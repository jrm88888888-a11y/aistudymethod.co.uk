  <circle cx="48" cy="54" r="10" fill="url(#sp)" stroke="#12123a" stroke-width="2.600"/>
  <circle cx="44.500" cy="50.500" r="2.800" fill="#fff" fill-opacity=".9"/>
  <g stroke="#7a5a00" stroke-width="2">
