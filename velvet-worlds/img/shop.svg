  <path d="M69 44l2.600 6.400 6.400 2.600-6.400 2.600L69 62l-2.600-6.400L60 53l6.400-2.600z" fill="#fff6c2" stroke="#12123a" stroke-width="1.800" stroke-linejoin="round"/>
  <!-- the counter -->
  <rect x="6" y="64" width="84" height="24" rx="5" fill="url(#sc)" stroke="#12123a" stroke-width="3.200"/>
  <path d="M11 69H85" stroke="#8f8aec" stroke-width="2.200" stroke-linecap="round"/>
  <g fill="#ffd83d"><circle cx="24" cy="78" r="2.400"/><circle cx="48" cy="78" r="2.400"/><circle cx="72" cy="78" r="2.400"/></g>
