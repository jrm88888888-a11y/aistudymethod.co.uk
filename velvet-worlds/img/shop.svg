<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="The Shop">
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a37a8"/><stop offset="1" stop-color="#1c1a66"/></linearGradient>
    <radialGradient id="sp" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f2fcff"/><stop offset=".5" stop-color="#8fd9ff"/><stop offset="1" stop-color="#2a8fe6"/></radialGradient>
    <radialGradient id="sg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8fd9ff" stop-opacity=".7"/><stop offset="1" stop-color="#8fd9ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#ffc21a"/></linearGradient>
  </defs>
  <!-- posts and the back of the stall -->
  <rect x="13" y="30" width="6" height="40" fill="#8f8aec" stroke="#12123a" stroke-width="2.6"/>
  <rect x="77" y="30" width="6" height="40" fill="#8f8aec" stroke="#12123a" stroke-width="2.6"/>
  <rect x="19" y="32" width="58" height="34" fill="#0d0d3a"/>
  <!-- the awning -->
  <g stroke="#12123a" stroke-width="3" stroke-linejoin="round">
    <path d="M6 16H22V34A8 8 0 0 1 6 34Z" fill="#ffd83d"/>
    <path d="M22 16H38V34A8 8 0 0 1 22 34Z" fill="#ff2d95"/>
    <path d="M38 16H54V34A8 8 0 0 1 38 34Z" fill="#ffd83d"/>
