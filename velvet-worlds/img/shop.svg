    <path d="M70 16H90V34A10 8 0 0 1 70 34Z" fill="#ffd83d"/>
    <rect x="4" y="8" width="88" height="11" rx="4.500" fill="#b79bff"/>
  </g>
  <path d="M9 12.500H87" stroke="#fff" stroke-opacity=".75" stroke-width="2.200" stroke-linecap="round"/>
  <!-- what is for sale: a Hydrogen Pop, coins, a flash -->
