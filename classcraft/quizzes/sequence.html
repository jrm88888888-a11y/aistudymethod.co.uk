  .seq-item.locked .seq-tag { color:var(--ar-mint); }
  .seq-item.fixed .seq-tag { color:var(--ar-gold); }
  .seq-item.wrong .seq-tag { color:var(--ar-pink); }
  .seq-ends { display:flex; justify-content:space-between; font-family:var(--ar-mono); font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--ar-muted); margin-bottom:8px; }

  @media (max-width:520px) {

<script>
(async function() {
  const esc = Arcade.escapeHtml;
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  Arcade.mountMuteButton();
  Arcade.maybeShowChallenge && Arcade.maybeShowChallenge();

  if (!stem) {
    root.innerHTML = '<div class="ar-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  const spec = await Arcade.fetchSpecJson(stem, '../adventures/_specs');

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subj  = ((spec && spec.subject) || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  function truncate(s, n) {
    s = String(s ?? '').trim();
    return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s;
  }

  function extractYear(text) {
    let m = text.match(/\b(1[0-9]{3}|20[0-9]{2})\b/);          // 1066, 1815, 2008
    if (m) return +m[1];
    m = text.match(/\bAD\s*([0-9]{2,4})\b/i);                  // AD 43, AD 410
    if (m) return +m[1];
    m = text.match(/\bc\.?\s*([0-9]{3})\b/);                   // c. 450
    if (m) return +m[1];
    return null;
  }

  /* ------------------------------------------------------------------ *
   *  Build the ordered item list.
   *  1. spec.sequence — authored, already in correct order (future-proof)
   *  2. history specs: derive order from years found in concepts
   *  3. process specs: derive order from step/ordinal markers in defs
   * ------------------------------------------------------------------ */
  function buildItems() {
    if (!spec) return null;

    // 1 — authored sequence array.
    if (Array.isArray(spec.sequence) && spec.sequence.length >= 4) {
      const items = spec.sequence
        .map(s => typeof s === 'string'
          ? { term: s, def: '' }
          : { term: s.term || s.label || s.name || '', def: s.def || s.detail || s.note || '' })
        .filter(s => s.term);
      if (items.length >= 4) return { source: 'authored', items: items.slice(0, 6) };
    }

    const concepts = (spec.concepts || []).filter(c => c && c.term && c.def);
    if (concepts.length < 5) return null;

    // 2 — history: a year in each concept's term + def gives the order.
    const isHistory = /^history-/.test(stem) || spec.subject === 'history';
    if (isHistory) {
      const dated = [];
      for (const c of concepts) {
        const y = extractYear(c.term + ' — ' + c.def);
        if (y !== null) dated.push({ term: c.term, def: c.def, year: y });
      }
      // Duplicate years make the ordering ambiguous — keep first only.
      const seen = new Set();
      const unique = dated.filter(d => seen.has(d.year) ? false : (seen.add(d.year), true));
      if (unique.length >= 5) {
        unique.sort((a, b) => a.year - b.year);
        return { source: 'years', items: unique.slice(0, 6) };
      }
    }

    // 3 — process steps: "1.", "step 2", "first", "second"… in defs.
    const ORD = { first:1, second:2, third:3, fourth:4, fifth:5, sixth:6, seventh:7, eighth:8 };
    function extractStep(text) {
      let m = text.match(/(?:^|\b(?:step|stage|phase)\s*)([1-8])\s*[\.\):–-]/i);
      if (m) return +m[1];
      m = text.toLowerCase().match(/\b(first|second|third|fourth|fifth|sixth|seventh|eighth)\b/);
      if (m) return ORD[m[1]];
      return null;
    }
    const stepped = [];
    const seenSteps = new Set();
    for (const c of concepts) {
      const n = extractStep(c.def) ?? extractStep(c.term);
      if (n !== null && !seenSteps.has(n)) {
        seenSteps.add(n);
        stepped.push({ term: c.term, def: c.def, step: n });
      }
    }
    if (stepped.length >= 5) {
      stepped.sort((a, b) => a.step - b.step);
      return { source: 'steps', items: stepped.slice(0, 6) };
    }

    return null;
  }

  const built = buildItems();

  if (!built) {
    root.innerHTML = `
      <div class="ar-badge">V · Verify · Sort the Sequence</div>
      <h1 class="ar-title">${esc(topic)}</h1>
      <p class="ar-sub">Sort the Sequence needs an ordered concept list for this topic — coming soon.</p>
      <div class="ar-meta">${esc([level, subj, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="ar-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🪜</div>
        <h2 style="font-size:1.3rem;margin:0 0 8px">Sequence in production</h2>
        <p style="color:var(--ar-text2);margin:0 0 18px;font-size:15px;">This game needs five or six concepts with a genuine natural order — dates, process steps or magnitudes — authored for this exact topic. That ordered list hasn't been written yet.</p>
        <a href="../../subjects.html" class="ar-btn ghost" style="text-decoration:none;display:inline-block;">← Back to subjects</a>
      </div>
    `;
    return;
  }

  // ITEMS[i].order = correct rank (0 = first / earliest / smallest).
  const ITEMS = built.items.map((it, i) => ({
    term: it.term,
    def: truncate(it.def, 90),
    order: i,
    year: it.year,
  }));
  const N = ITEMS.length;
  const BEST_KEY = 'aism-seq-best:' + stem;

  const endLabels = built.source === 'years'
    ? { top: '▲ Earliest', bottom: '▼ Latest' }
    : built.source === 'steps'
      ? { top: '▲ First step', bottom: '▼ Last step' }
      : { top: '▲ First / earliest / smallest', bottom: '▼ Last / latest / largest' };

  function shuffledStart() {
    for (let t = 0; t < 12; t++) {
      const s = Arcade.shuffle(ITEMS);
      if (s.some((it, i) => it.order !== i)) return s;
    }
    return ITEMS.slice().reverse();
  }

  function fmtSecs(ms) {
    const s = Math.round(ms / 1000);
    return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 350);
  }

  let state, hudTimerInt = null;

  function startGame() {
    if (hudTimerInt) { clearInterval(hudTimerInt); hudTimerInt = null; }
    state = {
      phase: 'sorting', hintUsed: false, score: 0,
      firstSet: new Set(), fixedSet: new Set(),
      result: null, t0: Date.now(), elapsed: 0,
    };
    renderRound(shuffledStart());
  }

  function renderHeader(metaTail) {
    return `
      <div class="ar-badge">V · Verify · Sort the Sequence</div>
      <h1 class="ar-title">${esc(topic)}</h1>
      <p class="ar-sub">Drag everything into the right order, then hit check. Nail it first try for full points — anything wrong gets ONE second-wind fix at half credit.</p>
      <div class="ar-meta">${esc([level, subj].filter(Boolean).join(' · '))} · ${esc(metaTail)}</div>
    `;
  }

  function syncHud() {
    const s = document.getElementById('hudScore');
    if (s && String(state.score) !== s.textContent) { s.textContent = state.score; bump(s); }
    const t = document.getElementById('hudTime');
    if (t) t.textContent = fmtSecs(state.phase === 'done' ? state.elapsed : Date.now() - state.t0);
  }

  function renderRound(startOrder) {
    root.innerHTML = `
      ${renderHeader(N + ' items · one check + one second wind')}
      <div class="ar-hud">
        <div class="ar-hud-stat">Score <b id="hudScore">0</b></div>
        <div class="ar-hud-stat gold">Time <b id="hudTime">0s</b></div>
      </div>
      <div class="ar-card">
        <div class="ar-label">Sort all ${N} · first try = 100 · second wind = 50</div>
        <div class="ar-prompt">Put these in the right order.</div>
        <div class="seq-ends"><span>${endLabels.top}</span><span>${endLabels.bottom}</span></div>
        <ul class="seq-list ar-stagger" id="seq-list" role="listbox" aria-label="Sortable items. Drag with the handle, or focus a card and press Alt plus arrow up or down to move it.">
          ${startOrder.map(it => `
            <li class="seq-item" tabindex="0" role="option" aria-grabbed="false" data-order="${it.order}">
              <span class="seq-handle" aria-hidden="true">⋮⋮</span>
              <span class="seq-pos" aria-hidden="true"></span>
              <div class="seq-body">
                <div class="seq-term">${esc(it.term)}</div>
                ${it.def ? `<div class="seq-def">${esc(it.def)}</div>` : ''}
              </div>
              <span class="seq-tag" aria-hidden="true"></span>
            </li>
          `).join('')}
        </ul>
        <div class="seq-actions">
          <button class="ar-btn" id="check">Lock it in →</button>
          <button class="ar-btn ghost" id="hint">Reveal order (−30%)</button>
        </div>
        <div class="ar-kbd-hint">Keyboard: Tab to a card · Alt+↑ / Alt+↓ moves it · Enter to check</div>
        <div id="fb"></div>
        <div id="reveal"></div>
      </div>
    `;

    const list = document.getElementById('seq-list');
    const checkBtn = document.getElementById('check');
    const hintBtn = document.getElementById('hint');

    hudTimerInt = setInterval(syncHud, 1000);

    function cards() { return Array.from(list.querySelectorAll('.seq-item')); }
    function renumber() {
      cards().forEach((c, i) => { c.querySelector('.seq-pos').textContent = i + 1; });
    }
    renumber();

    // During second wind, locked cards belong at slot index = their correct
    // rank. After any reorder, snap them back and flow the rest around them.
    function renormalize() {
      const all = cards();
      const slots = new Array(all.length).fill(null);
      all.forEach(c => { if (c.classList.contains('locked')) slots[+c.dataset.order] = c; });
      const un = all.filter(c => !c.classList.contains('locked'));
      let k = 0;
      for (let i = 0; i < slots.length; i++) if (!slots[i]) slots[i] = un[k++];
      slots.forEach(c => list.appendChild(c));
      renumber();
    }

    function sortable() { return state.phase === 'sorting' || state.phase === 'second'; }

    /* ---------------- pointer-event drag (mouse + touch + pen) ------- */
    let drag = null, startY = 0;

    list.addEventListener('pointerdown', e => {
      if (!sortable()) return;
      const card = e.target.closest('.seq-item');
      if (!card || card.classList.contains('locked')) return;
      // Touch drags start from the 44×44 handle so the page can still
      // scroll over the card body; mouse/pen can grab anywhere.
      if (e.pointerType === 'touch' && !e.target.closest('.seq-handle')) return;
      e.preventDefault();
      drag = card;
      startY = e.clientY;
      drag.classList.add('dragging');
      drag.setAttribute('aria-grabbed', 'true');
      try { drag.setPointerCapture(e.pointerId); } catch (err) {}
    });

    list.addEventListener('pointermove', e => {
      if (!drag) return;
      e.preventDefault();
      drag.style.transform = `translateY(${e.clientY - startY}px)`;

      // Reorder live: when the pointer crosses a sibling's midpoint,
      // insert the dragged card before/after that sibling. Locked cards
      // are not valid crossing targets.
      const sibs = cards().filter(c => c !== drag && !c.classList.contains('locked'));
      for (const sib of sibs) {
        const r = sib.getBoundingClientRect();
        const mid = r.top + r.height / 2;
        const sibIsBelow = !!(drag.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
        if (sibIsBelow && e.clientY > mid) { moveInDom(sib, 'after', e.clientY); break; }
        if (!sibIsBelow && e.clientY < mid) { moveInDom(sib, 'before', e.clientY); break; }
      }
    });

    function moveInDom(ref, where, pointerY) {
      const before = drag.getBoundingClientRect().top;
      if (where === 'after') ref.after(drag); else ref.before(drag);
      const after = drag.getBoundingClientRect().top;
      startY += (after - before);                       // keep the card under the pointer
      drag.style.transform = `translateY(${pointerY - startY}px)`;
      renumber();
    }

    function endDrag() {
      if (!drag) return;
      drag.style.transform = '';
      drag.classList.remove('dragging');
      drag.setAttribute('aria-grabbed', 'false');
      const dropped = drag;
      drag = null;
      if (state.phase === 'second') renormalize(); else renumber();
      const pos = cards().indexOf(dropped) + 1;
      announce.textContent = `${dropped.querySelector('.seq-term').textContent} dropped at position ${pos} of ${N}.`;
    }
    list.addEventListener('pointerup', endDrag);
    list.addEventListener('pointercancel', endDrag);

    /* ---------------- keyboard reorder -------------------------------- */
    list.addEventListener('keydown', e => {
      if (!sortable()) return;
      const card = e.target.closest('.seq-item');
      if (!card) return;
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        e.preventDefault();
        if (card.classList.contains('locked')) return;
        let sib = e.key === 'ArrowUp' ? card.previousElementSibling : card.nextElementSibling;
        while (sib && sib.classList.contains('locked')) {
          sib = e.key === 'ArrowUp' ? sib.previousElementSibling : sib.nextElementSibling;
        }
        if (!sib) return;
        if (e.key === 'ArrowUp') sib.before(card); else sib.after(card);
        if (state.phase === 'second') renormalize(); else renumber();
        Arcade.sfx.click();
        card.focus();
        const pos = cards().indexOf(card) + 1;
        announce.textContent = `${card.querySelector('.seq-term').textContent} moved to position ${pos} of ${N}.`;
      } else if (!e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        // plain arrows move focus between cards
        e.preventDefault();
        const sib = e.key === 'ArrowUp' ? card.previousElementSibling : card.nextElementSibling;
        if (sib) sib.focus();
      }
    });

    /* ---------------- hint --------------------------------------------- */
    hintBtn.addEventListener('click', () => {
      if (!sortable() || state.hintUsed) return;
      state.hintUsed = true;
      hintBtn.disabled = true;
      Arcade.sfx.swoosh();
      document.getElementById('reveal').innerHTML = `
        <div class="seq-reveal">
          <div class="seq-reveal-lbl">Correct order (−30% applied)</div>
          <ol>${ITEMS.map(it => `<li>${esc(it.term)}${it.year ? ` <span style="color:var(--ar-muted)">(${esc(it.year)})</span>` : ''}</li>`).join('')}</ol>
        </div>
      `;
      announce.textContent = 'Correct order revealed. Thirty percent will be deducted from your final score.';
    });

    /* ---------------- first check: lock the exacts --------------------- */
    function firstCheck() {
      state.phase = 'reveal';
      const cs = cards();
      const correctCards = cs.filter((c, i) => +c.dataset.order === i);
      correctCards.forEach(c => state.firstSet.add(+c.dataset.order));
      state.score = state.firstSet.size * 100;
      checkBtn.disabled = true;

      correctCards.forEach((c, k) => {
        setTimeout(() => {
          c.classList.add('locked', 'flip');
          c.setAttribute('tabindex', '-1');
          c.setAttribute('aria-disabled', 'true');
          c.querySelector('.seq-tag').textContent = '✓ locked';
          Arcade.sfx.correct(k + 1);
        }, k * 130);
      });

      const cascade = correctCards.length * 130 + 250;

      if (correctCards.length === N) {
        // Flawless first check — straight to the final reveal.
        setTimeout(finalCheck, cascade);
        return;
      }

      setTimeout(() => {
        state.phase = 'second';
        checkBtn.disabled = false;
        checkBtn.textContent = 'Lock final answer 🔒';
        syncHud();
        Arcade.flashMsg('SECOND WIND ⚡', '#00e5ff');
        Arcade.sfx.riser();
        Arcade.vibrate([20, 30, 20]);
        const fb = document.getElementById('fb');
        fb.className = 'ar-feedback mid';
        fb.innerHTML = `<strong>${state.firstSet.size}/${N} locked in.</strong> The glowing ones can't move. One fix attempt on the rest — make it count.`;
        announce.textContent = `${state.firstSet.size} of ${N} items locked in the correct position. You get one fix attempt on the remaining items, worth half credit each.`;
      }, cascade);
    }

    /* ---------------- final check: reveal cascade ----------------------- */
    function finalCheck() {
      state.phase = 'reveal';
      checkBtn.disabled = true;
      const cs = cards();
      const ranks = cs.map(c => +c.dataset.order);
      let adjacent = 0;
      for (let i = 0; i < N - 1; i++) if (ranks[i] < ranks[i + 1]) adjacent++;

      const pending = [];
      cs.forEach((c, i) => {
        if (c.classList.contains('locked')) return;
        const ok = +c.dataset.order === i;
        if (ok) state.fixedSet.add(+c.dataset.order);
        pending.push({ c, ok });
      });

      pending.forEach((p, k) => {
        setTimeout(() => {
          Arcade.sfx.tick();
          p.c.classList.remove('flip');
          void p.c.offsetWidth;
          p.c.classList.add('flip', p.ok ? 'fixed' : 'wrong');
          p.c.setAttribute('tabindex', '-1');
          p.c.setAttribute('aria-disabled', 'true');
          p.c.querySelector('.seq-tag').textContent = p.ok ? '+50 second wind' : '→ ' + (+p.c.dataset.order + 1);
        }, k * 140);
      });

      let score = state.firstSet.size * 100 + state.fixedSet.size * 50;
      if (state.hintUsed) score = Math.round(score * 0.7);
      state.score = score;
      state.elapsed = Date.now() - state.t0;
      if (hudTimerInt) { clearInterval(hudTimerInt); hudTimerInt = null; }
      state.result = { adjacent, score };

      setTimeout(() => {
        state.phase = 'done';
        syncHud();
        hintBtn.disabled = true;
        const firstN = state.firstSet.size, fixedN = state.fixedSet.size;
        const placed = firstN + fixedN;

        if (placed === N) {
          Arcade.sfx.correct(5);
          Arcade.confettiBurst({ count: 90 });
          Arcade.flashMsg(firstN === N ? 'PERFECT ORDER 👑' : 'CLEANED IT UP ✨', '#00ffa3');
          Arcade.vibrate(30);
        } else {
          Arcade.sfx.wrong();
          Arcade.shake();
          Arcade.flashMsg(placed >= Math.ceil(N * 0.6) ? 'ALMOST HAD IT' : 'ORDER DOWN', '#ff2e88');
          Arcade.vibrate([40, 30, 40]);
        }

        let line;
        if (firstN === N) line = 'Perfect on the first check — every item exactly where it belongs, no second wind needed.';
        else if (placed === N) line = 'Second wind used to perfection — everything found its place. First-try locks scored full, fixes scored half.';
        else if (adjacent >= Math.ceil((N - 1) * 0.6)) line = 'You have the broad shape of the sequence — the pink tags show where each stray item actually belongs. Study them before the rematch.';
        else line = 'The order needs work — most relative positions are off. Study the pink tags, then run it back from a fresh shuffle.';

        const fb = document.getElementById('fb');
        fb.className = 'ar-feedback ' + (placed === N ? 'ok' : 'mid');
        fb.innerHTML = `<strong>First try ${firstN}/${N} · second wind ${fixedN} · pairs in order ${adjacent}/${N - 1}${state.hintUsed ? ' · hint −30%' : ''}.</strong> ${esc(line)}`;
        announce.textContent = `Checked. ${firstN} of ${N} first try, ${fixedN} fixed on the second wind, ${adjacent} of ${N - 1} adjacent pairs in order. Score ${score} points. ${line}`;

        checkBtn.disabled = false;
        checkBtn.textContent = 'See your score →';
        checkBtn.focus({ preventScroll: true });
      }, pending.length * 140 + 300);
    }

    checkBtn.addEventListener('click', () => {
      if (state.phase === 'done') { renderSummary(); return; }
      if (state.phase === 'sorting') { endDrag(); Arcade.sfx.click(); firstCheck(); }
      else if (state.phase === 'second') { endDrag(); Arcade.sfx.click(); finalCheck(); }
    });

    document.addEventListener('keydown', enterToCheck);
    function enterToCheck(e) {
      if (e.key !== 'Enter' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) return;
      if (e.target && e.target.classList && e.target.classList.contains('seq-item')) return;
      if (!document.body.contains(checkBtn)) { document.removeEventListener('keydown', enterToCheck); return; }
      if (checkBtn.disabled) return;
      e.preventDefault();
      checkBtn.click();
    }
  }

  function renderSummary() {
    const { adjacent, score } = state.result;
    const firstN = state.firstSet.size, fixedN = state.fixedSet.size;
    const pct = Math.round((score / (N * 100)) * 100);
    const emoji = ITEMS.map(it => state.firstSet.has(it.order) ? '🟩' : state.fixedSet.has(it.order) ? '🟨' : '🟥').join('');
    const secs = fmtSecs(state.elapsed);
    const speedy = state.elapsed < 30000;

    let insight;
    if (firstN === N) insight = `Flawless sequencing — and ordering is the hardest kind of recall, because you can't bluff it with recognition. Next level: explain out loud why each item in ${topic} follows the one before. That's the jump from knowing the order to understanding it.`;
    else if (pct >= 70) insight = `Strong grip on the flow of ${topic}. ${adjacent} of ${N - 1} adjacent pairs were in the right relative order — what's missing is precision on a few anchors. Pin each item to one concrete fact (a date, a trigger, a product) and run it back.`;
    else if (pct >= 40) insight = 'You\'ve got fragments of the sequence but not the spine. Don\'t memorise positions — memorise the links: what causes or enables the next item. A chain of "because" beats a numbered list every time.';
    else insight = `This sequence hasn't settled yet — which is exactly what this game is for. Read the correct order once, close your eyes, and narrate the story of ${topic} first to last in your own words. Then come back and sort it cold.`;

    root.innerHTML = renderHeader('Results') + '<div id="end"></div>';
    Arcade.renderEndCard(document.getElementById('end'), {
      gameName: 'Sort the Sequence',
      gameEmoji: '🪜',
      topic: topic,
      meta: [level, subj].filter(Boolean).join(' · '),
      pct: pct,
      big: score,
      bigLabel: 'points' + (state.hintUsed ? ' · hint −30%' : ''),
      rows: [
        { v: `${firstN}/${N}`, l: 'first try' },
        { v: String(fixedN), l: 'second wind' },
        { v: `${adjacent}/${N - 1}`, l: 'pairs in order' },
        { v: (speedy ? '⚡ ' : '') + secs, l: speedy ? 'speedrun' : 'time' },
      ],
      emojiGrid: emoji,
      bestKey: BEST_KEY,
      bestValue: score,
      bestSuffix: ' pts',
      insight: insight,
      share: { subject: subj, level: level, bigLabel: 'POINTS', statLine: firstN + '/' + N + ' first try  ·  ' + adjacent + '/' + (N - 1) + ' pairs in order' },
      shareLines: [
        '🪜 Sort the Sequence — ' + topic,
        `Score ${score} pts · ${secs}${speedy ? ' ⚡' : ''}`,
        emoji,
      ],
      onAgain: startGame,
    });
    if (speedy && pct >= 60) setTimeout(() => Arcade.flashMsg('SPEEDRUN ⚡', '#00e5ff'), 800);
    announce.textContent = `Game over. Score ${score} points — ${pct} percent. ${firstN} of ${N} first try, ${fixedN} fixed on the second wind, ${adjacent} of ${N - 1} adjacent pairs in order. Time ${secs}.`;
  }

  startGame();
})();
</script>
