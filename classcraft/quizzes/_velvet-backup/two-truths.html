<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Truths One Lie — AI Study Method</title>
<meta name="description" content="Three statements about the topic — two are true, one is a plausible misconception. Spot the lie to prove your conceptual grip.">
<link rel="stylesheet" href="../../style.css">
<style>
  .tt-wrap { max-width: 760px; margin: 0 auto; padding: calc(var(--nav-h) + 36px) 1.5rem 80px; }
  .tt-badge { display:inline-flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 12px; border-radius:30px; font-family:'DM Mono',monospace; margin-bottom:14px; }
  .tt-title { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1.15; margin:0 0 10px; }
  .tt-sub { color:var(--text-secondary); font-size:15px; margin:0 0 22px; line-height:1.55; max-width:60ch; }
  .tt-meta { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:24px; }
  .tt-progress { display:flex; gap:6px; margin-bottom:24px; }
  .tt-progress span { height:5px; flex:1; border-radius:3px; background:var(--border); transition:background 0.2s ease; }
  .tt-progress span.done { background:var(--accent); }
  .tt-progress span.now { background:var(--accent); opacity:0.45; }
  .tt-card { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:14px; padding:24px 26px; box-shadow:0 4px 14px rgba(10,107,94,0.06); margin-bottom:18px; }
  .tt-round-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .tt-prompt { font-size:17px; font-weight:600; color:var(--text-primary); margin:0 0 18px; line-height:1.4; }
  .tt-stmts { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .tt-stmt { background:var(--bg-primary); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; font-size:15px; transition:all 0.15s ease; text-align:left; font-family:inherit; color:var(--text-primary); width:100%; }
  .tt-stmt:hover { border-color:var(--accent); background:var(--accent-soft); }
  .tt-stmt.selected { border-color:var(--accent); background:var(--accent-soft); }
  .tt-stmt.is-lie { border-color:#c2410c; background:rgba(194,65,12,0.08); }
  .tt-stmt.is-truth { border-color:#0a6b5e; background:rgba(10,107,94,0.08); }
  .tt-stmt-q { font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:0.8px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; line-height:1.5; }
  .tt-stmt-a { line-height:1.5; }
  .tt-verdict { display:inline-block; margin-top:8px; font-family:'DM Mono',monospace; font-size:10px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; padding:2px 9px; border-radius:20px; }
  .tt-verdict.lie { background:rgba(194,65,12,0.12); color:#c2410c; border:1px solid rgba(194,65,12,0.3); }
  .tt-verdict.truth { background:rgba(10,107,94,0.12); color:#0a6b5e; border:1px solid var(--border-accent); }
  .tt-btn { background:var(--velvet-gradient); color:#fff; border:none; padding:14px 24px; border-radius:10px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; box-shadow:0 4px 12px var(--accent-glow); transition:transform 0.15s; }
  .tt-btn:hover { transform:translateY(-1px); }
  .tt-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
  .tt-btn-ghost { background:none; border:1.5px solid var(--border-accent); color:var(--accent); box-shadow:none; }
  .tt-feedback { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.55; }
  .tt-feedback.ok { background:rgba(10,107,94,0.08); color:var(--accent); border:1px solid var(--border-accent); }
  .tt-feedback.no { background:rgba(194,65,12,0.08); color:#c2410c; border:1px solid rgba(194,65,12,0.25); }
  .tt-kbd-hint { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-top:10px; }
  @media (hover:none) { .tt-kbd-hint { display:none; } }
  .tt-summary { margin-top:24px; padding:28px; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; text-align:center; }
  .tt-summary h2 { font-family:'Playfair Display',serif; font-size:1.5rem; margin:0 0 16px; }
  .tt-big-stat { font-family:'Playfair Display',serif; font-size:56px; font-weight:700; line-height:1; color:var(--accent); }
  .tt-big-lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin:8px 0 4px; }
  .tt-best { display:inline-block; margin-top:10px; font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border:1px solid var(--border-accent); border-radius:20px; padding:4px 12px; }
  .tt-insight { font-style:italic; font-size:14px; color:var(--text-secondary); margin:20px auto 0; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); text-align:left; max-width:54ch; }
  .tt-ctas { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .tt-ctas a.tt-btn { text-decoration:none; display:inline-block; }
  .tt-error { padding:20px; background:rgba(194,65,12,0.05); border:1px solid rgba(194,65,12,0.2); border-radius:10px; color:#c2410c; font-size:14px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="../../index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text">
        <span class="logo-primary">AI Study Method</span>
        <span class="logo-secondary">The Velvet Method™</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="../../subjects.html">Subjects</a></li>

<div class="tt-wrap" id="root">
  <div class="tt-error">Loading…</div>
</div>
<div id="announce" aria-live="polite" class="sr-only"></div>

<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(async function() {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  if (!stem) {
    root.innerHTML = '<div class="tt-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  // Some on-disk stems contain a colon the URL param drops (e.g.
  // "history-gcse-edexcel:-superpower…"). Try the plain stem first,
  // then every possible colon-insertion before a dash.
  const stemCandidates = [stem];
  for (let i = 0; i < stem.length; i++) {
    if (stem[i] === '-') stemCandidates.push(stem.slice(0, i) + ':' + stem.slice(i));
  }
  async function fetchJson(dir) {
    for (const cand of stemCandidates) {
      try {
        const r = await fetch(`${dir}/${encodeURIComponent(cand)}.json`);
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  const [spec, bank] = await Promise.all([
    fetchJson('../adventures/_specs'),
    fetchJson('../evaluate/misconception-banks'),
  ]);

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subj  = ((spec && spec.subject) || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // Placeholder concept defs would make hollow "truths" — treat as unauthored.
  const PLACEHOLDER_DEF_RE = /^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;
  const concepts = ((spec && spec.concepts) || []).filter(c => c && c.term && c.def && !PLACEHOLDER_DEF_RE.test(c.def));
  const bankItems = ((bank && bank.items) || []).filter(it => it && it.q && it.misconception);

  if (!spec || !bank || concepts.length < 4 || bankItems.length < 2) {
    root.innerHTML = `
      <div class="tt-badge">V · Verify · Two Truths One Lie</div>
      <h1 class="tt-title">${escapeHtml(topic)}</h1>
      <p class="tt-sub">This game needs a full set of concept definitions plus a bank of researched misconceptions — generic filler wouldn't earn its place on the site. Come back soon.</p>
      <div class="tt-meta">${escapeHtml([level, subj, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="tt-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🕵️</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;margin:0 0 8px">Statements in production</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:15px;">Two Truths One Lie needs at least four authored concept definitions and two researched misconceptions for this exact topic. That set hasn't been written at the required depth yet.</p>
        <a href="../../subjects.html" style="color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">← Back to subjects</a>
      </div>
    `;
    return;
  }

  const BEST_KEY = 'aism-tt-best:' + stem;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Build rounds: each pairs one misconception (the lie) with two
  // randomly-drawn concept definitions (the truths). Every statement is
  // shown as a prompt + claim so the lie isn't given away by format.
  function buildRounds() {
    return shuffle(bankItems).slice(0, 5).map(item => {
      const [c1, c2] = shuffle(concepts);
      const statements = shuffle([
        { lie: true,  prompt: item.q, claim: item.misconception, why: item.why || '' },
        { lie: false, prompt: `What does “${c1.term}” mean?`, claim: c1.def },
        { lie: false, prompt: `What does “${c2.term}” mean?`, claim: c2.def },
      ]);
      return { statements, lieIdx: statements.findIndex(s => s.lie) };
    });
  }

  let rounds, state;

  function startGame() {
    rounds = buildRounds();
    state = { idx: 0, correct: 0 };
    renderRound();
  }

  function renderHeader(metaTail) {
    return `
      <div class="tt-badge">V · Verify · Two Truths One Lie</div>
      <h1 class="tt-title">${escapeHtml(topic)}</h1>
      <p class="tt-sub">Three claims about ${escapeHtml(topic)}. Two are true — one is a misconception that trips real students up. Pick the lie.</p>
      <div class="tt-meta">${escapeHtml([level, subj].filter(Boolean).join(' · '))} · ${metaTail}</div>
    `;
  }

  function renderRound() {
    const round = rounds[state.idx];

    root.innerHTML = `
      ${renderHeader(`Round ${state.idx + 1} of ${rounds.length}`)}
      <div class="tt-progress" aria-hidden="true">${rounds.map((_, i) =>
        `<span class="${i < state.idx ? 'done' : i === state.idx ? 'now' : ''}"></span>`).join('')}</div>
      <div class="tt-card">
        <div class="tt-round-label">Round ${state.idx + 1} · Score ${state.correct}</div>
        <div class="tt-prompt">Which one is the lie?</div>
        <div class="tt-stmts" role="radiogroup" aria-label="Three statements — pick the lie">
          ${round.statements.map((s, i) => `
            <button type="button" class="tt-stmt" role="radio" aria-checked="false" data-idx="${i}">
              <div class="tt-stmt-q">${escapeHtml(s.prompt)}</div>
              <div class="tt-stmt-a">${escapeHtml(s.claim)}</div>
              <span class="tt-verdict-slot"></span>
            </button>
          `).join('')}
        </div>
        <button class="tt-btn" id="submit" disabled>Call the lie →</button>
        <div class="tt-kbd-hint">Keyboard: 1–3 to pick · Enter to submit</div>
        <div id="fb"></div>
      </div>
    `;

    const submit = document.getElementById('submit');
    const stmts = Array.from(root.querySelectorAll('.tt-stmt'));
    let chosen = null;
    let phase = 'answer';

    stmts.forEach(b => {
      b.addEventListener('click', () => {
        if (phase !== 'answer') return;
        stmts.forEach(x => { x.classList.remove('selected'); x.setAttribute('aria-checked', 'false'); });
        b.classList.add('selected');
        b.setAttribute('aria-checked', 'true');
        chosen = parseInt(b.dataset.idx);
        submit.disabled = false;
      });
    });

    submit.addEventListener('click', () => {
      if (phase === 'answer') {
        if (chosen === null) return;
        const correct = chosen === round.lieIdx;
        if (correct) state.correct++;

        stmts.forEach((b, i) => {
          b.style.pointerEvents = 'none';
          b.disabled = true;
          const slot = b.querySelector('.tt-verdict-slot');
          if (i === round.lieIdx) {
            b.classList.add('is-lie');
            slot.outerHTML = '<span class="tt-verdict lie">⚠️ lie</span>';
          } else {
            b.classList.add('is-truth');
            slot.outerHTML = '<span class="tt-verdict truth">✓ truth</span>';
          }
        });

        const lie = round.statements[round.lieIdx];
        const fb = document.getElementById('fb');
        fb.className = 'tt-feedback ' + (correct ? 'ok' : 'no');
        fb.innerHTML = (correct
          ? '<strong>Caught it.</strong> '
          : '<strong>That one was true.</strong> The lie was: <em>' + escapeHtml(lie.claim) + '</em>. ')
          + (lie.why ? escapeHtml(lie.why) : '');
        announce.textContent = (correct ? 'Correct — you found the lie. ' : 'Incorrect — that statement was true. ') + (lie.why || '');

        submit.textContent = state.idx + 1 < rounds.length ? 'Next round →' : 'See your score →';
        phase = 'next';
      } else {
        if (state.idx + 1 < rounds.length) {
          state.idx++;
          renderRound();
        } else {
          renderSummary();
        }
      }
    });
  }

  function renderSummary() {
    const total = rounds.length;
    const accuracy = Math.round((state.correct / total) * 100);

    let prevBest = null;
    try { prevBest = parseInt(localStorage.getItem(BEST_KEY)); } catch (e) {}
    if (isNaN(prevBest)) prevBest = null;
    const newBest = prevBest === null || accuracy > prevBest;
    if (newBest) { try { localStorage.setItem(BEST_KEY, String(accuracy)); } catch (e) {} }

    let insight;
    if (accuracy === 100) insight = `A clean sweep. Every lie in this set is a misconception that genuinely trips students up in exams — and none of them got past you. You're ready to teach ${topic} to someone else, which is the real test.`;
    else if (accuracy >= 60) insight = 'Strong lie-detection. The ones that slipped past you are worth a second look — each was a misconception chosen because it feels true. Re-read the explanations above your misses, then play again.';
    else insight = `The lies in this game are designed to sound right — falling for them just means you've found exactly which ideas in ${topic} need shoring up. Revisit the concept definitions, then come back and call the lies.`;

    root.innerHTML = `
      ${renderHeader('Results')}
      <div class="tt-summary">
        <h2>Lie-detection report</h2>
        <div class="tt-big-stat">${accuracy}%</div>
        <div class="tt-big-lbl">${state.correct} of ${total} lies caught</div>
        ${newBest
          ? '<div class="tt-best">★ New personal best</div>'
          : prevBest !== null ? `<div class="tt-best" style="opacity:0.7">Personal best: ${prevBest}%</div>` : ''}
        <div class="tt-insight">${escapeHtml(insight)}</div>
        <div class="tt-ctas">
          <button class="tt-btn" id="again">Play again</button>
          <a class="tt-btn tt-btn-ghost" href="../../subjects.html">More games</a>
        </div>
      </div>
    `;
    announce.textContent = `Game over. You caught ${state.correct} of ${total} lies — ${accuracy} percent.` + (newBest ? ' New personal best.' : '');
    document.getElementById('again').addEventListener('click', startGame);
  }

  // Keyboard shortcuts: 1–3 pick a statement, Enter submits/advances.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter') {
      if (e.target && e.target.classList && e.target.classList.contains('tt-stmt')) return; // native activation
      const submit = document.getElementById('submit');
      if (submit && !submit.disabled) { e.preventDefault(); submit.click(); }
      return;
    }
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const map = { '1': 0, '2': 1, '3': 2 };
    if (e.key in map) {
      const b = root.querySelectorAll('.tt-stmt')[map[e.key]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
</html>
