<link rel="stylesheet" href="../../style.css">
<style>
  .tt-wrap { max-width: 760px; margin: 0 auto; padding: calc(var(--nav-h) + 36px) 1.5rem 80px; }
  .tt-badge { display:inline-flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 12px; border-radius:30px; font-family:'DM Mono',monospace; margin-bottom:14px; }
  .tt-title { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1.15; margin:0 0 10px; }
  .tt-sub { color:var(--text-secondary); font-size:15px; margin:0 0 22px; line-height:1.55; max-width:60ch; }
  .tt-meta { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:24px; }
  .tt-progress { display:flex; gap:6px; margin-bottom:24px; }
  .tt-progress span { height:5px; flex:1; border-radius:3px; background:var(--border); transition:background 0.2s ease; }
  .tt-progress span.done { background:var(--accent); }
  .tt-progress span.now { background:var(--accent); opacity:0.45; }
  .tt-card { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:14px; padding:24px 26px; box-shadow:0 4px 14px rgba(10,107,94,0.06); margin-bottom:18px; }
  .tt-round-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .tt-prompt { font-size:17px; font-weight:600; color:var(--text-primary); margin:0 0 18px; line-height:1.4; }
  .tt-btn { background:var(--velvet-gradient); color:#fff; border:none; padding:14px 24px; border-radius:10px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; box-shadow:0 4px 12px var(--accent-glow); transition:transform 0.15s; }
  .tt-btn:hover { transform:translateY(-1px); }
  .tt-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
  .tt-btn-ghost { background:none; border:1.5px solid var(--border-accent); color:var(--accent); box-shadow:none; }
  .tt-feedback { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.55; }
  .tt-feedback.ok { background:rgba(10,107,94,0.08); color:var(--accent); border:1px solid var(--border-accent); }
  .tt-feedback.mid { background:rgba(194,65,12,0.06); color:var(--text-primary); border:1px solid var(--border); }
  .tt-kbd-hint { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-top:10px; }
  @media (hover:none) { .tt-kbd-hint { display:none; } }
  .tt-summary { margin-top:24px; padding:28px; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; text-align:center; }
  .tt-summary h2 { font-family:'Playfair Display',serif; font-size:1.5rem; margin:0 0 16px; }
  .tt-big-stat { font-family:'Playfair Display',serif; font-size:56px; font-weight:700; line-height:1; color:var(--accent); }
  .tt-big-lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin:8px 0 4px; }
  .tt-best { display:inline-block; margin-top:10px; font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border:1px solid var(--border-accent); border-radius:20px; padding:4px 12px; }
  .tt-insight { font-style:italic; font-size:14px; color:var(--text-secondary); margin:20px auto 0; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); text-align:left; max-width:54ch; }
  .tt-ctas { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .tt-ctas a.tt-btn { text-decoration:none; display:inline-block; }
  .tt-error { padding:20px; background:rgba(194,65,12,0.05); border:1px solid rgba(194,65,12,0.2); border-radius:10px; color:#c2410c; font-size:14px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* ---- Sequence-specific ---- */
  .seq-list { list-style:none; margin:0 0 22px; padding:0; display:flex; flex-direction:column; gap:10px; }
  .seq-item { display:flex; align-items:stretch; min-height:56px; background:var(--bg-primary); border:1.5px solid var(--border); border-radius:10px; cursor:grab; user-select:none; -webkit-user-select:none; transition:border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; position:relative; width:100%; }
  .seq-item:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .seq-item.dragging { cursor:grabbing; z-index:10; box-shadow:0 10px 24px rgba(10,107,94,0.18); border-color:var(--accent); background:var(--bg-card); transition:none; }
  .seq-item.right { border-color:#0a6b5e; background:rgba(10,107,94,0.08); }
  .seq-item.wrong { border-color:#c2410c; background:rgba(194,65,12,0.08); }
  .seq-item.locked { cursor:default; }
  .seq-handle { flex:0 0 44px; min-height:44px; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:15px; letter-spacing:-1px; color:var(--text-muted); border-right:1px dashed var(--border); border-radius:10px 0 0 10px; touch-action:none; }
  .seq-item:not(.locked) .seq-handle:hover { color:var(--accent); background:var(--accent-soft); }
  .seq-pos { flex:0 0 auto; align-self:center; font-family:'DM Mono',monospace; font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-soft); border:1px solid var(--border-accent); border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; margin:0 0 0 12px; }
  .seq-item.right .seq-pos { background:rgba(10,107,94,0.15); }
  .seq-item.wrong .seq-pos { color:#c2410c; background:rgba(194,65,12,0.1); border-color:rgba(194,65,12,0.3); }
  .seq-body { flex:1 1 auto; padding:10px 14px 10px 12px; display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .seq-term { font-size:15px; font-weight:600; color:var(--text-primary); line-height:1.35; }
  .seq-def { font-size:12.5px; color:var(--text-secondary); line-height:1.45; margin-top:2px; }
  .seq-correct-tag { align-self:center; flex:0 0 auto; margin-right:14px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; font-weight:600; white-space:nowrap; }
  .seq-item.right .seq-correct-tag { color:#0a6b5e; }
  .seq-item.wrong .seq-correct-tag { color:#c2410c; }
  .seq-ends { display:flex; justify-content:space-between; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .seq-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .seq-metrics { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .seq-metric { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:6px 12px; border-radius:20px; border:1px solid var(--border-accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .seq-reveal { margin-top:14px; padding:12px 16px; background:var(--bg-primary); border:1px dashed var(--border); border-radius:10px; opacity:0.65; }
  .seq-reveal-lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
  .seq-reveal ol { margin:0; padding-left:20px; font-size:13.5px; color:var(--text-secondary); line-height:1.7; }
  @media (max-width:520px) {
    .tt-wrap { padding-left:1rem; padding-right:1rem; }
    .tt-card { padding:18px 14px; }
    .seq-def { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .seq-correct-tag { position:absolute; top:6px; right:10px; margin:0; }
  }
</style>

<div class="tt-wrap" id="root">
  <div class="tt-error">Loading…</div>
</div>
<div id="announce" aria-live="polite" class="sr-only"></div>

<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(async function() {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  if (!stem) {
    root.innerHTML = '<div class="tt-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  // Some on-disk stems contain a colon the URL param drops (e.g.
  // "history-gcse-edexcel:-superpower…"). Try the plain stem first,
  // then every possible colon-insertion before a dash.
  const stemCandidates = [stem];
  for (let i = 0; i < stem.length; i++) {
    if (stem[i] === '-') stemCandidates.push(stem.slice(0, i) + ':' + stem.slice(i));
  }
  async function fetchJson(dir) {
    for (const cand of stemCandidates) {
      try {
        const r = await fetch(`${dir}/${encodeURIComponent(cand)}.json`);
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  const spec = await fetchJson('../adventures/_specs');

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subj  = ((spec && spec.subject) || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  function truncate(s, n) {
    s = String(s ?? '').trim();
    return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s;
  }

  function extractYear(text) {
    let m = text.match(/\b(1[0-9]{3}|20[0-9]{2})\b/);          // 1066, 1815, 2008
    if (m) return +m[1];
    m = text.match(/\bAD\s*([0-9]{2,4})\b/i);                  // AD 43, AD 410
    if (m) return +m[1];
    m = text.match(/\bc\.?\s*([0-9]{3})\b/);                   // c. 450
    if (m) return +m[1];
    return null;
  }

  /* ------------------------------------------------------------------ *
   *  Build the ordered item list.
   *  1. spec.sequence — authored, already in correct order (future-proof)
   *  2. history specs: derive order from years found in concepts
   *  3. process specs: derive order from step/ordinal markers in defs
   * ------------------------------------------------------------------ */
  function buildItems() {
    if (!spec) return null;

    // 1 — authored sequence array.
    if (Array.isArray(spec.sequence) && spec.sequence.length >= 4) {
      const items = spec.sequence
        .map(s => typeof s === 'string'
          ? { term: s, def: '' }
          : { term: s.term || s.label || s.name || '', def: s.def || s.detail || s.note || '' })
        .filter(s => s.term);
      if (items.length >= 4) return { source: 'authored', items: items.slice(0, 6) };
    }

    const concepts = (spec.concepts || []).filter(c => c && c.term && c.def);
    if (concepts.length < 5) return null;

    // 2 — history: a year in each concept's term + def gives the order.
    const isHistory = /^history-/.test(stem) || spec.subject === 'history';
    if (isHistory) {
      const dated = [];
      for (const c of concepts) {
        const y = extractYear(c.term + ' — ' + c.def);
        if (y !== null) dated.push({ term: c.term, def: c.def, year: y });
      }
      // Duplicate years make the ordering ambiguous — keep first only.
      const seen = new Set();
      const unique = dated.filter(d => seen.has(d.year) ? false : (seen.add(d.year), true));
      if (unique.length >= 5) {
        unique.sort((a, b) => a.year - b.year);
        return { source: 'years', items: unique.slice(0, 6) };
      }
    }

    // 3 — process steps: "1.", "step 2", "first", "second"… in defs.
    const ORD = { first:1, second:2, third:3, fourth:4, fifth:5, sixth:6, seventh:7, eighth:8 };
    function extractStep(text) {
      let m = text.match(/(?:^|\b(?:step|stage|phase)\s*)([1-8])\s*[\.\):–-]/i);
      if (m) return +m[1];
      m = text.toLowerCase().match(/\b(first|second|third|fourth|fifth|sixth|seventh|eighth)\b/);
      if (m) return ORD[m[1]];
      return null;
    }
    const stepped = [];
    const seenSteps = new Set();
    for (const c of concepts) {
      const n = extractStep(c.def) ?? extractStep(c.term);
      if (n !== null && !seenSteps.has(n)) {
        seenSteps.add(n);
        stepped.push({ term: c.term, def: c.def, step: n });
      }
    }
    if (stepped.length >= 5) {
      stepped.sort((a, b) => a.step - b.step);
      return { source: 'steps', items: stepped.slice(0, 6) };
    }

    return null;
  }

  const built = buildItems();

  if (!built) {
    root.innerHTML = `
      <div class="tt-badge">V · Verify · Sort the Sequence</div>
      <h1 class="tt-title">${escapeHtml(topic)}</h1>
      <p class="tt-sub">Sort the Sequence needs an ordered concept list for this topic — coming soon.</p>
      <div class="tt-meta">${escapeHtml([level, subj, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="tt-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🪜</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;margin:0 0 8px">Sequence in production</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:15px;">This game needs five or six concepts with a genuine natural order — dates, process steps or magnitudes — authored for this exact topic. That ordered list hasn't been written yet.</p>
        <a href="../../subjects.html" style="color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">← Back to subjects</a>
      </div>
    `;
    return;
  }

  // ITEMS[i].order = correct rank (0 = first / earliest / smallest).
  const ITEMS = built.items.map((it, i) => ({
    term: it.term,
    def: truncate(it.def, 90),
    order: i,
    year: it.year,
  }));
  const N = ITEMS.length;
  const BEST_KEY = 'aism-seq-best:' + stem;

  const endLabels = built.source === 'years'
    ? { top: '▲ Earliest', bottom: '▼ Latest' }
    : built.source === 'steps'
      ? { top: '▲ First step', bottom: '▼ Last step' }
      : { top: '▲ First / earliest / smallest', bottom: '▼ Last / latest / largest' };

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function shuffledStart() {
    for (let t = 0; t < 12; t++) {
      const s = shuffle(ITEMS);
      if (s.some((it, i) => it.order !== i)) return s;
    }
    return ITEMS.slice().reverse();
  }

  let state;

  function startGame() {
    state = { phase: 'sorting', hintUsed: false, result: null };
    renderRound(shuffledStart());
  }

  function renderHeader(metaTail) {
    return `
      <div class="tt-badge">V · Verify · Sort the Sequence</div>
      <h1 class="tt-title">${escapeHtml(topic)}</h1>
      <p class="tt-sub">Drag the items into the correct order. The earliest / first / smallest goes at the top.</p>
      <div class="tt-meta">${escapeHtml([level, subj].filter(Boolean).join(' · '))} · ${metaTail}</div>
    `;
  }

  function renderRound(startOrder) {
    root.innerHTML = `
      ${renderHeader(`1 round · ${N} items`)}
      <div class="tt-progress" aria-hidden="true"><span class="now"></span></div>
      <div class="tt-card">
        <div class="tt-round-label">Sort all ${N} · One shot</div>
        <div class="tt-prompt">Put these in the right order.</div>
        <div class="seq-ends"><span>${endLabels.top}</span><span>${endLabels.bottom}</span></div>
        <ul class="seq-list" id="seq-list" role="listbox" aria-label="Sortable items. Drag with the handle, or focus a card and press Alt plus arrow up or down to move it.">
          ${startOrder.map(it => `
            <li class="seq-item" tabindex="0" role="option" aria-grabbed="false" data-order="${it.order}">
              <span class="seq-handle" aria-hidden="true">⋮⋮</span>
              <span class="seq-pos" aria-hidden="true"></span>
              <div class="seq-body">
                <div class="seq-term">${escapeHtml(it.term)}</div>
                ${it.def ? `<div class="seq-def">${escapeHtml(it.def)}</div>` : ''}
              </div>
              <span class="seq-correct-tag" aria-hidden="true"></span>
            </li>
          `).join('')}
        </ul>
        <div class="seq-actions">
          <button class="tt-btn" id="check">Check order →</button>
          <button class="tt-btn tt-btn-ghost" id="hint">Show me (−25%)</button>
        </div>
        <div class="tt-kbd-hint">Keyboard: Tab to a card · Alt+↑ / Alt+↓ moves it · Enter to check</div>
        <div id="fb"></div>
        <div id="reveal"></div>
      </div>
    `;

    const list = document.getElementById('seq-list');
    const checkBtn = document.getElementById('check');
    const hintBtn = document.getElementById('hint');

    function cards() { return Array.from(list.querySelectorAll('.seq-item')); }
    function renumber() {
      cards().forEach((c, i) => { c.querySelector('.seq-pos').textContent = i + 1; });
    }
    renumber();

    /* ---------------- pointer-event drag (mouse + touch + pen) ------- */
    let drag = null, startY = 0;

    list.addEventListener('pointerdown', e => {
      if (state.phase !== 'sorting') return;
      const card = e.target.closest('.seq-item');
      if (!card) return;
      // Touch drags start from the 44×44 handle so the page can still
      // scroll over the card body; mouse/pen can grab anywhere.
      if (e.pointerType === 'touch' && !e.target.closest('.seq-handle')) return;
      e.preventDefault();
      drag = card;
      startY = e.clientY;
      drag.classList.add('dragging');
      drag.setAttribute('aria-grabbed', 'true');
      try { drag.setPointerCapture(e.pointerId); } catch (err) {}
    });

    list.addEventListener('pointermove', e => {
      if (!drag) return;
      e.preventDefault();
      drag.style.transform = `translateY(${e.clientY - startY}px)`;

      // Reorder live: when the pointer crosses a sibling's midpoint,
      // insert the dragged card before/after that sibling.
      const sibs = cards().filter(c => c !== drag);
      for (const sib of sibs) {
        const r = sib.getBoundingClientRect();
        const mid = r.top + r.height / 2;
        const sibIsBelow = !!(drag.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
        if (sibIsBelow && e.clientY > mid) { moveInDom(sib, 'after', e.clientY); break; }
        if (!sibIsBelow && e.clientY < mid) { moveInDom(sib, 'before', e.clientY); break; }
      }
    });

    function moveInDom(ref, where, pointerY) {
      const before = drag.getBoundingClientRect().top;
      if (where === 'after') ref.after(drag); else ref.before(drag);
      const after = drag.getBoundingClientRect().top;
      startY += (after - before);                       // keep the card under the pointer
      drag.style.transform = `translateY(${pointerY - startY}px)`;
      renumber();
    }

    function endDrag() {
      if (!drag) return;
      drag.style.transform = '';
      drag.classList.remove('dragging');
      drag.setAttribute('aria-grabbed', 'false');
      const pos = cards().indexOf(drag) + 1;
      announce.textContent = `${drag.querySelector('.seq-term').textContent} dropped at position ${pos} of ${N}.`;
      drag = null;
      renumber();
    }
    list.addEventListener('pointerup', endDrag);
    list.addEventListener('pointercancel', endDrag);

    /* ---------------- keyboard reorder -------------------------------- */
    list.addEventListener('keydown', e => {
      if (state.phase !== 'sorting') return;
      const card = e.target.closest('.seq-item');
      if (!card) return;
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        e.preventDefault();
        const sib = e.key === 'ArrowUp' ? card.previousElementSibling : card.nextElementSibling;
        if (!sib) return;
        if (e.key === 'ArrowUp') sib.before(card); else sib.after(card);
        renumber();
        card.focus();
        const pos = cards().indexOf(card) + 1;
        announce.textContent = `${card.querySelector('.seq-term').textContent} moved to position ${pos} of ${N}.`;
      } else if (!e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        // plain arrows move focus between cards
        e.preventDefault();
        const sib = e.key === 'ArrowUp' ? card.previousElementSibling : card.nextElementSibling;
        if (sib) sib.focus();
      }
    });

    /* ---------------- hint --------------------------------------------- */
    hintBtn.addEventListener('click', () => {
      if (state.phase !== 'sorting' || state.hintUsed) return;
      state.hintUsed = true;
      hintBtn.disabled = true;
      document.getElementById('reveal').innerHTML = `
        <div class="seq-reveal">
          <div class="seq-reveal-lbl">Correct order (−25% applied)</div>
          <ol>${ITEMS.map(it => `<li>${escapeHtml(it.term)}${it.year ? ` <span style="color:var(--text-muted)">(${it.year})</span>` : ''}</li>`).join('')}</ol>
        </div>
      `;
      announce.textContent = 'Correct order revealed. Twenty-five percent will be deducted from this round.';
    });

    /* ---------------- check -------------------------------------------- */
    checkBtn.addEventListener('click', () => {
      if (state.phase === 'done') { renderSummary(); return; }
      if (state.phase !== 'sorting') return;
      endDrag();

      const ranks = cards().map(c => +c.dataset.order);   // ranks[i] = correct rank of card now in slot i
      let exact = 0, adjacent = 0;
      for (let i = 0; i < N; i++) if (ranks[i] === i) exact++;
      for (let i = 0; i < N - 1; i++) if (ranks[i] < ranks[i + 1]) adjacent++;

      // Kendall-tau-flavoured partial credit: blend exact placement with
      // adjacent-pair concordance, then apply the hint penalty.
      let score = Math.round(100 * (0.5 * (exact / N) + 0.5 * (adjacent / (N - 1))));
      if (state.hintUsed) score = Math.round(score * 0.75);
      state.result = { exact, adjacent, score };

      cards().forEach((c, i) => {
        c.classList.add('locked');
        c.setAttribute('tabindex', '-1');
        const ok = +c.dataset.order === i;
        c.classList.add(ok ? 'right' : 'wrong');
        c.querySelector('.seq-correct-tag').textContent = ok ? '✓' : `→ ${+c.dataset.order + 1}`;
      });
      hintBtn.disabled = true;

      let line;
      if (exact === N) line = 'Perfect order — every item exactly where it belongs.';
      else if (adjacent === N - 1) line = 'Every adjacent pair is in the right relative order — you know the flow, just not the exact anchors. One nudge from perfect.';
      else if (adjacent >= Math.ceil((N - 1) * 0.6)) line = 'You have the broad shape of the sequence; a couple of items are swapped. The orange tags show the position each one actually belongs in.';
      else line = 'The order needs work — most relative positions are off. Study the corrected positions (orange tags), then play again from a fresh shuffle.';

      const fb = document.getElementById('fb');
      fb.className = 'tt-feedback ' + (exact === N ? 'ok' : 'mid');
      fb.innerHTML = `
        <div class="seq-metrics" style="margin-top:0;margin-bottom:10px;">
          <span class="seq-metric">Exact = ${exact}/${N}</span>
          <span class="seq-metric">Adjacent pairs in order = ${adjacent}/${N - 1}</span>
          ${state.hintUsed ? '<span class="seq-metric" style="opacity:0.7">Hint −25%</span>' : ''}
        </div>
        ${escapeHtml(line)}
      `;
      announce.textContent = `Checked. ${exact} of ${N} items in the exact position; ${adjacent} of ${N - 1} adjacent pairs in order. Score ${state.result.score} percent. ${line}`;

      checkBtn.textContent = 'See your score →';
      state.phase = 'done';
    });

    document.addEventListener('keydown', enterToCheck);
    function enterToCheck(e) {
      if (e.key !== 'Enter' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) return;
      if (e.target && e.target.classList && e.target.classList.contains('seq-item')) return;
      if (!document.body.contains(checkBtn)) { document.removeEventListener('keydown', enterToCheck); return; }
      e.preventDefault();
      checkBtn.click();
    }
  }

  function renderSummary() {
    const { exact, adjacent, score } = state.result;

    let prevBest = null;
    try { prevBest = parseInt(localStorage.getItem(BEST_KEY)); } catch (e) {}
    if (isNaN(prevBest)) prevBest = null;
    const newBest = prevBest === null || score > prevBest;
    if (newBest) { try { localStorage.setItem(BEST_KEY, String(score)); } catch (e) {} }

    let insight;
    if (score === 100) insight = `Flawless sequencing. Ordering is the hardest kind of recall — you can't bluff it with recognition — and you placed every item in ${topic} without help. Now explain out loud why each item follows the previous one; that's the upgrade from knowing the order to understanding it.`;
    else if (score >= 70) insight = `Strong grip on the flow of ${topic}. The relative order is mostly there (${adjacent}/${ITEMS.length - 1} adjacent pairs correct) — what's missing is precision on a few positions. Anchor each item to one concrete fact (a date, a trigger, a product) and replay.`;
    else if (score >= 40) insight = 'You have fragments of the sequence but not the spine. Don\'t memorise positions — memorise the links: what causes or enables the next item. A chain of "because" beats a numbered list every time.';
    else insight = `This sequence hasn't settled yet — which is exactly what this game is for. Read the correct order once, close your eyes, and narrate the story of ${topic} from first to last in your own words. Then come back and sort it cold.`;

    root.innerHTML = `
      ${renderHeader('Results')}
      <div class="tt-summary">
        <h2>Sequencing report</h2>
        <div class="tt-big-stat">${score}%</div>
        <div class="tt-big-lbl">Exact ${exact}/${ITEMS.length} · Adjacent pairs ${adjacent}/${ITEMS.length - 1}${state.hintUsed ? ' · Hint used' : ''}</div>
        ${newBest
          ? '<div class="tt-best">★ New personal best</div>'
          : prevBest !== null ? `<div class="tt-best" style="opacity:0.7">Personal best: ${prevBest}%</div>` : ''}
        <div class="tt-insight">${escapeHtml(insight)}</div>
        <div class="tt-ctas">
          <button class="tt-btn" id="again">Play again</button>
          <a class="tt-btn tt-btn-ghost" href="../../subjects.html">More games</a>
        </div>
      </div>
    `;
    announce.textContent = `Game over. Score ${score} percent. ${exact} of ${ITEMS.length} exact, ${adjacent} of ${ITEMS.length - 1} adjacent pairs in order.` + (newBest ? ' New personal best.' : '');
    document.getElementById('again').addEventListener('click', startGame);
  }

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
