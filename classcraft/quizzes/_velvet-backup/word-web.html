<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Web — AI Study Method</title>
<meta name="description" content="Rebuild the topic's concept web. Six spokes radiate from the hub — match each definition to its term and light up the whole schema.">
<link rel="stylesheet" href="../../style.css">
<style>
  .ww-wrap { max-width: 860px; margin: 0 auto; padding: calc(var(--nav-h) + 36px) 1.5rem 80px; }
  .ww-badge { display:inline-flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 12px; border-radius:30px; font-family:'DM Mono',monospace; margin-bottom:14px; }
  .ww-title { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1.15; margin:0 0 10px; }
  .ww-sub { color:var(--text-secondary); font-size:15px; margin:0 0 22px; line-height:1.55; max-width:60ch; }
  .ww-meta { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:24px; }
  .ww-card { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:14px; padding:24px 26px; box-shadow:0 4px 14px rgba(10,107,94,0.06); margin-bottom:18px; }

  /* ── layout: web + score side panel + MCQ card ── */
  .ww-layout { display:grid; grid-template-columns:1fr 188px; grid-template-areas:"web side" "quiz side"; gap:16px; align-items:start; margin-bottom:18px; }
  .ww-stage { grid-area:web; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:8px; box-shadow:0 4px 14px rgba(10,107,94,0.06); }
  .ww-stage svg { display:block; width:100%; height:auto; }
  .ww-side { grid-area:side; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:14px; position:sticky; top:calc(var(--nav-h) + 16px); }
  .ww-side-stat { border-bottom:1px dashed var(--border); padding-bottom:12px; }
  .ww-side-stat:last-child { border-bottom:none; padding-bottom:0; }
  .ww-side-lbl { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
  .ww-side-num { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; line-height:1; color:var(--accent); }
  .ww-side-num.warn { color:#b45309; }
  .ww-quiz { grid-area:quiz; margin-bottom:0; }
  @media (max-width: 600px) {
    .ww-layout { grid-template-columns:1fr; grid-template-areas:"web" "side" "quiz"; }
    .ww-side { position:static; flex-direction:row; justify-content:space-around; padding:12px 14px; }
    .ww-side-stat { border-bottom:none; padding-bottom:0; text-align:center; }
    .ww-side-num { font-size:21px; }
    .ww-quiz { padding:18px 16px; }
  }

  /* ── SVG web ── */
  .ww-guide { stroke:var(--border); stroke-width:1.5; stroke-dasharray:4 7; }
  .ww-link { stroke:var(--accent); stroke-width:2.5; fill:none; transition:stroke-dashoffset 0.6s ease; }
  .ww-spoke { cursor:pointer; transform-box:fill-box; transform-origin:center; }
  .ww-spoke circle { fill:var(--bg-primary); stroke:var(--border); stroke-width:2; stroke-dasharray:6 5; transition:stroke 0.18s ease, fill 0.18s ease; }
  .ww-spoke:hover:not(.filled):not(.missed) circle, .ww-spoke:focus-visible circle { stroke:var(--accent); fill:var(--accent-soft); }
  .ww-spoke:focus-visible { outline:none; }
  .ww-spoke:focus-visible circle { stroke-width:3.5; stroke:var(--accent); }
  .ww-spoke.active circle { stroke:var(--accent); fill:var(--accent-soft); stroke-dasharray:none; }
  .ww-qmark { fill:var(--text-muted); font-family:'Playfair Display',serif; font-size:28px; font-weight:700; pointer-events:none; }
  .ww-spokeno { fill:var(--text-muted); font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; pointer-events:none; }
  .ww-spoke:hover:not(.filled):not(.missed) .ww-qmark, .ww-spoke.active .ww-qmark { fill:var(--accent); }
  .ww-spoke.filled, .ww-spoke.missed { cursor:default; }
  .ww-spoke.filled circle { fill:rgba(10,107,94,0.10); stroke:var(--accent); stroke-dasharray:none; }
  .ww-spoke .ww-term { fill:var(--accent); font-family:'DM Sans','Segoe UI',sans-serif; font-weight:600; pointer-events:none; }
  .ww-spoke.missed circle { fill:rgba(180,83,9,0.08); stroke:#b45309; stroke-dasharray:none; }
  .ww-spoke.missed .ww-term { fill:#b45309; }
  @keyframes wwPop { 0%{transform:scale(0.55)} 65%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .ww-spoke.pop { animation:wwPop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  .ww-spoke.wrongflash circle { stroke:#c2410c; fill:rgba(194,65,12,0.12); }
  @keyframes wwShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .ww-spoke.shake { animation:wwShake 0.4s ease; }
  .ww-hub-name { fill:#ffffff; font-family:'Playfair Display',serif; font-weight:700; pointer-events:none; }
  .ww-hub-kicker { fill:rgba(255,255,255,0.75); font-family:'DM Mono',monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:600; pointer-events:none; }
  @keyframes wwHubPulse { 0%,100%{transform:scale(1)} 45%{transform:scale(1.06)} }
  .ww-hub { transform-box:fill-box; transform-origin:center; }
  .ww-hub.pulse { animation:wwHubPulse 0.9s ease 2; }
  svg.ww-complete .ww-link { filter:drop-shadow(0 0 5px rgba(10,107,94,0.55)); }
  svg.ww-complete .ww-spoke.filled circle { filter:drop-shadow(0 0 7px rgba(10,107,94,0.4)); }

  /* ── MCQ card ── */
  .ww-q-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .ww-q { font-family:'Playfair Display',serif; font-size:1.15rem; font-weight:700; color:var(--text-primary); margin:0 0 10px; line-height:1.3; }
  .ww-def { font-size:15px; color:var(--text-primary); margin:0 0 18px; line-height:1.55; padding:13px 15px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); font-style:italic; }
  .ww-options { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .ww-opt { display:flex; align-items:center; gap:10px; background:var(--bg-primary); border:1.5px solid var(--border); border-radius:10px; padding:13px 15px; cursor:pointer; font-size:15px; font-weight:600; transition:border-color 0.15s ease, background 0.15s ease; text-align:left; font-family:inherit; color:var(--text-primary); line-height:1.35; width:100%; }
  .ww-opt:hover:not(:disabled) { border-color:var(--accent); background:var(--accent-soft); }
  .ww-opt:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .ww-opt.selected { border-color:var(--accent); background:var(--accent-soft); }
  .ww-opt:disabled { cursor:default; }
  .ww-opt.correct { border-color:#0a6b5e; background:rgba(10,107,94,0.12); color:#0a6b5e; }
  .ww-opt.wrong { border-color:#c2410c; background:rgba(194,65,12,0.10); color:#c2410c; opacity:0.8; text-decoration:line-through; }
  .ww-key { font-family:'DM Mono',monospace; font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--border-accent); border-radius:6px; padding:2px 7px; flex:none; }
  .ww-opt.wrong .ww-key { color:#c2410c; border-color:rgba(194,65,12,0.35); }
  .tt-btn { background:var(--velvet-gradient); color:#fff; border:none; padding:14px 24px; border-radius:10px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; box-shadow:0 4px 12px var(--accent-glow); transition:transform 0.15s; }
  .tt-btn:hover { transform:translateY(-1px); }
  .tt-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
  .tt-btn-ghost { background:none; border:1.5px solid var(--border-accent); color:var(--accent); box-shadow:none; }
  .ww-quiz-foot { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .ww-tries { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); }
  .ww-fb { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.55; }
  .ww-fb.ok { background:rgba(10,107,94,0.08); color:var(--accent); border:1px solid var(--border-accent); }
  .ww-fb.no { background:rgba(194,65,12,0.08); color:#c2410c; border:1px solid rgba(194,65,12,0.25); }
  .ww-idle { color:var(--text-secondary); font-size:15px; line-height:1.55; display:flex; align-items:center; gap:12px; }
  .ww-idle-icon { font-size:30px; line-height:1; }
  .ww-kbd-hint { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-top:12px; }
  @media (hover:none) { .ww-kbd-hint { display:none; } }

  /* ── summary ── */
  .ww-summary { margin-top:6px; padding:28px; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; text-align:center; }
  .ww-summary h2 { font-family:'Playfair Display',serif; font-size:1.5rem; margin:0 0 16px; }
  .ww-big-stat { font-family:'Playfair Display',serif; font-size:56px; font-weight:700; line-height:1; color:var(--accent); }
  .ww-big-lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); margin:8px 0 4px; }
  .ww-metric-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:22px 0; }
  .ww-metric { background:var(--bg-primary); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .ww-metric-num { font-family:'Playfair Display',serif; font-size:24px; font-weight:700; line-height:1; color:var(--text-primary); }
  .ww-metric-lbl { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); margin-top:5px; }
  .ww-best { display:inline-block; margin-top:4px; font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border:1px solid var(--border-accent); border-radius:20px; padding:4px 12px; }
  .ww-deflist { display:flex; flex-direction:column; gap:10px; margin:20px 0 0; text-align:left; }
  .ww-defrow { padding:12px 14px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); }
  .ww-defrow.was-missed { border-left-color:#b45309; }
  .ww-defrow strong { font-size:14px; color:var(--text-primary); display:block; margin-bottom:3px; }
  .ww-defrow span { font-size:13px; color:var(--text-secondary); line-height:1.5; }
  .ww-retry-tag { font-family:'DM Mono',monospace; font-size:10px; color:#b45309; font-weight:600; margin-left:6px; }
  .ww-insight { font-style:italic; font-size:14px; color:var(--text-secondary); margin:20px auto 0; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); text-align:left; max-width:54ch; }
  .ww-ctas { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .ww-ctas a.tt-btn { text-decoration:none; display:inline-block; }
  @media (max-width: 560px) { .ww-metric-row { gap:8px; } .ww-metric { padding:11px 8px; } .ww-metric-num { font-size:19px; } }

  .ww-error, .ww-pending { padding:20px; border-radius:10px; font-size:14px; }
  .ww-error { background:rgba(194,65,12,0.05); border:1px solid rgba(194,65,12,0.2); color:#c2410c; }
  .ww-pending { background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  @media (prefers-reduced-motion: reduce) {
    .ww-link, .ww-spoke circle, .ww-opt, .tt-btn { transition:none; }
    .ww-spoke.pop, .ww-spoke.shake, .ww-hub.pulse { animation:none; }
    svg.ww-complete .ww-link, svg.ww-complete .ww-spoke.filled circle { filter:none; }
  }
</style>

<div class="ww-wrap" id="root">
  <div class="ww-pending">Loading…</div>
</div>
<div id="announce" aria-live="polite" class="sr-only"></div>

<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const liveRegion = document.getElementById('announce');

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function announce(msg) {
    liveRegion.textContent = '';
    setTimeout(() => { liveRegion.textContent = msg; }, 30);
  }
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!stem) {
    root.innerHTML = '<div class="ww-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  // Some on-disk stems contain a colon the URL param drops (e.g.
  // "history-gcse-edexcel:-superpower…"). Try the plain stem first,
  // then every possible colon-insertion before a dash.
  const candidates = [`../adventures/_specs/${encodeURIComponent(stem)}.json`];
  for (let i = 0; i < stem.length; i++) {
    if (stem[i] === '-') candidates.push(`../adventures/_specs/${encodeURIComponent(stem.slice(0,i) + ':' + stem.slice(i))}.json`);
  }
  let spec = null;
  for (const url of candidates) {
    try {
      const r = await fetch(url);
      if (r.ok) { spec = await r.json(); break; }
    } catch (e) {}
  }
  if (!spec) {
    root.innerHTML = `<div class="ww-error">Couldn't load the concept set for <code>${escapeHtml(stem)}</code>.</div>`;
    return;
  }

  const topic = spec.topic_display || spec.title || stem;
  const level = (spec.level || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subjDisplay = (spec.subject || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // Placeholder defs would make hollow questions — treat them as unauthored.
  const PLACEHOLDER_DEF_RE = /^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;
  const allConcepts = ((spec.concepts) || [])
    .filter(c => c && c.term && c.def && !PLACEHOLDER_DEF_RE.test(String(c.def)))
    .map(c => ({ term: String(c.term).trim(), def: String(c.def).trim() }))
    .filter(c => c.term && c.def);

  if (allConcepts.length < 6) {
    root.innerHTML = `
      <div class="ww-badge">L · Learn · Word Web</div>
      <h1 class="ww-title">${escapeHtml(topic)}</h1>
      <p class="ww-sub">A word web needs six distinctive, topic-specific concepts — generic filler wouldn't earn its place on the site. Come back soon.</p>
      <div class="ww-meta">${escapeHtml([level, subjDisplay, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="ww-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🕸️</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;margin:0 0 8px">Web in production</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:15px;">Word Web needs six authored concept definitions for this exact topic. That set hasn't been written at the required depth yet.</p>
        <a href="../../subjects.html" style="color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">← Back to subjects</a>
      </div>
    `;
    return;
  }

  const BEST_KEY = 'aism-wordweb-best:' + location.pathname;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const N = 6, CX = 300, CY = 250, HUB_R = 65, NODE_R = 55, RING_R = 175;

  function svgEl(name, attrs, parent) {
    const n = document.createElementNS(SVGNS, name);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  // Word-wrap into tspans that fit a spoke circle (min font 12px).
  function wrapLines(text, maxChars) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      if (!cur) cur = w;
      else if ((cur + ' ' + w).length <= maxChars) cur += ' ' + w;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function setSpokeTerm(textNode, term, x) {
    let maxChars = 12;
    let lines = wrapLines(term, maxChars);
    while (lines.length > 3 && maxChars < 40) { maxChars += 3; lines = wrapLines(term, maxChars); }
    lines = lines.slice(0, 3).map(l => l.length > 14 ? l.slice(0, 13) + '…' : l);
    const fs = 12; // brief: never below 12px inside spokes
    const lh = fs * 1.18;
    const startDy = -((lines.length - 1) / 2) * lh;
    while (textNode.firstChild) textNode.removeChild(textNode.firstChild);
    lines.forEach((ln, i) => {
      const ts = svgEl('tspan', { x, dy: i === 0 ? startDy : lh }, textNode);
      ts.textContent = ln;
    });
    textNode.setAttribute('font-size', fs);
  }

  const fmtTime = ms => {
    const s = Math.round(ms / 1000);
    return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
  };

  /* ── game state ── */
  let state = null;
  let spokeEls = [];      // per-spoke { g, circle, qmark, no, term, link, x, y }
  let svgRoot = null, hubG = null;
  let activeSpoke = null; // index of the spoke whose MCQ is showing
  let chosenTerm = null;  // currently selected option in the MCQ

  function spokeAria(i) {
    const sp = state.spokes[i];
    if (sp.status === 'done') return `Spoke ${i + 1}: filled with ${sp.term}`;
    if (sp.status === 'missed') return `Spoke ${i + 1}: revealed as ${sp.term} after two tries`;
    return `Empty spoke ${i + 1} — tap to fill`;
  }

  function renderHeader() {
    return `
      <div class="ww-badge">L · Learn · Word Web</div>
      <h1 class="ww-title">${escapeHtml(topic)}</h1>
      <p class="ww-sub">Every topic is a web of connected ideas. The hub is <strong>${escapeHtml(topic)}</strong>; the six empty bubbles are its key concepts. Tap a bubble, read the definition, pick the right term — two tries per spoke. Light up all six.</p>
      <div class="ww-meta">${escapeHtml([level, subjDisplay].filter(Boolean).join(' · '))} · 6 spokes</div>
    `;
  }

  /* ── build the SVG web ── */
  function buildWeb() {
    svgRoot = svgEl('svg', {
      viewBox: '0 0 600 500',
      xmlns: SVGNS,
      role: 'group',
      'aria-label': `Word web for ${topic}: six concept spokes around a central hub`,
    });

    // Velvet gradient for the hub
    const defs = svgEl('defs', null, svgRoot);
    const grad = svgEl('linearGradient', { id: 'wwVelvet', x1: '0%', y1: '0%', x2: '100%', y2: '100%' }, defs);
    svgEl('stop', { offset: '0%', 'stop-color': '#0a6b5e' }, grad);
    svgEl('stop', { offset: '100%', 'stop-color': '#4a3fa0' }, grad);

    const guidesG = svgEl('g', { 'aria-hidden': 'true' }, svgRoot);
    const linksG = svgEl('g', { 'aria-hidden': 'true' }, svgRoot);
    const spokesG = svgEl('g', null, svgRoot);
    spokeEls = [];

    for (let i = 0; i < N; i++) {
      const a = (i * 60) * Math.PI / 180; // 0°, 60°, … 300°
      const x = CX + RING_R * Math.cos(a);
      const y = CY + RING_R * Math.sin(a);
      const x1 = CX + HUB_R * Math.cos(a), y1 = CY + HUB_R * Math.sin(a);
      const x2 = x - NODE_R * Math.cos(a), y2 = y - NODE_R * Math.sin(a);
      const len = Math.hypot(x2 - x1, y2 - y1);

      // Faint dashed guide; solid accent link drawn on success.
      svgEl('line', { x1, y1, x2, y2, class: 'ww-guide' }, guidesG);
      const link = svgEl('line', { x1, y1, x2, y2, class: 'ww-link' }, linksG);
      link.style.strokeDasharray = `${len} ${len}`;
      link.style.strokeDashoffset = String(len);

      const g = svgEl('g', {
        class: 'ww-spoke',
        role: 'button',
        tabindex: '0',
        'aria-label': `Empty spoke ${i + 1} — tap to fill`,
      }, spokesG);
      const circle = svgEl('circle', { cx: x, cy: y, r: NODE_R }, g);
      const no = svgEl('text', { x, y: y - 20, 'text-anchor': 'middle', class: 'ww-spokeno' }, g);
      no.textContent = String(i + 1);
      const qmark = svgEl('text', { x, y: y + 16, 'text-anchor': 'middle', class: 'ww-qmark' }, g);
      qmark.textContent = '?';
      const term = svgEl('text', { x, y, 'text-anchor': 'middle', 'dominant-baseline': 'middle', class: 'ww-term' }, g);

      g.addEventListener('click', () => activateSpoke(i));
      g.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateSpoke(i); }
      });
      spokeEls.push({ g, circle, qmark, no, term, link, x, y });
    }

    // Hub last so it sits on top of the guide lines.
    hubG = svgEl('g', { class: 'ww-hub', 'aria-hidden': 'true' }, svgRoot);
    svgEl('circle', { cx: CX, cy: CY, r: HUB_R, fill: 'url(#wwVelvet)', stroke: 'rgba(255,255,255,0.4)', 'stroke-width': '2' }, hubG);
    const kicker = svgEl('text', { x: CX, y: CY - 16, 'text-anchor': 'middle', class: 'ww-hub-kicker' }, hubG);
    kicker.textContent = 'Topic';
    const name = svgEl('text', { x: CX, y: CY + 10, 'text-anchor': 'middle', class: 'ww-hub-name' }, hubG);
    const label = topic.length > 14 ? topic.slice(0, 14).trimEnd() + '…' : topic;
    name.textContent = label;
    name.setAttribute('font-size', Math.max(12, Math.min(17, Math.round(116 / Math.max(label.length, 1) * 1.7))));

    return svgRoot;
  }

  /* ── MCQ card ── */
  function activateSpoke(i) {
    if (!state || state.done) return;
    const sp = state.spokes[i];
    if (sp.status !== 'empty') return;
    activeSpoke = i;
    chosenTerm = null;
    spokeEls.forEach((el, j) => el.g.classList.toggle('active', j === i));
    renderQuiz();
    announce(`Spoke ${i + 1} selected. ${sp.variant === 0 ? 'Which term has this definition?' : 'Which term means:'} ${sp.def}`);
  }

  function renderQuiz() {
    const quiz = document.getElementById('wwQuiz');
    if (!quiz) return;

    if (activeSpoke == null) {
      const remaining = state.spokes.filter(s => s.status === 'empty').length;
      quiz.innerHTML = state.done ? '' : `
        <div class="ww-idle">
          <span class="ww-idle-icon" aria-hidden="true">🕸️</span>
          <span>Tap an empty spoke on the web to reveal its question. <strong>${remaining}</strong> of 6 still to fill.</span>
        </div>
        <div class="ww-kbd-hint">Tab to a spoke · Enter opens · 1–4 picks an answer · Enter confirms</div>
      `;
      return;
    }

    const i = activeSpoke;
    const sp = state.spokes[i];
    const heading = sp.variant === 0 ? 'Which term has this definition?' : 'Which term means:';
    quiz.innerHTML = `
      <div class="ww-q-label">Spoke ${i + 1} of 6 · ${sp.tries === 0 ? 'first try +100' : 'second try +50'}</div>
      <h2 class="ww-q" id="wwQuizQ">${heading}</h2>
      <blockquote class="ww-def">“${escapeHtml(sp.def)}”</blockquote>
      <div class="ww-options" role="group" aria-labelledby="wwQuizQ">
        ${sp.options.map((t, k) => `
          <button type="button" class="ww-opt${sp.wrongPicks.includes(t) ? ' wrong' : ''}" data-term="${escapeHtml(t)}" ${sp.wrongPicks.includes(t) ? 'disabled' : ''} aria-pressed="false">
            <span class="ww-key" aria-hidden="true">${k + 1}</span><span>${escapeHtml(t)}</span>
          </button>
        `).join('')}
      </div>
      <div class="ww-quiz-foot">
        <button type="button" class="tt-btn" id="wwConfirm" disabled>Confirm →</button>
        <span class="ww-tries">${sp.tries === 0 ? '2 tries left' : '1 try left'}</span>
      </div>
      <div id="wwFb"></div>
    `;

    const confirm = document.getElementById('wwConfirm');
    quiz.querySelectorAll('.ww-opt').forEach(b => {
      b.addEventListener('click', () => {
        if (b.disabled) return;
        quiz.querySelectorAll('.ww-opt').forEach(x => { x.classList.remove('selected'); x.setAttribute('aria-pressed', 'false'); });
        b.classList.add('selected');
        b.setAttribute('aria-pressed', 'true');
        chosenTerm = b.dataset.term;
        confirm.disabled = false;
      });
    });
    confirm.addEventListener('click', confirmAnswer);
  }

  function confirmAnswer() {
    if (activeSpoke == null || chosenTerm == null) return;
    const i = activeSpoke;
    const sp = state.spokes[i];
    const quiz = document.getElementById('wwQuiz');
    const fb = document.getElementById('wwFb');
    sp.tries++;

    if (chosenTerm === sp.term) {
      const firstTry = sp.tries === 1;
      const pts = firstTry ? 100 : 50;
      sp.status = 'done';
      sp.firstTry = firstTry;
      state.score += pts;
      if (firstTry) state.firstTryCount++;
      quiz.querySelectorAll('.ww-opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.term === sp.term) b.classList.add('correct');
      });
      document.getElementById('wwConfirm').disabled = true;
      fb.className = 'ww-fb ok';
      fb.innerHTML = `<strong>Correct — +${pts}.</strong> “${escapeHtml(sp.term)}” joins the web.`;
      announce(`Correct. Spoke ${i + 1} filled with ${sp.term}. Score ${state.score}.`);
      fillSpoke(i, false);
    } else {
      state.retries++;
      sp.wrongPicks.push(chosenTerm);
      flashWrong(i);
      if (sp.tries >= 2) {
        // Out of tries: reveal the answer, fill the spoke in "missed" amber.
        sp.status = 'missed';
        quiz.querySelectorAll('.ww-opt').forEach(b => {
          b.disabled = true;
          if (b.dataset.term === sp.term) b.classList.add('correct');
          else if (b.dataset.term === chosenTerm) b.classList.add('wrong');
        });
        document.getElementById('wwConfirm').disabled = true;
        fb.className = 'ww-fb no';
        fb.innerHTML = `<strong>Out of tries.</strong> The answer was “${escapeHtml(sp.term)}” — it joins the web, but unscored. Worth a re-read below when you finish.`;
        announce(`Out of tries. Spoke ${i + 1} was ${sp.term}.`);
        fillSpoke(i, true);
      } else {
        const wrongBtn = quiz.querySelector(`.ww-opt.selected`);
        if (wrongBtn) { wrongBtn.classList.remove('selected'); wrongBtn.classList.add('wrong'); wrongBtn.disabled = true; }
        chosenTerm = null;
        document.getElementById('wwConfirm').disabled = true;
        quiz.querySelector('.ww-tries').textContent = '1 try left';
        quiz.querySelector('.ww-q-label').textContent = `Spoke ${i + 1} of 6 · second try +50`;
        fb.className = 'ww-fb no';
        fb.innerHTML = `<strong>Not that one.</strong> That term belongs on a different spoke — one try left.`;
        announce(`Wrong term for spoke ${i + 1}. One try left.`);
      }
    }
    updateStats();
  }

  function flashWrong(i) {
    const el = spokeEls[i];
    el.g.classList.add('wrongflash');
    if (!REDUCED) {
      el.g.classList.remove('shake');
      void el.g.getBoundingClientRect();
      el.g.classList.add('shake');
    }
    setTimeout(() => el.g.classList.remove('wrongflash', 'shake'), 500);
  }

  function fillSpoke(i, missed) {
    const sp = state.spokes[i];
    const el = spokeEls[i];
    state.filledCount++;

    el.qmark.remove();
    el.no.remove();
    setSpokeTerm(el.term, sp.term, el.x);
    el.g.classList.remove('active');
    el.g.classList.add(missed ? 'missed' : 'filled');
    if (!REDUCED) el.g.classList.add('pop');
    el.g.setAttribute('aria-label', spokeAria(i));
    el.g.setAttribute('aria-disabled', 'true');
    el.g.setAttribute('tabindex', '-1');

    // Permanent hub→spoke line, revealed with a dash-offset draw.
    requestAnimationFrame(() => { el.link.style.strokeDashoffset = '0'; });

    activeSpoke = null;
    chosenTerm = null;

    if (state.filledCount === N) {
      setTimeout(finishGame, REDUCED ? 250 : 1100);
    } else {
      // Linger on the feedback, then invite the next spoke.
      setTimeout(() => {
        if (state.done || activeSpoke != null) return; // player already moved on
        renderQuiz();
        const next = state.spokes.findIndex((s, j) => s.status === 'empty' && j > i);
        const tgt = spokeEls[next !== -1 ? next : state.spokes.findIndex(s => s.status === 'empty')];
        if (tgt) tgt.g.focus();
      }, REDUCED ? 400 : 1600);
    }
  }

  function updateStats() {
    const sc = document.getElementById('wwScoreNum');
    const ft = document.getElementById('wwFirstTryNum');
    const rt = document.getElementById('wwRetryNum');
    if (sc) sc.textContent = state.score;
    if (ft) ft.textContent = `${state.firstTryCount}/6`;
    if (rt) { rt.textContent = state.retries; rt.classList.toggle('warn', state.retries > 0); }
  }

  /* ── end of game ── */
  function finishGame() {
    state.done = true;
    state.elapsed = Date.now() - state.t0;
    if (svgRoot) svgRoot.classList.add('ww-complete');
    if (hubG && !REDUCED) hubG.classList.add('pulse');

    const pct = Math.round((state.firstTryCount / N) * 100);
    let prevBest = null;
    try { prevBest = parseInt(localStorage.getItem(BEST_KEY), 10); } catch (e) {}
    if (isNaN(prevBest)) prevBest = null;
    const newBest = prevBest === null || state.score > prevBest;
    if (newBest) { try { localStorage.setItem(BEST_KEY, String(state.score)); } catch (e) {} }

    const missed = state.spokes.filter(s => s.status === 'missed');
    let insightHead, insightBody;
    if (state.retries === 0) {
      insightHead = 'Strong recall.';
      insightBody = `Every spoke connected on the first touch — you don't just recognise the terms of ${topic}, you hold the whole schema as one connected map. That's exactly the layer exams reward when questions cut across concepts.`;
    } else {
      insightHead = 'Mixed up some terms.';
      insightBody = `${state.retries} ${state.retries === 1 ? 'retry' : 'retries'} means some term–definition wires are crossed${missed.length ? `, and ${missed.length} ${missed.length === 1 ? 'spoke' : 'spokes'} had to be revealed` : ''}. Re-read the definitions below — especially the amber ones — then replay and aim for a clean web.`;
    }

    const quiz = document.getElementById('wwQuiz');
    if (quiz) quiz.innerHTML = `<div class="ww-idle"><span class="ww-idle-icon" aria-hidden="true">✨</span><span>Web complete — summary below.</span></div>`;

    const panel = document.getElementById('wwPanel');
    panel.innerHTML = `
      <div class="ww-summary">
        <h2>Web complete</h2>
        <div class="ww-big-stat">${state.score}</div>
        <div class="ww-big-lbl">Total score</div>
        ${newBest
          ? '<div class="ww-best">★ New personal best</div>'
          : prevBest !== null ? `<div class="ww-best" style="opacity:0.7">Personal best: ${prevBest}</div>` : ''}
        <div class="ww-metric-row">
          <div class="ww-metric"><div class="ww-metric-num">${pct}%</div><div class="ww-metric-lbl">First-try (${state.firstTryCount}/6)</div></div>
          <div class="ww-metric"><div class="ww-metric-num">${state.retries}</div><div class="ww-metric-lbl">Retries used</div></div>
          <div class="ww-metric"><div class="ww-metric-num">${fmtTime(state.elapsed)}</div><div class="ww-metric-lbl">Time elapsed</div></div>
        </div>
        <div class="ww-insight"><strong>${insightHead}</strong> ${escapeHtml(insightBody)}</div>
        <div class="ww-deflist">
          ${state.spokes.map(s => `
            <div class="ww-defrow${s.status === 'missed' ? ' was-missed' : ''}">
              <strong>${escapeHtml(s.term)}${s.status === 'missed' ? '<span class="ww-retry-tag">· revealed</span>' : s.firstTry === false ? '<span class="ww-retry-tag">· 2nd try</span>' : ''}</strong>
              <span>${escapeHtml(s.def)}</span>
            </div>
          `).join('')}
        </div>
        <div class="ww-ctas">
          <button class="tt-btn" id="wwAgain">Play again ↺</button>
          <a class="tt-btn tt-btn-ghost" href="../../subjects.html">More games</a>
        </div>
      </div>
    `;
    announce(`Web complete. Score ${state.score}. First-try ${state.firstTryCount} of 6, ${pct} percent. ${state.retries} retries.` + (newBest ? ' New personal best.' : ''));
    document.getElementById('wwAgain').addEventListener('click', startGame);
    panel.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
  }

  /* ── boot / reboot ── */
  function startGame() {
    const picked = shuffle(allConcepts).slice(0, N);
    state = {
      spokes: picked.map(c => {
        const distractors = shuffle(picked.filter(o => o.term !== c.term).map(o => o.term)).slice(0, 3);
        return {
          term: c.term,
          def: c.def,
          options: shuffle([c.term, ...distractors]),
          variant: Math.random() < 0.5 ? 0 : 1, // 0 = "has this definition?", 1 = "means:"
          tries: 0,
          wrongPicks: [],
          status: 'empty',
          firstTry: null,
        };
      }),
      score: 0,
      firstTryCount: 0,
      retries: 0,
      filledCount: 0,
      done: false,
      t0: Date.now(),
      elapsed: 0,
    };
    activeSpoke = null;
    chosenTerm = null;

    root.innerHTML = `
      ${renderHeader()}
      <div class="ww-layout">
        <div class="ww-stage" id="wwStage"></div>
        <aside class="ww-side" aria-label="Score panel">
          <div class="ww-side-stat"><div class="ww-side-lbl">Score</div><div class="ww-side-num" id="wwScoreNum">0</div></div>
          <div class="ww-side-stat"><div class="ww-side-lbl">First-try</div><div class="ww-side-num" id="wwFirstTryNum">0/6</div></div>
          <div class="ww-side-stat"><div class="ww-side-lbl">Retries used</div><div class="ww-side-num" id="wwRetryNum">0</div></div>
        </aside>
        <div class="ww-card ww-quiz" id="wwQuiz"></div>
      </div>
      <div id="wwPanel"></div>
    `;
    document.getElementById('wwStage').appendChild(buildWeb());
    renderQuiz();
  }

  // Keyboard: 1–4 pick an option, Enter confirms (when the MCQ is live).
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (activeSpoke == null || !state || state.done) return;
    const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
    if (e.key in map) {
      const opts = document.querySelectorAll('#wwQuiz .ww-opt');
      const b = opts[map[e.key]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
      return;
    }
    if (e.key === 'Enter') {
      // Let native button activation handle Enter on options/Confirm itself.
      if (e.target && (e.target.id === 'wwConfirm' || (e.target.classList && e.target.classList.contains('ww-opt')))) return;
      const confirm = document.getElementById('wwConfirm');
      if (confirm && !confirm.disabled) { e.preventDefault(); confirm.click(); }
    }
  });

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
