<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   AISM SFX — compact synth layer (mirrors the mob-quiz engine)
   ============================================================ */
const AISM_REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const AISM_SFX = (() => {
  let actx = null, master = null;
  let muted = false;
  try { muted = localStorage.getItem('aism-muted') === '1'; } catch (e) {}
  function ensure() {
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.32;
        master.connect(actx.destination);
      }
      if (actx.state === 'suspended') actx.resume();
      return true;
    } catch (e) { return false; }
  }
  function tone(freq, dur, type, vol, endFreq) {
    if (muted || !ensure()) return;
    try {
      const t0 = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t0 + dur);
      g.gain.setValueAtTime(vol || 0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  return {
    unlock() { ensure(); },
    isMuted() { return muted; },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('aism-muted', muted ? '1' : '0'); } catch (e) {}
      return muted;
    },
    buzz()    { tone(440, 0.08, 'square', 0.14); setTimeout(() => tone(660, 0.12, 'square', 0.12), 70); },
    tick()    { tone(880, 0.05, 'sine', 0.06); },
    correct() { tone(523, 0.09, 'sine', 0.14); setTimeout(() => tone(659, 0.12, 'sine', 0.13), 80); setTimeout(() => tone(784, 0.16, 'sine', 0.12), 160); },
    wrong()   { tone(196, 0.22, 'sawtooth', 0.11, 98); },
    fanfare() { tone(523, 0.1, 'triangle', 0.15); setTimeout(() => tone(659, 0.1, 'triangle', 0.15), 100); setTimeout(() => tone(784, 0.2, 'triangle', 0.15), 200); },
    over()    { tone(330, 0.22, 'triangle', 0.13, 240); setTimeout(() => tone(220, 0.35, 'triangle', 0.12, 120), 220); },
  };
})();
(function aismMuteBtn() {
  function add() {
    if (document.getElementById('aism-mute')) return;
    const b = document.createElement('button');
    b.id = 'aism-mute';
    b.type = 'button';
    b.title = 'Toggle sound (M)';
    b.textContent = AISM_SFX.isMuted() ? '🔇' : '🔊';
    b.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:900;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;line-height:1;';
    b.addEventListener('click', () => { b.textContent = AISM_SFX.toggleMute() ? '🔇' : '🔊'; });
    document.body.appendChild(b);
  }
  if (document.body) add(); else window.addEventListener('DOMContentLoaded', add);
  document.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const b = document.getElementById('aism-mute');
      if (b) b.click();
    }
  });
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => AISM_SFX.unlock(), { once: true, capture: true }));
})();

/* ============================================================
   PROCEDURAL ART GENERATOR
   Deterministic abstract "poster" per concept term:
   FNV-1a hash → mulberry32 PRNG → seeded shapes + subject palette
   + a subject icon glyph at the centre.
   ============================================================ */
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function drawCustomGlyph(ctx, name) {
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (name === 'atom') {
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(50, 50);
      ctx.rotate((i * Math.PI) / 3);
      ctx.beginPath();
      ctx.ellipse(0, 0, 38, 15, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(50, 50, 7, 0, Math.PI * 2); ctx.fill();
  } else if (name === 'globe') {
    ctx.beginPath(); ctx.arc(50, 50, 36, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(50, 50, 16, 36, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, 50); ctx.lineTo(86, 50); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(50, 32, 33, 10, 0, 0, Math.PI); ctx.stroke();
  } else if (name === 'gear') {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.save(); ctx.translate(50, 50); ctx.rotate(a);
      ctx.fillRect(-5, -42, 10, 14);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(50, 50, 28, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(50, 50, 11, 0, Math.PI * 2); ctx.stroke();
  } else if (name === 'note') {
    ctx.beginPath(); ctx.ellipse(38, 74, 13, 10, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(50, 71); ctx.lineTo(50, 18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(50, 18); ctx.quadraticCurveTo(72, 24, 70, 42); ctx.stroke();
  } else if (name === 'spiral') {
    ctx.beginPath();
    for (let t = 0; t <= Math.PI * 5; t += 0.1) {
      const r = 3 + t * 2.4;
      const x = 50 + Math.cos(t) * r, y = 50 + Math.sin(t) * r;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (name === 'people') {
    [[34, 0], [66, 0]].forEach(([cx]) => {
      ctx.beginPath(); ctx.arc(cx, 34, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, 84, 22, Math.PI, 0); ctx.stroke();
    });
  } else if (name === 'coin') {
    ctx.beginPath(); ctx.arc(50, 50, 36, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(50, 50, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.font = '700 34px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('£', 50, 52);
  } else if (name === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i / 5) * Math.PI * 2 - Math.PI / 2;
      const a2 = ((i + 0.5) / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(50 + Math.cos(a1) * 38, 50 + Math.sin(a1) * 38);
      ctx.lineTo(50 + Math.cos(a2) * 16, 50 + Math.sin(a2) * 16);
    }
    ctx.closePath(); ctx.fill();
  }
}

/* Render the full poster for a concept onto an offscreen canvas. */
function renderPoster(term, subject, W, H) {
  const cnv = document.createElement('canvas');
  cnv.width = W; cnv.height = H;
  const ctx = cnv.getContext('2d');
  const pal = PALETTES[subject] || PALETTE_DEFAULT;
  const rnd = mulberry32(fnv1a(term + '|' + subject));

  // Background gradient at a seeded angle
  const ga = rnd() * Math.PI * 2;
  const grad = ctx.createLinearGradient(
    W / 2 + Math.cos(ga) * W, H / 2 + Math.sin(ga) * H,
    W / 2 - Math.cos(ga) * W, H / 2 - Math.sin(ga) * H);
  grad.addColorStop(0, pal.bg[0]);
  grad.addColorStop(1, pal.bg[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Faint seeded grid texture
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridStep = 24 + Math.floor(rnd() * 30);
  for (let x = gridStep; x < W; x += gridStep) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = gridStep; y < H; y += gridStep) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // 5–12 seeded abstract shapes
  const nShapes = 5 + Math.floor(rnd() * 8);
  for (let i = 0; i < nShapes; i++) {
    const col = pal.cols[Math.floor(rnd() * pal.cols.length)];
    const x = rnd() * W, y = rnd() * H;
    const size = 30 + rnd() * 130;
    const rot = rnd() * Math.PI * 2;
    const alpha = 0.18 + rnd() * 0.5;
    const kind = Math.floor(rnd() * 5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    if (kind === 0) {            // filled circle
      ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 1) {     // ring
      ctx.lineWidth = 4 + rnd() * 10;
      ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.stroke();
    } else if (kind === 2) {     // polygon (3–6 sides)
      const sides = 3 + Math.floor(rnd() * 4);
      ctx.beginPath();
      for (let k = 0; k < sides; k++) {
        const a = (k / sides) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * size / 2, Math.sin(a) * size / 2);
      }
      ctx.closePath(); ctx.fill();
    } else if (kind === 3) {     // gradient bar
      const barG = ctx.createLinearGradient(-size, 0, size, 0);
      barG.addColorStop(0, col + '00');
      barG.addColorStop(0.5, col);
      barG.addColorStop(1, col + '00');
      ctx.fillStyle = barG;
      ctx.fillRect(-size, -(6 + rnd() * 16) / 2, size * 2, 6 + rnd() * 16);
    } else {                     // arc sweep
      ctx.lineWidth = 3 + rnd() * 7;
      ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * (0.6 + rnd() * 1.2)); ctx.stroke();
    }
    ctx.restore();
  }

  // Centre icon hint: glow disc + subject glyph
  const glyphName = SUBJECT_GLYPH[subject] || 'star';
  const cx = W / 2, cy = H / 2;
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, H * 0.42);
  glow.addColorStop(0, 'rgba(10,10,14,0.55)');
  glow.addColorStop(1, 'rgba(10,10,14,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  const scale = (H * 0.5) / 100;
  ctx.translate(cx - 50 * scale, cy - 50 * scale);
  ctx.scale(scale, scale);
  ctx.strokeStyle = pal.glyph;
  ctx.fillStyle = pal.glyph;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = pal.cols[0];
  ctx.shadowBlur = 18;
  const g = GLYPH_PATHS[glyphName];
  if (g.custom) {
    drawCustomGlyph(ctx, g.custom);
  } else {
    const p = new Path2D(g.d);
    if (g.fill) ctx.fill(p);
    ctx.stroke(p);
  }
  ctx.restore();

  // Corner ticks — seeded accent flourish
  ctx.strokeStyle = pal.cols[1 % pal.cols.length];
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 3;
  const m = 14, t = 20;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(x + t * sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + t * sy);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  return cnv;
}

/* ============================================================
   GAME
   ============================================================ */
(async function () {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  if (!stem) {
    root.innerHTML = '<div class="rr-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  // Some on-disk stems contain a colon the URL param drops. Try the plain
  // stem first, then every possible colon-insertion before a dash.
  const stemCandidates = [stem];
  for (let i = 0; i < stem.length; i++) {
    if (stem[i] === '-') stemCandidates.push(stem.slice(0, i) + ':' + stem.slice(i));
  }
  async function fetchJson(dir) {
    for (const cand of stemCandidates) {
      try {
        const r = await fetch(`${dir}/${encodeURIComponent(cand)}.json`);
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  const spec = await fetchJson('../adventures/_specs');

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subject = (spec && spec.subject) || '';
  const subjDisplay = subject.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  const concepts = ((spec && spec.concepts) || []).filter(c => c && c.term);

  if (!spec || concepts.length < 4) {
    root.innerHTML = `
      <div class="rr-badge">V · Verify · Reveal Race</div>
      <h1 class="rr-title">${escapeHtml(topic)}</h1>
      <p class="rr-sub">Reveal Race needs at least four concept terms for this exact topic so it can build posters and decoys. That set hasn't been authored yet.</p>
      <div class="rr-meta">${escapeHtml([level, subjDisplay, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="rr-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🖼️</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;margin:0 0 8px">Posters in production</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:15px;">Check back soon — this topic's concept set is still being written at the required depth.</p>
        <a href="../../subjects.html" style="color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">← Back to subjects</a>
      </div>
    `;
    return;
  }

  const BEST_KEY = 'aism-reveal-best:' + location.pathname;
  const SLOW_KEY = 'aism-reveal-slow';
  const TOTAL_ROUNDS = 5;
  const BASE_TIME = 10000;        // ms — full reveal
  const GRID_COLS = 16, GRID_ROWS = 10;
  const TOTAL_CELLS = GRID_COLS * GRID_ROWS;
  const ART_W = 640, ART_H = 400;
  const PLACEHOLDER_DEF_RE = /^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;

  let slowMode = false;
  try { slowMode = localStorage.getItem(SLOW_KEY) === '1'; } catch (e) {}

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Build 5 rounds: each picks a target concept (cycling a shuffle so small
  // sets still fill 5 rounds) + 3 decoy terms from the same spec.
  function buildRounds() {
    const order = shuffle(concepts);
    const rounds = [];
    for (let i = 0; i < TOTAL_ROUNDS; i++) {
      const target = order[i % order.length];
      const decoys = shuffle(concepts.filter(c => c.term !== target.term)).slice(0, 3);
      const options = shuffle([target.term, ...decoys.map(c => c.term)]);
      rounds.push({ target, options, correctIdx: options.indexOf(target.term) });
    }
    return rounds;
  }

  let rounds, state;
  let raf = null, revealStart = 0, pausedFrac = 0;
  let phase = 'idle';   // idle | revealing | options | feedback | done
  let cellOrder = [], revealedCount = 0;
  let artCanvas = null, viewCtx = null, viewCanvas = null;
  let roundTotalTime = BASE_TIME;
  let milestones = {};

  function startGame() {
    rounds = buildRounds();
    state = { idx: 0, score: 0, bestRound: 0, correct: 0, revealFracs: [] };
    renderRound();
  }

  function renderHeader(metaTail) {
    return `
      <div class="rr-badge">V · Verify · Reveal Race</div>
      <h1 class="rr-title">${escapeHtml(topic)}</h1>
      <p class="rr-sub">An abstract poster slowly reveals. Buzz in when you can name it. The sooner, the higher your score — but guess wrong and the round is lost.</p>
      <div class="rr-meta">${escapeHtml([level, subjDisplay].filter(Boolean).join(' · '))} · ${metaTail}</div>
    `;
  }

  function renderRound() {
    const round = rounds[state.idx];
    phase = 'idle';
    roundTotalTime = slowMode ? BASE_TIME * 2 : BASE_TIME;
    milestones = {};
    revealedCount = 0;
    pausedFrac = 0;

    root.innerHTML = `
      ${renderHeader(`Round ${state.idx + 1} of ${TOTAL_ROUNDS}`)}
      <div class="rr-hud">
        <div class="rr-hud-item"><div class="rr-hud-num" id="hud-score">${state.score}</div><div class="rr-hud-lbl">Score</div></div>
        <div class="rr-hud-item"><div class="rr-hud-num">${state.idx + 1}/${TOTAL_ROUNDS}</div><div class="rr-hud-lbl">Round</div></div>
        <div class="rr-hud-item"><div class="rr-hud-num" id="hud-best">${state.bestRound}</div><div class="rr-hud-lbl">Best per round</div></div>
      </div>
      <div class="rr-card">
        <div class="rr-round-label">
          <span>Round ${state.idx + 1} · Which concept is this poster?</span>
          <span id="reveal-pct-label">0% revealed</span>
        </div>
        <div class="rr-timer-track" aria-hidden="true"><div class="rr-timer-fill" id="timer-fill"></div></div>
        <div class="rr-stage">
          <canvas class="rr-canvas" id="art" width="${ART_W}" height="${ART_H}" role="img"
            aria-label="Abstract poster gradually revealing — buzz in when you can identify the concept"></canvas>
          <div class="rr-reveal-tag" id="reveal-tag">0%</div>
        </div>
        <div class="rr-buzz-row" id="buzz-row">
          <button type="button" class="rr-buzz" id="buzz">⚡ Buzz</button>
        </div>
        <div id="options-zone"></div>
        <div id="fb"></div>
        <div class="rr-toggles">
          <label class="rr-toggle"><input type="checkbox" id="slow-toggle" ${slowMode ? 'checked' : ''}> Slow mode (2× reveal time)</label>
        </div>
        <div class="rr-kbd-hint">Keyboard: Space to buzz · 1–4 to answer · Enter for next</div>
      </div>
    `;

    viewCanvas = document.getElementById('art');
    viewCtx = viewCanvas.getContext('2d');
    artCanvas = renderPoster(round.target.term, subject, ART_W, ART_H);

    // Seeded reveal order — deterministic per concept so replays feel fair.
    const rnd = mulberry32(fnv1a('order|' + round.target.term + '|' + subject));
    cellOrder = Array.from({ length: TOTAL_CELLS }, (_, i) => i);
    for (let i = cellOrder.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [cellOrder[i], cellOrder[j]] = [cellOrder[j], cellOrder[i]];
    }

    // Base layer: coarse pixelated mosaic, dimmed — the "covered" state.
    const mosaic = document.createElement('canvas');
    mosaic.width = GRID_COLS; mosaic.height = GRID_ROWS;
    const mctx = mosaic.getContext('2d');
    mctx.drawImage(artCanvas, 0, 0, GRID_COLS, GRID_ROWS);
    viewCtx.imageSmoothingEnabled = false;
    viewCtx.drawImage(mosaic, 0, 0, ART_W, ART_H);
    viewCtx.imageSmoothingEnabled = true;
    viewCtx.fillStyle = 'rgba(10,11,16,0.55)';
    viewCtx.fillRect(0, 0, ART_W, ART_H);

    document.getElementById('buzz').addEventListener('click', onBuzz);
    document.getElementById('slow-toggle').addEventListener('change', e => {
      slowMode = e.target.checked;
      try { localStorage.setItem(SLOW_KEY, slowMode ? '1' : '0'); } catch (err) {}
      // Re-scale the running clock so elapsed fraction is preserved.
      if (phase === 'revealing') {
        const frac = currentFrac();
        roundTotalTime = slowMode ? BASE_TIME * 2 : BASE_TIME;
        revealStart = performance.now() - frac * roundTotalTime;
      } else {
        roundTotalTime = slowMode ? BASE_TIME * 2 : BASE_TIME;
      }
      announce.textContent = slowMode ? 'Slow mode on — reveal time doubled.' : 'Slow mode off.';
    });

    announce.textContent = `Round ${state.idx + 1} of ${TOTAL_ROUNDS}. Poster revealing now.`;
    phase = 'revealing';
    revealStart = performance.now();
    if (raf) cancelAnimationFrame(raf);
    if (AISM_REDUCED) {
      stepReveal();                  // chunky, timer-driven reveal — no per-frame animation
    } else {
      raf = requestAnimationFrame(revealFrame);
    }
  }

  function currentFrac() {
    return Math.min(1, (performance.now() - revealStart) / roundTotalTime);
  }

  function revealCellsTo(frac) {
    const target = Math.floor(frac * TOTAL_CELLS);
    const cw = ART_W / GRID_COLS, ch = ART_H / GRID_ROWS;
    while (revealedCount < target && revealedCount < TOTAL_CELLS) {
      const cell = cellOrder[revealedCount];
      const cx = (cell % GRID_COLS) * cw;
      const cy = Math.floor(cell / GRID_COLS) * ch;
      viewCtx.drawImage(artCanvas, cx, cy, cw, ch, cx, cy, cw, ch);
      revealedCount++;
    }
  }

  function updateRevealUI(frac) {
    const pct = Math.round(frac * 100);
    const fill = document.getElementById('timer-fill');
    if (fill) {
      fill.style.width = (100 - pct) + '%';
      fill.classList.toggle('urgent', frac > 0.75);
    }
    const tag = document.getElementById('reveal-tag');
    if (tag) tag.textContent = pct + '%';
    const lbl = document.getElementById('reveal-pct-label');
    if (lbl) lbl.textContent = pct + '% revealed';
    // aria-live milestones
    [[0.5, '50'], [0.75, '75'], [1, '100']].forEach(([m, label]) => {
      if (frac >= m && !milestones[label]) {
        milestones[label] = true;
        announce.textContent = label === '100'
          ? 'Fully revealed. Answer now — score capped at 30.'
          : label + ' percent revealed.';
        if (label !== '100') { try { AISM_SFX.tick(); } catch (e) {} }
      }
    });
  }

  function revealFrame() {
    if (phase !== 'revealing') return;
    const frac = currentFrac();
    revealCellsTo(frac);
    updateRevealUI(frac);
    if (frac >= 1) { onTimeout(); return; }
    raf = requestAnimationFrame(revealFrame);
  }

  // Reduced-motion path: reveal in discrete 10% steps once per second.
  let stepTimer = null;
  function stepReveal() {
    if (phase !== 'revealing') return;
    const frac = currentFrac();
    revealCellsTo(frac);
    updateRevealUI(frac);
    if (frac >= 1) { onTimeout(); return; }
    stepTimer = setTimeout(stepReveal, roundTotalTime / 10);
  }

  function stopReveal() {
    if (raf) cancelAnimationFrame(raf);
    if (stepTimer) clearTimeout(stepTimer);
    raf = null; stepTimer = null;
  }

  function onBuzz() {
    if (phase !== 'revealing') return;
    const frac = currentFrac();
    pausedFrac = frac;
    phase = 'options';
    stopReveal();
    try { AISM_SFX.buzz(); } catch (e) {}
    document.getElementById('buzz-row').innerHTML = '';
    announce.textContent = `Buzzed at ${Math.round(frac * 100)} percent revealed. Pick the concept.`;
    showOptions(false);
  }

  function onTimeout() {
    if (phase !== 'revealing') return;
    pausedFrac = 1;
    phase = 'options';
    stopReveal();
    revealCellsTo(1);
    updateRevealUI(1);
    document.getElementById('buzz-row').innerHTML = '';
    showOptions(true);
  }

  function showOptions(timedOut) {
    const round = rounds[state.idx];
    const zone = document.getElementById('options-zone');
    zone.innerHTML = `
      <div class="rr-options" role="radiogroup" aria-label="Four possible concepts — pick the one the poster shows">
        ${round.options.map((opt, i) => `
          <button type="button" class="rr-opt" data-idx="${i}">
            <span class="rr-opt-key">${i + 1}</span>${escapeHtml(opt)}
          </button>
        `).join('')}
      </div>
      ${timedOut ? '<div class="rr-kbd-hint" style="margin-top:8px">Full reveal — score capped at 30 this round.</div>' : ''}
    `;
    zone.querySelectorAll('.rr-opt').forEach(b => {
      b.addEventListener('click', () => pickOption(parseInt(b.dataset.idx), timedOut));
    });
  }

  function pickOption(idx, timedOut) {
    if (phase !== 'options') return;
    phase = 'feedback';
    const round = rounds[state.idx];
    const correct = idx === round.correctIdx;
    state.revealFracs.push(pausedFrac);

    // Score: earlier buzz = more points. Timed-out rounds cap at 30.
    let earned = 0;
    if (correct) {
      const timeRemaining = roundTotalTime * (1 - pausedFrac);
      earned = Math.round((timeRemaining / roundTotalTime) * 100 + 50);
      if (timedOut) earned = Math.min(30, earned);
      state.score += earned;
      state.correct++;
      if (earned > state.bestRound) state.bestRound = earned;
    }

    // Show the full poster either way — the answer deserves its art.
    revealCellsTo(1);
    updateRevealUI(1);

    const zone = document.getElementById('options-zone');
    zone.querySelectorAll('.rr-opt').forEach(b => {
      const i = parseInt(b.dataset.idx);
      b.disabled = true;
      if (i === round.correctIdx) b.classList.add('is-right');
      else if (i === idx) b.classList.add('is-wrong');
    });

    const hudScore = document.getElementById('hud-score');
    if (hudScore) hudScore.textContent = state.score;
    const hudBest = document.getElementById('hud-best');
    if (hudBest) hudBest.textContent = state.bestRound;

    const def = (round.target.def && !PLACEHOLDER_DEF_RE.test(round.target.def)) ? round.target.def : '';
    const fb = document.getElementById('fb');
    fb.className = 'rr-feedback ' + (correct ? 'ok' : 'no');
    fb.innerHTML = correct
      ? `<strong>Correct — “${escapeHtml(round.target.term)}”.</strong> +${earned} points${timedOut ? ' (capped — full reveal)' : ` (buzzed at ${Math.round(pausedFrac * 100)}% reveal)`}. ${escapeHtml(def)}`
      : `<strong>Round lost.</strong> It was “${escapeHtml(round.target.term)}”. ${escapeHtml(def)}`;
    announce.textContent = correct
      ? `Correct. It was ${round.target.term}. ${earned} points.`
      : `Incorrect. It was ${round.target.term}. No points this round.`;
    try { (correct ? AISM_SFX.correct : AISM_SFX.wrong)(); } catch (e) {}

    const btn = document.createElement('button');
    btn.className = 'rr-btn';
    btn.id = 'next-btn';
    btn.textContent = state.idx + 1 < TOTAL_ROUNDS ? 'Next round →' : 'See your score →';
    btn.addEventListener('click', () => {
      if (state.idx + 1 < TOTAL_ROUNDS) { state.idx++; renderRound(); }
      else renderSummary();
    });
    fb.after(btn);
  }

  function renderSummary() {
    phase = 'done';
    stopReveal();
    const avgReveal = state.revealFracs.length
      ? Math.round((state.revealFracs.reduce((a, b) => a + b, 0) / state.revealFracs.length) * 100)
      : 100;
    const maxScore = TOTAL_ROUNDS * 150;
    const pct = state.score / maxScore;

    // Rank: rewards both accuracy and early buzzing.
    let rank = 'C';
    if (state.correct === TOTAL_ROUNDS && pct >= 0.8) rank = 'S+';
    else if (state.correct === TOTAL_ROUNDS && pct >= 0.6) rank = 'S';
    else if (state.correct >= TOTAL_ROUNDS - 1 && pct >= 0.55) rank = 'A+';
    else if (pct >= 0.45) rank = 'A';
    else if (pct >= 0.25) rank = 'B';

    let prevBest = null;
    try { prevBest = parseInt(localStorage.getItem(BEST_KEY)); } catch (e) {}
    if (isNaN(prevBest)) prevBest = null;
    const newBest = prevBest === null || state.score > prevBest;
    if (newBest) { try { localStorage.setItem(BEST_KEY, String(state.score)); } catch (e) {} }

    let insight;
    if (rank === 'S+' || rank === 'S') insight = `You're recognising ${topic} concepts from fragments — that's exactly the fast retrieval exams reward. Try slow mode off (if it was on) or aim to buzz before 25% next run.`;
    else if (rank === 'A+' || rank === 'A') insight = 'Solid recognition. The rounds where you waited for the full reveal — or lost — are the terms whose mental image is still fuzzy. Re-read those definitions, then race the reveal again.';
    else insight = `Letting the poster fully reveal is the safe play, but it means the terms aren't yet snapping into focus. Revisit the ${topic} concept list, then come back and try buzzing earlier — even a wrong early guess teaches you which terms blur together.`;

    try { (state.correct >= 4 ? AISM_SFX.fanfare : AISM_SFX.over)(); } catch (e) {}

    root.innerHTML = `
      ${renderHeader('Results')}
      <div class="rr-summary">
        <h2>Reveal report</h2>
        <div class="rr-big-stat">${state.score}</div>
        <div class="rr-big-lbl">Total score · max ${maxScore}</div>
        <div class="rr-rank">Rank ${rank}</div>
        <div class="rr-stat-row">
          <div class="rr-stat-pill"><div class="n">${state.correct}/${TOTAL_ROUNDS}</div><div class="l">Correct</div></div>
          <div class="rr-stat-pill"><div class="n">${avgReveal}%</div><div class="l">Avg reveal at buzz</div></div>
          <div class="rr-stat-pill"><div class="n">${state.bestRound}</div><div class="l">Best round</div></div>
        </div>
        <div style="margin-top:10px;font-size:14px;color:var(--text-secondary);">You buzzed at ${avgReveal}% reveal on average.</div>
        ${newBest
          ? '<div class="rr-best">★ New personal best</div>'
          : prevBest !== null ? `<div class="rr-best" style="opacity:0.7">Personal best: ${prevBest}</div>` : ''}
        <div class="rr-insight">${escapeHtml(insight)}</div>
        <div class="rr-ctas">
          <button class="rr-btn" id="again" style="margin-top:0">Play again</button>
          <a class="rr-btn rr-btn-ghost" href="../../subjects.html" style="margin-top:0">More games</a>
        </div>
      </div>
    `;
    announce.textContent = `Game over. ${state.score} points, ${state.correct} of ${TOTAL_ROUNDS} correct, rank ${rank}. You buzzed at ${avgReveal} percent reveal on average.` + (newBest ? ' New personal best.' : '');
    document.getElementById('again').addEventListener('click', startGame);
  }

  // Keyboard: Space buzzes, 1–4 answer, Enter advances.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === ' ' && phase === 'revealing') {
      e.preventDefault();
      onBuzz();
      return;
    }
    if (e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;  // native activation
      const next = document.getElementById('next-btn') || document.getElementById('again');
      if (next) { e.preventDefault(); next.click(); }
      return;
    }
    const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
    if (e.key in map && phase === 'options') {
      const b = root.querySelectorAll('.rr-opt')[map[e.key]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
</html>
