  .dd-wrap { max-width: 760px; margin: 0 auto; padding: calc(var(--nav-h) + 36px) 1.5rem 80px; }
  .dd-badge { display:inline-flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 12px; border-radius:30px; font-family:'DM Mono',monospace; margin-bottom:14px; }
  .dd-title { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1.15; margin:0 0 10px; }
  .dd-sub { color:var(--text-secondary); font-size:15px; margin:0 0 18px; line-height:1.55; max-width:60ch; }
  .dd-date { font-family:'DM Mono',monospace; font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:6px; }
  .dd-meta { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:18px; }

  /* Streak strip */
  .dd-streak-strip { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:18px; }
  .dd-streak-big { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; line-height:1.1; white-space:nowrap; }

  .dd-week { display:flex; gap:6px; }
  .dd-day { width:34px; }

  .dd-day-sq.played { background:var(--accent); border-color:var(--accent); color:#fff; }
  .dd-day-sq.today-pending { border-style:dashed; border-color:var(--accent); color:var(--accent); }
  .dd-day-lbl { font-family:'DM Mono',monospace; font-size:8.5px; letter-spacing:0.5px; text-transform:uppercase; color:var(--text-muted); text-align:center; margin-top:4px; }

  /* Filters */
  .dd-filters { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .dd-chip { background:var(--bg-primary); border:1.5px solid var(--border); border-radius:30px; padding:7px 14px; font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; font-weight:600; color:var(--text-secondary); cursor:pointer; transition:all 0.15s ease; }
  .dd-chip:hover { border-color:var(--accent); color:var(--accent); }
  .dd-chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .dd-subject-select { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.8px; text-transform:uppercase; padding:8px 12px; border:1.5px solid var(--border); border-radius:10px; background:var(--bg-primary); color:var(--text-primary); max-width:100%; cursor:pointer; }
  .dd-subject-select:focus { outline:none; border-color:var(--accent); }
  @media (max-width: 540px) {
    .dd-chip { padding:6px 11px; font-size:10px; }
    .dd-week { gap:4px; }
    .dd-day { width:30px; }
    .dd-day-sq { width:30px; height:30px; font-size:11px; }

  /* Question card */
  .dd-card { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:14px; padding:24px 26px; box-shadow:0 4px 14px rgba(10,107,94,0.06); margin-bottom:18px; }
  .dd-q-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .dd-q { font-size:17px; font-weight:600; color:var(--text-primary); margin:0 0 18px; line-height:1.4; }
  .dd-options { display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .dd-opt { background:var(--bg-primary); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; font-size:15px; transition:all 0.15s ease; text-align:left; font-family:inherit; color:var(--text-primary); }
  .dd-opt:hover { border-color:var(--accent); background:var(--accent-soft); }
  .dd-opt.selected { border-color:var(--accent); background:var(--accent-soft); }
  .dd-opt.correct { border-color:#0a6b5e; background:rgba(10,107,94,0.12); }
  .dd-opt.wrong { border-color:#c2410c; background:rgba(194,65,12,0.10); }
  .dd-btn { background:var(--velvet-gradient); color:#fff; border:none; padding:14px 24px; border-radius:10px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; box-shadow:0 4px 12px var(--accent-glow); transition:transform 0.15s; }
  .dd-btn:hover { transform:translateY(-1px); }
  .dd-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
  .dd-feedback { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; }
  .dd-feedback.ok { background:rgba(10,107,94,0.08); color:var(--accent); border:1px solid var(--border-accent); }
  .dd-feedback.no { background:rgba(194,65,12,0.08); color:#c2410c; border:1px solid rgba(194,65,12,0.25); }
  .dd-progress { display:flex; gap:6px; margin-bottom:20px; }
  .dd-progress span { height:5px; flex:1; border-radius:3px; background:var(--border); transition:background 0.2s ease; }
  .dd-progress span.done { background:var(--accent); }
  .dd-progress span.now { background:var(--accent); opacity:0.45; }
  .dd-kbd-hint { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-top:12px; }
  @media (hover:none) { .dd-kbd-hint { display:none; } }

  /* Summary / done */
  .dd-summary { margin-top:8px; padding:28px; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; }
  .dd-summary h2 { font-family:'Playfair Display',serif; font-size:1.5rem; margin:0 0 16px; }
  .dd-metric-row { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:22px; }
  .dd-metric { background:var(--bg-primary); border:1px solid var(--border); border-radius:10px; padding:18px 16px; text-align:center; }
  .dd-metric-num { font-family:'Playfair Display',serif; font-size:32px; font-weight:700; line-height:1; }
  .dd-metric-lbl { font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); margin-top:6px; }
  .dd-big-stat { font-family:'Playfair Display',serif; font-size:56px; font-weight:700; line-height:1; color:var(--accent); text-align:center; margin-top:6px; }
  .dd-big-lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-muted); text-align:center; margin:8px 0 4px; }
  .dd-insight { font-style:italic; font-size:14px; color:var(--text-secondary); margin:18px 0 0; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); line-height:1.55; }
  .dd-tomorrow { font-style:italic; font-size:14px; color:var(--text-secondary); margin-top:18px; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); }
  .dd-back { color:var(--accent); text-decoration:none; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; display:inline-block; margin-top:22px; }
  .dd-back:hover { text-decoration:underline; }
  .dd-error { padding:20px; background:rgba(194,65,12,0.05); border:1px solid rgba(194,65,12,0.2); border-radius:10px; color:#c2410c; font-size:14px; }
  .dd-loading { padding:30px 20px; text-align:center; color:var(--text-muted); font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; }

  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

<script>
/* ── AISM audio + confetti (shared 'aism-muted' preference) ── */
const AISM_REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const AISM_SFX = (() => {
  let actx = null, master = null;
  let muted = false;
  try { muted = localStorage.getItem('aism-muted') === '1'; } catch (e) {}
  function ensure() {
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.28;
        master.connect(actx.destination);
      }
      if (actx.state === 'suspended') actx.resume();
      return true;
    } catch (e) { return false; }
  }
  function tone(freq, dur, type, vol, endFreq) {
    if (muted || !ensure()) return;
    try {
      const t0 = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t0 + dur);
      g.gain.setValueAtTime(vol || 0.1, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  return {
    unlock() { ensure(); },
    isMuted() { return muted; },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('aism-muted', muted ? '1' : '0'); } catch (e) {}
      return muted;
    },
    ok()      { tone(587, 0.08, 'sine', 0.1); setTimeout(() => tone(740, 0.1, 'sine', 0.09), 70); },
    bad()     { tone(220, 0.15, 'sawtooth', 0.05, 165); },
    fanfare() { tone(523, 0.1, 'triangle', 0.12); setTimeout(() => tone(659, 0.1, 'triangle', 0.12), 100); setTimeout(() => tone(784, 0.2, 'triangle', 0.12), 200); },
  };
})();
function aismConfetti() {
  if (AISM_REDUCED) return;
  let st = document.getElementById('aism-confetti-style');
  if (!st) {
    st = document.createElement('style');
    st.id = 'aism-confetti-style';
    st.textContent = '@keyframes aismCfFall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}.aism-cf{position:fixed;top:0;width:8px;height:12px;z-index:950;pointer-events:none;animation:aismCfFall linear both;}';
    document.head.appendChild(st);
  }
  const colours = ['#0a6b5e', '#7b6fff', '#ffd166', '#c2410c', '#5ac8ff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'aism-cf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colours[i % colours.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3600);
  }
}
(function aismMuteBtn() {
  function add() {
    if (document.getElementById('aism-mute')) return;
    const b = document.createElement('button');
    b.id = 'aism-mute';
    b.type = 'button';
    b.title = 'Toggle sound (M)';
    b.textContent = AISM_SFX.isMuted() ? '🔇' : '🔊';
    b.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:900;background:rgba(26,29,39,0.92);border:1px solid rgba(255,255,255,0.16);color:#e8eaf0;border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;line-height:1;';
    b.addEventListener('click', () => { b.textContent = AISM_SFX.toggleMute() ? '🔇' : '🔊'; });
    document.body.appendChild(b);
  }
  if (document.body) add(); else window.addEventListener('DOMContentLoaded', add);
  document.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const b = document.getElementById('aism-mute');
      if (b) b.click();
    }
  });
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => AISM_SFX.unlock(), { once: true, capture: true }));
})();

(async function() {
  'use strict';
  const root = document.getElementById('root');
  const srLive = document.getElementById('srLive');

  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function announce(msg) { try { srLive.textContent = msg; } catch (e) {} }

  /* ── Seeded PRNG: xmur3 string hash → mulberry32 ── */
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function() {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  /* Per-session (unseeded) shuffle for option order */
  function sessionShuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ── Dates (UTC — so every visitor worldwide gets the same daily set) ── */
  const DAY_MS = 86400000;
  function utcISO(d) { return d.toISOString().slice(0, 10); }
  const now = new Date();
  const today = utcISO(now);
  const yesterday = utcISO(new Date(now.getTime() - DAY_MS));

  /* ── localStorage helpers ── */
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  function getHistory() {
    try {
      const h = JSON.parse(LS.get('aism-daily-history') || '{}');
      return (h && typeof h === 'object' && !Array.isArray(h)) ? h : {};
    } catch (e) { return {}; }
  }
  function saveHistory(h) {
    // prune anything older than 30 days
    const cutISO = utcISO(new Date(now.getTime() - 30 * DAY_MS));
    const pruned = {};
    Object.keys(h).forEach(k => { if (k >= cutISO) pruned[k] = h[k]; });
    LS.set('aism-daily-history', JSON.stringify(pruned));
  }

  /* ── Streak store: 'aism-daily-streak' holds one JSON object
     { lastPlayedDate, streak, totalDays, lastResult: { date, correct, total } }.
     Legacy format (bare number + side keys) is migrated on first read. ── */
  function loadStreak() {
    let o = null;
    try { o = JSON.parse(LS.get('aism-daily-streak') || 'null'); } catch (e) { o = null; }
    if (typeof o === 'number') {
      const lastDate = LS.get('aism-daily-last-date');
      const doneDate = LS.get('aism-daily-completed') || lastDate;
      const lastScore = parseInt(LS.get('aism-daily-last-score') || '', 10);
      o = {
        lastPlayedDate: lastDate || null,
        streak: o,
        totalDays: o,
        lastResult: doneDate ? { date: doneDate, correct: isNaN(lastScore) ? 0 : lastScore, total: 5 } : null,
      };
    }
    if (!o || typeof o !== 'object' || Array.isArray(o)) {
      o = { lastPlayedDate: null, streak: 0, totalDays: 0, lastResult: null };
    }
    o.streak = parseInt(o.streak, 10) || 0;
    o.totalDays = parseInt(o.totalDays, 10) || 0;
    if (!o.lastResult || typeof o.lastResult !== 'object') o.lastResult = null;
    return o;
  }
  function saveStreak(o) {
    LS.set('aism-daily-streak', JSON.stringify(o));
    try {
      ['aism-daily-last-date', 'aism-daily-last-score', 'aism-daily-completed']
        .forEach(k => localStorage.removeItem(k)); // retire legacy keys
    } catch (e) {}
  }

  /* Streak as it stands right now (before today's play is recorded) */
  function currentStreak() {
    const s = loadStreak();
    if (s.lastPlayedDate === today || s.lastPlayedDate === yesterday) return s.streak;
    return 0; // gap > 1 day, or never played → streak broken / fresh
  }

  /* ── URL params + filters ── */
  const params = new URLSearchParams(location.search);
  const subjectFilter = (params.get('subject') || '').toLowerCase().trim();
  const levelFilter = (params.get('level') || '').toLowerCase().trim();

  const LEVELS = ['ks3', 'gcse', 'a-level', 'ibdp'];
  const LEVEL_LABELS = { 'ks3': 'KS3', 'gcse': 'GCSE', 'a-level': 'A-Level', 'ibdp': 'IBDP' };
  function levelLabel(l) { return LEVEL_LABELS[String(l || '').toLowerCase()] || String(l || '').toUpperCase(); }
  function subjectLabel(s) {
    s = String(s || '');
    if (s === 'pe') return 'PE';
    return s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  /* ── Pool assembly from REAL_CONTENT_READY (hard-coded fallback if the
     whitelist script failed to load) ── */
  const FALLBACK_STEMS = [
    'art-design-a-level-aqa-art-craft-and-design-adventure-1',
    'astronomy-a-level-black-holes--relativity-adventure-1',
    'biology-a-level-aqa-cells-adventure-1',
    'business-studies-a-level-ansoff--porter-adventure-1',
    'chemistry-a-level-acids-bases--buffers-adventure-1',
    'computer-science-a-level-ai--machine-learning-adventure-1',
    'design-technology-a-level-aqa-design-communication-adventure-1',
    'economics-a-level-aqa-economic-principles-and-issues-adventure-1',
    'english-language-a-level-aqa-non-exam-assessment-language-in-action-adventure-1',
    'english-literature-a-level-aqa-non-exam-assessment-independent-critical-study-texts-across-time-adventure-1',
    'environmental-science-a-level-aqa-biological-resources-adventure-1',
    'food-technology-a-level-advanced-nutrition-science-adventure-1',
    'french-a-level-advanced-grammar-terms-adventure-1',
    'geography-a-level-aqa-ecosystems-under-stress-adventure-1',
    'german-a-level-aqa-artistic-culture-in-the-german-speaking-world-adventure-1',
    'history-a-level-ancient--medieval-adventure-1',
    'maths-a-level-aqa-algebra-functions-adventure-1',
    'music-a-level-20th-century--modernism-adventure-1',
    'pe-a-level-anatomy--physiology-adventure-1',
    'physics-a-level-aqa-electricity-adventure-1',
  ];
  let READY = window.REAL_CONTENT_READY;
  if (!READY || !(READY instanceof Set) || READY.size === 0) READY = new Set(FALLBACK_STEMS);
  const STEM_RE = /^(.*?)-(a-level|gcse|ks3|ibdp)-/;
  const allStems = [];
  const subjectsSet = new Set();
  READY.forEach(stem => {
    const m = STEM_RE.exec(stem);
    if (!m) return;
    allStems.push({ stem, subject: m[1], level: m[2] });
    subjectsSet.add(m[1]);
  });
  const allSubjects = Array.from(subjectsSet).sort();

  const pool = allStems.filter(s =>
    (!subjectFilter || s.subject === subjectFilter) &&
    (!levelFilter || s.level === levelFilter)
  ).map(s => s.stem).sort(); // sort → stable base order before seeded shuffle

  /* ── Shared header / streak / filter rendering ── */
  function filterDesc() {
    const bits = [];
    if (subjectFilter) bits.push(subjectLabel(subjectFilter));
    if (levelFilter) bits.push(levelLabel(levelFilter));
    return bits.length ? bits.join(' · ') : 'All subjects · All levels';
  }
  function prettyDate() {
    try {
      return now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    } catch (e) { return today; }
  }
  function headerHtml(metaExtra) {
    return `
      <div class="dd-badge">V · Verify · Daily Drill</div>
      <h1 class="dd-title">Today’s drill</h1>
      <p class="dd-sub">Five questions across the curriculum. Same set for everyone today. Come back tomorrow for a new five.</p>
      <div class="dd-date">${escapeHtml(prettyDate())}</div>
      <div class="dd-meta">${escapeHtml(filterDesc())}${metaExtra || ''}</div>
    `;
  }
  function weekGridHtml(includeTodayPending) {
    const history = getHistory();
    const cells = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now.getTime() - i * DAY_MS);
      const iso = utcISO(d);
      const dayLbl = ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getUTCDay()];
      const score = history[iso];
      let cls = '', inner = '·', title = iso + ' — missed';
      if (score != null) {
        cls = 'played'; inner = String(score); title = iso + ' — played, ' + score + '/5';
      } else if (iso === today && includeTodayPending) {
        cls = 'today-pending'; inner = '?'; title = 'Today — not played yet';
      }
      cells.push(`<div class="dd-day"><div class="dd-day-sq ${cls}" title="${escapeHtml(title)}">${inner}</div><div class="dd-day-lbl">${dayLbl}</div></div>`);
    }
    return `<div class="dd-week" role="img" aria-label="Last seven days of Daily Drill activity">${cells.join('')}</div>`;
  }
  function streakStripHtml(streakVal, includeTodayPending) {
    return `
      <div class="dd-streak-strip">
        <div class="dd-streak-big">🔥 ${streakVal}-day streak<small>Play daily to keep it</small></div>
        ${weekGridHtml(includeTodayPending)}
      </div>
    `;
  }
  function buildUrl(subj, lvl) {
    const p = new URLSearchParams();
    if (subj) p.set('subject', subj);
    if (lvl) p.set('level', lvl);
    const q = p.toString();
    return location.pathname + (q ? '?' + q : '');
  }
  function filtersHtml() {
    const chips = [`<button class="dd-chip" data-level="" aria-pressed="${!levelFilter}">All levels</button>`]
      .concat(LEVELS.map(l =>
        `<button class="dd-chip" data-level="${l}" aria-pressed="${levelFilter === l}">${LEVEL_LABELS[l]}</button>`));
    const opts = ['<option value="">All subjects</option>']
      .concat(allSubjects.map(s =>
        `<option value="${escapeHtml(s)}"${subjectFilter === s ? ' selected' : ''}>${escapeHtml(subjectLabel(s))}</option>`));
    return `
      <div class="dd-filters" role="group" aria-label="Drill filters">
        ${chips.join('')}
        <select class="dd-subject-select" id="subjSelect" aria-label="Filter by subject">${opts.join('')}</select>
      </div>
    `;
  }
  function wireFilters() {
    root.querySelectorAll('.dd-chip').forEach(b => {
      b.addEventListener('click', () => {
        const lvl = b.dataset.level || '';
        if (lvl === levelFilter) return;
        location.href = buildUrl(subjectFilter, lvl);
      });
    });
    const sel = document.getElementById('subjSelect');
    if (sel) sel.addEventListener('change', () => {
      location.href = buildUrl(sel.value, levelFilter);
    });
  }

  /* ── Already played today? ── */
  const storedStreak = loadStreak();
  if (storedStreak.lastResult && storedStreak.lastResult.date === today) {
    const lr = storedStreak.lastResult;
    const streak = currentStreak();
    root.innerHTML = `
      ${headerHtml(' · Done for today')}
      ${streakStripHtml(streak, false)}
      <div class="dd-summary">
        <h2>Already played today — see you tomorrow</h2>
        <div class="dd-metric-row">
          <div class="dd-metric"><div class="dd-metric-num">${lr.correct}/${lr.total || 5}</div><div class="dd-metric-lbl">Today’s score</div></div>
          <div class="dd-metric"><div class="dd-metric-num">🔥 ${streak}</div><div class="dd-metric-lbl">Day streak</div></div>
        </div>
        <div class="dd-tomorrow">One drill per day — that’s the deal. A fresh set of five arrives at midnight UTC, and your ${streak}-day streak is safe until then. Showing up daily is the whole trick; you’ve already done today’s part.</div>
        <a href="../../subjects.html" class="dd-back">← Back to subjects</a>
      </div>
    `;
    announce(`You've already played today's Daily Drill. You scored ${lr.correct} out of ${lr.total || 5}. Your streak is ${streak} days. Come back tomorrow.`);
    return;
  }

  /* ── No pool for these filters ── */
  function renderNoDrill(msg) {
    root.innerHTML = `
      ${headerHtml('')}
      ${streakStripHtml(currentStreak(), true)}
      ${filtersHtml()}
      <div class="dd-error">${msg}</div>
      <a href="../../subjects.html" class="dd-back">← Back to subjects</a>
    `;
    wireFilters();
  }
  if (pool.length === 0) {
    renderNoDrill(`No daily drill is available for <strong>${escapeHtml(filterDesc())}</strong> today. Try a different subject or level combination.`);
    return;
  }

  /* ── Deterministic daily selection ── */
  const seedStr = today + '|' + (subjectFilter || 'all') + '|' + (levelFilter || 'all');
  const rng = mulberry32(xmur3(seedStr)());
  const shuffled = seededShuffle(pool, rng);

  const META_Q_RE = /\b(this adventure|key terms? this|term chips?|adventure introduces?)\b/i;
  function validMcqs(spec) {
    return (spec.mcqs || []).filter(m => {
      if (!m || !m.q || META_Q_RE.test(String(m.q))) return false;
      const opts = m.options;
      if (!Array.isArray(opts) || opts.length < 2) return false;
      const nCorrect = opts.filter(o => Array.isArray(o) ? !!o[1] : !!(o && o.correct)).length;
      return nCorrect === 1;
    });
  }
  async function fetchSpec(stem) {
    // Try plain stem, then every possible colon-insertion before a dash
    // (some spec filenames contain a colon the stem omits).
    const candidates = [`../adventures/_specs/${stem}.json`];
    for (let i = 0; i < stem.length; i++) {
      if (stem[i] === '-') candidates.push(`../adventures/_specs/${stem.slice(0, i)}:${stem.slice(i)}.json`);
    }
    for (const url of candidates) {
      try {
        const r = await fetch(url);
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    return null;
  }

  root.innerHTML = headerHtml('') + '<div class="dd-loading">Assembling today’s five questions…</div>';

  /* Concept-def explanation: find an authored concept whose term appears in
     the correct answer (or the question stem) and surface its definition. */
  const PLACEHOLDER_DEF_RE = /^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;
  function explanationFor(spec, correctText, qText) {
    const concepts = (spec.concepts || []).filter(c =>
      c && c.term && c.def && !PLACEHOLDER_DEF_RE.test(c.def));
    const hay = (correctText + ' ' + qText).toLowerCase();
    let best = null;
    for (const c of concepts) {
      const t = String(c.term).toLowerCase();
      if (t.length >= 4 && hay.includes(t) && (!best || t.length > best.term.length)) best = c;
    }
    return best ? `${best.term} — ${best.def}` : '';
  }

  const questions = [];
  const MAX_ATTEMPTS = 30;
  for (let i = 0; i < shuffled.length && i < MAX_ATTEMPTS && questions.length < 5; i++) {
    const stem = shuffled[i];
    const spec = await fetchSpec(stem);
    if (!spec) continue; // failed to load — skip to the 6th, 7th, … stem
    const mcqs = validMcqs(spec);
    if (!mcqs.length) continue; // deterministic skip — same for every student
    // Deterministic per-(date, stem) MCQ index, independent of fetch order
    const qRng = mulberry32(xmur3(seedStr + '|' + stem)());
    const mcqIndex = Math.floor(qRng() * mcqs.length);
    const m = mcqs[mcqIndex];
    const opts = m.options.map(o => Array.isArray(o)
      ? { text: String(o[0]), correct: !!o[1] }
      : { text: String(o.text), correct: !!o.correct });
    const correctOpt = opts.find(o => o.correct);
    questions.push({
      q: String(m.q),
      options: sessionShuffle(opts), // option order is per-session only
      subject: subjectLabel(spec.subject || ''),
      level: levelLabel(spec.level || ''),
      topic: String(spec.topic_display || spec.title || ''),
      explain: explanationFor(spec, correctOpt ? correctOpt.text : '', String(m.q)),
    });
  }

  if (questions.length < 5) {
    renderNoDrill(`No daily drill is available for <strong>${escapeHtml(filterDesc())}</strong> today — we couldn’t assemble five questions. Try a different subject or level, or come back tomorrow.`);
    return;
  }

  /* ── Question flow ── */
  const state = { idx: 0, score: 0 };

  function renderQuestion() {
    const q = questions[state.idx];
    const context = `Q${state.idx + 1} · ${q.subject} ${q.level}` + (q.topic ? ` · ${q.topic}` : '');
    root.innerHTML = `
      ${headerHtml(` · Question ${state.idx + 1} of 5`)}
      ${streakStripHtml(currentStreak(), true)}
      ${filtersHtml()}
      <div class="dd-progress" aria-hidden="true">${questions.map((_, i) =>
        `<span class="${i < state.idx ? 'done' : i === state.idx ? 'now' : ''}"></span>`).join('')}</div>
      <div class="dd-card">
        <div class="dd-q-label">${escapeHtml(context)}</div>
        <div class="dd-q">${escapeHtml(q.q)}</div>
        <div class="dd-options">${q.options.map((o, i) =>
          `<button class="dd-opt" data-idx="${i}">${escapeHtml(o.text)}</button>`).join('')}</div>
        <div style="margin-top:14px"><button class="dd-btn" id="submit" disabled>Submit answer →</button></div>
        <div class="dd-kbd-hint">Keyboard: 1–${q.options.length} to pick · Enter to submit</div>
        <div id="fb"></div>
      </div>
    `;
    wireFilters();
    announce(`Question ${state.idx + 1} of 5. ${q.subject} ${q.level}${q.topic ? ', ' + q.topic : ''}. ${q.q}`);

    const submit = document.getElementById('submit');
    let chosen = null;
    let phase = 'answer'; // two-phase: 'answer' then 'next'
    root.querySelectorAll('.dd-opt').forEach(b => {
      b.addEventListener('click', () => {
        if (phase !== 'answer') return;
        root.querySelectorAll('.dd-opt').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        chosen = parseInt(b.dataset.idx, 10);
        submit.disabled = false;
      });
    });

    submit.addEventListener('click', () => {
      if (phase === 'answer') {
        if (chosen == null) return;
        const correctIdx = q.options.findIndex(o => o.correct);
        const correct = chosen === correctIdx;
        if (correct) state.score++;
        root.querySelectorAll('.dd-opt').forEach((b, i) => {
          b.style.pointerEvents = 'none';
          b.disabled = true;
          if (i === correctIdx) b.classList.add('correct');
          else if (i === chosen) b.classList.add('wrong');
        });
        try { correct ? AISM_SFX.ok() : AISM_SFX.bad(); } catch (e) {}
        const fb = document.getElementById('fb');
        fb.className = 'dd-feedback ' + (correct ? 'ok' : 'no');
        const explain = q.explain ? ' ' + escapeHtml(q.explain) : '';
        fb.innerHTML = correct
          ? '<strong>Correct.</strong>' + (explain || ' Sharp work — next one.')
          : `<strong>Not quite.</strong> Correct answer: <em>${escapeHtml(q.options[correctIdx].text)}</em>.` + (explain || ' Worth a flashcard — try harder on the next one.');
        announce((correct
          ? `Correct. Score so far: ${state.score} of ${state.idx + 1}.`
          : `Not quite. The correct answer was: ${q.options[correctIdx].text}.`) + (q.explain ? ' ' + q.explain : ''));
        submit.textContent = state.idx + 1 < questions.length ? 'Next →' : 'Finish drill →';
        submit.disabled = false;
        phase = 'next';
      } else {
        if (state.idx + 1 < questions.length) {
          state.idx++;
          renderQuestion();
        } else {
          completeDrill();
        }
      }
    });
  }

  /* ── Completion: record streak + show summary ── */
  function insightText(score, streak) {
    const accLine =
      score === 5 ? 'A perfect five — across five different corners of the curriculum, that’s genuine range.' :
      score === 4 ? 'Four of five across mixed subjects is a strong showing — the one that got away is revision, not weakness.' :
      score === 3 ? 'Three of five — solid core knowledge, with a couple of areas asking for a second look.' :
      score >= 1  ? 'A tough mix today. Wrong answers in a drill are cheap; the same gaps in an exam are expensive — you just bought them at the cheap price.' :
                    'A blank scorecard today — but showing up is the hard part, and you did that.';
    const streakLine =
      streak >= 7 ? ` ${streak} straight days: the habit is doing the heavy lifting now.` :
      streak >= 3 ? ` ${streak} days running — streaks like this are how five-minute drills quietly turn into exam marks.` :
      streak === 2 ? ' Two days in a row — tomorrow makes it a pattern.' :
      ' Day one of the streak. The drill only works if you come back — see you tomorrow.';
    return accLine + streakLine;
  }

  function completeDrill() {
    const s = loadStreak();
    let newStreak;
    if (s.lastResult && s.lastResult.date === today) {
      newStreak = s.streak; // already recorded (e.g. second tab) — don't double-count
    } else {
      newStreak = (s.lastPlayedDate === yesterday) ? s.streak + 1 : 1;
      s.streak = newStreak;
      s.lastPlayedDate = today;
      s.totalDays = (s.totalDays || 0) + 1;
      s.lastResult = { date: today, correct: state.score, total: 5 };
      saveStreak(s);
      const h = getHistory();
      h[today] = state.score;
      saveHistory(h);
    }
    const extended = newStreak > 1;
    try {
      AISM_SFX.fanfare();
      if (state.score >= 4 || extended) aismConfetti();
    } catch (e) {}

    const insight = insightText(state.score, newStreak);

    root.innerHTML = `
      ${headerHtml(' · Complete')}
      ${streakStripHtml(newStreak, false)}
      <div class="dd-summary">
        <h2>You got ${state.score} / 5</h2>
        <div class="dd-big-stat">🔥 ${newStreak}</div>
        <div class="dd-big-lbl">day streak${s.totalDays > 1 ? ` · ${s.totalDays} days played all-time` : ''}</div>
        <div class="dd-insight">${escapeHtml(insight)}</div>
        <div class="dd-tomorrow">That’s your five for today — no replays, daily means daily. A fresh drill lands at midnight UTC. ${extended ? 'Don’t break the chain.' : 'Come back tomorrow to make it two.'}</div>
        <a href="../../subjects.html" class="dd-back">← Back to subjects</a>
      </div>
    `;
    announce(`Drill complete. You got ${state.score} out of 5. Your streak is now ${newStreak} days. ${insight}`);
  }

  /* ── Keyboard shortcuts: 1–4 pick an option, Enter submits/advances ── */
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const inField = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Enter') {
      if (inField) return;
      if (e.target && e.target.classList && e.target.classList.contains('dd-opt')) return; // let Enter activate the focused option
      const submit = document.getElementById('submit');
      if (submit && !submit.disabled) { e.preventDefault(); submit.click(); }
      return;
    }
    if (inField) return;
    const map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5 };
    if (e.key in map) {
      const opts = root.querySelectorAll('.dd-opt');
      const b = opts[map[e.key]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  renderQuestion();
})();
</script>
<script src="../../script.js" defer></script>

</body>
</html>
