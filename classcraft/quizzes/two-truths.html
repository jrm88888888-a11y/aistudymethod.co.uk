<script>
(async function() {
  const esc = Arcade.escapeHtml;
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const DEBUG = params.get('debug') === '1';
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  Arcade.mountMuteButton();
  // If this visit came from a shared score, drop in the "Your mate scored X — beat them" banner.
  Arcade.maybeShowChallenge && Arcade.maybeShowChallenge();

  if (!stem) {
    root.innerHTML = '<div class="ar-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  const [spec, bank] = await Promise.all([
    Arcade.fetchSpecJson(stem, '../adventures/_specs'),
    Arcade.fetchSpecJson(stem, '../evaluate/misconception-banks'),
  ]);

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subj  = ((spec && spec.subject) || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // Placeholder concept defs would make hollow "truths" — treat as unauthored.
  const PLACEHOLDER_DEF_RE = /^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;
  const concepts = ((spec && spec.concepts) || []).filter(c => c && c.term && c.def && !PLACEHOLDER_DEF_RE.test(c.def));
  const bankItems = ((bank && bank.items) || []).filter(it => it && it.q && it.misconception);
  // Hard-suppress quality:"low" banks. 96% of KS3 banks are tagged low because
  // the generation pipeline routinely produced over-level content (quantum,
  // spectroscopy, etc.). Without this gate the engine still drew items from
  // them, so KS3 students were seeing A-Level misconceptions.
  const bankIsLowQuality = bank && bank.quality === 'low';

  if (!spec || !bank || bankIsLowQuality || concepts.length < 4 || bankItems.length < 2) {
    root.innerHTML = `
      <div class="ar-badge">V · Verify · Two Truths One Lie</div>
      <h1 class="ar-title">${esc(topic)}</h1>
      <p class="ar-sub">This game needs a full set of concept definitions plus a bank of researched misconceptions — generic filler wouldn't earn its place on the site. Come back soon.</p>
      <div class="ar-meta">${esc([level, subj, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="ar-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🕵️</div>
        <h2 style="font-size:1.3rem;margin:0 0 8px">Statements in production</h2>
        <p style="color:var(--ar-text2);margin:0 0 18px;font-size:15px;">Two Truths One Lie needs at least four authored concept definitions and two researched misconceptions for this exact topic. That set hasn't been written at the required depth yet.</p>
        <a href="../../subjects.html" class="ar-btn ghost" style="text-decoration:none;display:inline-block;">← Back to subjects</a>
      </div>
    `;
    return;
  }

  const BEST_KEY = 'aism-tt-best:' + stem;
  const ROUND_MS = 20000;
  const ROUNDS = 5;

  /* ---- LIGHTNING ROUND ----------------------------------------------------
     Earned by a 3-streak. For 20 seconds the rounds keep coming with no
     inter-round padding: a correct verdict dwells ~0.7s then auto-advances,
     and extra rounds are appended so the supply never runs dry — more
     retrieval per minute, never less. Everything answered inside the window
     scores ×2. A wrong keeps its full teaching dwell and ends the storm
     early. The trigger round itself scores normally — the ×2 starts after
     the banner, so the reward is always telegraphed before it applies.   */
  const LIGHTNING_MS = 20000;
  const LIGHTNING_MULT = 2;
  const MAX_ROUNDS = 40;               // hard bound on lightning extensions
  const lightning = { until: 0, tickId: null };
  function lightningActive() { return performance.now() < lightning.until; }

  function crackleSfx() {
    Arcade.sfx.tick();
    setTimeout(() => Arcade.sfx.tick(), 60);
    setTimeout(() => Arcade.sfx.tick(), 130);
    setTimeout(() => Arcade.sfx.coin(), 200);
  }

  function startLightning() {
    lightning.until = performance.now() + LIGHTNING_MS;
    document.body.classList.add('tt-lightning');
    Arcade.flashMsg('⚡ LIGHTNING ROUND — ×2 ⚡', '#ffd60a');
    crackleSfx();
    Arcade.sfx.riser();
    announce.textContent = 'Lightning round! Twenty seconds of double points — rounds come fast, a wrong answer ends it.';
    clearInterval(lightning.tickId);
    lightning.tickId = setInterval(() => {
      const left = lightning.until - performance.now();
      const el = document.getElementById('lightSecs');
      if (el) el.textContent = Math.max(0, Math.ceil(left / 1000));
      if (left <= 0) endLightning(false);
    }, 200);
  }

  function endLightning(byWrong) {
    const wasOn = document.body.classList.contains('tt-lightning');
    lightning.until = 0;
    clearInterval(lightning.tickId);
    lightning.tickId = null;
    document.body.classList.remove('tt-lightning');
    const badge = document.getElementById('boltBadge');
    if (badge) badge.remove();
    if (wasOn && !byWrong) {
      Arcade.flashMsg('LIGHTNING OVER', '#ffd60a');
      Arcade.sfx.swoosh();
    }
  }

  // One extra round, same construction as buildRounds — a real misconception
  // versus two authored truths. Lightning never recycles thin filler.
  function buildExtraRound() {
    const item = Arcade.shuffle(bankItems)[0];
    const [c1, c2] = Arcade.shuffle(concepts);
    const statements = Arcade.shuffle([
      { lie: true,  prompt: item.q, claim: item.misconception, why: item.why || '' },
      { lie: false, prompt: `What does “${c1.term}” mean?`, claim: c1.def },
      { lie: false, prompt: `What does “${c2.term}” mean?`, claim: c2.def },
    ]);
    return { statements, lieIdx: statements.findIndex(s => s.lie) };
  }

  // Build rounds: each pairs one misconception (the lie) with two
  // randomly-drawn concept definitions (the truths). Every statement is
  // shown as a prompt + claim so the lie isn't given away by format.
  // Hand-written bank items (no `src` marker) lead; MCQ-derived items
  // only backfill the remaining rounds.
  function buildRounds() {
    const authored = Arcade.shuffle(bankItems.filter(it => !it.src));
    const derived  = Arcade.shuffle(bankItems.filter(it => it.src));
    return Arcade.shuffle(authored.concat(derived).slice(0, ROUNDS)).map(item => {
      const [c1, c2] = Arcade.shuffle(concepts);
      const statements = Arcade.shuffle([
        { lie: true,  prompt: item.q, claim: item.misconception, why: item.why || '' },
        { lie: false, prompt: `What does “${c1.term}” mean?`, claim: c1.def },
        { lie: false, prompt: `What does “${c2.term}” mean?`, claim: c2.def },
      ]);
      return { statements, lieIdx: statements.findIndex(s => s.lie) };
    });
  }

  let rounds, state, timerCtl = null;

  function startGame() {
    if (timerCtl) { timerCtl.stop(); timerCtl = null; }
    endLightning(true);
    rounds = buildRounds();
    state = { idx: 0, caught: 0, score: 0, streak: 0, bestStreak: 0, grid: [], lightningRounds: 0, lightningPts: 0, lastCalc: null };
    renderRound();
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 350);
  }

  function renderHeader(metaTail) {
    return `
      <div class="ar-badge">V · Verify · Two Truths One Lie</div>
      <h1 class="ar-title">${esc(topic)}</h1>
      <p class="ar-sub">Three claims about ${esc(topic)}. Two are true — one is a misconception built to fool you. 20 seconds. Call the lie. Catch three in a row to spark a ⚡ Lightning Round: twenty seconds of double points with no waiting between rounds.</p>
      <div class="ar-meta">${esc([level, subj].filter(Boolean).join(' · '))} · ${esc(metaTail)}</div>
    `;
  }

  function hudHtml() {
    const bolt = lightningActive()
      ? `<div class="ar-hud-stat tt-bolt-badge" id="boltBadge">⚡ ×2 <b><span id="lightSecs">${Math.max(0, Math.ceil((lightning.until - performance.now()) / 1000))}</span>s</b></div>`
      : '';
    return `
      <div class="ar-hud">
        <div class="ar-hud-stat">Score <b id="hudScore">${state.score}</b></div>
        <div class="ar-hud-stat${state.streak >= 3 ? ' hot' : ''}">Streak <b id="hudStreak">${state.streak}${state.streak >= 3 ? '🔥' : ''}</b></div>
        ${bolt}
        <div class="ar-hud-stat gold">Round <b>${state.idx + 1}/${rounds.length}</b></div>
      </div>
    `;
  }

  function renderRound() {
    const round = rounds[state.idx];

    root.innerHTML = `
      ${renderHeader('Round ' + (state.idx + 1) + ' of ' + rounds.length)}
      ${hudHtml()}
      <div class="ar-dots" aria-hidden="true">${rounds.map((_, i) => {
        if (i < state.idx) return `<span class="${state.grid[i] === '🟩' ? 'done' : 'fail'}"></span>`;
        return `<span class="${i === state.idx ? 'now' : ''}"></span>`;
      }).join('')}</div>
      <div class="ar-timer" aria-hidden="true"><i id="tfill"></i></div>
      <div class="ar-card">
        <div class="ar-label">Round ${state.idx + 1} · tap to lock your call</div>
        <div class="ar-prompt">Which one is the lie?</div>
        <div class="tt-stmts ar-stagger" role="radiogroup" aria-label="Three statements — pick the lie">
          ${round.statements.map((s, i) => `
            <button type="button" class="ar-tile" role="radio" aria-checked="false" data-idx="${i}">
              <div class="tt-q">${esc(s.prompt)}</div>
              <div class="tt-a">${esc(s.claim)}</div>
              <span class="tt-pill-slot"></span>
            </button>
          `).join('')}
        </div>
        <div class="ar-kbd-hint">Keyboard: 1–3 locks your call · Enter for next round</div>
        <div id="fb"></div>
        <div id="nextWrap" style="margin-top:14px;"></div>
      </div>
    `;

    const tiles = Array.from(root.querySelectorAll('.tt-stmts .ar-tile'));
    let phase = 'answer';

    timerCtl = Arcade.timer(document.getElementById('tfill'), ROUND_MS, {
      onEnd: () => { if (phase === 'answer') settle(null, true); },
    });

    function settle(chosen, timedOut) {
      if (phase !== 'answer') return;
      phase = 'verdict';
      const remaining = timedOut ? 0 : timerCtl.remaining;
      timerCtl.stop();

      const correct = !timedOut && chosen === round.lieIdx;
      const lie = round.statements[round.lieIdx];

      tiles.forEach((b, i) => {
        b.disabled = true;
        b.style.pointerEvents = 'none';
        b.setAttribute('aria-checked', String(i === chosen));
        const slot = b.querySelector('.tt-pill-slot');
        if (i === round.lieIdx) {
          b.classList.add('correct');
          slot.outerHTML = '<span class="ar-pill bad" style="margin-top:8px;display:inline-block;">⚠ the lie</span>';
        } else {
          if (i === chosen) b.classList.add('wrong');
          else b.classList.add('dim');
          slot.outerHTML = '<span class="ar-pill good" style="margin-top:8px;display:inline-block;">✓ truth</span>';
        }
      });

      // ×2 only for rounds answered INSIDE an already-running lightning
      // window — the trigger round itself scores normally (telegraph first).
      const inLightning = lightningActive();
      let pts = 0;
      if (correct) {
        state.caught++;
        state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        const mult = Math.min(2, 1 + 0.25 * (state.streak - 1));
        const speed = Math.round(50 * (remaining / ROUND_MS));
        pts = Math.round((100 + speed) * mult) * (inLightning ? LIGHTNING_MULT : 1);
        state.score += pts;
        state.grid.push('🟩');
        state.lastCalc = { speed, mult, doubled: inLightning };
        if (inLightning) { state.lightningRounds++; state.lightningPts += pts; }
        Arcade.sfx.correct(state.streak);
        if (inLightning) crackleSfx();
        if (![3, 5, 7, 10].includes(state.streak)) Arcade.flashMsg(inLightning ? '⚡ CAUGHT IT ×2' : 'CAUGHT IT', inLightning ? '#ffd60a' : '#00ffa3');
        Arcade.streakCall(state.streak);
        Arcade.confettiBurst({ count: 40 });
        Arcade.popTextOver(tiles[round.lieIdx], '+' + pts, inLightning ? '#ffd60a' : '#00ffa3');
        Arcade.vibrate(20);
        // A 3-streak EARNS the lightning round — announced before it pays.
        if (!inLightning && state.streak === 3) startLightning();
      } else {
        state.streak = 0;
        state.grid.push(timedOut ? '⬛' : '🟥');
        state.lastCalc = null;
        // A wrong ends the lightning round early — the full teaching dwell
        // below is untouched.
        if (inLightning) endLightning(true);
        if (timedOut) {
          Arcade.sfx.timeup();
          Arcade.flashMsg("TIME'S UP ⏱", '#ffd60a');
        } else {
          Arcade.sfx.wrong();
          Arcade.flashMsg('NOT EVEN CLOSE', '#ff2e88');
        }
        Arcade.shake();
        Arcade.vibrate([40, 30, 40]);
      }

      const hudS = document.getElementById('hudScore');
      hudS.textContent = state.score;
      if (pts) bump(hudS);
      const hudSt = document.getElementById('hudStreak');
      hudSt.textContent = state.streak + (state.streak >= 3 ? '🔥' : '');
      bump(hudSt);
      hudSt.parentElement.classList.toggle('hot', state.streak >= 3);

      const fb = document.getElementById('fb');
      fb.className = 'ar-feedback ' + (correct ? 'ok' : 'no');
      fb.innerHTML = (correct
        ? `<strong>Caught it. +${pts} pts.</strong> `
        : timedOut
          ? `<strong>The clock beat you.</strong> The lie was: <em>${esc(lie.claim)}</em>. `
          : `<strong>That one was true.</strong> The lie was: <em>${esc(lie.claim)}</em>. `)
        + esc(lie.why || '');
      announce.textContent = (correct
        ? `Correct — you caught the lie. Plus ${pts} points. `
        : timedOut ? 'Time up — round lost. ' : 'Incorrect — that statement was true. ')
        + (lie.why || '');

      if (correct && lightningActive()) {
        // No inter-round padding during lightning: ~0.7s verdict beat, then
        // the next round arrives on its own.
        document.getElementById('nextWrap').innerHTML = '<div class="tt-zap">⚡ next round incoming…</div>';
        setTimeout(advance, 700);
      } else {
        const last = state.idx + 1 >= rounds.length;
        document.getElementById('nextWrap').innerHTML =
          `<button class="ar-btn big" id="next">${last ? 'See your score →' : 'Next →'}</button>`;
        const nextBtn = document.getElementById('next');
        nextBtn.addEventListener('click', advance);
        nextBtn.focus({ preventScroll: true });
      }
    }

    function advance() {
      Arcade.sfx.swoosh();
      // Lightning keeps the supply topped up: while the window is live,
      // append a fresh round so play never stalls — MORE retrieval, not less.
      if (lightningActive() && state.idx + 1 >= rounds.length && rounds.length < MAX_ROUNDS) {
        rounds.push(buildExtraRound());
      }
      if (state.idx + 1 < rounds.length) {
        state.idx++;
        renderRound();
      } else {
        renderEnd();
      }
    }

    tiles.forEach(b => {
      b.addEventListener('click', () => {
        if (phase !== 'answer') return;
        Arcade.sfx.click();
        settle(parseInt(b.dataset.idx), false);
      });
    });
  }

  function renderEnd() {
    endLightning(true);
    const total = rounds.length;
    const pct = Math.round((state.caught / total) * 100);

    let insight;
    if (pct === 100) insight = `Clean sweep. Every lie in this set is a misconception that trips real students in real exams — and none of them got past you. Final boss: explain WHY each lie is wrong to someone else. If you can teach ${topic}, you own it.`;
    else if (pct >= 60) insight = 'Sharp detecting. The lies that slipped through were chosen because they feel true — that feeling is the trap. Re-read the why explanations on your misses, then run it back and catch all five.';
    else insight = `These lies are engineered to sound right — falling for them just exposed exactly which ideas in ${topic} need rebuilding. Re-read each explanation, revisit the definitions, then come back and call every lie.`;

    root.innerHTML = renderHeader('Results') + '<div id="end"></div>';
    const endResult = Arcade.renderEndCard(document.getElementById('end'), {
      gameName: 'Two Truths One Lie',
      gameEmoji: '🕵️',
      topic: topic,
      meta: [level, subj].filter(Boolean).join(' · '),
      pct: pct,
      big: state.score,
      bigLabel: 'points',
      rows: [
        { v: `${state.caught}/${total}`, l: 'lies caught' },
        { v: '🔥 ' + state.bestStreak, l: 'best streak' },
        { v: pct + '%', l: 'accuracy' },
      ].concat(state.lightningRounds ? [{ v: '⚡ ' + state.lightningRounds, l: 'lightning rounds' }] : []),
      emojiGrid: state.grid.join(''),
      bestKey: BEST_KEY,
      bestValue: state.score,
      bestSuffix: ' pts',
      insight: insight,
      shareLines: [
        '🕵️ Two Truths One Lie — ' + topic,
        `Score ${state.score} pts · 🔥 best streak ${state.bestStreak}` + (state.lightningRounds ? ` · ⚡ ${state.lightningRounds} lightning rounds` : ''),
        state.grid.join(''),
      ],
      // Share-card extras (consumed by Arcade.shareScore inside renderEndCard).
      share: {
        subject: subj,
        level: level,
        bigLabel: 'POINTS',
        statLine: '🔥 best streak ' + state.bestStreak + '  ·  ' + pct + '% accuracy',
      },
      onAgain: startGame,
    });

    // Share button is now wired by Arcade.renderEndCard automatically — we
    // just pass the share extras via opts.share above so the card has good
    // copy. No per-game override needed any more.
    announce.textContent = `Game over. Score ${state.score} points. You caught ${state.caught} of ${total} lies — ${pct} percent.`;
  }

  // Keyboard shortcuts: 1–3 lock a statement, Enter advances.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return; // native activation
      const next = document.getElementById('next');
      if (next) { e.preventDefault(); next.click(); }
      return;
    }
    const map = { '1': 0, '2': 1, '3': 2 };
    if (e.key in map) {
      const b = root.querySelectorAll('.tt-stmts .ar-tile')[map[e.key]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  /* ---- debug hook for the test harness (sibling pattern: coin-pusher) ---- */
  if (DEBUG) {
    window.__tt = {
      get score() { return state.score; },
      get streak() { return state.streak; },
      get idx() { return state.idx; },
      get caught() { return state.caught; },
      get roundCount() { return rounds.length; },
      get lightningActive() { return lightningActive(); },
      get lightningMsLeft() { return Math.max(0, lightning.until - performance.now()); },
      get lightningRounds() { return state.lightningRounds; },
      get lightningPts() { return state.lightningPts; },
      get lastCalc() { return state.lastCalc; },
      get lieIdx() { return rounds[state.idx] ? rounds[state.idx].lieIdx : -1; },
      answer(right) {
        const tiles = root.querySelectorAll('.tt-stmts .ar-tile');
        if (!tiles.length) return false;
        const li = rounds[state.idx].lieIdx;
        const b = tiles[right ? li : (li === 0 ? 1 : 0)];
        if (!b || b.disabled) return false;
        b.click();
        return true;
      },
      next() {
        const n = document.getElementById('next');
        if (!n) return false;
        n.click();
        return true;
      },
      expireLightning() { lightning.until = performance.now() - 1; endLightning(false); },
    };
  }

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
</html>
