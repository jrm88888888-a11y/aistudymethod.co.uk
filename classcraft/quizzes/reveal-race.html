/* ============================================================
   PROCEDURAL ART GENERATOR
   Deterministic abstract "poster" per concept term:
   FNV-1a hash → mulberry32 PRNG → seeded shapes + subject palette
   + a subject icon glyph at the centre.
   ============================================================ */
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Subject icon glyphs — simple baked SVG path data, drawn in a 100×100 box. */
const GLYPH_PATHS = {
  leaf:   { d:'M50 8 C22 28 12 56 22 76 C32 94 60 96 73 79 C88 60 83 26 50 8 Z M48 24 L44 78', fill:true },

  book:   { d:'M50 22 C41 14 26 14 18 18 V80 C26 76 41 76 50 84 C59 76 74 76 82 80 V18 C74 14 59 14 50 22 Z M50 22 V84', fill:false },

  pulse:  { d:'M10 52 H30 L40 26 L54 76 L64 44 L70 52 H90', fill:false },

const SUBJECT_GLYPH = {
  'physics':'atom', 'astronomy':'star', 'biology':'leaf', 'environmental-science':'drop',
  'chemistry':'flask', 'history':'scroll', 'maths':'sigma', 'geography':'globe',
  'english-literature':'book', 'english-language':'book', 'computer-science':'code',
  'design-technology':'gear', 'food-technology':'fork', 'music':'note', 'art-design':'brush',
  'pe':'pulse', 'psychology':'spiral', 'sociology':'people', 'religious-studies':'flame',
  'economics':'coin', 'business-studies':'coin', 'french':'speech', 'german':'speech', 'spanish':'speech',
};

function drawCustomGlyph(ctx, name) {
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (name === 'atom') {
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(50, 50);
      ctx.rotate((i * Math.PI) / 3);
      ctx.beginPath();
      ctx.ellipse(0, 0, 38, 15, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(50, 50, 7, 0, Math.PI * 2); ctx.fill();
  } else if (name === 'globe') {
    ctx.beginPath(); ctx.arc(50, 50, 36, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(50, 50, 16, 36, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, 50); ctx.lineTo(86, 50); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(50, 32, 33, 10, 0, 0, Math.PI); ctx.stroke();
  } else if (name === 'gear') {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.save(); ctx.translate(50, 50); ctx.rotate(a);
      ctx.fillRect(-5, -42, 10, 14);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(50, 50, 28, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(50, 50, 11, 0, Math.PI * 2); ctx.stroke();
  } else if (name === 'note') {
    ctx.beginPath(); ctx.ellipse(38, 74, 13, 10, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(50, 71); ctx.lineTo(50, 18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(50, 18); ctx.quadraticCurveTo(72, 24, 70, 42); ctx.stroke();
  } else if (name === 'spiral') {
    ctx.beginPath();
    for (let t = 0; t <= Math.PI * 5; t += 0.1) {
      const r = 3 + t * 2.4;
      const x = 50 + Math.cos(t) * r, y = 50 + Math.sin(t) * r;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  } else if (name === 'people') {
    [[34, 0], [66, 0]].forEach(([cx]) => {
      ctx.beginPath(); ctx.arc(cx, 34, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, 84, 22, Math.PI, 0); ctx.stroke();
    });
  } else if (name === 'coin') {
    ctx.beginPath(); ctx.arc(50, 50, 36, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(50, 50, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.font = '700 34px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('£', 50, 52);
  } else if (name === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i / 5) * Math.PI * 2 - Math.PI / 2;
      const a2 = ((i + 0.5) / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.lineTo(50 + Math.cos(a1) * 38, 50 + Math.sin(a1) * 38);
      ctx.lineTo(50 + Math.cos(a2) * 16, 50 + Math.sin(a2) * 16);
    }
    ctx.closePath(); ctx.fill();
  }
}

/* Render the full poster for a concept onto an offscreen canvas. */
function renderPoster(term, subject, W, H) {
  const cnv = document.createElement('canvas');
  cnv.width = W; cnv.height = H;
  const ctx = cnv.getContext('2d');
  const pal = PALETTES[subject] || PALETTE_DEFAULT;
  const rnd = mulberry32(fnv1a(term + '|' + subject));

  // Background gradient at a seeded angle
  const ga = rnd() * Math.PI * 2;
  const grad = ctx.createLinearGradient(
    W / 2 + Math.cos(ga) * W, H / 2 + Math.sin(ga) * H,
    W / 2 - Math.cos(ga) * W, H / 2 - Math.sin(ga) * H);
  grad.addColorStop(0, pal.bg[0]);
  grad.addColorStop(1, pal.bg[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Faint seeded grid texture
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridStep = 24 + Math.floor(rnd() * 30);
  for (let x = gridStep; x < W; x += gridStep) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = gridStep; y < H; y += gridStep) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // 5–12 seeded abstract shapes
  const nShapes = 5 + Math.floor(rnd() * 8);
  for (let i = 0; i < nShapes; i++) {
    const col = pal.cols[Math.floor(rnd() * pal.cols.length)];
    const x = rnd() * W, y = rnd() * H;
    const size = 30 + rnd() * 130;
    const rot = rnd() * Math.PI * 2;
    const alpha = 0.18 + rnd() * 0.5;
    const kind = Math.floor(rnd() * 5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    if (kind === 0) {            // filled circle
      ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 1) {     // ring
      ctx.lineWidth = 4 + rnd() * 10;
      ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * 2); ctx.stroke();
    } else if (kind === 2) {     // polygon (3–6 sides)
      const sides = 3 + Math.floor(rnd() * 4);
      ctx.beginPath();
      for (let k = 0; k < sides; k++) {
        const a = (k / sides) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * size / 2, Math.sin(a) * size / 2);
      }
      ctx.closePath(); ctx.fill();
    } else if (kind === 3) {     // gradient bar
      const barG = ctx.createLinearGradient(-size, 0, size, 0);
      barG.addColorStop(0, col + '00');
      barG.addColorStop(0.5, col);
      barG.addColorStop(1, col + '00');
      ctx.fillStyle = barG;
      ctx.fillRect(-size, -(6 + rnd() * 16) / 2, size * 2, 6 + rnd() * 16);
    } else {                     // arc sweep
      ctx.lineWidth = 3 + rnd() * 7;
      ctx.beginPath(); ctx.arc(0, 0, size / 2, 0, Math.PI * (0.6 + rnd() * 1.2)); ctx.stroke();
    }
    ctx.restore();
  }

  // Centre icon hint: glow disc + subject glyph
  const glyphName = SUBJECT_GLYPH[subject] || 'star';
  const cx = W / 2, cy = H / 2;
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, H * 0.42);
  glow.addColorStop(0, 'rgba(10,10,14,0.55)');
  glow.addColorStop(1, 'rgba(10,10,14,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  const scale = (H * 0.5) / 100;
  ctx.translate(cx - 50 * scale, cy - 50 * scale);
  ctx.scale(scale, scale);
  ctx.strokeStyle = pal.glyph;
  ctx.fillStyle = pal.glyph;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = pal.cols[0];
  ctx.shadowBlur = 18;
  const g = GLYPH_PATHS[glyphName];
  if (g.custom) {
    drawCustomGlyph(ctx, g.custom);
  } else {
    const p = new Path2D(g.d);
    if (g.fill) ctx.fill(p);
    ctx.stroke(p);
  }
  ctx.restore();

  // Corner ticks — seeded accent flourish
  ctx.strokeStyle = pal.cols[1 % pal.cols.length];
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 3;
  const m = 14, t = 20;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(x + t * sx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + t * sy);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  return cnv;
}

/* ============================================================
   GAME — auto-reveal, decaying points, buzz to freeze
   ============================================================ */
(async function () {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const announceEl = document.getElementById('announce');
  function announce(msg) { announceEl.textContent = msg; }

  if (!stem) {
    root.innerHTML = '<div class="ar-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  const spec = await Arcade.fetchSpecJson(stem, '../adventures/_specs');

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subject = (spec && spec.subject) || '';
  const subjDisplay = subject.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  const concepts = ((spec && spec.concepts) || []).filter(c => c && c.term);

  if (!spec || concepts.length < 4) {
    root.innerHTML = `
      <div class="ar-badge">V · Verify · Reveal Race</div>
      <h1 class="ar-title">${esc(topic)}</h1>
      <p class="ar-sub">Reveal Race needs at least four concept terms for this exact topic so it can build posters and decoys. That set hasn't been authored yet.</p>
      <div class="ar-meta">${esc([level, subjDisplay, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="ar-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🖼️</div>
        <h2 style="font-size:1.3rem;margin:0 0 8px;font-weight:700;">Posters in production</h2>
        <p style="color:var(--ar-text2);margin:0 0 18px;font-size:15px;">Check back soon — this topic's concept set is still being written at the required depth.</p>
        <a href="../../subjects.html" style="color:var(--ar-cyan);font-family:var(--ar-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">← Back to subjects</a>
      </div>
    `;
    announce('This topic is still in production — no game available yet.');
    return;
  }

  const BEST_KEY = 'aism-reveal-best:' + location.pathname;
  const SLOW_KEY = 'aism-reveal-slow';
  const TOTAL_ROUNDS = Math.min(6, concepts.length);  // one round per concept, cap 6
  const START_PTS = 500, FLOOR_PTS = 50;
  const STAGES = 12;
  const BASE_STAGE_MS = 1200;                          // ~1.2s per reveal piece
  const GRID_COLS = 16, GRID_ROWS = 10;
  const TOTAL_CELLS = GRID_COLS * GRID_ROWS;
  const ART_W = 640, ART_H = 400;
  const PLACEHOLDER_DEF_RE = /^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;

  let slowMode = false;
  try { slowMode = localStorage.getItem(SLOW_KEY) === '1'; } catch (e) {}
  function stageMs() { return slowMode ? BASE_STAGE_MS * 2 : BASE_STAGE_MS; }
  function totalMs() { return STAGES * stageMs(); }

  // Build rounds: one per concept (shuffled), each with 3 decoy terms from the same spec.
  function buildRounds() {
    const order = Arcade.shuffle(concepts).slice(0, TOTAL_ROUNDS);
    return order.map(target => {
      const decoys = Arcade.shuffle(concepts.filter(c => c.term !== target.term)).slice(0, 3);
      const options = Arcade.shuffle([target.term, ...decoys.map(c => c.term)]);
      return { target, options, correctIdx: options.indexOf(target.term) };
    });
  }

  let rounds, state;
  let phase = 'idle';        // idle | revealing | options | feedback | done
  let cellOrder = [], revealedCount = 0, revealedStages = 0;
  let artCanvas = null, viewCtx = null;
  let revealT0 = 0, revealElapsed = 0;
  let stageTimer = null, ptsRAF = null, lastBeat = 0;
  let frozenPts = START_PTS, frozenFrac = 0;
  let wrongGuesses = 0, roundTimedOut = false;
  let correctStreak = 0;
  let milestones = {};

  function startGame() {
    Arcade.sfx.click();
    rounds = buildRounds();
    state = { idx: 0, score: 0, correct: 0, buzzFracs: [], correctFracs: [], emoji: [] };
    renderRound();
  }

  function renderHeader(metaTail) {
    return `
      <div class="ar-badge">V · Verify · Reveal Race</div>
      <h1 class="ar-title">${esc(topic)}</h1>
      <p class="ar-sub">The poster reveals on its own — and 500 points drain away while it does. Buzz the second you know it. Wrong guess? The decay resumes. Two wrong guesses ends the round.</p>
      <div class="ar-meta">${esc([level, subjDisplay].filter(Boolean).join(' · '))} · ${esc(metaTail)}</div>
    `;
  }

  function currentFrac() {
    return Math.min(1, ((phase === 'revealing' ? performance.now() - revealT0 : revealElapsed)) / totalMs());
  }
  function currentPts() {
    return Math.max(FLOOR_PTS, Math.round(START_PTS - (START_PTS - FLOOR_PTS) * currentFrac()));
  }

  function renderRound() {
    const round = rounds[state.idx];
    phase = 'idle';
    revealedCount = 0; revealedStages = 0;
    revealElapsed = 0;
    wrongGuesses = 0; roundTimedOut = false;
    milestones = {};

    root.innerHTML = `
      ${renderHeader('Round ' + (state.idx + 1) + ' of ' + TOTAL_ROUNDS)}
      <div class="ar-hud">
        <div class="ar-hud-stat gold">banked <b id="hud-score">${state.score}</b></div>
        <div class="ar-hud-stat">round <b>${state.idx + 1}/${TOTAL_ROUNDS}</b></div>
        <div class="ar-hud-stat">named <b id="hud-named">${state.correct}</b></div>
      </div>
      <div class="ar-card">
        <div class="ar-label">Which concept is this poster?</div>
        <div class="rv-pts-wrap">
          <div class="rv-pts" id="pts">${START_PTS}</div>
          <div class="rv-pts-lbl">pts on the table — buzz to freeze</div>
        </div>
        <div class="rv-stage">
          <canvas class="rv-canvas" id="art" width="${ART_W}" height="${ART_H}" role="img"
            aria-label="Abstract poster gradually revealing — buzz in when you can identify the concept"></canvas>
          <div class="rv-reveal-tag" id="reveal-tag">0%</div>
        </div>
        <div class="rv-buzz-row" id="buzz-row">
          <button type="button" class="ar-btn hot big" id="buzz" style="max-width:340px;">⚡ BUZZ</button>
        </div>
        <div id="options-zone"></div>
        <div id="fb"></div>
        <div class="rv-toggles">
          <label class="rv-toggle"><input type="checkbox" id="slow-toggle" ${slowMode ? 'checked' : ''}> Slow mode (2× reveal time)</label>
          <span class="rv-strikes" id="strikes"></span>
        </div>
        <div class="ar-kbd-hint">Space to buzz · 1–4 to answer · Enter for next</div>
      </div>
    `;

    const viewCanvas = document.getElementById('art');
    viewCtx = viewCanvas.getContext('2d');
    artCanvas = renderPoster(round.target.term, subject, ART_W, ART_H);

    // Seeded reveal order — deterministic per concept so replays feel fair.
    const rnd = mulberry32(fnv1a('order|' + round.target.term + '|' + subject));
    cellOrder = Array.from({ length: TOTAL_CELLS }, (_, i) => i);
    for (let i = cellOrder.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [cellOrder[i], cellOrder[j]] = [cellOrder[j], cellOrder[i]];
    }

    // Base layer: coarse pixelated mosaic, dimmed — the "covered" state.
    const mosaic = document.createElement('canvas');
    mosaic.width = GRID_COLS; mosaic.height = GRID_ROWS;
    const mctx = mosaic.getContext('2d');
    mctx.drawImage(artCanvas, 0, 0, GRID_COLS, GRID_ROWS);
    viewCtx.imageSmoothingEnabled = false;
    viewCtx.drawImage(mosaic, 0, 0, ART_W, ART_H);
    viewCtx.imageSmoothingEnabled = true;
    viewCtx.fillStyle = 'rgba(10,11,16,0.55)';
    viewCtx.fillRect(0, 0, ART_W, ART_H);

    document.getElementById('buzz').addEventListener('click', onBuzz);
    document.getElementById('slow-toggle').addEventListener('change', e => {
      const fracBefore = currentFrac();
      slowMode = e.target.checked;
      try { localStorage.setItem(SLOW_KEY, slowMode ? '1' : '0'); } catch (err) {}
      // Re-scale the running clock so the elapsed fraction is preserved.
      if (phase === 'revealing') {
        revealT0 = performance.now() - fracBefore * totalMs();
        clearTimeout(stageTimer);
        scheduleStage();
      } else {
        revealElapsed = fracBefore * totalMs();
      }
      announce(slowMode ? 'Slow mode on — reveal time doubled.' : 'Slow mode off.');
    });

    announce('Round ' + (state.idx + 1) + ' of ' + TOTAL_ROUNDS + '. Poster revealing. 500 points on the table and falling. Press space to buzz.');
    startReveal();
  }

  /* ---- reveal engine: staged cells + continuously decaying points ---- */
  function startReveal() {
    phase = 'revealing';
    revealT0 = performance.now() - revealElapsed;
    scheduleStage();
    if (ptsRAF) cancelAnimationFrame(ptsRAF);
    ptsRAF = requestAnimationFrame(ptsFrame);
  }

  function scheduleStage() {
    const boundary = (revealedStages + 1) * stageMs();
    const delay = Math.max(0, revealT0 + boundary - performance.now());
    stageTimer = setTimeout(stageFire, delay);
  }

  function stageFire() {
    if (phase !== 'revealing') return;
    revealedStages++;
    revealCellsTo(revealedStages / STAGES);
    Arcade.sfx.tick();
    updateRevealUI(revealedStages / STAGES);
    if (revealedStages >= STAGES) { onFullReveal(); return; }
    scheduleStage();
  }

  function ptsFrame() {
    if (phase !== 'revealing') return;
    const pts = currentPts();
    const el = document.getElementById('pts');
    if (el) {
      el.textContent = pts;
      el.classList.toggle('danger', pts < 200);
    }
    if (pts < 200) {
      const now = performance.now();
      if (now - lastBeat > 900) { Arcade.sfx.heartbeat(); lastBeat = now; }
    }
    ptsRAF = requestAnimationFrame(ptsFrame);
  }

  function stopReveal() {
    clearTimeout(stageTimer);
    if (ptsRAF) cancelAnimationFrame(ptsRAF);
    stageTimer = null; ptsRAF = null;
  }

  function revealCellsTo(frac) {
    const target = Math.floor(frac * TOTAL_CELLS);
    const cw = ART_W / GRID_COLS, ch = ART_H / GRID_ROWS;
    while (revealedCount < target && revealedCount < TOTAL_CELLS) {
      const cell = cellOrder[revealedCount];
      const cx = (cell % GRID_COLS) * cw;
      const cy = Math.floor(cell / GRID_COLS) * ch;
      viewCtx.drawImage(artCanvas, cx, cy, cw, ch, cx, cy, cw, ch);
      revealedCount++;
    }
  }

  function updateRevealUI(frac) {
    const pct = Math.round(frac * 100);
    const tag = document.getElementById('reveal-tag');
    if (tag) tag.textContent = pct + '%';
    [[0.5, '50'], [0.75, '75']].forEach(([m, label]) => {
      if (frac >= m && !milestones[label]) {
        milestones[label] = true;
        announce(label + ' percent revealed. ' + currentPts() + ' points left.');
      }
    });
  }

  function onBuzz() {
    if (phase !== 'revealing') return;
    revealElapsed = performance.now() - revealT0;
    frozenFrac = currentFrac();
    phase = 'options';
    stopReveal();
    frozenPts = currentPts();
    Arcade.sfx.riser();
    Arcade.vibrate(25);
    const ptsEl = document.getElementById('pts');
    if (ptsEl) { ptsEl.textContent = frozenPts; ptsEl.classList.remove('danger'); ptsEl.classList.add('frozen'); }
    document.getElementById('buzz-row').innerHTML = '';
    announce('Buzzed at ' + Math.round(frozenFrac * 100) + ' percent revealed. ' + frozenPts + ' points frozen. Pick the concept, keys one to four.');
    showOptions();
  }

  function onFullReveal() {
    revealElapsed = totalMs();
    frozenFrac = 1;
    frozenPts = FLOOR_PTS;
    phase = 'options';
    roundTimedOut = true;
    stopReveal();
    revealCellsTo(1);
    updateRevealUI(1);
    Arcade.sfx.timeup();
    const ptsEl = document.getElementById('pts');
    if (ptsEl) { ptsEl.textContent = FLOOR_PTS; ptsEl.classList.add('danger'); }
    document.getElementById('buzz-row').innerHTML = '';
    Arcade.flashMsg('FULL REVEAL 👀', '#ffd60a');
    announce('Fully revealed — last chance, ' + FLOOR_PTS + ' points on the table. Pick the concept.');
    showOptions();
  }

  function showOptions() {
    const round = rounds[state.idx];
    const zone = document.getElementById('options-zone');
    zone.innerHTML = `
      <div class="rv-options ar-stagger" role="radiogroup" aria-label="Four possible concepts — pick the one the poster shows">
        ${round.options.map((opt, i) => `
          <button type="button" class="ar-tile" data-idx="${i}">
            <span class="rv-opt-key">${i + 1}</span>${esc(opt)}
          </button>
        `).join('')}
      </div>
    `;
    zone.querySelectorAll('.ar-tile').forEach(b => {
      if (b.dataset.dead) return;
      b.addEventListener('click', () => pickOption(parseInt(b.dataset.idx, 10), b));
    });
    // Re-disable any option already burned this round.
    if (wrongGuesses > 0 && showOptions._dead != null) {
      const burned = zone.querySelector(`.ar-tile[data-idx="${showOptions._dead}"]`);
      if (burned) { burned.disabled = true; burned.classList.add('wrong', 'dim'); }
    }
  }

  function pickOption(idx, btn) {
    if (phase !== 'options') return;
    const round = rounds[state.idx];
    const correct = idx === round.correctIdx;
    Arcade.sfx.click();

    if (correct) {
      finishRound(true, btn);
      return;
    }

    wrongGuesses++;
    showOptions._dead = idx;
    btn.classList.add('wrong');
    btn.disabled = true;
    Arcade.sfx.wrong();
    Arcade.shake();
    Arcade.vibrate([40, 30, 40]);

    if (wrongGuesses >= 2) {
      // Two strikes — round over, zero points.
      finishRound(false, null);
      return;
    }

    const strikes = document.getElementById('strikes');
    if (strikes) strikes.textContent = '✖ 1 strike';

    if (roundTimedOut) {
      // Nothing left to reveal — allow the final guess immediately.
      announce('Not it. One guess left at ' + FLOOR_PTS + ' points.');
      Arcade.flashMsg('NOT IT — LAST GUESS', '#ff2e88');
      return;
    }

    // Wrong guess: reveal resumes, points keep decaying, buzz again.
    Arcade.flashMsg('NOPE — DECAY RESUMES ⏳', '#ff2e88');
    announce('Not it. The reveal resumes and points keep falling. Buzz again when you know it.');
    document.getElementById('options-zone').innerHTML = '';
    document.getElementById('buzz-row').innerHTML =
      '<button type="button" class="ar-btn hot big" id="buzz" style="max-width:340px;">⚡ BUZZ AGAIN</button>';
    document.getElementById('buzz').addEventListener('click', onBuzz);
    const ptsEl = document.getElementById('pts');
    if (ptsEl) ptsEl.classList.remove('frozen');
    startReveal();
  }

  function finishRound(won, btn) {
    phase = 'feedback';
    stopReveal();
    showOptions._dead = null;
    const round = rounds[state.idx];
    state.buzzFracs.push(frozenFrac);

    let earned = 0;
    if (won) {
      earned = frozenPts;
      state.score += earned;
      state.correct++;
      state.correctFracs.push(frozenFrac);
      correctStreak++;
      state.emoji.push(earned >= START_PTS * 0.6 ? '🟩' : '🟨');
      Arcade.sfx.correct(correctStreak);
      Arcade.confettiBurst({ count: earned >= 300 ? 70 : 45 });
      Arcade.streakCall(correctStreak);
      if (btn) { Arcade.popTextOver(btn, '+' + earned, '#ffd60a'); btn.classList.add('correct'); }
      Arcade.vibrate(30);
    } else {
      correctStreak = 0;
      state.emoji.push('🟥');
      Arcade.sfx.wrong();
    }

    // Show the full poster either way — the answer deserves its art.
    revealCellsTo(1);
    updateRevealUI(1);

    const zone = document.getElementById('options-zone');
    zone.querySelectorAll('.ar-tile').forEach(b => {
      const i = parseInt(b.dataset.idx, 10);
      b.disabled = true;
      if (i === round.correctIdx) b.classList.add('correct');
      else b.classList.add('dim');
    });

    const hudScore = document.getElementById('hud-score');
    if (hudScore) Arcade.countUp(hudScore, state.score, 500);
    const hudNamed = document.getElementById('hud-named');
    if (hudNamed) hudNamed.textContent = state.correct;

    const def = (round.target.def && !PLACEHOLDER_DEF_RE.test(round.target.def)) ? round.target.def : '';
    const fb = document.getElementById('fb');
    fb.className = 'ar-feedback ' + (won ? 'ok' : 'no');
    fb.innerHTML = won
      ? `<strong>“${esc(round.target.term)}” — banked +${earned}.</strong> ${roundTimedOut ? 'Full reveal, floor points.' : 'Called it at ' + Math.round(frozenFrac * 100) + '% revealed.'} ${esc(def)}`
      : `<strong>Round lost — it was “${esc(round.target.term)}”.</strong> ${esc(def)}`;
    announce(won
      ? 'Correct. It was ' + round.target.term + '. Banked ' + earned + ' points. ' + def
      : 'Round lost. It was ' + round.target.term + '. Zero points. ' + def);

    const btnNext = document.createElement('button');
    btnNext.className = 'ar-btn';
    btnNext.id = 'next-btn';
    btnNext.style.marginTop = '14px';
    btnNext.textContent = state.idx + 1 < TOTAL_ROUNDS ? 'Next round →' : 'See the damage →';
    btnNext.addEventListener('click', () => {
      Arcade.sfx.click();
      if (state.idx + 1 < TOTAL_ROUNDS) { state.idx++; renderRound(); }
      else renderSummary();
    });
    fb.after(btnNext);
  }

  function renderSummary() {
    phase = 'done';
    stopReveal();
    const maxScore = TOTAL_ROUNDS * START_PTS;
    const avgPct = state.correctFracs.length
      ? Math.round((state.correctFracs.reduce((a, b) => a + b, 0) / state.correctFracs.length) * 100)
      : 100;
    const fastest = state.correctFracs.length
      ? Math.round(Math.min(...state.correctFracs) * 100)
      : null;
    let pct = Math.round(100 * state.score / maxScore);
    if (state.correct === TOTAL_ROUNDS) pct = Math.min(100, pct + 10);

    let insight;
    if (pct >= 70) insight = `You're recognising ${topic} concepts from fragments — that's exactly the fast retrieval exams reward. Next run: try to beat a ${avgPct}% average buzz point.`;
    else if (pct >= 40) insight = 'Solid recognition. The rounds where you waited for the full reveal — or lost — are the terms whose mental image is still fuzzy. Re-read those definitions, then race the reveal again.';
    else insight = `Letting the poster fully reveal is the safe play, but it means the terms aren't snapping into focus yet. Revisit the ${topic} concept list, then come back and buzz earlier — even a wrong early guess teaches you which terms blur together.`;

    root.innerHTML = renderHeader('Results') + '<div id="end-root"></div>';

    Arcade.renderEndCard(document.getElementById('end-root'), {
      gameName: 'Reveal Race',
      gameEmoji: '🖼️',
      topic: topic,
      meta: TOTAL_ROUNDS + ' rounds',
      pct: pct,
      big: state.score,
      bigLabel: 'points banked · max ' + maxScore,
      rows: [
        { v: state.correct + '/' + TOTAL_ROUNDS, l: 'named' },
        { v: avgPct + '%', l: 'avg reveal at buzz' },
        { v: fastest != null ? fastest + '%' : '—', l: 'fastest call' },
      ],
      emojiGrid: state.emoji.join(''),
      bestKey: BEST_KEY,
      bestValue: state.score,
      bestSuffix: ' pts',
      insight,
      shareLines: [
        '🖼️ Reveal Race · ' + topic,
        state.score + ' pts · named ' + state.correct + '/' + TOTAL_ROUNDS + ' · avg buzz @ ' + avgPct + '% revealed',
        state.emoji.join(''),
      ],
      onAgain: startGame,
    });

    announce('Game over. ' + state.score + ' points banked, ' + state.correct + ' of ' + TOTAL_ROUNDS + ' named. You name posters at ' + avgPct + ' percent revealed on average. ' + insight);
  }

  // Keyboard: Space buzzes, 1–4 answer, Enter advances.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === ' ' && phase === 'revealing') {
      e.preventDefault();
      onBuzz();
      return;
    }
    if (e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;  // native activation
      const next = document.getElementById('next-btn') || document.getElementById('ar-again');
      if (next) { e.preventDefault(); next.click(); }
      return;
    }
    const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
    if (e.key in map && phase === 'options') {
      const b = root.querySelectorAll('.rv-options .ar-tile')[map[e.key]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
</html>
