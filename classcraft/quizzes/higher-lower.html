<script>
(async function() {
  'use strict';
  const E = Arcade.escapeHtml;
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  Arcade.mountMuteButton();
  Arcade.maybeShowChallenge && Arcade.maybeShowChallenge();

  if (!stem) {
    root.innerHTML = '<div class="ar-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  // Spec fetch with colon-stem fallback (shared engine handles the candidates).
  const spec = await Arcade.fetchSpecJson(stem, '../adventures/_specs');

  // Sibling specs are exact known stems — plain fetch, no fallback needed.
  async function fetchSpec(siblingStem) {
    try {
      const r = await fetch(`../adventures/_specs/${encodeURIComponent(siblingStem)}.json`);
      if (r.ok) return await r.json();
    } catch (e) {}
    return null;
  }

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = ((spec && spec.level) || '').toUpperCase().replace('A-LEVEL', 'A-Level');
  const subj  = ((spec && spec.subject) || '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  // ── Pool building ─────────────────────────────────────────────────────
  // A card is usable when its answer is a finite number in a sane display
  // range. Questions that mention a year get tagged so we never ask a
  // student to compare 1908 against 9.81 m/s² — categories only mix when
  // both cards are years or both aren't.
  const YEAR_RE = /\byear\b|\bcentury did\b|\bwhen did\b.*\b(1\d{3}|20\d{2})\b/i;
  function toCard(n, srcLabel) {
    if (!n || typeof n.q !== 'string' || !n.q.trim()) return null;
    const v = Number(n.answer);
    if (!isFinite(v)) return null;
    const abs = Math.abs(v);
    if (abs < 0.01 || abs > 1e9) return null;
    return {
      q: n.q.trim(),
      value: v,
      unit: typeof n.unit === 'string' ? n.unit.trim() : '',
      year: YEAR_RE.test(n.q),
      decs: Math.min(4, (String(n.answer).split('.')[1] || '').length),
      src: srcLabel,
    };
  }

  function inProduction(reason) {
    root.innerHTML = `
      <div class="ar-badge">V · Verify · Higher or Lower</div>
      <h1 class="ar-title">${E(topic)}</h1>
      <p class="ar-sub">This game runs on real numerical answers drawn from across the subject — padding it with filler numbers wouldn't earn its place on the site. Come back soon.</p>
      <div class="ar-meta">${E([level, subj, 'In production'].filter(Boolean).join(' · '))}</div>
      <div class="ar-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">⚖️</div>
        <h2 style="font-size:1.3rem;margin:0 0 8px">Numbers in production</h2>
        <p style="color:var(--ar-text2);margin:0 0 18px;font-size:15px;">${E(reason)}</p>
        <a href="../../subjects.html" style="color:var(--ar-cyan);font-family:var(--ar-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;">← Back to subjects</a>
      </div>
    `;
  }

  const ownCards = ((spec && spec.numericals) || []).map(n => toCard(n, topic)).filter(Boolean);
  if (!spec || ownCards.length === 0) {
    inProduction('Higher or Lower needs authored numerical questions with genuinely numeric answers for this topic. That set hasn’t been written at the required depth yet.');
    return;
  }

  // ── Sibling discovery ─────────────────────────────────────────────────
  // The full catalog (resources.js) is far too large to fetch usefully, so
  // we lean on a baked-in hint table of known-good topic stems per subject
  // prefix. Many candidates will 404 — that's fine, we just skip them.
  const SIBLING_HINTS = {
    'physics-a-level': ['aqa-electricity','aqa-fields-their-consequences','aqa-further-mechanics-thermal-physics','aqa-measurements-errors','aqa-mechanics-materials','aqa-nuclear-physics','aqa-particles-radiation','aqa-waves','astrophysics','capacitance--capacitors','cosmology--hubbles-law','edexcel-electric-circuits','edexcel-electric-magnetic-fields','edexcel-further-mechanics','ccea-waves-photons-astronomy','ccea-forces-energy-electricity'],
    'chemistry-a-level': ['acids-bases--buffers','aqa-atomic-structure','aqa-bonding-energetics','aqa-inorganic-chemistry','aqa-kinetics-equilibria','aqa-physical-chemistry','aqa-polymers-synthesis','aqa-rate-equations','aqa-thermodynamics','atomic-structure--bonding','edexcel-acid-base-equilibria','edexcel-atomic-structure-periodic-table','edexcel-bonding-structure','edexcel-energetics','edexcel-formulae-equations-amounts','ccea-physical-chemistry'],
    'biology-a-level': ['aqa-cells','aqa-control-of-gene-expression','aqa-energy-transfers','aqa-genetic-information-variation','aqa-genetics-populations-ecosystems','aqa-organisms-exchange-substances','aqa-organisms-respond-to-changes','biological-molecules','cells--transport','dna-replication','ecology--populations','edexcel-biodiversity-natural-resources','edexcel-genes-health','ccea-molecules-cells','ccea-biochemistry-genetics-evolution'],
    'maths-a-level': ['aqa-algebra-functions','aqa-coordinate-geometry','aqa-differentiation','aqa-exponentials-logarithms','aqa-integration','aqa-kinematics','aqa-moments','aqa-probability','aqa-sequences-series','aqa-statistical-distributions','aqa-trigonometry','aqa-vectors','aqa-forces-newtons-laws','aqa-numerical-methods','aqa-proof'],
    'history-a-level': ['ancient--medieval','aqa-democracy-nazism-germany-1918-1945','aqa-france-in-revolution-1774-1815','aqa-industrialisation-the-people-britain-c1783-1885','aqa-stuart-britain-the-crisis-of-monarchy-1603-1702','aqa-the-age-of-the-crusades-c1071-1204','aqa-the-american-dream-reality-illusion-1945-1980','aqa-the-making-of-modern-britain-1951-2007','aqa-tudors-england-1485-1603','aqa:-cold-war-1945-91','aqa:-russia-1855-1964','aqa:-tudors-1485-1603','aqa:-usa-1865-1975','british-empire-in-india','ccea-germany-1919-45','ccea-partition-of-ireland-1900-25'],
    'history-gcse': ['american-west-1840-95','aqa-america-1840-1895-expansion-consolidation','aqa-britain-health-the-people-c1000-to-present-day','aqa-conflict-tension-1918-1939','aqa-conflict-tension-between-east-west-1945-1972','aqa-elizabethan-england-c1568-1603','aqa-germany-1890-1945-democracy-dictatorship','aqa-norman-england-c1066-c1100','aqa-power-the-people-c1170-to-present-day','aqa:-conflict--tension-1894-1918','aqa:-elizabethan-england-1568-1603','aqa:-health--the-people','aqa:-power--the-people','cambridge-igcse-depth-study-germany-1918-45','cambridge-igcse-depth-study-russia-1905-41','cambridge-igcse-core-content-the-20th-century-1919-1990'],
    'geography-a-level': ['aqa-ecosystems-under-stress','aqa-global-systems-global-governance','aqa-population-the-environment','aqa-resource-security','aqa:-changing-places','aqa:-coastal-systems','aqa:-global-governance','aqa:-water-and-carbon-cycles','carbon-cycle','ccea-human-geography-population','ccea-human-geography-development','ccea-human-geography-settlement','ccea-physical-geography-atmosphere','ccea-physical-geography-ecosystems','ccea-physical-geography-fluvial-coastal-environments','ccea-contemporary-issues-tectonic-environments'],
    'geography-gcse': ['aqa-physical-landscapes-in-the-uk','aqa-the-challenge-of-natural-hazards','aqa-the-challenge-of-resource-management','aqa-the-changing-economic-world','aqa-the-living-world','aqa-urban-issues-challenges','aqa:-changing-economic-world','aqa:-resource-management-water','aqa:-tropical-rainforests','aqa:-uk-coastal-landscapes','cambridge-igcse-population-settlement','cambridge-igcse-the-natural-environment','ccea-changing-urban-areas','ccea-coastal-environments','ccea-contrasts-in-world-development','ccea-managing-our-environment'],
    'physics-gcse': ['aqa-atomic-structure','aqa-magnetism-electromagnetism','aqa-particle-model-of-matter','aqa-space-physics','cambridge-igcse-electricity-magnetism','cambridge-igcse-motion-forces-energy','cambridge-igcse-nuclear-physics','cambridge-igcse-space-physics','cambridge-igcse-thermal-physics','ccea-atomic-nuclear-physics','ccea-density-pressure','ccea-space-physics','domestic-electricity--power','edexcel-astronomy','edexcel-conservation-of-energy','edexcel-electricity-circuits'],
    'chemistry-gcse': ['aqa-atomic-structure-the-periodic-table','aqa-bonding-structure-properties','aqa-chemistry-of-the-atmosphere','aqa-rate-extent-of-change','atomic-structure','bonding','cambridge-igcse-acids-bases-salts','cambridge-igcse-atoms-elements-compounds','cambridge-igcse-chemical-energetics','cambridge-igcse-electrochemistry','cambridge-igcse-metals','cambridge-igcse-states-of-matter','cambridge-igcse-stoichiometry','ccea-acids-bases-salts','ccea-formulae-equations','ccea-materials'],
    'biology-gcse': ['aqa-inheritance-variation-evolution','bioenergetics','cambridge-igcse-biological-molecules','cambridge-igcse-characteristics-classification','cambridge-igcse-coordination-response','cambridge-igcse-diseases-immunity','cambridge-igcse-enzymes','cambridge-igcse-gas-exchange-respiration','cambridge-igcse-human-nutrition','cambridge-igcse-plant-nutrition','cambridge-igcse-transport-in-animals','cambridge-igcse-transport-in-plants','ccea-breathing-respiration','ccea-cell-division-genetics','ccea-cells','ccea-coordination-control'],
    'maths-gcse': ['algebra','aqa-geometry-measures','aqa-number','aqa-probability','aqa-ratio-proportion-rates-of-change','cambridge-igcse-algebra-graphs','cambridge-igcse-coordinate-geometry','cambridge-igcse-geometry','cambridge-igcse-mensuration','cambridge-igcse-number','cambridge-igcse-probability','cambridge-igcse-transformations-vectors','cambridge-igcse-trigonometry','ccea-geometry-measures','ccea-handling-data','edexcel-geometry-measures'],
  };

  const shuffle = Arcade.shuffle;

  // Same-topic sibling adventures first (adventure-1..3), then ~10 stems
  // from the hint table for this subject prefix.
  const base = stem.replace(/-adventure-\d+$/, '');
  const candidates = new Set();
  for (let n = 1; n <= 3; n++) {
    const s = `${base}-adventure-${n}`;
    if (s !== stem) candidates.add(s);
  }
  const prefixKey = Object.keys(SIBLING_HINTS).find(k => stem.startsWith(k + '-'));
  if (prefixKey) {
    shuffle(SIBLING_HINTS[prefixKey]).slice(0, 10).forEach(t => {
      const s = `${prefixKey}-${t}-adventure-1`;
      if (s !== stem) candidates.add(s);
    });
  }

  const siblingSpecs = await Promise.all([...candidates].map(fetchSpec));
  const pool = ownCards.slice();
  const seen = new Set(pool.map(c => c.q + '|' + c.value));
  siblingSpecs.forEach(s => {
    if (!s || !Array.isArray(s.numericals)) return;
    const label = s.topic_display || s.title || 'Sibling topic';
    for (const n of s.numericals) {
      const card = toCard(n, label);
      if (card && !seen.has(card.q + '|' + card.value)) {
        seen.add(card.q + '|' + card.value);
        pool.push(card);
        break; // first valid numerical per sibling spec
      }
    }
  });

  // Backfill from the subject+level number pool (every authored numerical
  // across the subject) so a thin topic still gets a full comparison chain.
  if (pool.length < 8 && spec && spec.subject && spec.level) {
    try {
      const r = await fetch(`../arcade/numbers/${encodeURIComponent(spec.subject)}-${encodeURIComponent(spec.level)}.json`);
      if (r.ok) {
        const packCards = ((await r.json()).cards || []);
        for (const n of packCards) {
          const card = toCard(n, n.src || 'Across the subject');
          if (card && !seen.has(card.q + '|' + card.value)) {
            seen.add(card.q + '|' + card.value);
            pool.push(card);
            if (pool.length >= 16) break;
          }
        }
      }
    } catch (e) { /* pool is optional — fall through to the gate */ }
  }

  const distinctValues = new Set(pool.map(c => c.value)).size;
  if (pool.length < 3 || distinctValues < 2) {
    inProduction('Higher or Lower needs at least three numerical answers from this topic and its sibling topics to build a fair comparison chain. Not enough have been authored yet.');
    return;
  }

  // ── Game ──────────────────────────────────────────────────────────────
  const BEST_KEY = 'aism-hl-best:' + stem;
  const MAX_Q = 12;          // cap the run so videos stay tight
  const HOT_POT = 500;       // heartbeat territory
  const sameVal = (a, b) => Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));

  let queue = [];
  function refill(exclude) { queue = shuffle(pool.filter(c => c !== exclude)); }
  function takeFrom(pred) {
    const i = queue.findIndex(pred);
    return i > -1 ? queue.splice(i, 1)[0] : null;
  }
  // Prefer a card in the same category (year vs quantity) with a different
  // value; identical answers are skipped outright. Only mix categories when
  // the current category has nothing left to offer.
  function drawNext(current) {
    const strict = c => c.year === current.year && !sameVal(c.value, current.value);
    const loose  = c => !sameVal(c.value, current.value);
    let c = takeFrom(strict);
    if (!c) { refill(current); c = takeFrom(strict) || takeFrom(loose); }
    return c;
  }

  function fmt(v, card) {
    if (card.year) return String(Math.round(v));
    if (card.decs > 0) return Number(v.toFixed(card.decs)).toLocaleString('en-GB', { minimumFractionDigits: card.decs, maximumFractionDigits: card.decs });
    return Math.round(v).toLocaleString('en-GB');
  }

  let state, stats;

  function startGame() {
    refill(null);
    const left = queue.shift();
    const right = drawNext(left);
    state = { left, right, banked: 0, pot: 0, streak: 0, qNum: 0, correctCount: 0, busy: false };
    stats = { overshoot: 0, undershoot: 0, yearRounds: 0, yearRight: 0, lastWrongGuess: null, longestStreak: 0, biggestBurn: 0, marks: [] };
    renderGame(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function headerHtml(metaTail) {
    return `
      <div class="ar-badge">V · Verify · Higher or Lower</div>
      <h1 class="ar-title">${E(topic)}</h1>
      <p class="ar-sub">Call it: is the hidden answer higher or lower? Every correct call grows the pot — bank it, or push your luck.</p>
      <div class="ar-meta">${E([level, subj].filter(Boolean).join(' · '))} · ${E(metaTail)} · ${pool.length} facts in play</div>
    `;
  }

  function hudHtml() {
    return `
      <div class="ar-hud">
        <div class="ar-hud-stat gold">🏦 Banked <b id="banked-val">${state.banked}</b></div>
        <div class="ar-hud-stat ${state.pot > HOT_POT ? 'hot' : ''}">🔥 Pot <b id="pot-val">${state.pot}</b></div>
        <div class="ar-hud-stat">⚡ Streak <b id="streak-val">${state.streak}</b></div>
      </div>
      <div class="ar-dots" aria-hidden="true">${Array.from({ length: MAX_Q }, (_, i) => {
        const m = stats.marks.filter(x => x !== '🏦')[i];
        let cls = '';
        if (m === '🟩') cls = 'done';
        else if (m === '🟥') cls = 'fail';
        else if (i === state.qNum) cls = 'now';
        return `<span class="${cls}"></span>`;
      }).join('')}</div>
    `;
  }

  function cardHtml(card, mystery, extraClass) {
    const ans = mystery
      ? '<span class="hl-num">?</span>'
      : `<span class="hl-num">${E(fmt(card.value, card))}</span>${card.unit ? `<span class="hl-unit">${E(card.unit)}</span>` : ''}`;
    return `
      <article class="hl-card ${mystery ? 'mystery' : ''} ${extraClass || ''}">
        <div class="hl-card-label">${E(mystery ? '? · ' + card.src : card.src)}</div>
        <div class="hl-card-q">${E(card.q)}</div>
        <div class="hl-card-ans">${ans}</div>
      </article>
    `;
  }

  function renderGame(enterRight) {
    root.innerHTML = `
      ${headerHtml('Question ' + (state.qNum + 1) + ' of ' + MAX_Q)}
      ${hudHtml()}
      <div class="hl-stage" id="stage">
        <div class="hl-col" id="colL">${cardHtml(state.left, false)}</div>
        <div class="hl-vs" aria-hidden="true">vs</div>
        <div class="hl-col" id="colR">
          ${cardHtml(state.right, true, enterRight ? 'enter' : '')}
          <div class="hl-controls">
            <button type="button" class="hl-pill hl-higher" id="btnHigher" aria-label="Guess the hidden answer is higher">↑ HIGHER</button>
            <button type="button" class="hl-pill hl-lower" id="btnLower" aria-label="Guess the hidden answer is lower">↓ LOWER</button>
          </div>
        </div>
      </div>
      <div id="fb"></div>
      <div class="hl-decision" id="decision"></div>
      <button type="button" class="hl-cashout" id="btnCashout">Cash out &amp; finish — bank everything and see your results</button>
      <div class="ar-kbd-hint">Keyboard: ↑ higher · ↓ lower · B bank · Enter keep going</div>
    `;
    document.getElementById('btnHigher').addEventListener('click', () => guess('higher'));
    document.getElementById('btnLower').addEventListener('click', () => guess('lower'));
    document.getElementById('btnCashout').addEventListener('click', cashOut);
    if (state.pot > HOT_POT) Arcade.sfx.heartbeat();
  }

  // Flip the "?" to the real number with an eased count-up that starts from
  // the visible card's value — the number literally climbs or falls to its
  // answer, which is the whole drama of the game.
  function countUp(el, card, fromVal, done) {
    const t0 = performance.now(), dur = 700, target = card.value;
    function tick(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3); // ease-out cubic
      el.textContent = fmt(fromVal + (target - fromVal) * e, card);
      if (p < 1) requestAnimationFrame(tick);
      else { el.textContent = fmt(target, card); if (done) done(); }
    }
    requestAnimationFrame(tick);
  }

  // One-line educational comparison of the two quantities.
  function takeaway(left, right, isHigher) {
    const rStr = fmt(right.value, right) + (right.unit ? ' ' + right.unit : '');
    const lStr = fmt(left.value, left) + (left.unit ? ' ' + left.unit : '');
    if (left.year && right.year) {
      const gap = Math.abs(Math.round(right.value - left.value));
      if (gap === 0) return rStr + ' — the very same year as ' + lStr + '.';
      return rStr + ' is ' + gap + ' year' + (gap === 1 ? '' : 's') + ' ' + (isHigher ? 'after' : 'before') + ' ' + lStr + '.';
    }
    if (left.value > 0 && right.value > 0) {
      const ratio = right.value / left.value;
      if (ratio >= 1.05) return rStr + ' vs ' + lStr + ' — about ' + (ratio >= 10 ? Math.round(ratio) : ratio.toFixed(1)) + '× bigger.';
      if (ratio <= 0.95) {
        const inv = left.value / right.value;
        return rStr + ' vs ' + lStr + ' — about ' + (inv >= 10 ? Math.round(inv) : inv.toFixed(1)) + '× smaller.';
      }
      return rStr + ' vs ' + lStr + ' — nearly identical. That one was a coin flip.';
    }
    return rStr + ' vs ' + lStr + '.';
  }

  function endedByCap() { return state.qNum >= MAX_Q; }

  function guess(dir) {
    if (state.busy) return;
    state.busy = true;
    Arcade.sfx.click();
    const { left, right } = state;
    const isHigher = right.value > left.value;
    const correct = (dir === 'higher') === isHigher;
    state.qNum++;

    if (right.year) { stats.yearRounds++; if (correct) stats.yearRight++; }
    if (!correct) {
      stats.lastWrongGuess = dir;
      if (dir === 'higher') stats.overshoot++; else stats.undershoot++;
    }

    ['btnHigher', 'btnLower'].forEach(id => { document.getElementById(id).disabled = true; });

    const cardR = root.querySelector('#colR .hl-card');
    cardR.classList.add('revealed');
    if (!correct) cardR.classList.add('busted');
    const numEl = cardR.querySelector('.hl-num');
    if (right.unit) numEl.insertAdjacentHTML('afterend', `<span class="hl-unit">${E(right.unit)}</span>`);

    countUp(numEl, right, left.value, () => {
      const revealed = fmt(right.value, right) + (right.unit ? ' ' + right.unit : '');
      const take = takeaway(left, right, isHigher);
      const fb = document.getElementById('fb');
      const decision = document.getElementById('decision');

      if (correct) {
        state.streak++;
        state.correctCount++;
        if (state.streak > stats.longestStreak) stats.longestStreak = state.streak;
        const gain = 100 * state.streak;
        state.pot += gain;
        stats.marks.push('🟩');

        Arcade.sfx.correct(state.streak);
        Arcade.streakCall(state.streak);
        Arcade.vibrate([20]);
        const potEl = document.getElementById('pot-val');
        if (potEl) {
          potEl.textContent = state.pot;
          potEl.classList.add('bump');
          Arcade.popTextOver(potEl, '+' + gain, '#ffd60a');
          if (state.pot > HOT_POT) {
            potEl.closest('.ar-hud-stat').classList.add('hot');
            Arcade.sfx.heartbeat();
          }
        }
        const streakEl = document.getElementById('streak-val');
        if (streakEl) streakEl.textContent = state.streak;

        fb.className = 'ar-feedback ok';
        fb.innerHTML = `<strong>Called it.</strong> ${E(take)} Pot: <strong>${state.pot}</strong> unbanked.`;
        announce.textContent = 'Correct — the answer was ' + revealed + ', which is ' + (isHigher ? 'higher' : 'lower') + '. Streak ' + state.streak + '. Pot ' + state.pot + ' unbanked. Bank it, or keep going?';

        if (endedByCap()) {
          decision.innerHTML = '<button type="button" class="ar-btn big" id="btnCollect">🏦 Collect ' + state.pot + ' &amp; finish →</button>';
          document.getElementById('btnCollect').addEventListener('click', () => { bankPot(false); finish(false); });
        } else {
          decision.innerHTML = `
            <button type="button" class="ar-btn" id="btnBank">🏦 BANK IT — keep ${state.pot}</button>
            <button type="button" class="ar-btn hot" id="btnKeep">😈 KEEP GOING — next is +${100 * (state.streak + 1)}</button>
          `;
          document.getElementById('btnBank').addEventListener('click', () => { bankPot(true); advance(); });
          document.getElementById('btnKeep').addEventListener('click', () => { Arcade.sfx.click(); advance(); });
        }
      } else {
        const burned = state.pot;
        if (burned > stats.biggestBurn) stats.biggestBurn = burned;
        state.pot = 0;
        state.streak = 0;
        stats.marks.push('🟥');

        Arcade.sfx.wrong();
        Arcade.shake();
        Arcade.vibrate([60, 40, 60]);
        if (burned > 0) Arcade.flashMsg('TORCHED 🔥', '#ff2e88');
        const potEl = document.getElementById('pot-val');
        if (potEl) {
          potEl.textContent = '0';
          potEl.closest('.ar-hud-stat').classList.remove('hot');
          if (burned > 0) Arcade.popTextOver(potEl, '−' + burned, '#ff2e88');
        }
        const streakEl = document.getElementById('streak-val');
        if (streakEl) streakEl.textContent = '0';

        fb.className = 'ar-feedback no';
        fb.innerHTML = `<strong>Wrong way.</strong> ${E(take)}` + (burned > 0 ? ` Your unbanked pot of <strong>${burned}</strong> just went up in smoke.` : ' Nothing in the pot — nothing lost.');
        announce.textContent = 'Wrong — the answer was ' + revealed + ', which is ' + (isHigher ? 'higher' : 'lower') + '.' + (burned > 0 ? ' You burned an unbanked pot of ' + burned + '.' : '') + ' Banked total still ' + state.banked + '.';

        if (endedByCap()) {
          decision.innerHTML = '<button type="button" class="ar-btn big" id="btnFinish">See your results →</button>';
          document.getElementById('btnFinish').addEventListener('click', () => finish(false));
        } else {
          decision.innerHTML = '<button type="button" class="ar-btn big ghost" id="btnNext">Shake it off — next number →</button>';
          document.getElementById('btnNext').addEventListener('click', () => { Arcade.sfx.click(); advance(); });
        }
      }
    });
  }

  function bankPot(celebrate) {
    if (state.pot > 0) {
      state.banked += state.pot;
      stats.marks.push('🏦');
      Arcade.sfx.coin();
      const bankedEl = document.getElementById('banked-val');
      if (bankedEl) {
        Arcade.countUp(bankedEl, state.banked, 600);
        Arcade.popTextOver(bankedEl, '+' + state.pot, '#ffd60a');
      }
      if (celebrate) Arcade.confettiBurst({ count: Math.min(120, 30 + Math.round(state.pot / 20)) });
      announce.textContent = 'Banked ' + state.pot + '. Safe total ' + state.banked + '. Streak resets.';
    }
    state.pot = 0;
    state.streak = 0;
  }

  function advance() {
    const next = drawNext(state.right);
    if (!next || endedByCap()) {
      // Pool exhausted (or cap hit) — whatever is in the pot comes home safe.
      bankPot(false);
      finish(!next);
      return;
    }
    state.left = state.right;
    state.right = next;
    state.busy = false;
    renderGame(true);
  }

  function cashOut() {
    Arcade.sfx.click();
    bankPot(false);
    finish(false);
  }

  function numberSenseInsight() {
    const streak = stats.longestStreak;
    const datesGood = stats.yearRounds >= 2 && stats.yearRight === stats.yearRounds;
    let core;
    if (streak >= 10) core = `A ${streak}-call hot streak is real number sense — you're estimating magnitudes, not guessing. That instinct is exactly what the Verify stage is built to train.`;
    else if (stats.lastWrongGuess === 'higher') {
      core = datesGood
        ? 'Good sense for time scales — the dates never fooled you. But you overshot on the quantities: when in doubt, real answers are usually smaller than they feel.'
        : 'You overshot — you called "Higher" when the number was smaller. Quantities in this subject run more modest than intuition suggests; anchor on the units before you commit.';
    } else if (stats.lastWrongGuess === 'lower') {
      core = datesGood
        ? 'Good sense for time scales, but you undershot on the quantities — some of these numbers are bigger than they feel. Note which scales surprised you.'
        : 'You undershot — the hidden number was bigger than you expected. Magnitudes in this topic run larger than intuition suggests; that surprise is worth a flashcard.';
    } else {
      core = 'Every card here is a real numerical answer from the syllabus. The ones that surprised you are the ones worth writing down — number sense is built one calibrated guess at a time.';
    }
    if (stats.biggestBurn > 0 && stats.biggestBurn > state.banked) {
      core = `You torched more than you banked (a ${stats.biggestBurn}-point pot went up in flames). Knowing when to lock in what you've got is calibration too. ` + core;
    }
    return core;
  }

  function finish(exhausted) {
    state.busy = true;
    const answered = state.qNum;
    const pct = answered ? Math.round(100 * state.correctCount / answered) : 0;
    const grid = stats.marks.join('');

    root.innerHTML = `
      ${headerHtml(exhausted ? 'Deck cleared' : 'Run over')}
      <div id="end"></div>
    `;

    Arcade.renderEndCard(document.getElementById('end'), {
      gameName: 'Higher or Lower',
      gameEmoji: '⚖️',
      topic: topic,
      meta: [level, subj].filter(Boolean).join(' · '),
      pct: pct,
      big: state.banked,
      bigLabel: 'points banked',
      rows: [
        { v: stats.longestStreak, l: 'longest streak' },
        { v: stats.biggestBurn ? '−' + stats.biggestBurn : '—', l: 'biggest burn' },
        { v: state.correctCount + '/' + answered, l: 'calls right' },
      ],
      emojiGrid: grid,
      bestKey: BEST_KEY,
      bestValue: state.banked,
      bestSuffix: ' pts',
      insight: numberSenseInsight(),
      share: { subject: subj, level: level, bigLabel: 'POINTS BANKED', statLine: 'longest streak ⚡' + stats.longestStreak + '  ·  ' + state.correctCount + '/' + answered + ' calls right' },
      shareLines: [
        '⚖️ Higher or Lower — ' + topic,
        '🏦 ' + state.banked + ' banked · ⚡ streak ' + stats.longestStreak + (stats.biggestBurn ? ' · 🔥 burned ' + stats.biggestBurn : ''),
        grid,
      ],
      onAgain: startGame,
    });

    announce.textContent = 'Run over. ' + state.banked + ' points banked, longest streak ' + stats.longestStreak
      + (stats.biggestBurn ? ', biggest pot burned ' + stats.biggestBurn : '') + '. '
      + state.correctCount + ' of ' + answered + ' calls right.';
  }

  // Keyboard: ↑ = Higher, ↓ = Lower, B = bank, Enter = keep going / next.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const btn = document.getElementById(e.key === 'ArrowUp' ? 'btnHigher' : 'btnLower');
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      return;
    }
    if (e.key === 'b' || e.key === 'B') {
      const btn = document.getElementById('btnBank');
      if (btn) { e.preventDefault(); btn.click(); }
      return;
    }
    if (e.key === 'Enter') {
      const t = e.target;
      if (t && t.classList && (t.classList.contains('ar-btn') || t.classList.contains('hl-pill') || t.classList.contains('hl-cashout'))) return; // native activation
      const btn = document.getElementById('btnKeep') || document.getElementById('btnNext')
        || document.getElementById('btnCollect') || document.getElementById('btnFinish');
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  startGame();
})();
</script>
