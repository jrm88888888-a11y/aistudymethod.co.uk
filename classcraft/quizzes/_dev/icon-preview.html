<!doctype html><meta charset="utf-8">
<style>
body{background:#0d0a30;color:#ece8ff;font:11px monospace;margin:0;padding:16px}
h2{color:#5cffe4;font-size:13px;margin:18px 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.cell{width:96px;text-align:center}
.cell .l{color:#8f89c0;margin-top:2px;word-break:break-all}
.row{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.tiny .cell{width:52px}
.mascots{display:flex;gap:40px;align-items:flex-end}
canvas{image-rendering:pixelated}
</style>
<body>
<div id="out"></div>
<script src="../arcade-icons.js"></script>
<script>
var subjects=['art-design','astronomy','biology','business-studies','chemistry','computer-science','design-technology','economics','english-language','english-literature','environmental-science','food-technology','french','geography','german','history','maths','music','pe','physics','psychology','religious-studies','sociology','spanish'];
var cabinets=['daily-drill','wager','falling-words','conveyor','two-truths','higher-lower','mob-quiz','memory','sort','timeline','diagram','quiz','anagram','crossword','hangman','pairs','pacman','invaders'];
var A=window.ArcadeIcons,h='';
function block(title,names,sizes){
  h+='<h2>'+title+'</h2><div class="grid">';
  names.forEach(function(n){
    h+='<div class="cell"><div class="row">'+sizes.map(function(s){return A.svg(n,s)}).join('')+'</div><div class="l">'+n+'</div></div>';
  });
  h+='</div>';
}
block('SUBJECTS 32 + 64',subjects,[32,64]);
h+='<h2>SUBJECTS @16 (thumbnail test)</h2><div class="grid tiny">';
subjects.forEach(function(n){h+='<div class="cell">'+A.svg(n,16)+'<div class="l">'+n.slice(0,8)+'</div></div>'});
h+='</div>';
block('CABINETS 32 + 64',cabinets,[32,64]);
h+='<h2>MASCOT 20 / 48 / 96 / 200</h2><div class="mascots" id="masc">';
['mascot','mascot-cheer','mascot-flame'].forEach(function(n){
  h+='<div class="cell" style="width:auto"><div class="row">'+[20,48,96,200].map(function(s){return A.svg(n,s)}).join('')+'</div><div class="l">'+n+'</div></div>';
});
h+='</div><h2>CANVAS PARITY (drawOnCanvas)</h2><canvas id="cv" width="420" height="120" style="width:840px;height:240px;background:#1a1340"></canvas>';
document.getElementById('out').innerHTML=h;
var ctx=document.getElementById('cv').getContext('2d');
A.drawOnCanvas(ctx,'mascot',6,6,4);
A.drawOnCanvas(ctx,'quiz',120,10,4); A.drawOnCanvas(ctx,'pacman',200,10,4); A.drawOnCanvas(ctx,'chemistry',280,10,4);
A.drawOnCanvas(ctx,'nope',350,10,4);
</script>
