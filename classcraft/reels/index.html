<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reel Studio — Revision Arcade — AI Study Method</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a30; --bg2:#1a1340; --panel:#12103a;
  --cyan:#5cffe4; --lav:#7e6dff; --yellow:#ffd24d; --magenta:#ff5fa2;
  --text:#e9e9ff; --dim:#9a9ad0;
  --vgrad:linear-gradient(135deg,#1fb89a,#4f6bd8 55%,#8b5cf6);
  --px:'Press Start 2P',monospace; --vt:'VT323',monospace;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(126,109,255,.18), transparent),
    radial-gradient(ellipse 60% 40% at 85% 100%, rgba(92,255,228,.08), transparent);
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
body::after{
  content:'';position:fixed;inset:0;z-index:1000;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:18px 16px 80px}

/* ---- marquee ---- */
.marquee{text-align:center;padding:14px 12px 6px}
.vrow{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:12px}
.v-mascot{flex:0 0 auto;line-height:0}
.v-mascot svg{display:block;width:52px;height:52px;filter:drop-shadow(0 0 10px rgba(126,109,255,.5))}
.v-mascot.flip svg{transform:scaleX(-1)}
.vtile{
  width:56px;height:56px;border-radius:13px;background:var(--vgrad);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:34px;color:#fff;
  box-shadow:0 0 16px rgba(79,107,216,.55),0 0 5px rgba(31,184,154,.6);
  animation:tilebob 3s ease-in-out infinite;
}
@keyframes tilebob{50%{transform:translateY(-6px)}}
.marquee .over{font-family:var(--px);font-size:10px;color:var(--cyan);letter-spacing:3px;margin-bottom:10px;text-shadow:0 0 8px rgba(92,255,228,.7)}
.marquee h1{
  font-family:var(--px);font-size:clamp(18px,4.4vw,38px);line-height:1.3;color:var(--yellow);
  text-shadow:0 0 6px rgba(255,210,77,.8),0 0 24px rgba(255,159,28,.55),3px 3px 0 #7a2bd6;
  letter-spacing:2px;animation:flick 4s infinite;
}
@keyframes flick{0%,93%,96%,100%{opacity:1}94%{opacity:.75}95%{opacity:.92}}
.marquee .sub{font-family:var(--vt);font-size:clamp(17px,2.4vw,24px);color:var(--cyan);margin-top:10px;letter-spacing:3px;text-shadow:0 0 10px rgba(92,255,228,.6)}

.studio-tag{font-family:var(--px);font-size:11px;color:var(--lav);letter-spacing:2px;text-align:center;margin:6px 0 2px;text-shadow:0 0 10px rgba(126,109,255,.6)}
.note{
  max-width:640px;margin:14px auto 4px;text-align:center;font-family:var(--vt);
  font-size:20px;letter-spacing:1px;color:var(--text);
  border:2px dashed rgba(126,109,255,.5);border-radius:10px;padding:10px 16px;
  background:rgba(126,109,255,.07);
}

/* ---- cards grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:26px}
.card{
  display:flex;flex-direction:column;gap:10px;padding:16px 16px 18px;border-radius:14px;
  background:linear-gradient(160deg,#191152,#100d38);border:2px solid #2a2470;
  box-shadow:inset 0 0 30px rgba(126,109,255,.08);position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 40% at 50% -10%,rgba(92,255,228,.1),transparent)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-num{font-family:var(--px);font-size:11px;color:var(--dim)}
.badge{font-family:var(--px);font-size:7px;letter-spacing:1px;padding:6px 8px;border-radius:5px;line-height:1.3;
  border:1px solid;white-space:nowrap}
.badge.claw{color:var(--cyan);border-color:rgba(92,255,228,.6);background:rgba(92,255,228,.08)}
.badge.pusher{color:var(--yellow);border-color:rgba(255,210,77,.6);background:rgba(255,210,77,.08)}
.badge.pacman{color:var(--magenta);border-color:rgba(255,95,162,.6);background:rgba(255,95,162,.08)}
.badge.invaders{color:var(--lav);border-color:rgba(126,109,255,.6);background:rgba(126,109,255,.08)}
.card-name{font-family:var(--px);font-size:13px;color:var(--yellow);line-height:1.5;text-shadow:0 0 8px rgba(255,210,77,.5)}
.card-topic{font-family:var(--vt);font-size:20px;letter-spacing:1px;color:var(--cyan)}
.card-myth{font-family:var(--body);font-weight:600;font-size:14px;line-height:1.45;color:var(--text)}
.card-myth b{color:var(--magenta);font-weight:800}
.record-btn{
  margin-top:auto;display:block;text-align:center;text-decoration:none;
  padding:14px 12px 12px;border-radius:11px;cursor:pointer;
  background:linear-gradient(160deg,#2a0f33,#181055);border:3px solid var(--yellow);
  color:var(--yellow);font-family:var(--px);font-size:12px;letter-spacing:1.5px;line-height:1.5;
  text-shadow:0 0 10px rgba(255,210,77,.7);
  box-shadow:0 0 20px rgba(255,210,77,.25),inset 0 0 30px rgba(255,95,162,.12);
  transition:transform .12s,box-shadow .12s;
}
.record-btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(255,210,77,.45),inset 0 0 30px rgba(255,95,162,.2)}
.record-btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

.foot{text-align:center;margin-top:34px;font-family:var(--vt);font-size:18px;color:var(--dim);letter-spacing:1px}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="marquee">
    <div class="vrow">
      <span class="v-mascot" id="mascot-l" aria-hidden="true"></span>
      <div class="vtile" aria-hidden="true">V</div>
      <span class="v-mascot flip" id="mascot-r" aria-hidden="true"></span>
    </div>
    <div class="over">AI STUDY METHOD PRESENTS</div>
    <h1>REVISION ARCADE</h1>
    <div class="sub">REEL STUDIO · 58 GAMEPLAY DEMOS · READY TO RECORD</div>
  </div>

  <p class="note">58 ready-to-record reels — split across The Claw, Coin Pusher, Pac-Man &amp; Space Invaders. Open one, record in 9:16, voice over.</p>

  <div class="grid" id="grid"></div>

  <p class="foot">Private launcher — REVISION ARCADE reel studio</p>
</div>

<script src="../quizzes/arcade-icons.js"></script>
<script>
(function () {
  'use strict';

  /* engine key -> page + display badge. claw-* / pusher-* / pacman-* / invaders-* */
  var ENGINES = {

  };

  /* ordered to match the 8 scripts. Myth lines hand-authored from each
     pack topic + hero.trap in reel-data.js. */
  var REELS = [
    { key: 'claw-evolution',      family: 'claw',     name: 'THE CLAW',       subject: 'Biology',   topic: 'Evolution',

    { key: 'pusher-acids',        family: 'pusher',   name: 'COIN PUSHER',    subject: 'Chemistry', topic: 'Strong vs Concentrated Acids',
      myth: 'A strong acid is just a concentrated acid.' },
    { key: 'pusher-absorption',   family: 'pusher',   name: 'COIN PUSHER',    subject: 'Biology',   topic: 'Absorption',

    { key: 'pacman-waves',        family: 'pacman',   name: 'PAC-MAN',        subject: 'Physics',   topic: 'Waves',

    { key: 'pacman-current',      family: 'pacman',   name: 'PAC-MAN',        subject: 'Physics',   topic: 'Electric Circuits',

      hookLabel: "Fact", myth: "An octopus has three hearts." },
    { key: "invaders-penguins", family: "invaders", name: "SPACE INVADERS", subject: "Biology", topic: "Habitats",
      hookLabel: "Myth", myth: "Penguins only live in Antarctica." },
    { key: "pacman-gold-magnet", family: "pacman", name: "PAC-MAN", subject: "Chemistry", topic: "Magnetism",
      hookLabel: "Myth", myth: "Gold is magnetic." },
    { key: "claw-lightning-tf", family: "claw", name: "THE CLAW", subject: "Physics", topic: "Weather Myths",
      hookLabel: "Fact", myth: "Lightning can strike the same place many times." },
    { key: "pusher-senses-tf", family: "pusher", name: "COIN PUSHER", subject: "Biology", topic: "The Senses",
      hookLabel: "Fact", myth: "We have more than five senses." },
    { key: "invaders-most-moons", family: "invaders", name: "SPACE INVADERS", subject: "Physics", topic: "The Solar System",
      hookLabel: "Trap", myth: "Most people guess Jupiter." },
    { key: "pacman-potassium-symbol", family: "pacman", name: "PAC-MAN", subject: "Chemistry", topic: "Chemical Symbols",
      hookLabel: "Trap", myth: "P is phosphorus, not potassium." },
    { key: "claw-bones-206", family: "claw", name: "THE CLAW", subject: "Biology", topic: "The Skeleton",
      hookLabel: "Trap", myth: "Babies have more; adults have 206." },
    { key: "pusher-mercury-metal", family: "pusher", name: "COIN PUSHER", subject: "Chemistry", topic: "Metals",
      hookLabel: "Trap", myth: "Lead is solid at room temperature." },
    { key: "invaders-si-force", family: "invaders", name: "SPACE INVADERS", subject: "Physics", topic: "Units",
      hookLabel: "Trap", myth: "The joule is energy, not force." },
    { key: "pacman-plants-gas", family: "pacman", name: "PAC-MAN", subject: "Biology", topic: "Photosynthesis",
      hookLabel: "Trap", myth: "Plants release oxygen; they take in CO₂." },
    { key: "claw-largest-organ", family: "claw", name: "THE CLAW", subject: "Biology", topic: "Organs",
      hookLabel: "Trap", myth: "Many say the liver — it is the skin." },
    { key: "pusher-atp-organelle", family: "pusher", name: "COIN PUSHER", subject: "Biology", topic: "Cells",
      hookLabel: "Trap", myth: "Ribosomes make protein, not ATP." },
    { key: "invaders-nitrogen-air", family: "invaders", name: "SPACE INVADERS", subject: "Chemistry", topic: "The Atmosphere",
      hookLabel: "Trap", myth: "21% is oxygen; most of the air is nitrogen." },
    { key: "pacman-fastest-animal", family: "pacman", name: "PAC-MAN", subject: "Biology", topic: "Animals",
      hookLabel: "Trap", myth: "Over a sprint, nothing beats the cheetah." },
    { key: "claw-photosynthesis-site", family: "claw", name: "THE CLAW", subject: "Biology", topic: "Photosynthesis",
      hookLabel: "Spot it", myth: "It does not happen in the roots." },
    { key: "pusher-electron-charge", family: "pusher", name: "COIN PUSHER", subject: "Physics", topic: "Atomic Structure",
      hookLabel: "Spot it", myth: "Electrons are not positive." },
    { key: "invaders-heart-chambers", family: "invaders", name: "SPACE INVADERS", subject: "Biology", topic: "The Heart",
      hookLabel: "Spot it", myth: "It is not three chambers." },
    { key: "pacman-evaporation-temp", family: "pacman", name: "PAC-MAN", subject: "Chemistry", topic: "Evaporation",
      hookLabel: "Spot it", myth: "It is not only at 100°C." },
    { key: "claw-sound-vacuum", family: "claw", name: "THE CLAW", subject: "Physics", topic: "Sound Waves",
      hookLabel: "Spot it", myth: "Sound cannot cross empty space." },
    { key: "pusher-moon-light", family: "pusher", name: "COIN PUSHER", subject: "Physics", topic: "The Moon",
      hookLabel: "Spot it", myth: "The Moon makes no light of its own." },
    { key: "invaders-bacteria-harm", family: "invaders", name: "SPACE INVADERS", subject: "Biology", topic: "Microorganisms",
      hookLabel: "Spot it", myth: "Not all bacteria cause disease." },
    { key: "pacman-ice-density", family: "pacman", name: "PAC-MAN", subject: "Chemistry", topic: "Density",
      hookLabel: "Spot it", myth: "If ice were denser it would sink." },

      hookLabel: "Spot it", myth: "On average it is not Venus." },

      hookLabel: "Why?", myth: "It is not a reflection of the oceans." },

      hookLabel: "Why?", myth: "It is about density, not trapped air." },

      hookLabel: "Why?", myth: "It is the tilt, not the distance." },
    { key: "pusher-leaves-green", family: "pusher", name: "COIN PUSHER", subject: "Biology", topic: "Photosynthesis",
      hookLabel: "Why?", myth: "Green light is reflected, not absorbed." },
    { key: "invaders-metals-conduct", family: "invaders", name: "SPACE INVADERS", subject: "Physics", topic: "Bonding",
      hookLabel: "Why?", myth: "It is free electrons, not protons." },

      hookLabel: "Why?", myth: "The bolt heats the air itself." },

      hookLabel: "Why?", myth: "It is not a heat-making reaction." },
    { key: "pusher-breathe-underwater", family: "pusher", name: "COIN PUSHER", subject: "Biology", topic: "Gas Exchange",
      hookLabel: "Why?", myth: "There is oxygen in water — lungs just can’t use it." },
    { key: "invaders-astronauts-float", family: "invaders", name: "SPACE INVADERS", subject: "Physics", topic: "Gravity & Orbits",
      hookLabel: "Why?", myth: "There is gravity in orbit — they are falling." },
    { key: "pacman-heart-exercise", family: "pacman", name: "PAC-MAN", subject: "Biology", topic: "Exercise & Respiration",
      hookLabel: "Why?", myth: "Your muscles are demanding more oxygen." }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var grid = document.getElementById('grid');
  var html = '';
  for (var i = 0; i < REELS.length; i++) {
    var r = REELS[i];
    var eng = ENGINES[r.family];
    var href = eng.page + '?reel=' + encodeURIComponent(r.key);
    html +=
      '<div class="card">' +
        '<div class="card-head">' +
          '<span class="card-num">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>' +
          '<span class="badge ' + eng.cls + '">' + esc(eng.badge) + '</span>' +
        '</div>' +
        '<div class="card-name">' + esc(r.name) + '</div>' +
        '<div class="card-topic">' + esc(r.subject) + ' · ' + esc(r.topic) + '</div>' +
        '<div class="card-myth"><b>' + esc(r.hookLabel || 'Myth') + ':</b> ' + esc(r.myth) + '</div>' +

  }
  grid.innerHTML = html;

  /* mascots either side of the V tile */
  if (window.ArcadeIcons && typeof window.ArcadeIcons.svg === 'function') {
    var l = document.getElementById('mascot-l');
    var rr = document.getElementById('mascot-r');
    var m = window.ArcadeIcons.svg('mascot', 52);
    if (l && m) { l.innerHTML = m; }
    if (rr && m) { rr.innerHTML = m; }
  }

  /* starfield */
  (function stars() {
    var c = document.getElementById('stars');
    var x = c.getContext && c.getContext('2d');
    if (!x) { return; }
    var arr = [];
    function size() {
      c.width = innerWidth; c.height = innerHeight;
      arr = Array.from({ length: Math.min(160, innerWidth / 6) }, function () {
        return {
          x: Math.random() * c.width, y: Math.random() * c.height,
          r: Math.random() * 1.6 + 0.3, s: Math.random() * 0.45 + 0.08,
          tw: Math.random() * Math.PI * 2
        };
      });
    }
    size();
    addEventListener('resize', size);
    var reduced = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    (function loop() {
      x.clearRect(0, 0, c.width, c.height);
      for (var i = 0; i < arr.length; i++) {
        var s = arr[i];
        s.y += s.s; s.tw += 0.04;
        if (s.y > c.height) { s.y = -2; s.x = Math.random() * c.width; }
        x.globalAlpha = 0.45 + Math.sin(s.tw) * 0.35;
        x.fillStyle = ['#9a9ad0', '#5cffe4', '#b18cff'][Math.floor(s.r * 2) % 3];
        x.fillRect(s.x, s.y, s.r, s.r);
      }
      x.globalAlpha = 1;
      if (!reduced) { requestAnimationFrame(loop); }
    })();
  })();
})();
</script>
</body>
</html>
