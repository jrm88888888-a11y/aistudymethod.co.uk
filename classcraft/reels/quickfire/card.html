/* ---- brand bar ---- */
.brand{position:absolute;top:150px;left:70px;right:70px;height:180px;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:22px}

.hook{position:absolute;top:360px;left:70px;right:70px;height:88px;z-index:20;

/* ---- stem ---- */
.stem{position:absolute;top:600px;left:80px;width:920px;height:200px;z-index:20;

/* ---- timer ---- */
.timer{position:absolute;top:830px;left:0;right:0;height:120px;z-index:20;
  display:flex;align-items:center;justify-content:center;gap:26px}

  text-shadow:0 0 26px rgba(255,210,77,.8)}

  border:2px solid rgba(255,210,77,.35)}

/* ---- options: x 90-930 keeps clear of the platform action rail ---- */
.opts{position:absolute;top:1000px;left:90px;width:840px;z-index:20;
  display:flex;flex-direction:column;gap:14px}
.row{height:100px;border-radius:16px;display:flex;align-items:center;gap:22px;padding:0 26px;
  background:rgba(126,109,255,.13);border:3px solid rgba(126,109,255,.45)}
.row .k{font-family:'PS2P',monospace;font-size:26px;color:#7e6dff;width:44px;flex:0 0 auto}
.row .v{font-size:46px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden}
.row.correct{background:rgba(61,220,132,.34);border-color:#3ddc84;box-shadow:0 0 54px rgba(61,220,132,.75),inset 0 0 30px rgba(61,220,132,.25)}
.row.correct .k{color:#3ddc84}
.row.trap{background:rgba(255,84,112,.14);border-color:rgba(255,84,112,.75);opacity:.62}

.row.trap .k{color:#ff5470}

/* ---- reveal / why line ---- */
.line{position:absolute;top:1352px;left:80px;width:900px;height:130px;z-index:20;

  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;
  border-radius:34px;background:linear-gradient(180deg,rgba(26,19,64,.97),rgba(13,10,48,.99));
  border:5px solid #7e6dff;box-shadow:0 0 70px rgba(126,109,255,.6)}
.cta .h{font-family:'PS2P',monospace;font-size:40px;line-height:1.6;color:#ffd24d;text-align:center;
  text-shadow:3px 3px 0 #7a2bd6}
.cta .d{font-size:52px;font-weight:800;color:#5cffe4;letter-spacing:-.5px}
.cta .s{font-family:'PS2P',monospace;font-size:19px;letter-spacing:3px;color:#ece8ff;opacity:.85}

</head><body>
<div id="stage">
  <canvas id="stars" width="1080" height="1920"></canvas>
  <div class="glowbg"></div>
  <div class="bez"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
  <div class="cor tl"></div><div class="cor tr"></div><div class="cor bl"></div><div class="cor br"></div>
  <div id="rivets"></div>
  <div class="draft" id="draft">DRAFT &middot; UNAPPROVED</div>
  <div class="brand"><div class="vtile">V</div><div class="wm">
    <div class="a">AI STUDY METHOD</div><div class="b">REVISION ARCADE</div></div></div>
  <div class="hook" id="hook"><span data-fit id="hooktx"></span></div>
  <div class="ctx" id="ctx"><span data-fit id="ctxtx"></span></div>
  <div class="stem" id="stem" data-fit></div>
  <div class="timer" id="timer"><div id="tdigit">3</div><div id="tsegs"><b></b><b></b><b></b></div></div>
  <div class="opts" id="opts"></div>
  <div class="line" id="line" data-fit></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div class="vig"></div><div class="scan"></div>
  <div class="cta" id="cta">
    <div class="h">SHARPEN YOUR<br>SCIENCE</div>
    <div class="d">aistudymethod.com</div>
    <div class="s">FREE GCSE REVISION ARCADE</div>
  </div>
</div>
<script>
(function(){
'use strict';
var Q=new URLSearchParams(location.search);
var BATCH=Q.get('batch')||'batch-01', CARD=Q.get('card');
var DUR=10.0, FPS=30;
var T={hook:0.00,stem:0.90,opts:1.00,timer0:1.00,timer1:4.00,lock:4.00,reveal:4.30,why:6.30,cta:8.30};

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function ease(x){return 1-Math.pow(1-clamp(x,0,1),3)}

var card=null, rows=[], starPts=[], coins=[], R=null;
var $=function(id){return document.getElementById(id)};

function layoutRivets(){
  var h='',ys=[120,460,860,1260,1660,1840];
  for(var i=0;i<ys.length;i++){h+='<div class="rivet" style="left:46px;top:'+ys[i]+'px"></div>';
    h+='<div class="rivet" style="right:46px;top:'+ys[i]+'px"></div>';}
  $('rivets').innerHTML=h;
}

function build(c){
  card=c; R=rng(hash(c.id));
  $('hooktx').textContent=c.hook;
  $('ctxtx').textContent=['AQA GCSE '+c.subject.toUpperCase(),c.paper.toUpperCase()].join(' · ');
  $('stem').textContent=c.stem;
  // deterministic option order, seeded on the card id
  var ord=c.options.map(function(o,i){return {o:o,i:i,k:R()}}).sort(function(a,b){return a.k-b.k});
  var K=['A','B','C'],html='';
  ord.forEach(function(x,i){html+='<div class="row" data-role="'+(x.o.correct?'correct':(x.o.trap?'trap':'other'))+
    '"><div class="k">'+K[i]+'</div><div class="v" data-fit>'+x.o.text+'</div></div>'});
  $('opts').innerHTML=html;
  rows=[].slice.call(document.querySelectorAll('.row'));
  var sr=rng(hash(c.id+'stars'));
  starPts=[];for(var i=0;i<150;i++)starPts.push({x:sr()*1080,y:sr()*1920,r:sr()*1.9+0.4,a:sr()*0.6+0.2,s:sr()*7+2});
  var cr=rng(hash(c.id+'coin'));
  coins=[];for(var j=0;j<26;j++)coins.push({a:cr()*Math.PI*2,v:300+cr()*340,sz:7+cr()*7,sp:cr()*3});
}

function drawStars(t){
  var cv=$('stars'),g=cv.getContext('2d');g.clearRect(0,0,1080,1920);
  for(var i=0;i<starPts.length;i++){var p=starPts[i];
    var y=(p.y+t*p.s)%1920;
    g.globalAlpha=p.a*(0.55+0.45*Math.sin(t*2+i));
    g.fillStyle=i%7===0?'#5cffe4':'#ffffff';g.fillRect(p.x,y,p.r,p.r)}
  g.globalAlpha=1;
}
function drawFx(t){
  var cv=$('fx'),g=cv.getContext('2d');g.clearRect(0,0,1080,1920);
  if(t<T.reveal||t>T.reveal+1.5)return;
  var e=t-T.reveal, cx=540, cy=1165;
  for(var i=0;i<coins.length;i++){var c=coins[i];
    var x=cx+Math.cos(c.a)*c.v*e, y=cy+Math.sin(c.a)*c.v*e+520*e*e;
    var a=clamp(1-e/1.4,0,1);
    g.globalAlpha=a;g.fillStyle=i%3===0?'#5cffe4':'#ffd24d';
    g.beginPath();g.ellipse(x,y,c.sz,c.sz*Math.abs(Math.cos(e*6+c.sp)),0,0,6.283);g.fill()}
  g.globalAlpha=1;
}

function seek(t){
  t=clamp(t,0,DUR);
  drawStars(t);drawFx(t);
  var isCta=t>=T.cta;

  // hook chip slams in
  var hk=$('hook'), hp=ease((t-0.05)/0.45);
  hk.style.opacity=String(clamp(hp,0,1));
  hk.style.transform='scale('+(0.55+0.45*hp)+')';

  $('ctx').style.opacity=String(clamp((t-0.45)/0.3,0,1));

  var st=$('stem'), sp=ease((t-T.stem)/0.30);
  st.style.opacity=String(clamp(sp,0,1));
  st.style.transform='translateY('+((1-sp)*26)+'px)';

  // timer
  var tm=$('timer'), n=0, shake=0;
  if(t>=T.timer0&&t<T.timer1){
    n=Math.max(1,Math.ceil(T.timer1-t));
    var frac=1-((T.timer1-t)-Math.floor(T.timer1-t));
    tm.style.opacity='1';
    $('tdigit').textContent=String(n);
    $('tdigit').style.transform='scale('+(1+0.34*Math.pow(1-frac,3))+')';
  } else if(t>=T.timer1&&t<T.reveal){
    tm.style.opacity='1';$('tdigit').textContent='0';$('tdigit').style.transform='scale(1)';n=0;
    shake=Math.sin((t-T.timer1)*70)*7*(1-(t-T.timer1)/(T.reveal-T.timer1));
  } else { tm.style.opacity=String(t<T.timer0?clamp((t-0.9)/0.1,0,1):0); }
  var segs=$('tsegs').children;
  for(var s=0;s<3;s++)segs[s].className=(s<n?'on':'');

  // options
  var op=$('opts');
  op.style.transform='translateX('+shake.toFixed(2)+'px)';
  rows.forEach(function(r,i){
    var ap=ease((t-(T.opts+i*0.07))/0.28);
    r.style.opacity=String(clamp(ap,0,1));
    r.style.transform='translateX('+((1-clamp(ap,0,1))*(i%2?34:-34))+'px)';
    var role=r.dataset.role, cls='row';
    if(t>=T.reveal&&role==='correct'){cls+=' correct';
      var pulse=Math.max(0,1-(t-T.reveal)/1.1);
      r.style.filter='brightness('+(1+0.55*pulse)+')';}
    else r.style.filter='none';
    if(t>=T.why&&role==='trap')cls+=' trap';
    if(t>=T.why&&role==='other')cls+=' dim';
    r.className=cls;
    var mul=1;
    if(t>=T.why){ var f=ease((t-T.why)/0.35);
      if(role==='trap')mul=1-0.42*f; if(role==='other')mul=1-0.72*f; }
    r.style.opacity=String(clamp(ap,0,1)*mul);
  });

  // reveal / why line
  var ln=$('line');
  if(t>=T.why){ln.className='line why';ln.textContent='✗ '+(card.options.find(function(o){return o.trap}).why);
    ln.style.opacity=String(ease((t-T.why)/0.28));}
  else if(t>=T.reveal){ln.className='line';ln.textContent='✓ '+card.reveal;
    ln.style.opacity=String(ease((t-T.reveal)/0.25));}
  else {ln.textContent='';ln.style.opacity='0'}

  // CTA
  var cta=$('cta'), cp=ease((t-T.cta)/0.35);
  cta.style.opacity=String(clamp(cp,0,1));
  cta.style.transform='scale('+(0.86+0.14*clamp(cp,0,1))+')';
  ['hook','ctx','stem','timer','opts','line'].forEach(function(id){
    var el=$(id); if(isCta) el.style.opacity=String(clamp(1-cp*1.6,0,1));
  });
}

function fit(){
  var sc=Math.min(window.innerWidth/1080,window.innerHeight/1920);
  document.getElementById('stage').style.transform='scale('+sc+')';
}
window.addEventListener('resize',fit);

var ready=fetch('cards/'+BATCH+'.json').then(function(r){return r.json()}).then(function(d){
  var c=CARD?d.cards.find(function(x){return x.id===CARD}):d.cards[0];
  if(!c)throw new Error('card not found: '+CARD);
  layoutRivets();build(c);fit();
  var draftOff = Q.get('draft')==='0';   // explicit author override; the gate is otherwise on
  $('draft').style.display=((c.review&&c.review.status==='approved')||draftOff)?'none':'block';
  return document.fonts.ready;
}).then(function(){seek(0);return true});

window.__reel={duration:DUR,fps:FPS,seek:seek,ready:ready,
  overflow:function(){return [].slice.call(document.querySelectorAll('[data-fit]'))
    .filter(function(el){return el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1})
    .map(function(el){return (el.id||el.className)+':'+el.textContent.slice(0,40)})}};
})();
</script></body></html>
