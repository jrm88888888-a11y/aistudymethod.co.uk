<script>const STORY_DATA = {"meta": {"title": "The Electrolysis Prison", "subtitle": "Pass the current. Break the bonds. Free the elements.", "subject": "Chemistry", "topic": "Electrolysis & Ionic Compounds", "level": "GCSE", "tags": ["⚗️ Chemistry", "GCSE · Year 10–11", "Electrolysis", "~10 min", "3 questions"], "intro": "An industrial electroplating facility has asked you to analyse their electrolysis system. Molten sodium chloride is being electrolysed to produce sodium metal and chlorine gas for use in industrial chemistry. You must identify what forms at each electrode and explain why."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#706860'/><rect x='150' y='80' width='400' height='120' fill='#8a7868'/><rect x='200' y='100' width='80' height='80' fill='#a09080'/><rect x='420' y='100' width='80' height='80' fill='#a09080'/><line x1='240' y1='80' x2='240' y2='50' stroke='#c0b8a8' stroke-width='3'/><line x1='460' y1='80' x2='460' y2='50' stroke='#c0b8a8' stroke-width='3'/><rect x='200' y='40' width='300' height='15' fill='#b0a898'/><rect x='0' y='240' width='700' height='22' fill='#706860'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#8a7868'/><rect x='150' y='70' width='400' height='120' fill='#a09080'/><rect x='180' y='90' width='80' height='80' fill='#706860'/><rect x='440' y='90' width='80' height='80' fill='#706860'/><rect x='0' y='230' width='700' height='32' fill='#706860'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#a09080'/><rect x='150' y='80' width='400' height='100' fill='#8a7868'/><rect x='0' y='230' width='700' height='32' fill='#706860'/></svg>"}, "nodes": [{"id": "intro_scene", "type": "story", "chapter": "Mission Briefing", "title": "Breaking Bonds with Electricity", "scene": "scene1", "body": "<p>Molten NaCl contains <strong>Na⁺</strong> (sodium ions) and <strong>Cl⁻</strong> (chloride ions) free to move. When a direct current passes through, positive ions move to the <strong>cathode (−)</strong> and negative ions move to the <strong>anode (+)</strong>.</p><p>At each electrode, ions gain or lose electrons — a process called <strong>oxidation</strong> (loss of electrons) or <strong>reduction</strong> (gain of electrons).</p>", "factBox": {"label": "Electrolysis", "text": "Electrolysis uses electrical energy to drive non-spontaneous chemical reactions. Ions in a molten or dissolved ionic compound are attracted to oppositely charged electrodes. Cathode (−): cations gain electrons (reduction). Anode (+): anions lose electrons (oxidation). Memory aid: OILRIG — Oxidation Is Loss, Reduction Is Gain."}, "formulaBox": {"label": "Electrode half-equations for NaCl", "formula": "Cathode: Na⁺ + e⁻ → Na (reduction)   Anode: 2Cl⁻ → Cl₂ + 2e⁻ (oxidation)", "vars": ""}, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "mcq", "chapter": "Question 1 of 3 — Cathode Product", "title": "What is produced at the cathode during electrolysis of molten NaCl?", "scene": "scene2", "body": "<p>The cathode is the negative electrode. Na⁺ ions (positive) are attracted to it.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What forms at the cathode?", "options": [{"text": "Sodium metal (Na) — Na⁺ ions gain electrons and are reduced: Na⁺ + e⁻ → Na", "correct": true}, {"text": "Chlorine gas (Cl₂) — chloride ions move to the cathode", "correct": false}, {"text": "Sodium chloride (NaCl) — the compound reforms at the electrode", "correct": false}, {"text": "Hydrogen (H₂) — water is electrolysed instead", "correct": false}], "maxAttempts": 2, "hintText": "Cathode = negative. Positive ions (Na⁺) move to cathode. Reduction (gain electrons) occurs there.", "feedbackCorrect": "Sodium metal — Na⁺ ions gain electrons (reduction) at the negative cathode.", "feedbackWrong": "A common mistake is saying ionic bonds involve 'sharing' electrons. Ionic bonds involve the transfer of electrons; covalent bonds involve sharing. Cathode is negative → attracts Na⁺ → Na⁺ + e⁻ → Na (sodium metal deposited).", "consequence": "<strong>Sodium metal collects at the cathode. Highly reactive — it must be collected carefully.</strong>", "next": "bridge1", "nextWrong": "bridge1", "examTip": "In the exam, draw dot-and-cross diagrams to support your answer. State whether electrons are transferred or shared.", "bloomsLevel": "Analyse"}, {"id": "bridge1", "type": "story", "chapter": "Act II — Anode Product", "title": "The Other Electrode", "scene": "scene2", "body": "<p>At the anode (+), Cl⁻ ions are attracted and lose electrons. Two Cl⁻ ions combine to form Cl₂ gas.</p><p>Half-equation: 2Cl⁻ → Cl₂ + 2e⁻</p><p>This is oxidation — the chloride ions lose electrons.</p>", "factBox": {"label": "OILRIG", "text": "Oxidation Is Loss of electrons (at anode). Reduction Is Gain of electrons (at cathode). The anode is positive; the cathode is negative."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "mcq", "chapter": "Question 2 of 3 — Anode Product", "title": "What is produced at the anode, and what type of reaction occurs?", "scene": "scene2", "body": "<p>Anode (positive electrode): Cl⁻ ions lose electrons.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What forms at the anode and what is this process called?", "options": [{"text": "Chlorine gas (Cl₂) by oxidation — 2Cl⁻ → Cl₂ + 2e⁻ (loss of electrons = oxidation)", "correct": true}, {"text": "Sodium metal by reduction — Na⁺ ions collect at the anode", "correct": false}, {"text": "Oxygen gas by reduction — O₂ forms from oxide ions at the anode", "correct": false}, {"text": "Chloride ions by oxidation — the ions are formed at the anode", "correct": false}], "maxAttempts": 2, "hintText": "Anode = positive. Negative ions (Cl⁻) move there. They lose electrons (oxidation). Two Cl⁻ combine to make Cl₂.", "feedbackCorrect": "Chlorine gas by oxidation — Cl⁻ lose electrons at the positive anode: 2Cl⁻ → Cl₂ + 2e⁻.", "feedbackWrong": "A common mistake is saying ionic bonds involve 'sharing' electrons. Ionic bonds involve the transfer of electrons; covalent bonds involve sharing. Anode: 2Cl⁻ → Cl₂ + 2e⁻. Loss of electrons = oxidation. Chlorine gas is released.", "consequence": "<strong>Chlorine gas bubbles at the anode — collected and used in industrial PVC and bleach production.</strong>", "next": "bridge2", "nextWrong": "bridge2", "examTip": "In the exam, draw dot-and-cross diagrams to support your answer. State whether electrons are transferred or shared.", "bloomsLevel": "Analyse"}, {"id": "bridge2", "type": "story", "chapter": "Act III — Aqueous vs Molten", "title": "Electrolysis of NaCl Solution", "scene": "scene3", "body": "<p>If NaCl is dissolved in water (not molten), there are now <strong>four</strong> ions: Na⁺, Cl⁻, H⁺ and OH⁻ (from water). At the cathode, H⁺ ions are discharged in preference to Na⁺ (H⁺ is less reactive). The cathode product changes.</p>", "factBox": {"label": "Aqueous NaCl electrolysis", "text": "In NaCl solution: cathode → H₂ (H⁺ gains electrons, not Na⁺ — hydrogen is less reactive). Anode → Cl₂ (same as molten — Cl⁻ discharged in preference to OH⁻ when concentration is high)."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Aqueous Change", "title": "In aqueous NaCl, what forms at the cathode instead of sodium?", "scene": "scene3", "body": "<p>Water introduces H⁺ and OH⁻ ions. At the cathode, H⁺ is preferentially reduced instead of Na⁺ (because Na is more reactive than H).</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is produced at the cathode during electrolysis of aqueous NaCl?", "options": [{"text": "Hydrogen gas (H₂) — H⁺ ions from water are preferentially reduced: 2H⁺ + 2e⁻ → H₂", "correct": true}, {"text": "Sodium metal (Na) — same as molten NaCl", "correct": false}, {"text": "Oxygen gas (O₂) — water is split at the cathode", "correct": false}, {"text": "Chlorine gas (Cl₂) — same as the anode product", "correct": false}], "maxAttempts": 2, "hintText": "In aqueous solution, water provides H⁺ ions. H⁺ is easier to reduce than Na⁺ (sodium is very reactive). So H₂ forms at the cathode.", "feedbackCorrect": "H₂ at cathode — H⁺ + e⁻ → H (×2 → H₂). Sodium remains in solution as Na⁺.", "feedbackWrong": "A common mistake is saying ionic bonds involve 'sharing' electrons. Ionic bonds involve the transfer of electrons; covalent bonds involve sharing. In aqueous solution, H⁺ (from water) is preferentially reduced at the cathode: 2H⁺ + 2e⁻ → H₂.", "consequence": "<strong>Aqueous electrolysis of brine produces: H₂ (cathode), Cl₂ (anode), and NaOH in solution — the chlor-alkali process, one of the most important industrial reactions in chemistry.</strong>", "next": "end", "nextWrong": "end", "examTip": "In the exam, draw dot-and-cross diagrams to support your answer. State whether electrons are transferred or shared.", "bloomsLevel": "Analyse"}], "ending": {"title": "Electrolysis Complete", "perfect": "Excellent electrolysis — you identified cathode/anode products for both molten and aqueous NaCl and explained oxidation/reduction.", "partial": "Good work. Cathode (−) = reduction = cations gain electrons. Anode (+) = oxidation = anions lose electrons.", "topic": "You practised electrolysis of ionic compounds (molten and aqueous) and half-equations for electrode reactions.", "retry": "Switch on the current again — electrolysis is fundamental to industrial chemistry."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
<!-- Reading progress bar (site-wide story upgrade) -->
<div id="aism-readbar" aria-hidden="true" style="position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#2d8f5a,#7b6fff);z-index:9999;pointer-events:none;"></div>
<script>
(function () {
  var bar = document.getElementById('aism-readbar');
  if (!bar) return;
  var ticking = false;
  function update() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    if (max <= 0) { bar.style.width = '0'; return; }
    var pct = Math.min(100, Math.max(0, (window.scrollY || doc.scrollTop) / max * 100));
    bar.style.width = pct + '%';
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>
