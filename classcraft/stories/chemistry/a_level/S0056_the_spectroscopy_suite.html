<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClassCraft — The Spectroscopy Suite</title>
  <link rel="stylesheet" href="../../../style.css"/>
  <style>
/* ═══════════════════════════════════════════════
       SCIENCE STORY ENGINE — style layer
       All visual decisions live here.
       Story authors never touch this section.
    ═══════════════════════════════════════════════ */

    .story-wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.25rem 6rem;
    }

    @media (min-width: 768px) {
      .story-wrap { padding: 5rem 2rem 8rem; }
    }

    /* ── Progress ── */
    .progress-track {
      height: 2px;
      background: var(--parchment-deep);
      margin-bottom: 2.5rem;
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      width: 0%;
    }

    /* ── Panel transitions ── */
    .panel {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .panel.in { opacity: 1; transform: translateY(0); }

    /* ── Typography ── */
    .eyebrow {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.5rem;
    }

    .story-h {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      font-weight: 300;
      line-height: 1.12;
      margin-bottom: 1.75rem;
      color: var(--ink);
    }

    .story-prose {
      font-size: 1.05rem;
      line-height: 1.88;
      color: var(--ink-mid);
    }
    .story-prose p { margin-bottom: 1.1em; max-width: 100%; }
    .story-prose p:last-child { margin-bottom: 0; }
    .story-prose strong { color: var(--ink); font-weight: 500; }
    .story-prose em { font-style: italic; }

    /* ── Scene illustration ── */
    .scene {
      width: 100%;
      aspect-ratio: 16 / 6;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.75rem;
    }
    .scene svg { width: 100%; height: 100%; }

    /* ── Knowledge callout ── */
    .fact-box {
      border-left: 3px solid var(--accent);
      background: var(--parchment-mid);
      padding: 1.1rem 1.3rem;
      margin: 1.75rem 0;
      border-radius: 0 3px 3px 0;
    }
    .fact-box .fact-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.45rem;
    }
    .fact-box p {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.65;
      margin: 0;
      max-width: 100%;
    }

    /* ── Formula display ── */
    .formula-box {
      background: var(--parchment-deep);
      border: 1px solid rgba(139,94,60,0.2);
      border-radius: 3px;
      padding: 1.25rem 1.5rem;
      margin: 1.75rem 0;
      text-align: center;
    }
    .formula-box .formula-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.75rem;
    }
    .formula-box .formula-main {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 0.5rem;
    }
    .formula-box .formula-vars {
      font-size: 0.8rem;
      color: var(--ink-mid);
      line-height: 1.7;
    }

    /* ── Worked example ── */
    .worked {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 3px;
      padding: 1.1rem 1.3rem;
      margin: 1.75rem 0;
    }
    .worked-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      display: block;
      margin-bottom: 0.6rem;
    }
    .worked-steps {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.85;
      margin: 0;
      max-width: 100%;
    }
    .worked-steps strong { color: var(--ink); font-weight: 500; }

    /* ── Answer input zone ── */
    .answer-zone {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
    }

    .answer-prompt {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink);
      margin-bottom: 1.1rem;
    }

    /* Numeric input */
    .answer-numeric {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .answer-numeric input[type="number"] {
      width: 120px;
      padding: 0.7rem 0.9rem;
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .answer-numeric input::-webkit-inner-spin-button,
    .answer-numeric input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .answer-numeric input:focus { border-color: var(--accent); }
    .answer-unit {
      font-size: 0.9rem;
      color: var(--ink-mid);
      font-style: italic;
    }

    /* MCQ choices */
    .mcq-choices {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .mcq-btn {
      width: 100%;
      text-align: left;
      padding: 0.9rem 1.1rem;
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--ink-mid);
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
      position: relative;
    }
    .mcq-btn::before {
      content: '→';
      margin-right: 0.55rem;
      color: var(--accent-light);
      display: inline-block;
      transition: transform 0.15s;
    }
    .mcq-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--parchment);
      color: var(--ink);
      transform: translateX(4px);
    }
    .mcq-btn:hover:not(:disabled)::before { transform: translateX(4px); }
    .mcq-btn:disabled { cursor: default; }

    /* Submit button */
    .submit-btn {
      margin-top: 0.85rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .submit-btn:hover { background: var(--ink); color: var(--parchment); }
    .submit-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Feedback states ── */
    .feedback {
      display: none;
      margin-top: 1.1rem;
      padding: 1rem 1.2rem;
      border-radius: 3px;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: #eef6e8;
      border: 1px solid #7aad4a;
      color: #2d5a0f;
    }
    .feedback.wrong {
      background: #fbefef;
      border: 1px solid #c97a7a;
      color: #5c1a1a;
    }
    .feedback.hint {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      color: var(--ink-mid);
    }
    .feedback .fb-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
      opacity: 0.75;
    }

    /* ── Consequence story beat ── */
    .consequence {
      display: none;
      margin-top: 1.25rem;
      padding: 1.1rem 1.3rem;
      background: var(--parchment-mid);
      border-left: 3px solid var(--accent-light);
      border-radius: 0 3px 3px 0;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--ink-mid);
      font-style: italic;
    }
    .consequence.show { display: block; }
    .consequence strong { font-style: normal; color: var(--ink); font-weight: 500; }

    /* ── Attempts tracker ── */
    .attempts-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }
    .attempt-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--parchment-deep);
      border: 1px solid var(--parchment-deep);
      transition: background 0.2s;
    }
    .attempt-pip.used { background: var(--accent-light); border-color: var(--accent-light); }
    .attempt-pip.wrong-pip { background: #c97a7a; border-color: #c97a7a; }
    .attempts-label {
      font-size: 0.72rem;
      color: var(--ink-light);
      letter-spacing: 0.06em;
    }

    /* ── Continue button ── */
    .continue-btn {
      display: none;
      margin-top: 1.4rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .continue-btn.show { display: inline-block; }
    .continue-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── Intro screen ── */
    .intro { text-align: center; }
    .intro .meta-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.5rem 0 2rem;
    }
    .meta-tag {
      font-size: 0.67rem;
      font-weight: 500;
      padding: 0.28rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--rule);
      color: var(--ink-mid);
      letter-spacing: 0.05em;
    }
    .start-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.9rem 2.1rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .start-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── End screen ── */
    .end-screen { display: none; }
    .end-screen.show { display: block; }
    .end-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--rule);
      padding: 0.35rem 1rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    .score-display {
      font-family: var(--font-display);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1;
      margin: 1rem 0 0.25rem;
    }
    .score-label {
      font-size: 0.8rem;
      color: var(--ink-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .score-summary {
      font-size: 0.95rem;
      color: var(--ink-mid);
      line-height: 1.75;
      max-width: 52ch;
      margin: 1.5rem auto 2rem;
    }
    .question-review {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      font-size: 0.85rem;
      color: var(--ink-mid);
      line-height: 1.5;
    }
    .review-icon { flex-shrink: 0; font-size: 1rem; }
    .restart-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.85rem 1.75rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .restart-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── Hint toggle ── */
    .hint-toggle {
      font-size: 0.75rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-top: 0.5rem;
      display: inline-block;
    }
  </style>
</head>

  <script>const STORY_DATA = {"meta": {"title": "The Spectroscopy Suite", "subtitle": "Every peak tells a story. Read the spectrum, identify the compound.", "subject": "Chemistry", "topic": "NMR & IR Spectroscopy", "level": "A-Level", "tags": ["⚗️ Chemistry", "A-Level", "NMR & IR Spectroscopy", "~10 min", "3 questions"], "intro": "A pharmaceutical company has synthesised a new compound. To confirm its structure, the analytical chemist runs NMR and IR spectroscopy. Using the spectra and your knowledge of chemical shifts and functional group absorptions, you can confirm the structure is correct."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#706860'/><rect x='100' y='80' width='500' height='100' fill='#8a7868'/><rect x='0' y='230' width='700' height='32' fill='#706860'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#8a7868'/><path d='M600,180 L500,180 L490,40 L480,180 L200,180 L190,60 L180,180 L60,180' stroke='#c0b8a8' stroke-width='2' fill='none'/><line x1='60' y1='200' x2='640' y2='200' stroke='#b0a898' stroke-width='1'/><line x1='60' y1='200' x2='60' y2='40' stroke='#b0a898' stroke-width='1'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#a09080'/><rect x='100' y='80' width='500' height='100' fill='#8a7868'/><rect x='0' y='230' width='700' height='32' fill='#706860'/></svg>"}, "nodes": [{"id": "intro_scene", "type": "story", "chapter": "Mission Briefing", "title": "Structure Confirmation", "scene": "scene1", "body": "<p>The compound is ethanol (CH₃CH₂OH). The IR spectrum and ¹H NMR spectrum must be interpreted to confirm this.</p><p>IR spectroscopy identifies functional groups from absorption wavenumbers. ¹H NMR identifies chemical environments of hydrogen atoms from chemical shift (δ, ppm) and spin-spin splitting patterns.</p>", "factBox": {"label": "Spectroscopy principles", "text": "IR: identifies functional groups by wavenumber of absorption (e.g. O-H: 2500–3300 broad, C=O: ~1700). ¹H NMR: chemical shift indicates environment (e.g. OH: δ 1–5, CH₃ adjacent to OH: δ ~1.2). Integration = number of H. Splitting: n adjacent H → n+1 lines."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "mcq", "chapter": "Question 1 of 3 — IR Absorption", "title": "The IR spectrum shows a broad absorption at 2500–3300 cm⁻¹. What functional group is this?", "scene": "scene2", "body": "<p>A broad, strong absorption is visible between 2500 and 3300 cm⁻¹ in the IR spectrum.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What functional group gives a broad IR absorption at 2500–3300 cm⁻¹?", "options": [{"text": "Carboxylic acid O-H (−COOH) — the broad O-H stretch in carboxylic acids appears in this region", "correct": true}, {"text": "Alcohol O-H (−OH) — alcohol O-H is broader still at 3200–3550 cm⁻¹", "correct": false}, {"text": "C=O carbonyl — carbonyl appears at ~1700 cm⁻¹, not 2500–3300", "correct": false}, {"text": "C-H bonds — C-H stretches appear at 2850–3100 cm⁻¹ (moderate)", "correct": false}], "maxAttempts": 2, "hintText": "Broad O-H absorptions appear in two regions: alcohol O-H (3200–3550, very broad) and carboxylic acid O-H (2500–3300, extra broad and characteristic).", "feedbackCorrect": "Carboxylic acid O-H — the exceptionally broad absorption from 2500–3300 is a hallmark of -COOH.", "feedbackWrong": "A common mistake is not using correct chemical terminology. Precision matters — 'atoms' vs 'molecules' vs 'ions' are not interchangeable. 2500–3300 cm⁻¹ broad = carboxylic acid O-H stretch. Alcohol O-H appears 3200–3550 cm⁻¹.", "consequence": "<strong>Carboxylic acid confirmed in the IR spectrum. The compound contains −COOH.</strong>", "next": "bridge1", "nextWrong": "bridge1", "examTip": "In the exam, use precise chemical terminology and always reference the data provided. Define key terms before applying them.", "bloomsLevel": "Evaluate"}, {"id": "bridge1", "type": "story", "chapter": "Act II — NMR Splitting", "title": "Spin-Spin Coupling", "scene": "scene2", "body": "<p>The ¹H NMR of ethanol shows three signals: δ ~1.2 (triplet, 3H), δ ~3.7 (quartet, 2H), δ ~2.6 (singlet, 1H).</p><p>The n+1 rule: a signal splits into (n+1) lines where n = number of adjacent H on neighbouring carbons.</p>", "factBox": {"label": "NMR splitting patterns", "text": "n+1 rule: n adjacent H → n+1 peaks. Singlet (1): no adjacent H. Doublet (2): 1 adjacent H. Triplet (3): 2 adjacent H. Quartet (4): 3 adjacent H. Integration ratios = number of H in each environment."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "mcq", "chapter": "Question 2 of 3 — NMR Interpretation", "title": "A triplet in ¹H NMR means how many adjacent protons?", "scene": "scene2", "body": "<p>The CH₃ group in ethanol shows as a triplet. Using the n+1 rule: triplet = 3 lines = (n+1) = 3 → n = ?</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "A triplet (3 lines) indicates how many adjacent protons?", "options": [{"text": "2 adjacent protons — n+1 = 3 → n = 2", "correct": true}, {"text": "3 adjacent protons — the number of lines equals the number of adjacent H", "correct": false}, {"text": "1 adjacent proton — triplet means 3 protons total", "correct": false}, {"text": "0 adjacent protons — no coupling means triplet", "correct": false}], "maxAttempts": 2, "hintText": "n+1 rule: (n+1) lines where n = adjacent H. Triplet = 3 lines → 3 = n+1 → n = 2.", "feedbackCorrect": "2 adjacent protons — triplet (3 lines) from 2 neighbouring H (the CH₂ group).", "feedbackWrong": "A common mistake is not using correct chemical terminology. Precision matters — 'atoms' vs 'molecules' vs 'ions' are not interchangeable. Triplet = 3 lines = n+1 = 3 → n = 2 adjacent protons.", "consequence": "<strong>Triplet at δ 1.2 from 3H (CH₃) adjacent to 2H (CH₂). Consistent with ethanol structure.</strong>", "next": "bridge2", "nextWrong": "bridge2", "examTip": "In the exam, use precise chemical terminology and always reference the data provided. Define key terms before applying them.", "bloomsLevel": "Evaluate"}, {"id": "bridge2", "type": "story", "chapter": "Act III — Chemical Shift", "title": "Where Are the Protons?", "scene": "scene3", "body": "<p>Chemical shift (δ) in NMR reveals the electronic environment. Protons near electronegative groups (O, N) are deshielded and appear at higher δ. Alkyl protons (far from electronegative groups) appear at low δ (~0–2 ppm).</p>", "factBox": null, "formulaBox": {"label": "Key chemical shifts", "formula": "TMS = 0 ppm (reference) · Alkyl C-H: 0.5–2 · O-CH: 3–5 · Aldehyde CHO: 9–10 · COOH: 10–13", "vars": "Higher δ = more deshielded (near electronegative groups)"}, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Chemical Shift", "title": "Which proton in ethanol (CH₃CH₂OH) appears at the highest chemical shift?", "scene": "scene3", "body": "<p>Ethanol: CH₃ (δ~1.2), CH₂ (δ~3.7), OH (δ~2.6). Consider which is closest to electronegative oxygen.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "Which proton in ethanol is most deshielded (highest δ)?", "options": [{"text": "CH₂ (δ~3.7) — directly attached to electronegative oxygen, most deshielded", "correct": true}, {"text": "CH₃ (δ~1.2) — furthest from oxygen, most shielded", "correct": false}, {"text": "OH (δ~2.6) — oxygen's own hydrogen has intermediate shift", "correct": false}, {"text": "All protons have the same shift in ethanol", "correct": false}], "maxAttempts": 2, "hintText": "Deshielding increases with proximity to electronegative atoms. O-CH₂ is directly bonded to O; CH₃ is further away.", "feedbackCorrect": "CH₂ at δ~3.7 — directly bonded to oxygen, maximally deshielded. CH₃ at δ~1.2 (shielded, far from O).", "feedbackWrong": "A common mistake is   <script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `ClassCraft — ${S.meta.title}`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
