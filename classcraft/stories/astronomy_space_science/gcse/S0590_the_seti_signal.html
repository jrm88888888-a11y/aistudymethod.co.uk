<script>const STORY_DATA = {"meta": {"title": "The SETI Signal", "subtitle": "Are we alone? The answer may depend on one equation.", "subject": "Astronomy & Space Science", "topic": "Search for Extraterrestrial Life", "level": "GCSE", "tags": ["🔭 Astronomy", "GCSE · Year 10–11", "SETI & Drake Equation", "~10 min", "3 questions"], "intro": "A radio telescope has detected a suspicious signal from a nearby star. Before you get excited, you need to understand the probability of detecting alien civilisations. The Drake Equation provides a framework for estimating how many communicating civilisations might exist in our galaxy."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#706860'/><rect x='190' y='80' width='20' height='100' fill='#8a7868'/><ellipse cx='200' cy='80' rx='60' ry='20' fill='none' stroke='#b0a898' stroke-width='1.5'/><ellipse cx='200' cy='80' rx='40' ry='13' fill='none' stroke='#b0a898' stroke-width='1'/><rect x='0' y='180' width='400' height='70' fill='#8a7868'/><circle cx='350' cy='50' r='2' fill='#c8b8a8'/><circle cx='50' cy='40' r='2' fill='#c8b8a8'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#706860'/><circle cx='200' cy='125' r='80' fill='#8a7868'/><circle cx='200' cy='125' r='60' fill='#a09080'/><circle cx='200' cy='125' r='40' fill='#8a7868'/><circle cx='200' cy='125' r='5' fill='#c8b8a8'/><circle cx='230' cy='110' r='2' fill='#c8b8a8'/><circle cx='170' cy='140' r='2' fill='#c8b8a8'/><circle cx='250' cy='130' r='2' fill='#c8b8a8'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#706860'/><circle cx='100' cy='125' r='30' fill='#a09080'/><circle cx='300' cy='125' r='30' fill='#a09080'/><line x1='130' y1='110' x2='270' y2='110' stroke='#c8b8a8' stroke-width='1' stroke-dasharray='8,4'/><line x1='130' y1='140' x2='270' y2='140' stroke='#c8b8a8' stroke-width='1' stroke-dasharray='8,4'/><circle cx='100' cy='125' r='5' fill='#c8b8a8'/><circle cx='300' cy='125' r='5' fill='#c8b8a8'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "The Drake Equation", "title": "Estimating Alien Civilisations", "scene": "scene1", "body": "<p>In 1961, astronomer Frank Drake proposed an equation to estimate the number of communicating civilisations in our galaxy. The equation multiplies together several factors, from star formation rates to the lifespan of civilisations.</p>", "factBox": {"label": "The Drake Equation factors", "text": "N = R* × f_p × n_e × f_l × f_i × f_c × L. R* = rate of star formation; f_p = fraction with planets; n_e = habitable planets per star; f_l = fraction where life develops; f_i = fraction with intelligence; f_c = fraction that communicate; L = communication lifespan."}, "formulaBox": {"label": "The Drake Equation", "formula": "N = R* × f_p × n_e × f_l × f_i × f_c × L", "vars": "N = number of communicating civilisations in our galaxy"}, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Drake Equation", "title": "How Many Civilisations?", "scene": "scene2", "body": "<p>Use these estimates: R* = <strong>1</strong> star/year, f_p = <strong>0.5</strong>, n_e = <strong>2</strong>, f_l = <strong>0.1</strong>, f_i = <strong>0.01</strong>, f_c = <strong>0.1</strong>, L = <strong>10,000</strong> years.</p><p>Calculate N.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Multiply step by step:</p><p>1 × 0.5 = 0.5</p><p>0.5 × 2 = 1</p><p>1 × 0.1 = 0.1</p><p>0.1 × 0.01 = 0.001</p><p>0.001 × 0.1 = 0.0001</p><p>0.0001 × 10,000 = ?</p>"}, "question": "How many communicating civilisations (N)?", "unit": "civilisations", "answer": 1, "tolerance": 0, "maxAttempts": 2, "hintText": "Follow the chain: 1 × 0.5 × 2 × 0.1 × 0.01 × 0.1 × 10000. Work left to right: 0.5 → 1 → 0.1 → 0.001 → 0.0001 → 1.", "feedbackCorrect": "N = 1 — with these estimates, we might be the only communicating civilisation in the galaxy right now.", "feedbackWrong": "A common mistake is confusing similar astronomical terms. Be precise — a 'solar system' is not the same as a 'galaxy' or a 'universe'. The answer is 1. Multiply through: 1 × 0.5 × 2 × 0.1 × 0.01 × 0.1 × 10,000 = 1.", "consequence": "<strong>Just one civilisation — perhaps us.</strong> But the answer depends heavily on the value of L, the communication lifespan.", "next": "mid1", "nextWrong": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "Act II — The L Factor", "title": "Civilisation Lifespan Matters Most", "scene": "scene2", "body": "<p>The most uncertain — and most impactful — factor in the Drake Equation is <strong>L</strong>, the average lifespan of a communicating civilisation. If civilisations typically last much longer than 10,000 years, N could be much larger.</p><p>What if L = <strong>1,000,000 years</strong> instead?</p>", "factBox": {"label": "The importance of L", "text": "L is the factor that changes N most dramatically. If civilisations are long-lived, the galaxy could be teeming with them. If they typically destroy themselves quickly, the galaxy may be silent."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Changing L", "title": "Long-Lived Civilisations", "scene": "scene2", "body": "<p>With L = 10,000 years, N = 1. If L increases to <strong>1,000,000 years</strong> (100 times larger), all other factors stay the same. What is the new N?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "Structure your working", "steps": "<p>N is directly proportional to L.</p><p>L increased by a factor of 1,000,000 / 10,000 = 100.</p><p>New N = old N × 100 = ?</p>"}, "question": "How many civilisations if L = 1,000,000 years?", "unit": "civilisations", "answer": 100, "tolerance": 0, "maxAttempts": 2, "hintText": "N scales linearly with L. 1,000,000 ÷ 10,000 = 100. So N = 1 × 100 = 100.", "feedbackCorrect": "100 civilisations — the galaxy goes from lonely to populated, just by changing one factor.", "feedbackWrong": "A common mistake is confusing similar astronomical terms. Be precise — a 'solar system' is not the same as a 'galaxy' or a 'universe'. The answer is 100. N is proportional to L: if L increases 100-fold, so does N.", "consequence": "<strong>100 civilisations in our galaxy.</strong> The question of whether we are alone may come down to how long civilisations survive.", "next": "mid2", "nextWrong": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "Act III — The Fermi Paradox", "title": "Where Is Everybody?", "scene": "scene3", "body": "<p>If the Drake Equation suggests there could be many civilisations, why haven't we detected any? This is the <strong>Fermi Paradox</strong> — the apparent contradiction between the high probability of alien civilisations and the lack of evidence for them.</p><p>Possible explanations range from the 'Great Filter' (civilisations destroy themselves) to the idea that the galaxy is simply too vast for signals to reach us.</p>", "factBox": {"label": "Proposed solutions", "text": "There are dozens of proposed solutions: civilisations might be too far apart, too short-lived, too different to recognise, deliberately hiding, or simply not interested in communication. No solution is universally accepted."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — The Drake Equation", "title": "Strengths and Weaknesses", "scene": "scene3", "body": "<p>What is the main limitation of the Drake Equation?</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is the biggest weakness of the Drake Equation?", "options": [{"text": "It only applies to our Solar System, not other star systems", "correct": false}, {"text": "Most of its factors are poorly constrained, so estimates vary enormously depending on assumptions", "correct": true}, {"text": "It has been mathematically disproven", "correct": false}, {"text": "It does not include the possibility of intelligent life", "correct": false}], "maxAttempts": 2, "hintText": "We showed that changing just one factor (L) changed N from 1 to 100. How well do we actually know these factors?", "feedbackCorrect": "Correct — the Drake Equation is a useful framework, but most of its factors are highly uncertain, making precise estimates impossible.", "feedbackWrong": "A common mistake is confusing similar astronomical terms. Be precise — a 'solar system' is not the same as a 'galaxy' or a 'universe'. The main weakness is that most factors (especially f_l, f_i, f_c, and L) are poorly known, so N can range from less than 1 to millions depending on assumptions.", "consequence": "<strong>The Drake Equation asks the right questions</strong> — even if we cannot yet answer them with certainty. The search continues.", "next": "end", "nextWrong": "end", "examTip": "In the exam, use precise scientific terminology and include scale or distance values where relevant. Compare objects using quantitative data, not just qualitative descriptions.", "bloomsLevel": "Analyse"}], "ending": {"title": "Mission Complete", "perfect": "Excellent analysis. You calculated N using the Drake Equation, explored how L dominates the result, and identified the equation's limitations.", "partial": "Good work — review how multiplying several small fractions works and why L has such a large impact on N.", "retry": "Try again to master the Drake Equation and the search for extraterrestrial intelligence.", "topic": "The Drake Equation (N = R* × f_p × n_e × f_l × f_i × f_c × L), the importance of civilisation lifespan, and the Fermi Paradox."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
<!-- Reading progress bar (site-wide story upgrade) -->
<div id="aism-readbar" aria-hidden="true" style="position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#2d8f5a,#7b6fff);z-index:9999;pointer-events:none;"></div>
<script>
(function () {
  var bar = document.getElementById('aism-readbar');
  if (!bar) return;
  var ticking = false;
  function update() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    if (max <= 0) { bar.style.width = '0'; return; }
    var pct = Math.min(100, Math.max(0, (window.scrollY || doc.scrollTop) / max * 100));
    bar.style.width = pct + '%';
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>
