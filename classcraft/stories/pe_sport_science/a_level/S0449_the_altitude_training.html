<script>const STORY_DATA = {"meta": {"title": "The Altitude Training", "subtitle": "Thinner air, more red blood cells — but does altitude training actually work?", "subject": "PE & Sport Science", "topic": "Altitude & Physiological Adaptation", "level": "A-Level", "tags": ["🏃 PE & Sport Science", "A-Level", "Altitude & Physiological Adaptation", "~10 min", "3 questions"], "intro": "You are the head of sports science for a national athletics federation. The 10,000m squad is debating whether to invest in a 4-week altitude training camp. You must evaluate the evidence and present a recommendation."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><polygon points='0,250 120,80 200,120 280,50 400,200 400,250' fill='#8a7868'/><polygon points='0,250 80,150 160,180 250,100 350,160 400,250' fill='#a09080'/><rect x='0' y='230' width='400' height='20' fill='#706860'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='40' y='30' width='320' height='170' fill='#8a7868'/><rect x='50' y='40' width='300' height='150' fill='#b0a898'/><line x1='80' y1='175' x2='330' y2='175' stroke='#706860' stroke-width='2'/><line x1='80' y1='175' x2='80' y2='50' stroke='#706860' stroke-width='2'/><rect x='100' y='100' width='50' height='75' fill='#706860'/><rect x='170' y='80' width='50' height='95' fill='#c8b8a8'/><rect x='240' y='70' width='50' height='105' fill='#8a7868'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='190' width='400' height='60' fill='#706860'/><rect x='80' y='50' width='240' height='130' fill='#8a7868'/><rect x='90' y='60' width='220' height='110' fill='#a09080'/><rect x='110' y='80' width='90' height='70' fill='#c8b8a8'/><rect x='210' y='80' width='90' height='70' fill='#706860'/><line x1='200' y1='70' x2='200' y2='160' stroke='#a09080' stroke-width='2'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Altitude Debate", "scene": "scene1", "body": "<p>The coaching staff is divided. Some want a 4-week camp at 2,400m altitude in Kenya. Others think the money would be better spent on facilities at sea level.</p><p><em>\"Altitude training has been used by East African runners for decades. But is there actual evidence it works for athletes who normally live at sea level?\"</em> the head coach asks.</p><p>You present the science: at altitude, the lower <strong>partial pressure of oxygen</strong> triggers the body to produce more <strong>erythropoietin (EPO)</strong>, stimulating red blood cell production.</p>", "factBox": {"label": "Altitude Physiology", "text": "At altitude (typically 2,000-3,000m), the partial pressure of oxygen (PO₂) is lower. The body responds with: increased EPO production (within hours), increased red blood cell production (over 2-4 weeks), increased haemoglobin concentration, increased capillarisation, increased mitochondrial density, and increased 2,3-DPG (which shifts the oxygen-dissociation curve rightward, improving oxygen release to tissues). These adaptations improve oxygen-carrying capacity at sea level for 2-4 weeks after return."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Altitude & Physiological Adaptation", "title": "Oxygen Availability", "scene": "scene2", "body": "<p>At sea level, the partial pressure of oxygen (PO₂) is approximately <strong>159 mmHg</strong>. At 2,400m altitude, PO₂ drops to approximately <strong>118 mmHg</strong>. What is the <strong>percentage decrease</strong> in oxygen availability?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p><strong>% decrease = ((Sea level − Altitude) ÷ Sea level) × 100</strong></p><p>= ((159 − 118) ÷ 159) × 100</p><p>= (41 ÷ 159) × 100 = ?</p>"}, "question": "What is the percentage decrease in PO₂ at 2,400m altitude?", "unit": "%", "answer": 25.8, "tolerance": 0.5, "maxAttempts": 2, "hintText": "The drop is 41 mmHg. Divide by 159 and multiply by 100. 41/159 = 0.258, × 100 = ?", "feedbackCorrect": "25.8% decrease — a significant reduction that the body compensates for by increasing red blood cell production.", "feedbackWrong": "A common mistake is giving generic answers without specific sporting examples. Apply the concept to a named sport, position, or movement. The answer is approximately 25.8%. (41 ÷ 159) × 100 = 25.8%.", "consequence": "<strong>A 25.8% reduction in available oxygen.</strong> <em>\"No wonder runners feel breathless when they first arrive at altitude,\"</em> the coach says. <em>\"But the body adapts.\"</em>", "next": "mid1", "bloomsLevel": "Analyse"}, {"id": "mid1", "type": "story", "chapter": "Training Models", "title": "Live High, Train Low", "scene": "scene2", "body": "<p>You present three altitude training models:</p><p><strong>Live high, train high (LHTH):</strong> Traditional approach — live and train at altitude. Problem: athletes cannot train as intensely due to reduced oxygen.</p><p><strong>Live high, train low (LHTL):</strong> Sleep at altitude to gain haematological adaptations, but descend to train at sea level to maintain training intensity. Considered the gold standard.</p><p><strong>Live low, train high (LLTH):</strong> Using altitude tents or hypoxic chambers for short exposures. Convenient but less effective.</p>", "factBox": {"label": "Live High, Train Low", "text": "The LHTL model was proposed by Levine and Stray-Gundersen (1997). Athletes live at ~2,500m for the EPO/red blood cell response but train at ~1,250m where oxygen is sufficient for high-intensity work. Research shows 1-3% improvement in sea-level endurance performance. The optimal duration is 3-4 weeks minimum. Benefits persist for approximately 2-4 weeks after return to sea level. Individual responses vary — some athletes are 'responders' and others are 'non-responders'."}, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Altitude & Physiological Adaptation", "title": "Red Cell Increase", "scene": "scene2", "body": "<p>After 4 weeks at altitude, a runner's red blood cell count increases from <strong>4.8 million/μL</strong> to <strong>5.3 million/μL</strong>. What is the <strong>percentage increase</strong> in red blood cell count?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p><strong>% increase = ((New − Original) ÷ Original) × 100</strong></p><p>= ((5.3 − 4.8) ÷ 4.8) × 100</p><p>= (0.5 ÷ 4.8) × 100 = ?</p>"}, "question": "What is the percentage increase in red blood cell count?", "unit": "%", "answer": 10.4, "tolerance": 0.5, "maxAttempts": 2, "hintText": "The increase is 0.5 million. Divide by 4.8 and multiply by 100. 0.5/4.8 = 0.1042, × 100 = ?", "feedbackCorrect": "10.4% increase — a meaningful rise in oxygen-carrying capacity that should translate to improved endurance performance.", "feedbackWrong": "A common mistake is giving generic answers without specific sporting examples. Apply the concept to a named sport, position, or movement. The answer is approximately 10.4%. (0.5 ÷ 4.8) × 100 = 10.42%.", "consequence": "<strong>A 10.4% increase in red blood cells.</strong> The coach raises an eyebrow. <em>\"That's a significant adaptation from just four weeks. How long will it last at sea level?\"</em> About 2-4 weeks, you explain.", "next": "mid2", "bloomsLevel": "Analyse"}, {"id": "mid2", "type": "story", "chapter": "The Recommendation", "title": "Cost-Benefit Analysis", "scene": "scene3", "body": "<p>You present the final evidence: altitude training can improve sea-level endurance performance by <strong>1-3%</strong> in responders. However, there are risks: illness at altitude, poor sleep quality, overtraining due to the additional physiological stress, and the cost of travel and accommodation.</p><p>The LHTL model minimises training intensity loss but requires access to both high and low altitude locations.</p>", "factBox": {"label": "Individual Responses", "text": "Not all athletes respond equally to altitude training. 'Responders' show a significant EPO and red blood cell increase; 'non-responders' show minimal change. Factors include: iron status (adequate iron stores are essential for new red blood cell production), baseline haemoglobin (those with lower starting values may respond more), genetic factors (EPO receptor sensitivity varies), and the altitude and duration of exposure."}, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Altitude & Physiological Adaptation", "title": "The Best Model", "scene": "scene3", "body": "<p>The federation must choose one approach. Based on the evidence, which altitude training model offers the best balance of haematological adaptation and training quality?</p>", "question": "Which altitude training model provides the best combination of altitude adaptation and training intensity?", "options": [{"text": "Live high, train high — maximum altitude exposure ensures maximum adaptation", "correct": false}, {"text": "Live high, train low — sleeping at altitude stimulates red blood cell production while training at lower altitude maintains workout intensity", "correct": true}, {"text": "Live low, train high — brief altitude exposures are sufficient and cause no training disruption", "correct": false}, {"text": "No altitude training — the evidence is too weak to justify the expense", "correct": false}], "maxAttempts": 2, "hintText": "The key challenge is gaining altitude adaptations WITHOUT sacrificing training quality. Which model solves both problems?", "feedbackCorrect": "Correct. Live high, train low combines the haematological benefits of altitude exposure (increased EPO, red blood cells) with the ability to maintain high training intensity at lower altitude. It is the model with the strongest research support.", "feedbackWrong": "A common mistake is giving generic answers without specific sporting examples. Apply the concept to a named sport, position, or movement. The correct answer is Live high, train low. This model solves the fundamental problem of LHTH (where training intensity drops due to low oxygen) by allowing athletes to train at lower altitudes while still gaining the red blood cell adaptations from sleeping at height.", "consequence": "<strong>The federation approves a LHTL camp in Kenya.</strong> The squad will sleep at 2,400m and travel down to 1,200m for interval sessions. The science supports the investment.", "next": "end", "examTip": "In the exam, apply theoretical concepts to practical sporting examples. Name specific sports, movements, and muscle groups.", "bloomsLevel": "Evaluate"}], "ending": {"title": "The Altitude Training", "perfect": "Excellent altitude physiology analysis. You calculated oxygen changes, red blood cell adaptations, and evaluated training models with precision. The federation's investment is backed by solid science.", "partial": "Good understanding of altitude training but some percentage calculations need work. Review the physiology of altitude adaptation and the three training models.", "retry": "Want to re-evaluate the altitude evidence?", "topic": "Altitude & Physiological Adaptation"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
<!-- Reading progress bar (site-wide story upgrade) -->
<div id="aism-readbar" aria-hidden="true" style="position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#2d8f5a,#7b6fff);z-index:9999;pointer-events:none;"></div>
<script>
(function () {
  var bar = document.getElementById('aism-readbar');
  if (!bar) return;
  var ticking = false;
  function update() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    if (max <= 0) { bar.style.width = '0'; return; }
    var pct = Math.min(100, Math.max(0, (window.scrollY || doc.scrollTop) / max * 100));
    bar.style.width = pct + '%';
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>
