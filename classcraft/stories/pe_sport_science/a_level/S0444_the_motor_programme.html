<script>const STORY_DATA = {"meta": {"title": "The Motor Programme", "subtitle": "When a well-learned skill goes wrong, motor programme theory explains why.", "subject": "PE & Sport Science", "topic": "Motor Programme Theory", "level": "A-Level", "tags": ["🏃 PE & Sport Science", "A-Level", "Motor Programme Theory", "~10 min", "3 questions"], "intro": "You are a movement analyst working with a national gymnastics squad. A gymnast's vault technique has suddenly deteriorated. Using motor programme theory, you must diagnose the error and propose a solution."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='200' width='400' height='50' fill='#a09080'/><rect x='160' y='140' width='80' height='60' fill='#706860'/><rect x='165' y='145' width='70' height='50' fill='#8a7868'/><rect x='50' y='190' width='300' height='10' fill='#706860'/><rect x='50' y='192' width='300' height='6' fill='#c8b8a8'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='50' y='50' width='300' height='150' fill='#8a7868'/><rect x='60' y='60' width='280' height='130' fill='#b0a898'/><rect x='80' y='80' width='50' height='30' fill='#c8b8a8'/><line x1='130' y1='95' x2='160' y2='95' stroke='#706860' stroke-width='2'/><rect x='160' y='80' width='50' height='30' fill='#706860'/><line x1='210' y1='95' x2='240' y2='95' stroke='#706860' stroke-width='2'/><rect x='240' y='80' width='50' height='30' fill='#c8b8a8'/><line x1='185' y1='110' x2='185' y2='140' stroke='#706860' stroke-width='2'/><rect x='160' y='140' width='50' height='30' fill='#8a7868'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='190' width='400' height='60' fill='#706860'/><rect x='80' y='50' width='240' height='130' fill='#8a7868'/><rect x='90' y='60' width='220' height='110' fill='#a09080'/><circle cx='150' cy='110' r='30' fill='#c8b8a8'/><circle cx='250' cy='110' r='30' fill='#706860'/><line x1='180' y1='110' x2='220' y2='110' stroke='#b0a898' stroke-width='3'/><polygon points='215,105 225,110 215,115' fill='#b0a898'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Failing Vault", "scene": "scene1", "body": "<p>Emma, a 17-year-old gymnast, has been performing the Yurchenko vault successfully for two years. In recent weeks, her technique has broken down — she is under-rotating and landing short.</p><p>Her coach is frustrated. <em>\"She's done this vault thousands of times. Why is it suddenly going wrong?\"</em></p><p>You explain that the answer lies in <strong>motor programme theory</strong> and how the brain stores and executes movement patterns.</p>", "factBox": {"label": "Motor Programme Theory", "text": "A motor programme is a stored pattern of movements in long-term memory. Schmidt's Schema Theory (1975) proposes that movements are controlled by generalised motor programmes (GMPs) with invariant features (sequence, relative timing, relative force) and variable parameters (overall speed, absolute force, limb used). The brain retrieves the GMP and adjusts parameters for the specific situation using two schemas: recall schema (produces movement) and recognition schema (evaluates outcome)."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Motor Programme Theory", "title": "Reaction Time Analysis", "scene": "scene2", "body": "<p>To assess Emma's motor programme execution, you measure her <strong>total response time</strong> during a simulated vault approach. Her <strong>reaction time</strong> (stimulus to initiation) is <strong>0.22 seconds</strong> and her <strong>movement time</strong> (initiation to completion of the hurdle step) is <strong>0.48 seconds</strong>.</p><p>What is her total <strong>response time</strong>?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p><strong>Response time = Reaction time + Movement time</strong></p><p>= 0.22 + 0.48 = ?</p>"}, "question": "What is Emma's total response time?", "unit": "seconds", "answer": 0.7, "tolerance": 0.01, "maxAttempts": 2, "hintText": "Simply add reaction time and movement time: 0.22 + 0.48 = ?", "feedbackCorrect": "0.70 seconds — within normal range. The issue is not in response time but in the execution parameters of the motor programme.", "feedbackWrong": "A common mistake is giving generic answers without specific sporting examples. Apply the concept to a named sport, position, or movement. The answer is 0.70 seconds. Response time = 0.22 + 0.48 = 0.70 s.", "consequence": "<strong>0.70 seconds.</strong> Her response time is normal. <em>\"So the programme is being initiated correctly,\"</em> you note. <em>\"The problem must be in the parameters — the speed, force, or timing within the movement.\"</em>", "next": "mid1", "bloomsLevel": "Analyse"}, {"id": "mid1", "type": "story", "chapter": "Diagnosing the Error", "title": "Invariant vs Variable", "scene": "scene2", "body": "<p>You analyse video of Emma's vault. The <strong>invariant features</strong> — the sequence of actions (run, hurdle, roundoff, back handspring, flight, landing) — are intact. She is performing the correct movements in the correct order.</p><p>The problem is in the <strong>variable parameters</strong>: she has lost confidence and is unconsciously reducing her approach speed, which means she arrives at the vault table with insufficient momentum for full rotation.</p>", "factBox": {"label": "Invariant vs Variable Features", "text": "Invariant features are fixed within a GMP and do not change regardless of the situation: the order/sequence of movements, the relative timing of each phase, and the relative force between muscle groups. Variable parameters are adjusted for each execution: overall duration/speed, absolute force, the specific muscles or limbs used. When a well-learned skill breaks down, the cause is usually incorrect parameter selection rather than a corrupted motor programme."}, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Motor Programme Theory", "title": "Approach Speed", "scene": "scene2", "body": "<p>Video analysis shows Emma's approach speed has dropped from <strong>7.8 m/s</strong> (when successful) to <strong>6.9 m/s</strong> (current). What is the <strong>percentage decrease</strong> in her approach speed?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p><strong>% decrease = ((Original − Current) ÷ Original) × 100</strong></p><p>= ((7.8 − 6.9) ÷ 7.8) × 100</p><p>= (0.9 ÷ 7.8) × 100 = ?</p>"}, "question": "What is the percentage decrease in Emma's approach speed?", "unit": "%", "answer": 11.5, "tolerance": 0.5, "maxAttempts": 2, "hintText": "The drop is 0.9 m/s. Divide by the original (7.8) and multiply by 100. 0.9 ÷ 7.8 = 0.1154, × 100 ≈ ?", "feedbackCorrect": "Approximately 11.5% decrease — a significant reduction that directly explains the under-rotation.", "feedbackWrong": "A common mistake is giving generic answers without specific sporting examples. Apply the concept to a named sport, position, or movement. The answer is approximately 11.5%. (0.9 ÷ 7.8) × 100 = 11.54%.", "consequence": "<strong>An 11.5% speed reduction.</strong> <em>\"That's the smoking gun,\"</em> you tell the coach. <em>\"She's running slower because of anxiety. The motor programme is fine — the parameter input is wrong.\"</em>", "next": "mid2", "bloomsLevel": "Analyse"}, {"id": "mid2", "type": "story", "chapter": "The Fix", "title": "Rebuilding the Schema", "scene": "scene3", "body": "<p>The solution involves retraining the <strong>recall schema</strong> — the stored relationship between movement parameters and outcomes. Emma needs to practise the approach at gradually increasing speeds in a safe environment (pit landing) to rebuild her confidence and recalibrate the speed parameter.</p><p><em>\"So we're not teaching her a new skill — we're reminding her brain of the correct input settings?\"</em> the coach asks.</p><p>Exactly. The motor programme is intact. The parameters just need recalibration.</p>", "factBox": {"label": "Schema Theory and Variability of Practice", "text": "Schema Theory predicts that practising a skill under varied conditions (different speeds, distances, forces) strengthens the schemas and makes the motor programme more adaptable. This is called variability of practice. A gymnast who practises vaults at different approach speeds develops a more robust recall schema, making them better at selecting the correct parameters in competition. This is more effective than practising at one fixed speed."}, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Motor Programme Theory", "title": "The Theory Question", "scene": "scene3", "body": "<p>Before the training session, the coach asks: <em>\"According to Schmidt's Schema Theory, which strategy would best help Emma recalibrate her approach speed parameter?\"</em></p>", "question": "Which strategy best recalibrates a motor programme parameter according to Schema Theory?", "options": [{"text": "Practise the vault at one fixed speed repeatedly until it becomes automatic", "correct": false}, {"text": "Practise at varied approach speeds in a safe environment to strengthen the recall schema through variability of practice", "correct": true}, {"text": "Watch video of other gymnasts performing the vault to develop a new motor programme", "correct": false}, {"text": "Remove all feedback and let Emma figure it out through trial and error alone", "correct": false}], "maxAttempts": 2, "hintText": "Schema Theory emphasises variability of practice — practising under different conditions strengthens the schemas that select movement parameters.", "feedbackCorrect": "Correct. Variability of practice strengthens the recall schema by providing multiple examples of the relationship between parameters (speed) and outcomes (rotation). This makes parameter selection more accurate and adaptable.", "feedbackWrong": "A common mistake is giving generic answers without specific sporting examples. Apply the concept to a named sport, position, or movement. The correct answer is varied practice. Schema Theory specifically advocates variability of practice to strengthen the recall schema. Practising at multiple speeds provides the data the brain needs to recalibrate.", "consequence": "<strong>Emma begins the recalibration programme.</strong> Within two weeks of progressive speed work with pit landings, her approach speed returns to 7.8 m/s and the vault is back to full rotation.", "next": "end", "examTip": "In the exam, apply theoretical concepts to practical sporting examples. Name specific sports, movements, and muscle groups.", "bloomsLevel": "Evaluate"}], "ending": {"title": "The Motor Programme", "perfect": "Exceptional movement analysis. You measured response times, identified the parameter error through percentage calculations, and applied Schema Theory to design an effective intervention. Emma's vault is restored.", "partial": "Good understanding of motor programme theory but some calculations need review. Practise percentage decrease calculations and revisit Schema Theory's key concepts.", "retry": "Want to diagnose the movement error again?", "topic": "Motor Programme Theory"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
