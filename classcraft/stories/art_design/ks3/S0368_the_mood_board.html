<style>
/* ═══════════════════════════════════════════════
       SCIENCE STORY ENGINE — style layer
       All visual decisions live here.
       Story authors never touch this section.
    ═══════════════════════════════════════════════ */

    .story-wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.25rem 6rem;
    }

    @media (min-width: 768px) {
      .story-wrap { padding: 5rem 2rem 8rem; }
    }

    /* ── Progress ── */
    .progress-track {
      height: 2px;
      background: var(--parchment-deep);
      margin-bottom: 2.5rem;
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      width: 0%;
    }

    /* ── Panel transitions ── */
    .panel {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .panel.in { opacity: 1; transform: translateY(0); }

    /* ── Typography ── */
    .eyebrow {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.5rem;
    }

    .story-h {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      font-weight: 300;
      line-height: 1.12;
      margin-bottom: 1.75rem;
      color: var(--ink);
    }

    .story-prose {
      font-size: 1.05rem;
      line-height: 1.88;
      color: var(--ink-mid);
    }
    .story-prose p { margin-bottom: 1.1em; max-width: 100%; }
    .story-prose p:last-child { margin-bottom: 0; }
    .story-prose strong { color: var(--ink); font-weight: 500; }
    .story-prose em { font-style: italic; }

    /* ── Scene illustration ── */
    .scene {
      width: 100%;
      aspect-ratio: 16 / 6;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.75rem;
    }
    .scene svg { width: 100%; height: 100%; }

    /* ── Knowledge callout ── */
    .fact-box {
      border-left: 3px solid var(--accent);
      background: var(--parchment-mid);
      padding: 1.1rem 1.3rem;
      margin: 1.75rem 0;
      border-radius: 0 3px 3px 0;
    }
    .fact-box .fact-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.45rem;
    }
    .fact-box p {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.65;
      margin: 0;
      max-width: 100%;
    }

    /* ── Formula display ── */
    .formula-box {
      background: var(--parchment-deep);
      border: 1px solid rgba(139,94,60,0.2);
      border-radius: 3px;
      padding: 1.25rem 1.5rem;
      margin: 1.75rem 0;
      text-align: center;
    }
    .formula-box .formula-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.75rem;
    }
    .formula-box .formula-main {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 0.5rem;
    }
    .formula-box .formula-vars {
      font-size: 0.8rem;
      color: var(--ink-mid);
      line-height: 1.7;
    }

    /* ── Worked example ── */
    .worked {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 3px;
      padding: 1.1rem 1.3rem;
      margin: 1.75rem 0;
    }
    .worked-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      display: block;
      margin-bottom: 0.6rem;
    }
    .worked-steps {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.85;
      margin: 0;
      max-width: 100%;
    }
    .worked-steps strong { color: var(--ink); font-weight: 500; }

    /* ── Answer input zone ── */
    .answer-zone {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
    }

    .answer-prompt {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink);
      margin-bottom: 1.1rem;
    }

    /* Numeric input */
    .answer-numeric {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .answer-numeric input[type="number"] {
      width: 120px;
      padding: 0.7rem 0.9rem;
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .answer-numeric input::-webkit-inner-spin-button,
    .answer-numeric input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .answer-numeric input:focus { border-color: var(--accent); }
    .answer-unit {
      font-size: 0.9rem;
      color: var(--ink-mid);
      font-style: italic;
    }

    /* MCQ choices */
    .mcq-choices {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .mcq-btn {
      width: 100%;
      text-align: left;
      padding: 0.9rem 1.1rem;
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--ink-mid);
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
      position: relative;
    }
    .mcq-btn::before {
      content: '→';
      margin-right: 0.55rem;
      color: var(--accent-light);
      display: inline-block;
      transition: transform 0.15s;
    }
    .mcq-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--parchment);
      color: var(--ink);
      transform: translateX(4px);
    }
    .mcq-btn:hover:not(:disabled)::before { transform: translateX(4px); }
    .mcq-btn:disabled { cursor: default; }

    /* Submit button */
    .submit-btn {
      margin-top: 0.85rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .submit-btn:hover { background: var(--ink); color: var(--parchment); }
    .submit-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Feedback states ── */
    .feedback {
      display: none;
      margin-top: 1.1rem;
      padding: 1rem 1.2rem;
      border-radius: 3px;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: #eef6e8;
      border: 1px solid #7aad4a;
      color: #2d5a0f;
    }
    .feedback.wrong {
      background: #fbefef;
      border: 1px solid #c97a7a;
      color: #5c1a1a;
    }
    .feedback.hint {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      color: var(--ink-mid);
    }
    .feedback .fb-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
      opacity: 0.75;
    }

    /* ── Consequence story beat ── */
    .consequence {
      display: none;
      margin-top: 1.25rem;
      padding: 1.1rem 1.3rem;
      background: var(--parchment-mid);
      border-left: 3px solid var(--accent-light);
      border-radius: 0 3px 3px 0;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--ink-mid);
      font-style: italic;
    }
    .consequence.show { display: block; }
    .consequence strong { font-style: normal; color: var(--ink); font-weight: 500; }

    /* ── Attempts tracker ── */
    .attempts-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }
    .attempt-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--parchment-deep);
      border: 1px solid var(--parchment-deep);
      transition: background 0.2s;
    }
    .attempt-pip.used { background: var(--accent-light); border-color: var(--accent-light); }
    .attempt-pip.wrong-pip { background: #c97a7a; border-color: #c97a7a; }
    .attempts-label {
      font-size: 0.72rem;
      color: var(--ink-light);
      letter-spacing: 0.06em;
    }

    /* ── Continue button ── */
    .continue-btn {
      display: none;
      margin-top: 1.4rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .continue-btn.show { display: inline-block; }
    .continue-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── Intro screen ── */
    .intro { text-align: center; }
    .intro .meta-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.5rem 0 2rem;
    }
    .meta-tag {
      font-size: 0.67rem;
      font-weight: 500;
      padding: 0.28rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--rule);
      color: var(--ink-mid);
      letter-spacing: 0.05em;
    }
    .start-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.9rem 2.1rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .start-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── End screen ── */
    .end-screen { display: none; }
    .end-screen.show { display: block; }
    .end-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--rule);
      padding: 0.35rem 1rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    .score-display {
      font-family: var(--font-display);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1;
      margin: 1rem 0 0.25rem;
    }
    .score-label {
      font-size: 0.8rem;
      color: var(--ink-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .score-summary {
      font-size: 0.95rem;
      color: var(--ink-mid);
      line-height: 1.75;
      max-width: 52ch;
      margin: 1.5rem auto 2rem;
    }
    .question-review {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      font-size: 0.85rem;
      color: var(--ink-mid);
      line-height: 1.5;
    }
    .review-icon { flex-shrink: 0; font-size: 1rem; }
    .restart-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.85rem 1.75rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .restart-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── Hint toggle ── */
    .hint-toggle {
      font-size: 0.75rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-top: 0.5rem;
      display: inline-block;
    }
  </style>

<script>const STORY_DATA = {"meta": {"title": "The Mood Board", "subtitle": "A design project needs a mood board to guide the creative direction. Research, select and justify your visual choices.", "subject": "Art & Design", "topic": "Research & Inspiration", "level": "KS3", "tags": ["🎨 Art & Design", "KS3 · Year 7–9", "Research & Inspiration", "~10 min", "3 questions"], "intro": "You are Priya, working on a design project for a new cafe brand. Before any designing begins, your teacher insists on thorough visual research collected on a mood board. The mood board will guide every creative decision — colours, textures, typography and style."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#c8b8a8'/><rect x='20' y='20' width='110' height='80' fill='#8a7868'/><rect x='145' y='20' width='110' height='80' fill='#a09080'/><rect x='270' y='20' width='110' height='80' fill='#706860'/><rect x='20' y='115' width='170' height='60' fill='#b0a898'/><rect x='205' y='115' width='175' height='60' fill='#8a7868'/><rect x='20' y='190' width='80' height='40' fill='#706860'/><rect x='115' y='190' width='80' height='40' fill='#a09080'/><rect x='210' y='190' width='80' height='40' fill='#c8b8a8' stroke='#706860' stroke-width='1'/><rect x='305' y='190' width='75' height='40' fill='#b0a898'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='30' y='30' width='150' height='100' fill='#8a7868'/><circle cx='80' cy='70' r='20' fill='#b0a898'/><rect x='110' y='55' width='50' height='40' fill='#706860'/><rect x='220' y='30' width='150' height='100' fill='#c8b8a8'/><rect x='240' y='50' width='40' height='30' fill='#a09080'/><rect x='300' y='50' width='40' height='30' fill='#8a7868'/><rect x='30' y='150' width='340' height='70' fill='#b0a898'/><circle cx='70' cy='185' r='15' fill='#706860'/><circle cx='120' cy='185' r='15' fill='#8a7868'/><circle cx='170' cy='185' r='15' fill='#a09080'/><circle cx='220' cy='185' r='15' fill='#c8b8a8'/><circle cx='270' cy='185' r='15' fill='#b0a898'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='40' y='20' width='320' height='210' fill='#c8b8a8'/><rect x='60' y='40' width='120' height='80' fill='#8a7868'/><rect x='200' y='40' width='140' height='80' fill='#a09080'/><rect x='60' y='135' width='90' height='75' fill='#706860'/><rect x='165' y='135' width='90' height='75' fill='#b0a898' stroke='#8a7868' stroke-width='1'/><rect x='270' y='135' width='70' height='75' fill='#8a7868'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Cafe Brief", "scene": "scene1", "body": "<p>Your design teacher, Mr Adekunle, hands out the project brief: <em>\"Design a brand identity for a new independent cafe. But before you touch any design software, you must create a mood board.\"</em></p><p>A <strong>mood board</strong> is a visual collage that gathers images, colours, textures, typography samples and other references to establish the creative direction of a project. It communicates the <strong>mood, tone and aesthetic</strong> before any final designs are made.</p><p>Mr Adekunle adds: <em>\"A strong mood board has at least 8–12 carefully chosen visual elements. Every element must justify its place — no random clutter.\"</em></p>", "factBox": {"label": "Mood Board Essentials", "text": "A good mood board typically includes: colour palette swatches (3–5 colours), texture/pattern samples, typography examples, photographic references, material samples, and inspirational imagery. Each element should clearly connect to the project's intended mood and audience. Quality over quantity — every piece must earn its place."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Research & Inspiration", "title": "Colour Palette Selection", "scene": "scene1", "body": "<p>You begin your research by collecting colour references. Your cafe brief specifies a <strong>warm, earthy aesthetic</strong>. You gather images of coffee beans, terracotta pots, autumn leaves and wooden furniture.</p><p>Mr Adekunle says a colour palette for a brand typically uses <strong>5 colours</strong>: 1 dominant, 2 supporting, and 2 accent colours. You've identified <strong>12 potential colours</strong> from your research images.</p><p><em>\"How many colours will you need to eliminate to reach your palette of 5?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Colours collected: 12</p><p>Colours needed: 5</p><p>Colours to eliminate: 12 − 5 = ?</p>"}, "question": "How many colours must you eliminate?", "unit": "colours", "answer": 7, "tolerance": 0, "maxAttempts": 2, "hintText": "Subtract the palette size from your total collection: 12 minus 5.", "feedbackCorrect": "7 colours eliminated — curation is crucial. A mood board isn't about collecting everything; it's about selecting the strongest references.", "feedbackWrong": "A common mistake is describing what you see without analysing how and why the artist made those choices. Focus on the effect of techniques, not just identifying them. The answer is 7. You have 12 colours and need only 5, so 12 − 5 = 7 must go.", "consequence": "<strong>You narrow your palette to five earthy tones.</strong> Warm brown, terracotta, cream, sage green and charcoal. The cafe's personality begins to emerge.", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "Building the Board", "title": "Visual Hierarchy", "scene": "scene2", "body": "<p>With colours chosen, you arrange your mood board. Mr Adekunle explains that mood boards have their own <strong>visual hierarchy</strong> — the most important reference image should be the largest, with supporting elements arranged around it.</p><p>He recommends the <strong>60-30-10 rule</strong> for layout: 60% of the board's visual weight should come from your dominant image/colour, 30% from supporting elements, and 10% from accent details.</p><p>You have a board that measures <strong>50 cm × 40 cm</strong>. Time to calculate the areas.</p>", "factBox": {"label": "The 60-30-10 Rule", "text": "This design principle applies to both colour usage and layout composition. 60% dominant element creates cohesion, 30% supporting elements add visual interest, and 10% accent elements provide contrast and focal points. This ratio creates a balanced, professional-looking design."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Research & Inspiration", "title": "Board Area", "scene": "scene2", "body": "<p>Your mood board is <strong>50 cm × 40 cm</strong>. Using the 60-30-10 rule, the <strong>dominant image</strong> should cover 60% of the total area.</p><p><em>\"What area in square centimetres should the dominant image occupy?\"</em> Mr Adekunle asks.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Total area = 50 × 40 = 2000 cm²</p><p>Dominant area = 60% of 2000</p><p>= 0.6 × 2000 = ?</p>"}, "question": "What area should the dominant image cover?", "unit": "cm²", "answer": 1200, "tolerance": 0, "maxAttempts": 2, "hintText": "First find the total area (50 × 40), then calculate 60% of that total.", "feedbackCorrect": "1200 cm² — that's a substantial area, ensuring your dominant reference sets the tone for the entire board.", "feedbackWrong": "A common mistake is describing what you see without analysing how and why the artist made those choices. Focus on the effect of techniques, not just identifying them. The answer is 1200 cm². Total area = 50 × 40 = 2000 cm². Dominant = 60% of 2000 = 1200 cm².", "consequence": "<strong>You place a large photograph of a rustic coffee counter as the centrepiece.</strong> It dominates the board and immediately communicates the cafe's warm, handcrafted character.", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "Final Review", "title": "Justifying Choices", "scene": "scene3", "body": "<p>The mood board is assembled. Mr Adekunle gathers the class for peer review. Each student must explain <strong>why</strong> their visual choices support the project brief.</p><p><em>\"A mood board without annotations is just a pretty collage,\"</em> he warns. <em>\"You must be able to justify every single element.\"</em></p><p>He tests your understanding of what makes a mood board effective versus just decorative.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Research & Inspiration", "title": "Mood Board Purpose", "scene": "scene3", "body": "<p>Mr Adekunle asks: <em>\"What is the primary purpose of a mood board in the design process?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is the primary purpose of a mood board?", "options": [{"text": "To display as many images as possible to show you've done lots of research", "correct": false}, {"text": "To establish and communicate the visual direction, mood and aesthetic before final designs are created", "correct": true}, {"text": "To create a finished piece of art that can be displayed in a gallery", "correct": false}, {"text": "To copy other designers' work and use it as your own", "correct": false}], "maxAttempts": 2, "hintText": "Think about when a mood board is created — before final designs. What is it guiding?", "feedbackCorrect": "A mood board establishes and communicates visual direction before final design work begins. It's a planning and communication tool, not a finished piece.", "feedbackWrong": "A common mistake is describing what you see without analysing how and why the artist made those choices. Focus on the effect of techniques, not just identifying them. The correct answer is: to establish and communicate the visual direction, mood and aesthetic before final designs are created. It guides all subsequent design decisions.", "consequence": "<strong>You present your mood board confidently.</strong> Every colour, texture and image choice links back to the warm, earthy cafe brief. Mr Adekunle gives a rare nod of approval: <em>\"Now you're ready to design.\"</em>", "next": "end", "examTip": "In the exam, analyse artworks using the four frames: subjective, structural, cultural, and postmodern. Support your analysis with specific visual evidence.", "bloomsLevel": "Understand"}], "ending": {"title": "The Mood Board", "perfect": "Excellent research skills, Priya. Your curated colour palette, calculated layout proportions, and clear understanding of the mood board's purpose set a strong foundation for the cafe brand.", "partial": "Your mood board has potential, though some planning calculations and concepts needed a second look. Keep refining your research and curation skills.", "retry": "Want to try building the mood board again?", "topic": "Research & Inspiration"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
