<script>const STORY_DATA = {"meta": {"title": "The Perspective", "subtitle": "A set designer needs accurate perspective drawings. Calculate vanishing points and angles to build the stage illusion.", "subject": "Art & Design", "topic": "One & Two-Point Perspective", "level": "KS3", "tags": ["🎨 Art & Design", "KS3 · Year 7–9", "Perspective Drawing", "~10 min", "3 questions"], "intro": "You are Alex, assistant set designer for the school play. The director wants a painted backdrop that looks like a long Victorian street stretching into the distance. You must use one-point and two-point perspective to create the illusion of depth on a flat surface."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><line x1='200' y1='125' x2='20' y2='20' stroke='#706860' stroke-width='1'/><line x1='200' y1='125' x2='380' y2='20' stroke='#706860' stroke-width='1'/><line x1='200' y1='125' x2='20' y2='230' stroke='#706860' stroke-width='1'/><line x1='200' y1='125' x2='380' y2='230' stroke='#706860' stroke-width='1'/><circle cx='200' cy='125' r='5' fill='#8a7868'/><line x1='0' y1='125' x2='400' y2='125' stroke='#a09080' stroke-width='1' stroke-dasharray='5,5'/><rect x='60' y='80' width='80' height='100' fill='#8a7868' opacity='0.5'/><rect x='260' y='80' width='80' height='100' fill='#8a7868' opacity='0.5'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><line x1='0' y1='125' x2='400' y2='125' stroke='#706860' stroke-width='1' stroke-dasharray='3,3'/><circle cx='50' cy='125' r='4' fill='#706860'/><circle cx='350' cy='125' r='4' fill='#706860'/><line x1='50' y1='125' x2='150' y2='70' stroke='#8a7868' stroke-width='1'/><line x1='50' y1='125' x2='150' y2='180' stroke='#8a7868' stroke-width='1'/><line x1='350' y1='125' x2='250' y2='70' stroke='#8a7868' stroke-width='1'/><line x1='350' y1='125' x2='250' y2='180' stroke='#8a7868' stroke-width='1'/><rect x='150' y='70' width='100' height='110' fill='none' stroke='#c8b8a8' stroke-width='2'/><line x1='150' y1='70' x2='50' y2='125' stroke='#b0a898' stroke-width='1'/><line x1='250' y1='70' x2='350' y2='125' stroke='#b0a898' stroke-width='1'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='180' width='400' height='70' fill='#706860'/><line x1='200' y1='100' x2='40' y2='180' stroke='#8a7868' stroke-width='2'/><line x1='200' y1='100' x2='360' y2='180' stroke='#8a7868' stroke-width='2'/><rect x='80' y='130' width='50' height='50' fill='#8a7868'/><rect x='160' y='140' width='35' height='40' fill='#a09080'/><rect x='230' y='135' width='40' height='45' fill='#8a7868'/><rect x='300' y='125' width='45' height='55' fill='#a09080'/><circle cx='200' cy='100' r='4' fill='#706860'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Stage Illusion", "scene": "scene1", "body": "<p>The drama hall is empty except for a vast blank canvas stretched across the back of the stage. The director claps her hands: <em>\"Alex, I need a Victorian street that looks like it goes on forever. The audience must believe there's real depth behind those actors.\"</em></p><p>You know the secret: <strong>perspective drawing</strong>. In <strong>one-point perspective</strong>, all parallel lines that recede into the distance converge at a single <strong>vanishing point</strong> on the <strong>horizon line</strong> (the viewer's eye level). This creates the illusion of depth on a flat surface.</p><p>In <strong>two-point perspective</strong>, there are two vanishing points — one on the left and one on the right of the horizon line. This is used when viewing an object at an angle, such as the corner of a building.</p>", "factBox": {"label": "Perspective Basics", "text": "One-point perspective uses 1 vanishing point — ideal for roads, corridors, and railway tracks heading straight away from the viewer. Two-point perspective uses 2 vanishing points — ideal for buildings viewed at a corner angle. Both place vanishing points on the horizon line, which represents the viewer's eye level."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Perspective Drawing", "title": "Vanishing Points", "scene": "scene1", "body": "<p>You sketch the street scene. The road runs straight ahead using <strong>one-point perspective</strong> (1 vanishing point). On either side, buildings are angled to show two walls each, so each building uses <strong>two-point perspective</strong> (2 vanishing points).</p><p>The director asks: <em>\"How many vanishing points in total do you need if the street uses one-point perspective and the two corner buildings each use two-point perspective?\"</em></p><p>Note: buildings on the same side share vanishing points. The street's vanishing point is shared with one of each building's points. So the road VP is shared, each building adds one extra VP.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Street (one-point): 1 vanishing point (centre)</p><p>Left building (two-point): shares the centre VP + 1 new VP on the left = 1 extra</p><p>Right building (two-point): shares the centre VP + 1 new VP on the right = 1 extra</p><p>Total unique vanishing points = 1 + 1 + 1 = ?</p>"}, "question": "How many unique vanishing points are needed in total?", "unit": "points", "answer": 3, "tolerance": 0, "maxAttempts": 2, "hintText": "The centre VP is shared. Each side building adds one extra VP. Count: centre + left + right.", "feedbackCorrect": "3 vanishing points — one centre (for the road), one left (for the left building's side wall), and one right (for the right building's side wall).", "feedbackWrong": "A common mistake is describing what you see without analysing how and why the artist made those choices. Focus on the effect of techniques, not just identifying them. The answer is 3 unique vanishing points. The central VP serves the road and one face of each building. Each building adds one extra VP for its angled wall.", "consequence": "<strong>You mark three points on the horizon line.</strong> The framework for the entire street scene is set with just three dots and a ruler.", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "Building the Scene", "title": "The Horizon Line", "scene": "scene2", "body": "<p>With the vanishing points marked, you begin drawing convergence lines from each point. The buildings take shape — their rooflines and base lines all angle towards the appropriate vanishing point.</p><p>The director peers at your sketch: <em>\"Where exactly is the horizon line? I want the audience to feel like they're standing in the street, not floating above it.\"</em></p><p>You explain that the <strong>horizon line</strong> represents <strong>eye level</strong>. For a person standing on the street, eye level is roughly halfway up the canvas — this gives a natural, ground-level perspective.</p>", "factBox": {"label": "Eye Level", "text": "The horizon line always sits at the viewer's eye level. A low horizon (bottom third) makes buildings tower overhead. A high horizon (upper third) gives a bird's-eye view. For a natural street-level view, the horizon sits near the vertical centre of the composition."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Perspective Drawing", "title": "The Horizon Height", "scene": "scene2", "body": "<p>Your backdrop canvas is <strong>300 cm tall</strong>. You want a natural street-level view, so you'll place the horizon line at exactly <strong>halfway</strong> up the canvas.</p><p><em>\"How many centimetres from the bottom of the canvas should the horizon line be?\"</em> the director asks.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Halfway up a 300 cm canvas:</p><p>Height ÷ 2 = 300 ÷ 2 = ?</p>"}, "question": "How many centimetres from the bottom is the horizon line?", "unit": "cm", "answer": 150, "tolerance": 0, "maxAttempts": 2, "hintText": "Half of 300 is a straightforward division by 2.", "feedbackCorrect": "150 cm from the bottom — exactly halfway. The audience will feel like they're standing right in the middle of the Victorian street.", "feedbackWrong": "A common mistake is describing what you see without analysing how and why the artist made those choices. Focus on the effect of techniques, not just identifying them. The answer is 150 cm. Halfway up a 300 cm canvas = 300 ÷ 2 = 150 cm from the bottom.", "consequence": "<strong>You snap a chalk line across the canvas at 150 cm.</strong> The horizon line is set. Every convergence line in the scene will anchor to this level.", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "Final Detail", "title": "Choosing the Right Perspective", "scene": "scene3", "body": "<p>The street is taking shape beautifully. The road narrows towards the central vanishing point, the buildings recede convincingly, and the lampposts shrink as they march into the distance.</p><p>The director has one final question. She's adding a scene where the audience sees a single building from dead-on — facing the front wall directly, with the road stretching away behind it.</p><p>She needs to know which type of perspective is appropriate for this specific view.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Perspective Drawing", "title": "One or Two Point?", "scene": "scene3", "body": "<p>The director asks: <em>\"If the audience is looking straight at the front face of a building — so the front wall appears flat with no visible side walls — which type of perspective should I use for the road behind it?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "Which perspective type is correct for a straight-on view with a receding road?", "options": [{"text": "Two-point perspective, because all scenes need two vanishing points", "correct": false}, {"text": "One-point perspective, because the road recedes to a single vanishing point directly ahead", "correct": true}, {"text": "Three-point perspective, because the building has height", "correct": false}, {"text": "No perspective is needed — flat scenes don't use vanishing points", "correct": false}], "maxAttempts": 2, "hintText": "When you look straight down a road, all receding lines converge to one point directly ahead. How many vanishing points is that?", "feedbackCorrect": "One-point perspective — when viewing straight ahead, all depth lines converge to a single vanishing point. The front wall stays flat with no perspective distortion.", "feedbackWrong": "A common mistake is describing what you see without analysing how and why the artist made those choices. Focus on the effect of techniques, not just identifying them. The correct answer is one-point perspective. A straight-on view with a road receding directly away uses just one vanishing point on the horizon.", "consequence": "<strong>The backdrop is complete.</strong> Victorian buildings line a cobbled street that stretches convincingly into the distance. At dress rehearsal, the actors gasp — the flat canvas looks three-dimensional.", "next": "end", "examTip": "In the exam, analyse artworks using the four frames: subjective, structural, cultural, and postmodern. Support your analysis with specific visual evidence.", "bloomsLevel": "Understand"}], "ending": {"title": "The Perspective", "perfect": "Brilliant draughtsmanship, Alex. Your understanding of vanishing points, horizon lines, and perspective types created a stage illusion that had the whole audience believing in a Victorian street.", "partial": "The backdrop looks good, though some perspective calculations needed adjusting. Keep practising one-point and two-point perspective and your spatial drawings will sharpen.", "retry": "Want to try designing the stage backdrop again?", "topic": "One & Two-Point Perspective"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
