      letter-spacing: 0.16em;
      text-transform: uppercase;

    .formula-box .formula-main {
      font-family: var(--font-display);

      font-size: 0.8rem;

      font-size: 1.2rem;

      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;

    .answer-unit {
      font-size: 0.9rem;
      color: var(--ink-mid);

      gap: 0.65rem;

      padding: 0.9rem 1.1rem;

      color: var(--accent-light);

      transition: transform 0.15s;

      background: var(--parchment);

    .submit-btn {

      border: 1px solid var(--ink);

      border-radius: 1px;

    .feedback {

      border-radius: 3px;
      font-size: 0.9rem;
      line-height: 1.65;

      color: #2d5a0f;
    }
    .feedback.wrong {
      background: #fbefef;
      border: 1px solid #c97a7a;
      color: #5c1a1a;
    }
    .feedback.hint {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      color: var(--ink-mid);
    }
    .feedback .fb-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
      opacity: 0.75;
    }

    /* ── Consequence story beat ── */
    .consequence {
      display: none;
      margin-top: 1.25rem;
      padding: 1.1rem 1.3rem;
      background: var(--parchment-mid);
      border-left: 3px solid var(--accent-light);
      border-radius: 0 3px 3px 0;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--ink-mid);
      font-style: italic;

    .consequence.show { display: block; }
    .consequence strong { font-style: normal; color: var(--ink); font-weight: 500; }

    .attempt-pip.wrong-pip { background: #c97a7a; border-color: #c97a7a; }
    .attempts-label {
      font-size: 0.72rem;
      color: var(--ink-light);
      letter-spacing: 0.06em;
    }

    .continue-btn {
      display: none;
      margin-top: 1.4rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;

    .intro { text-align: center; }

      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.5rem 0 2rem;

      font-weight: 500;
      padding: 0.28rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--rule);
      color: var(--ink-mid);
      letter-spacing: 0.05em;
    }
    .start-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;

    .end-badge {

      font-size: 0.8rem;
      color: var(--ink-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .score-summary {
      font-size: 0.95rem;
      color: var(--ink-mid);
      line-height: 1.75;
      max-width: 52ch;
      margin: 1.5rem auto 2rem;
    }
    .question-review {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      font-size: 0.85rem;
      color: var(--ink-mid);
      line-height: 1.5;
    }
    .review-icon { flex-shrink: 0; font-size: 1rem; }
    .restart-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;

      margin-top: 0.5rem;
      display: inline-block;
    }

e-width='2'/><line x1='300' y1='160' x2='400' y2='120' stroke='#b0a898' stroke-width='2'/><line x1='400' y1='120' x2='500' y2='90' stroke='#b0a898' stroke-width='2'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='220' width='700' height='42' fill='#706860'/><rect x='200' y='40' width='300' height='170' fill='#8a7868'/><circle cx='280' cy='110' r='30' fill='#a09080'/><circle cx='420' cy='110' r='30' fill='#706860'/><rect x='260' y='150' width='40' height='5' fill='#b0a898'/><rect x='400' y='150' width='40' height='5' fill='#b0a898'/><line x1='310' y1='110' x2='390' y2='110' stroke='#b0a898' stroke-width='2' stroke-dasharray='5,3'/></svg>"}, "nodes": [{"id": "intro_scene", "type": "story", "chapter": "Mission Briefing", "title": "The Child Development Lab", "scene": "scene1", "body": "<p>You enter the Child Development Lab — a bright, observation-friendly space where researchers track every stage of language acquisition. Behind one-way glass, toddlers play with toys while cameras record their speech. On the monitors, transcripts scroll in real time.</p><p><em>\"Children are the most efficient language learners on the planet,\"</em> the lead researcher explains. <em>\"They progress through predictable stages — from babbling to holophrastic speech, from two-word combinations to full sentences. Your task is to calculate the timing and measure the growth.\"</em></p><p>The major stages of acquisition include: <strong>babbling</strong> (6–9 months), <strong>holophrastic/one-word stage</strong> (12 months), <strong>two-word stage</strong> (18 months), <strong>telegraphic stage</strong> (around 24 months), and <strong>post-telegraphic stage</strong> (30+ months).</p>", "factBox": {"label": "Key Concept — Language Acquisition Stages", "text": "Children acquire language in broadly predictable stages. The holophrastic stage (around 12 months) involves single words carrying the meaning of whole sentences. The two-word stage (around 18 months) sees simple combinations like 'mummy go' or 'more juice'. The telegraphic stage (around 24 months) produces longer utterances that omit function words, like 'daddy kick ball'. Each stage shows systematic, rule-governed behaviour — children are not simply imitating adults."}, "formulaBox": {"label": "Difference Calculation", "formula": "Difference = Value A − Value B", "vars": "Express time differences in months"}, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Stage Timing", "title": "The Gap Between Stages", "scene": "scene2", "body": "<p>You examine the developmental timeline. The <strong>telegraphic stage</strong> begins at approximately <strong>24 months</strong> (age 2), when children start producing multi-word utterances that omit function words. The <strong>two-word stage</strong> begins at approximately <strong>18 months</strong> (1.5 years).</p><p><em>\"Calculate the difference in months between the onset of the two-word stage and the telegraphic stage,\"</em> the researcher instructs.</p>", "workedBox": {"label": "How to approach it", "steps": "<p><strong>Step 1:</strong> Identify the two onset times.<br>Telegraphic stage ≈ 24 months · Two-word stage ≈ 18 months</p><p><strong>Step 2:</strong> Subtract.<br>Difference = 24 − 18</p>"}, "question": "What is the difference in months between the onset of the two-word stage and the telegraphic stage?", "unit": "months", "answer": 6, "tolerance": 0, "maxAttempts": 2, "hintText": "Subtract the two-word stage onset (18 months) from the telegraphic stage onset (24 months).", "feedbackCorrect": "Six months. In just half a year, a child progresses from simple two-word combinations to multi-word telegraphic utterances — a remarkable acceleration in linguistic complexity.", "feedbackWrong": "A common mistake is paraphrasing the text instead of analysing it. Focus on how language creates meaning, not just what it says. The answer is ge are like sponges, absorbing vocabulary at a rate that no adult language learner can match.\"</em>", "next": "q3", "bloomsLevel": "Analyse"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Overextension", "title": "The Category Error", "scene": "scene1", "body": "<p>Your quantitative analysis is complete. Now the researcher asks you to define a characteristic feature of early child language that reveals how children are building their mental categories.</p><p><em>\"What is overextension in child language?\"</em> she asks. <em>\"It is one of the most telling features of early semantic development.\"</em></p>", "question": "What is \"overextension\" in child language?", "options": [{"text": "When a child refuses to use a word because they are unsure of its meaning and prefer to point instead", "correct": false}, {"text": "When a child uses a word too broadly — e.g. calling all four-legged animals 'dog' — because they have not yet learned the specific category boundaries", "correct": true}, {"text": "When a child repeats the last word of an adult's sentence as a strategy for maintaining conversation", "correct": false}, {"text": "When a child invents entirely new words that have no connection to the adult language they are acquiring", "correct": false}], "maxAttempts": 2, "hintText": "Overextension is about using a word too widely. Think about a child who knows the word 'dog' but applies it to cats, horses, and sheep as well.", "feedbackCorrect": "Overextension occurs when a child uses a word too broadly — for example, calling all four-legged animals 'dog' — because they have not yet learned the specific category boundaries. It reveals the child's developing semantic system.", "feedbackWrong": "A common mistake is paraphrasing the text instead of analysing it. Focus on how language creates meaning, not just what it says. The correct answer is: when a child uses a word too broadly — e.g. calling all four-legged animals 'dog' — because they have not yet learned the specific category boundaries.", "consequence": "<strong>The researcher observes the children through the glass.</strong> <em>\"Overextension is not a mistake — it is evidence of a system. The child has a rule: four legs, fur, moves = dog. That rule is too broad, but it is logical. The child will narrow it as they encounter more animals and learn more labels. Error is the engine of learning.\"</em>", "next": "end", "examTip": "In the exam, always quote briefly from the text and explain the effect of specific word choices. Use terminology like 'connotation' and 'tone'.", "bloomsLevel": "Evaluate"}], "ending": {"perfect": "Superb developmental analysis. You calculated the stage gaps, measured the vocabulary explosion, and defined overextension with precision. The research lab has excellent data.", "partial": "You identified some key milestones in language acquisition, but your analysis needed refinement. Return to strengthen your understanding of developmental stages.", "retry": "Every researcher benefits from another observation session. Try again to achieve a perfect score."}};</script>
  <script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `ClassCraft — ${S.meta.title}`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
