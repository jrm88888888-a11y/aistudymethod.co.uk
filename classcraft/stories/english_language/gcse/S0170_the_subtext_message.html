<script>const STORY_DATA = {"meta": {"title": "The Subtext Message: Implication & Inference", "subtitle": "A detective's case file is full of things unsaid. Can you read between the lines?", "subject": "English Language", "topic": "Implication & Inference", "level": "GCSE", "tags": ["📝 English Language", "GCSE", "Implication & Inference", "~10 min", "3 questions"], "intro": "You have been called into a detective's office to assist with a witness statement. The problem is not what the witness said — it is what the witness did not say. Your task is to count the explicit and implicit statements, calculate the proportion of hidden meaning, and define the skill of inference. In language analysis, the most important things are often the things left unsaid."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='220' width='700' height='42' fill='#706860'/><rect x='200' y='50' width='300' height='160' fill='#8a7868'/><rect x='220' y='70' width='260' height='8' fill='#a09080'/><rect x='220' y='90' width='240' height='8' fill='#a09080'/><rect x='220' y='110' width='250' height='8' fill='#706860'/><rect x='220' y='130' width='230' height='8' fill='#a09080'/><rect x='220' y='150' width='245' height='8' fill='#706860'/><rect x='220' y='170' width='220' height='8' fill='#a09080'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#a09080'/><rect x='0' y='220' width='700' height='42' fill='#706860'/><rect x='100' y='70' width='230' height='140' fill='#8a7868'/><rect x='370' y='70' width='230' height='140' fill='#8a7868'/><rect x='110' y='80' width='50' height='10' fill='#b0a898'/><rect x='380' y='80' width='50' height='10' fill='#b0a898'/><rect x='110' y='100' width='210' height='6' fill='#b0a898'/><rect x='110' y='115' width='210' height='6' fill='#b0a898'/><rect x='110' y='130' width='210' height='6' fill='#b0a898'/><rect x='380' y='100' width='210' height='6' fill='#706860'/><rect x='380' y='115' width='210' height='6' fill='#706860'/><rect x='380' y='130' width='210' height='6' fill='#706860'/><line x1='350' y1='70' x2='350' y2='210' stroke='#706860' stroke-width='2' stroke-dasharray='5,5'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='220' width='700' height='42' fill='#706860'/><rect x='250' y='60' width='200' height='150' fill='#8a7868'/><rect x='270' y='80' width='160' height='8' fill='#a09080'/><rect x='270' y='100' width='140' height='8' fill='#a09080'/><rect x='270' y='120' width='155' height='8' fill='#706860'/><rect x='270' y='140' width='130' height='8' fill='#a09080'/><rect x='270' y='160' width='150' height='8' fill='#706860'/><circle cx='350' cy='190' r='10' fill='#706860' opacity='0.5'/></svg>"}, "nodes": [{"id": "intro_scene", "type": "story", "chapter": "Mission Briefing", "title": "The Detective's Office", "scene": "scene1", "body": "<p>You step into a cluttered detective's office. Case files are stacked on every surface. A corkboard dominates one wall, covered in photographs, maps, and pinned notes connected by red string. The detective sits behind his desk, reading a witness statement with furrowed brows.</p><p><em>\"This witness is hiding something,\"</em> he says, sliding the document across the desk. <em>\"Not lying — that is the tricky part. Everything in this statement is technically true. But what the witness is not saying is more important than what they are saying.\"</em></p><p>He leans back. <em>\"In detective work, we call it reading between the lines. In your world — English Language — it is called <strong>inference</strong>. Your job is to go through this statement, separate the explicit from the implicit, and calculate how much of the meaning is hidden beneath the surface.\"</em></p>", "factBox": {"label": "Key Concept — Implication & Inference", "text": "An explicit statement says something directly — the meaning is on the surface. An implicit statement suggests something without stating it outright — the meaning must be inferred by the reader. Inference is the skill of reading between the lines: using clues in the text (word choice, tone, detail, omission) to understand meaning that is suggested but not directly stated. Writers use implication deliberately to create subtext, irony, and layered meaning."}, "formulaBox": {"label": "Calculating Proportions", "formula": "Percentage = (Part ÷ Whole) × 100", "vars": "Part = implicit or explicit statements · Whole = total statements"}, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Total Count", "title": "Cataloguing the Statements", "scene": "scene2", "body": "<p>You begin by going through the witness statement line by line, classifying each claim as either <strong>explicit</strong> (stated directly) or <strong>implicit</strong> (suggested or implied). You use two columns: one for what the witness actually says, and one for what the witness seems to mean without saying it.</p><p>After careful analysis, you find <strong>6 explicit statements</strong> and <strong>4 implicit statements</strong>. Together, these account for every meaningful claim in the text.</p><p><em>\"How many statements are there in total?\"</em> the detective asks.</p>", "workedBox": {"label": "How to approach it", "steps": "<p><strong>Step 1:</strong> Identify the two categories.<br>Explicit statements = 6 · Implicit statements = 4</p><p><strong>Step 2:</strong> Add them together.<br>Total = 6 + 4</p>"}, "question": "How many statements are in the witness text in total?", "unit": "statements", "answer": 10, "tolerance": 0, "maxAttempts": 2, "hintText": "Add the explicit statements (6) and the implicit statements (4) together.", "feedbackCorrect": "Ten statements in total. Six are on the surface; four are hidden beneath it. Now the question is: what proportion of the meaning is implicit?", "feedbackWrong": "A common mistake is paraphrasing the text instead of analysing it. Focus on how language creates meaning, not just what it says. The answer is 10. Explicit (6) + Implicit (4) = 10 statements total.", "consequence": "<strong>The detective marks his notepad.</strong> <em>\"Ten statements. Six things the witness actually said. Four things they implied. Let us find out what proportion of the truth is hiding.\"</em>", "next": "q2", "bloomsLevel": "Apply"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Implicit Proportion", "title": "The Hidden Meaning", "scene": "scene3", "body": "<p>Now you calculate the proportion of the statement that is <strong>implicit</strong> — meaning that must be inferred by the reader rather than taken at face value.</p><p>Of the <strong>10 total statements</strong>, <strong>4 are implicit</strong>.</p><p><em>\"What percentage of the witness statement is implicit?\"</em> the detective asks. <em>\"That figure will tell me how much this witness is relying on subtext rather than straight answers.\"</em></p>", "workedBox": {"label": "How to approach it", "steps": "<p><strong>Step 1:</strong> Identify the part and the whole.<br>Implicit statements = 4 · Total statements = 10</p><p><strong>Step 2:</strong> Apply the formula.<br>Percentage = (4 ÷ 10) × 100</p>"}, "question": "What percentage of the statements are implicit?", "unit": "%", "answer": 40, "tolerance": 0, "maxAttempts": 2, "hintText": "Divide 4 by 10 and multiply by 100.", "feedbackCorrect": "Forty percent implicit. Nearly half of the witness's meaning is hidden beneath the surface — a significant amount of subtext for a supposedly straightforward statement.", "feedbackWrong": "A common mistake is paraphrasing the text instead of analysing it. Focus on how language creates meaning, not just what it says. The answer is 40%. (4 ÷ 10) × 100 = 40% of the statements are implicit.", "consequence": "<strong>The detective nods slowly.</strong> <em>\"Forty percent. Nearly half of what this witness communicated was not actually said aloud. That is not a statement — it is a performance. And you have just proved it with numbers.\"</em>", "next": "q3", "bloomsLevel": "Apply"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Definition", "title": "Defining Inference", "scene": "scene1", "body": "<p>Before you leave the detective's office, he asks you to define the key skill you have been using throughout this analysis.</p><p><em>\"You have been reading between the lines all afternoon,\"</em> he says. <em>\"In your field, what is the proper term for that skill — and what does it actually mean?\"</em></p><p>You consider the options. Inference is a specific skill, not just a vague sense that something is hidden.</p>", "question": "What is inference?", "options": [{"text": "Identifying the literal meaning of every word in a text using a dictionary", "correct": false}, {"text": "Reading between the lines to understand meaning that is suggested but not directly stated", "correct": true}, {"text": "Summarising the main points of a text in your own words", "correct": false}, {"text": "Comparing two texts to identify similarities and differences in their arguments", "correct": false}], "maxAttempts": 2, "hintText": "Inference is about understanding what is implied, not what is stated. It involves using clues to reach a conclusion that is not explicitly given.", "feedbackCorrect": "Inference is reading between the lines — understanding meaning that is suggested but not directly stated. It requires the reader to use clues in the text to deduce what the writer or speaker truly means.", "feedbackWrong": "A common mistake is paraphrasing the text instead of analysing it. Focus on how language creates meaning, not just what it says. The answer is: reading between the lines to understand meaning that is suggested but not directly stated.", "consequence": "<strong>The detective shakes your hand.</strong> <em>\"Inference. It is the most important skill in my job — and, apparently, in yours. The truth is rarely on the surface. You have to dig.\"</em>", "next": "end", "examTip": "In the exam, always quote briefly from the text and explain the effect of specific word choices. Use terminology like 'connotation' and 'tone'.", "bloomsLevel": "Analyse"}], "ending": {"perfect": "Case closed. You catalogued explicit and implicit meaning with precision, calculated the proportion of subtext, and defined inference with clarity. The detective has a new appreciation for English Language skills.", "partial": "You demonstrated a working understanding of inference, but some of your analysis needed refinement. Return to sharpen your ability to read between the lines.", "retry": "The best detectives — and the best readers — never stop looking for what is hidden. Try again to achieve a perfect score."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
