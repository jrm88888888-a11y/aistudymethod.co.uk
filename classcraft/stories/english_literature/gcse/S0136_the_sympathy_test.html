300' y='60' width='160' height='150' fill='#8a7868'/><rect x='320' y='80' width='120' height='8' fill='#b0a898'/><rect x='320' y='100' width='100' height='8' fill='#b0a898'/><rect x='320' y='120' width='110' height='8' fill='#b0a898'/><rect x='500' y='60' width='160' height='150' fill='#8a7868'/><rect x='520' y='80' width='120' height='8' fill='#b0a898'/><rect x='520' y='100' width='100' height='8' fill='#b0a898'/><rect x='520' y='120' width='110' height='8' fill='#b0a898'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='220' width='700' height='42' fill='#706860'/><rect x='200' y='60' width='300' height='150' fill='#8a7868'/><rect x='220' y='80' width='80' height='110' fill='#706860'/><rect x='310' y='80' width='80' height='110' fill='#706860'/><rect x='400' y='80' width='80' height='110' fill='#706860'/></svg>"}, "nodes": [{"id": "intro_scene", "type": "story", "chapter": "Mission Briefing", "title": "The Forensics Lab", "scene": "scene1", "body": "<p>You enter the Literary Forensics Lab, where a passage of prose lies on the examination table like evidence at a crime scene. Beside it, a set of analytical tools — highlighters, a technique glossary, and a structured framework for building your response.</p><p>Your supervisor, Dr Chen, taps the passage with her pen. <em>\"This writer wants the reader to feel sympathy for the protagonist,\"</em> she explains. <em>\"They've used multiple techniques — emotive adjectives, rhetorical questions, short sentences — all layered together to manipulate your emotions. Your job is to count them, structure your analysis, and name the framework.\"</em></p><p>In GCSE English Literature, analysing <strong>writer's methods</strong> means identifying the techniques a writer uses and explaining their effect on the reader. The <strong>PEE framework</strong> (Point, Evidence, Explanation) provides the structure for doing this clearly and effectively.</p>", "factBox": {"label": "Key Concept — Writer's Methods", "text": "Writers choose specific techniques — language devices, structural choices, tonal shifts — to create particular effects on the reader. Identifying these methods and explaining their impact is a core skill in GCSE English Literature. The more precisely you can name and analyse a technique, the stronger your response."}, "formulaBox": {"label": "Counting Techniques", "formula": "Total Techniques = Type A + Type B + Type C + …", "vars": "Count each distinct technique type separately, then add them together"}, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Technique Count", "title": "The Arsenal", "scene": "scene1", "body": "<p>You examine the passage closely. Dr Chen has already categorised the techniques: <strong>4 emotive adjectives</strong>, <strong>3 rhetorical questions</strong>, and <strong>2 short sentences</strong> used for dramatic effect.</p><p><em>\"How many individual techniques has the writer deployed in total?\"</em> she asks. <em>\"The sheer volume tells us how aggressively the writer is trying to manipulate the reader's response.\"</em></p>", "workedBox": {"label": "How to approach it", "steps": "<p><strong>Step 1:</strong> Emotive adjectives = 4</p><p><strong>Step 2:</strong> Rhetorical questions = 3</p><p><strong>Step 3:</strong> Short sentences = 2</p><p><strong>Step 4:</strong> Total = 4 + 3 + 2</p>"}, "question": "How many techniques has the writer used in total?", "unit": "techniques", "answer": 9, "tolerance": 0, "maxAttempts": 2, "hintText": "Add together all the technique counts: 4 + 3 + 2.", "feedbackCorrect": "9 techniques in total. The writer has packed the passage with persuasive devices — a concentrated assault on the reader's emotions designed to generate maximum sympathy.", "feedbackWrong": "A common mistake is retelling the plot instead of analysing it. Focus on how and why the writer makes specific choices, not just what happens. The answer is 9. 4 emotive adjectives + 3 rhetorical questions + 2 short sentences = 9 techniques.", "consequence": "<strong>Dr Chen highlights the passage.</strong> <em>\"Nine techniques in a single passage. This writer isn't hoping for sympathy — they're demanding it. Every sentence is loaded with persuasive intent.\"</em>", "next": "q2", "bloomsLevel": "Apply"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Essay Structure", "title": "Building the Response", "scene": "scene2", "body": "<p>Dr Chen now turns to your written response. A strong analytical essay requires <strong>3 PEE paragraphs</strong>. Each PEE paragraph contains exactly <strong>3 parts</strong>: a <strong>Point</strong> (your argument), <strong>Evidence</strong> (a quote from the text), and an <strong>Explanation</strong> (analysis of the technique's effect).</p><p><em>\"How many individual parts do you need to write across all three paragraphs?\"</em> she asks. <em>\"Knowing the structure ensures nothing is missed.\"</em></p>", "workedBox": {"label": "How to approach it", "steps": "<p><strong>Step 1:</strong> Each PEE paragraph has 3 parts (Point + Evidence + Explanation)</p><p><strong>Step 2:</strong> You need 3 paragraphs</p><p><strong>Step 3:</strong> Total parts = 3 parts × 3 paragraphs</p>"}, "question": "How many individual parts do you need across 3 PEE paragraphs?", "unit": "parts", "answer": 9, "tolerance": 0, "maxAttempts": 2, "hintText": "Multiply the number of parts in each paragraph (3) by the number of paragraphs (3).", "feedbackCorrect": "9 parts. Three paragraphs, each with three components — Point, Evidence, Explanation — gives you a total of 9 distinct elements to write. This structured approach ensures thorough, organised analysis.", "feedbackWrong": "A common mistake is retelling the plot instead of analysing it. Focus on how and why the writer makes specific choices, not just what happens. The answer is 9 parts. 3 parts per paragraph × 3 paragraphs = 9.", "consequence": "<strong>Dr Chen arranges the framework.</strong> <em>\"Nine parts, laid out like a forensic report. Point identifies the technique, Evidence quotes the text, Explanation reveals the effect. Miss any one of them and your analysis has a hole.\"</em>", "next": "q3", "bloomsLevel": "Apply"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Framework", "title": "Naming the Framework", "scene": "scene3", "body": "<p>Your analysis is almost complete. You have counted the techniques and structured your response. Now Dr Chen asks you to name the analytical framework you've been using — the three-part structure that forms the backbone of every strong literary analysis paragraph.</p><p><em>\"What does PEE stand for?\"</em> she asks. <em>\"If you can name it, you can use it. And if you can use it, you can write a convincing response to any passage.\"</em></p>", "question": "What does PEE stand for in literary analysis?", "options": [{"text": "Purpose, Example, Evaluation", "correct": false}, {"text": "Point, Evidence, Explanation", "correct": true}, {"text": "Prediction, Evidence, Effect", "correct": false}, {"text": "Plot, Extract, Emotion", "correct": false}], "maxAttempts": 2, "hintText": "Think about the three things every analytical paragraph needs: a claim, a quote, and an explanation of its effect.", "feedbackCorrect": "PEE stands for Point, Evidence, Explanation. This framework ensures every analytical paragraph makes a clear argument, supports it with textual evidence, and explains the writer's technique and its effect.", "feedbackWrong": "A common mistake is retelling the plot instead of analysing it. Focus on how and why the writer makes specific choices, not just what happens. The answer is Point, Evidence, Explanation. PEE is the foundational framework for literary analysis at GCSE level.", "consequence": "<strong>Dr Chen closes the case file.</strong> <em>\"Point, Evidence, Explanation. The forensic framework of literary analysis. With it, you can dissect any passage and reveal the writer's methods with surgical precision.\"</em>", "next": "end", "examTip": "In the exam, embed short quotations into your sentences and analyse individual word choices. Link your points to the writer's intentions and context.", "bloomsLevel": "Analyse"}], "ending": {"perfect": "Flawless forensics. You counted the techniques, structured the response, and named the framework. The passage has been thoroughly analysed.", "partial": "Your analysis was promising but incomplete. Literary forensics demands precision — return to refine your methods.", "retry": "Every forensic specialist re-examines the evidence. Try again to achieve a perfect score."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
