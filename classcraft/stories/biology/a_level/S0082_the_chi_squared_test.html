dth=\"320\" height=\"190\" rx=\"4\" fill=\"#c8b8a8\" stroke=\"#706860\" stroke-width=\"2\"/><line x1=\"40\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#706860\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"110\" x2=\"360\" y2=\"110\" stroke=\"#a09080\" stroke-width=\"1\"/><line x1=\"40\" y1=\"150\" x2=\"360\" y2=\"150\" stroke=\"#a09080\" stroke-width=\"1\"/><line x1=\"40\" y1=\"190\" x2=\"360\" y2=\"190\" stroke=\"#a09080\" stroke-width=\"1\"/><line x1=\"140\" y1=\"30\" x2=\"140\" y2=\"220\" stroke=\"#706860\" stroke-width=\"1\"/><line x1=\"250\" y1=\"30\" x2=\"250\" y2=\"220\" stroke=\"#706860\" stroke-width=\"1\"/><circle cx=\"90\" cy=\"90\" r=\"6\" fill=\"#8a7868\"/><circle cx=\"195\" cy=\"90\" r=\"6\" fill=\"#8a7868\"/><circle cx=\"305\" cy=\"90\" r=\"6\" fill=\"#8a7868\"/></svg>", "distribution": "<svg viewBox=\"0 0 400 250\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"400\" height=\"250\" fill=\"#c8b8a8\"/><rect x=\"80\" y=\"160\" width=\"30\" height=\"50\" fill=\"#a09080\" stroke=\"#706860\" stroke-width=\"1\"/><rect x=\"120\" y=\"120\" width=\"30\" height=\"90\" fill=\"#a09080\" stroke=\"#706860\" stroke-width=\"1\"/><rect x=\"160\" y=\"80\" width=\"30\" height=\"130\" fill=\"#8a7868\" stroke=\"#706860\" stroke-width=\"1\"/><rect x=\"200\" y=\"60\" width=\"30\" height=\"150\" fill=\"#706860\" stroke=\"#706860\" stroke-width=\"1\"/><rect x=\"240\" y=\"90\" width=\"30\" height=\"120\" fill=\"#8a7868\" stroke=\"#706860\" stroke-width=\"1\"/><rect x=\"280\" y=\"130\" width=\"30\" height=\"80\" fill=\"#a09080\" stroke=\"#706860\" stroke-width=\"1\"/><line x1=\"60\" y1=\"210\" x2=\"340\" y2=\"210\" stroke=\"#706860\" stroke-width=\"2\"/><line x1=\"60\" y1=\"210\" x2=\"60\" y2=\"40\" stroke=\"#706860\" stroke-width=\"2\"/></svg>"}, "nodes": [{"id": "intro_scene", "chapter": "Chapter 1 — The Genetics Garden", "title": "Observed vs Expected", "scene": "field", "body": "<p>You kneel among rows of plants in the experimental garden. Months of careful crossing have produced <strong>200 offspring</strong>. According to Mendel's law of segregation, the expected phenotype ratio for a monohybrid cross is <strong>3:1</strong> — that means 150 dominant and 50 recessive.</p><p>But nature is never perfectly tidy. You count carefully: <strong>140 dominant and 60 recessive</strong>. The numbers are off. Is this deviation significant, or just random sampling error? The chi-squared test will give you the answer.</p>", "factBox": {"label": "Key Concept", "text": "The chi-squared (χ²) test compares observed results to expected results. A large χ² value means the data deviates significantly from what was expected. You compare your calculated χ² to a critical value from statistical tables."}, "formulaBox": {"label": "Chi-Squared Formula", "formula": "χ² = Σ ((O − E)² / E)", "vars": "O = observed value · E = expected value · Σ = sum across all categories"}, "type": "story", "next": "q1"}, {"id": "q1", "chapter": "Chapter 2 — The Dominant Category", "title": "Calculating the First Component", "body": "<p>You begin the chi-squared calculation with the <strong>dominant phenotype</strong>. You observed 140 individuals, but expected 150 (that's 3/4 of 200).</p><p>You set up the formula: take the difference between observed and expected, square it, then divide by the expected value. This gives you the contribution of the dominant category to the overall χ² statistic.</p>", "workedBox": {"label": "Worked Example — Dominant phenotype component", "steps": "<p><strong>Given:</strong> O = 140, E = 150</p><p><strong>Step 1:</strong> Difference: O − E = 140 − 150 = −10</p><p><strong>Step 2:</strong> Square: (−10)² = 100</p><p><strong>Step 3:</strong> Divide by E: 100 / 150 = <strong>?</strong></p>"}, "type": "numeric", "question": "What is (O − E)² / E for the dominant phenotype? (Give your answer to 3 decimal places)", "unit": "", "answer": 0.667, "tolerance": 0.01, "maxAttempts": 2, "hintText": "Calculate 100 ÷ 150. This gives a repeating decimal: 0.666... which rounds to 0.667.", "feedbackCorrect": "Correct — 100 / 150 = 0.667. That's the dominant category's contribution to χ².", "feedbackWrong": "A common mistake is using vague language like 'it helps the body'. Always specify what structure or process you mean and explain the mechanism. The correct answer is 0.667. The calculation is (140 − 150)² / 150 = 100 / 150 = 0.667.", "consequence": "<strong>You write down 0.667 in your results table.</strong> One category done — now you need the recessive category to complete the chi-squared calculation.", "next": "q2", "bloomsLevel": "Analyse"}, {"id": "q2", "chapter": "Chapter 3 — The Total Chi-Squared", "title": "Adding Both Components", "body": "<p>Now you calculate the <strong>recessive phenotype</strong> component. You observed 60, but expected 50 (that's 1/4 of 200). The recessive component is (60 − 50)² / 50 = 100 / 50 = <strong>2.000</strong>.</p><p>The total χ² value is the sum of both components: the dominant contribution (0.667) plus the recessive contribution (2.000).</p>", "workedBox": {"label": "Worked Example — Summing the components", "steps": "<p><strong>Dominant:</strong> (140 − 150)² / 150 = 0.667</p><p><strong>Recessive:</strong> (60 − 50)² / 50 = 2.000</p><p><strong>Total χ²:</strong> 0.667 + 2.000 = <strong>?</strong></p>"}, "type": "numeric", "question": "What is the total χ² value? (Give your answer to 3 decimal places)", "unit": "", "answer": 2.667, "tolerance": 0.01, "maxAttempts": 2, "hintText": "Simply add the two components together: 0.667 + 2.000.", "feedbackCorrect": "Correct — χ² = 0.667 + 2.000 = 2.667.", "feedbackWrong": "A common mistake is using vague language like 'it helps the body'. Always specify what structure or process you mean and explain the mechanism. The correct answer is 2.667. Sum the two components: 0.667 + 2.000 = 2.667.", "consequence": "<strong>You circle the total: χ² = 2.667.</strong> Now comes the crucial step — comparing this to the critical value to decide whether your results fit the expected ratio.", "next": "q3", "bloomsLevel": "Analyse"}, {"id": "q3", "chapter": "Chapter 4 — The Verdict", "title": "Accept or Reject?", "body": "<p>You open the chi-squared critical values table. With <strong>1 degree of freedom</strong> (two categories minus one) and a significance level of <strong>p = 0.05</strong>, the critical value is <strong>3.84</strong>.</p><p>Your calculated χ² = 2.667. You compare: is 2.667 greater than or less than 3.84? This comparison determines whether you accept or reject the null hypothesis — that the observed data fits the expected 3:1 ratio.</p>", "type": "mcq", "question": "Your χ² = 2.667 and the critical value at p = 0.05 with 1 df is 3.84. What do you conclude?", "options": [{"text": "We reject the null hypothesis — the results do not fit a 3:1 ratio and the difference is significant", "correct": false}, {"text": "We accept the null hypothesis — the observed data fits the expected 3:1 ratio; the difference is due to chance", "correct": true}, {"text": "The test is inconclusive — we need more data before we can decide", "correct": false}, {"text": "We reject the null hypothesis — the chi-squared value proves the ratio is exactly 3:1", "correct": false}], "maxAttempts": 2, "hintText": "If χ² is LESS than the critical value, the deviation is not significant — we accept the null hypothesis. If χ² is GREATER, we reject it.", "feedbackCorrect": "Exactly right. Since 2.667 < 3.84, the deviation from the expected 3:1 ratio is not statistically significant. The difference between observed and expected is likely due to random chance.", "feedbackWrong": "A common mistake is using vague language like 'it helps the body'. Always specify what structure or process you mean and explain the mechanism. The correct answer is: we accept the null hypothesis. Since χ² (2.667) is less than the critical value (3.84), the deviation is not significant — the data fits the expected 3:1 ratio.", "consequence": "<strong>You write your conclusion with confidence.</strong> The observed deviation from 3:1 is within the range expected by chance alone. Mendel's prediction holds — there is no evidence of any unusual inheritance pattern.", "next": "end", "examTip": "In the exam, use precise biological terminology and always link structure to function. Explain mechanisms step by step.", "bloomsLevel": "Evaluate"}], "ending": {"perfect": "Outstanding fieldwork. You've mastered the chi-squared test — from calculating components to interpreting statistical significance.", "partial": "Solid effort. The chi-squared test takes practice — review the formula and the comparison with critical values, then try again.", "retry": "Want to perfect your statistical analysis? Return to the genetics garden."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
