<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClassCraft — The Neutron Star</title>
  <link rel="stylesheet" href="../../../style.css"/>
  <style>
/* ═══════════════════════════════════════════════
       SCIENCE STORY ENGINE — style layer
       All visual decisions live here.
       Story authors never touch this section.
    ═══════════════════════════════════════════════ */

    .story-wrap {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.25rem 6rem;
    }

    @media (min-width: 768px) {
      .story-wrap { padding: 5rem 2rem 8rem; }
    }

    /* ── Progress ── */
    .progress-track {
      height: 2px;
      background: var(--parchment-deep);
      margin-bottom: 2.5rem;
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      width: 0%;
    }

    /* ── Panel transitions ── */
    .panel {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .panel.in { opacity: 1; transform: translateY(0); }

    /* ── Typography ── */
    .eyebrow {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.5rem;
    }

    .story-h {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      font-weight: 300;
      line-height: 1.12;
      margin-bottom: 1.75rem;
      color: var(--ink);
    }

    .story-prose {
      font-size: 1.05rem;
      line-height: 1.88;
      color: var(--ink-mid);
    }
    .story-prose p { margin-bottom: 1.1em; max-width: 100%; }
    .story-prose p:last-child { margin-bottom: 0; }
    .story-prose strong { color: var(--ink); font-weight: 500; }
    .story-prose em { font-style: italic; }

    /* ── Scene illustration ── */
    .scene {
      width: 100%;
      aspect-ratio: 16 / 6;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.75rem;
    }
    .scene svg { width: 100%; height: 100%; }

    /* ── Knowledge callout ── */
    .fact-box {
      border-left: 3px solid var(--accent);
      background: var(--parchment-mid);
      padding: 1.1rem 1.3rem;
      margin: 1.75rem 0;
      border-radius: 0 3px 3px 0;
    }
    .fact-box .fact-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.45rem;
    }
    .fact-box p {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.65;
      margin: 0;
      max-width: 100%;
    }

    /* ── Formula display ── */
    .formula-box {
      background: var(--parchment-deep);
      border: 1px solid rgba(139,94,60,0.2);
      border-radius: 3px;
      padding: 1.25rem 1.5rem;
      margin: 1.75rem 0;
      text-align: center;
    }
    .formula-box .formula-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.75rem;
    }
    .formula-box .formula-main {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 0.5rem;
    }
    .formula-box .formula-vars {
      font-size: 0.8rem;
      color: var(--ink-mid);
      line-height: 1.7;
    }

    /* ── Worked example ── */
    .worked {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 3px;
      padding: 1.1rem 1.3rem;
      margin: 1.75rem 0;
    }
    .worked-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      display: block;
      margin-bottom: 0.6rem;
    }
    .worked-steps {
      font-size: 0.88rem;
      color: var(--ink-mid);
      line-height: 1.85;
      margin: 0;
      max-width: 100%;
    }
    .worked-steps strong { color: var(--ink); font-weight: 500; }

    /* ── Answer input zone ── */
    .answer-zone {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
    }

    .answer-prompt {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink);
      margin-bottom: 1.1rem;
    }

    /* Numeric input */
    .answer-numeric {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .answer-numeric input[type="number"] {
      width: 120px;
      padding: 0.7rem 0.9rem;
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .answer-numeric input::-webkit-inner-spin-button,
    .answer-numeric input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .answer-numeric input:focus { border-color: var(--accent); }
    .answer-unit {
      font-size: 0.9rem;
      color: var(--ink-mid);
      font-style: italic;
    }

    /* MCQ choices */
    .mcq-choices {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .mcq-btn {
      width: 100%;
      text-align: left;
      padding: 0.9rem 1.1rem;
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--ink-mid);
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
      position: relative;
    }
    .mcq-btn::before {
      content: '→';
      margin-right: 0.55rem;
      color: var(--accent-light);
      display: inline-block;
      transition: transform 0.15s;
    }
    .mcq-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--parchment);
      color: var(--ink);
      transform: translateX(4px);
    }
    .mcq-btn:hover:not(:disabled)::before { transform: translateX(4px); }
    .mcq-btn:disabled { cursor: default; }

    /* Submit button */
    .submit-btn {
      margin-top: 0.85rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .submit-btn:hover { background: var(--ink); color: var(--parchment); }
    .submit-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Feedback states ── */
    .feedback {
      display: none;
      margin-top: 1.1rem;
      padding: 1rem 1.2rem;
      border-radius: 3px;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: #eef6e8;
      border: 1px solid #7aad4a;
      color: #2d5a0f;
    }
    .feedback.wrong {
      background: #fbefef;
      border: 1px solid #c97a7a;
      color: #5c1a1a;
    }
    .feedback.hint {
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      color: var(--ink-mid);
    }
    .feedback .fb-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
      opacity: 0.75;
    }

    /* ── Consequence story beat ── */
    .consequence {
      display: none;
      margin-top: 1.25rem;
      padding: 1.1rem 1.3rem;
      background: var(--parchment-mid);
      border-left: 3px solid var(--accent-light);
      border-radius: 0 3px 3px 0;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--ink-mid);
      font-style: italic;
    }
    .consequence.show { display: block; }
    .consequence strong { font-style: normal; color: var(--ink); font-weight: 500; }

    /* ── Attempts tracker ── */
    .attempts-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.65rem;
    }
    .attempt-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--parchment-deep);
      border: 1px solid var(--parchment-deep);
      transition: background 0.2s;
    }
    .attempt-pip.used { background: var(--accent-light); border-color: var(--accent-light); }
    .attempt-pip.wrong-pip { background: #c97a7a; border-color: #c97a7a; }
    .attempts-label {
      font-size: 0.72rem;
      color: var(--ink-light);
      letter-spacing: 0.06em;
    }

    /* ── Continue button ── */
    .continue-btn {
      display: none;
      margin-top: 1.4rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.8rem 1.6rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .continue-btn.show { display: inline-block; }
    .continue-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── Intro screen ── */
    .intro { text-align: center; }
    .intro .meta-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.5rem 0 2rem;
    }
    .meta-tag {
      font-size: 0.67rem;
      font-weight: 500;
      padding: 0.28rem 0.75rem;
      border-radius: 20px;
      border: 1px solid var(--rule);
      color: var(--ink-mid);
      letter-spacing: 0.05em;
    }
    .start-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.9rem 2.1rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .start-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── End screen ── */
    .end-screen { display: none; }
    .end-screen.show { display: block; }
    .end-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--rule);
      padding: 0.35rem 1rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    .score-display {
      font-family: var(--font-display);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 300;
      color: var(--accent);
      line-height: 1;
      margin: 1rem 0 0.25rem;
    }
    .score-label {
      font-size: 0.8rem;
      color: var(--ink-light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .score-summary {
      font-size: 0.95rem;
      color: var(--ink-mid);
      line-height: 1.75;
      max-width: 52ch;
      margin: 1.5rem auto 2rem;
    }
    .question-review {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--parchment-mid);
      border: 1px solid var(--parchment-deep);
      border-radius: 2px;
      font-size: 0.85rem;
      color: var(--ink-mid);
      line-height: 1.5;
    }
    .review-icon { flex-shrink: 0; font-size: 1rem; }
    .restart-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.85rem 1.75rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      border-radius: 1px;
    }
    .restart-btn:hover { background: var(--accent); color: var(--parchment); }

    /* ── Hint toggle ── */
    .hint-toggle {
      font-size: 0.75rem;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-top: 0.5rem;
      display: inline-block;
    }
  </style>
</head>

  <script>const STORY_DATA = {"meta": {"title": "The Neutron Star", "subtitle": "Escape the most extreme gravitational well in the known universe.", "subject": "Physics", "topic": "Escape Velocity (v = √(2GM÷r))", "level": "A-Level", "tags": ["🔬 Physics", "A-Level", "Escape Velocity", "~10 min", "3 questions"], "intro": "A research vessel has been pulled too close to a neutron star. To escape, the ship must exceed the escape velocity at its current position. The calculations must be exact — too slow and the ship falls, too fast and fuel runs out."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#706860'/><circle cx='200' cy='131' r='60' fill='#8a7868'/><circle cx='200' cy='131' r='40' fill='#a09080'/><circle cx='200' cy='131' r='20' fill='#b0a898'/><rect x='500' y='100' width='80' height='30' fill='#8a7868'/><rect x='530' y='90' width='20' height='12' fill='#b0a898'/><path d='M580,115 Q620,80 650,50' stroke='#c0b8a8' stroke-width='2' fill='none' stroke-dasharray='5,4'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#8a7868'/><circle cx='200' cy='131' r='70' fill='#706860'/><circle cx='200' cy='131' r='40' fill='#8a7868'/><circle cx='200' cy='131' r='15' fill='#b0a898'/><line x1='200' y1='131' x2='500' y2='131' stroke='#c0b8a8' stroke-width='1' stroke-dasharray='4,3'/><circle cx='500' cy='131' r='8' fill='#c0b8a8'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#706860'/><circle cx='180' cy='131' r='50' fill='#8a7868'/><circle cx='180' cy='131' r='30' fill='#a09080'/><path d='M500,131 Q550,80 620,40' stroke='#c0b8a8' stroke-width='2' fill='none'/><rect x='480' y='115' width='40' height='20' fill='#b0a898'/></svg>"}, "nodes": [{"id": "intro_scene", "type": "story", "chapter": "Mission Briefing", "title": "Too Close", "scene": "scene1", "body": "<p>The neutron star: mass <strong>M = 3.0 × 10³⁰ kg</strong> (about 1.5 solar masses). The ship is at distance <strong>r = 2.0 × 10⁷ m</strong> from the neutron star's centre. G = 6.67 × 10⁻¹¹ N·m²/kg².</p><p>Escape velocity: <strong>v_esc = √(2GM/r)</strong>. The ship must exceed this speed to break free.</p>", "factBox": {"label": "Escape velocity", "text": "To escape a gravitational field, an object needs enough kinetic energy to overcome gravitational potential energy: ½mv² = GMm/r → v_esc = √(2GM/r). At this speed, the object just barely escapes to infinity."}, "formulaBox": {"label": "Key formula", "formula": "v_esc = √(2GM ÷ r)", "vars": "G = 6.67×10⁻¹¹ · M = mass of star (kg) · r = distance from centre (m)"}, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Escape Velocity", "title": "What is the escape velocity at r = 2.0 × 10⁷ m?", "scene": "scene2", "body": "<p>G = <strong>6.67×10⁻¹¹</strong>. M = <strong>3.0×10³⁰ kg</strong>. r = <strong>2.0×10⁷ m</strong>.</p><p>v_esc = √(2GM/r)</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>2GM = 2 × 6.67×10⁻¹¹ × 3.0×10³⁰ = 2 × 6.67 × 3.0 × 10¹⁹ = 40.02×10¹⁹ = 4.002×10²⁰</p><p>2GM/r = 4.002×10²⁰ ÷ 2.0×10⁷ = 2.001×10¹³</p><p>v = √(2.001×10¹³) ≈ 4.47×10⁶ m/s</p>"}, "question": "What is the escape velocity at this distance?", "unit": "m/s", "answer": 4470000.0, "tolerance": 50000.0, "maxAttempts": 2, "hintText": "v = √(2 × 6.67×10⁻¹¹ × 3.0×10³⁰ ÷ 2.0×10⁷) = √(2.001×10¹³) ≈ 4.47×10⁶ m/s.", "feedbackCorrect": "~4.47 × 10⁶ m/s — about 1.5% of the speed of light. Extreme but achievable.", "feedbackWrong": "A common mistake is to divide when you should multiply. Remember: distance = speed × time. v_esc = √(4.002×10²⁰/2×10⁷) = √(2.001×10¹³) ≈ 4.47×10⁶ m/s.", "consequence": "<strong>4.47 million m/s needed. The thrusters engage at full power.</strong>", "next": "bridge1", "nextWrong": "bridge1", "bloomsLevel": "Analyse"}, {"id": "bridge1", "type": "story", "chapter": "Act II — Schwarzschild Radius", "title": "How Close to the Black Hole Limit?", "scene": "scene2", "body": "<p>The Schwarzschild radius (where escape velocity = c): r_s = 2GM/c². For this neutron star, is the ship inside or outside the Schwarzschild radius? c = 3.0 × 10⁸ m/s.</p>", "factBox": {"label": "Schwarzschild radius", "text": "r_s = 2GM/c². If the object were compressed to below this radius, it would become a black hole. Neutron stars are dense but still outside their Schwarzschild radius."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Schwarzschild Radius", "title": "What is the Schwarzschild radius of this neutron star?", "scene": "scene2", "body": "<p>2GM = <strong>4.002 × 10²⁰</strong>. c² = (3.0×10⁸)² = <strong>9.0 × 10¹⁶</strong>.</p><p>r_s = 2GM ÷ c²</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "Structure your working", "steps": "<p>r_s = 4.002×10²⁰ ÷ 9.0×10¹⁶</p><p>= (4.002/9.0) × 10⁴</p><p>≈ 0.4447 × 10⁴ ≈ 4,447 m ≈ 4.45 km</p>"}, "question": "What is the Schwarzschild radius?", "unit": "m", "answer": 4447, "tolerance": 100, "maxAttempts": 2, "hintText": "r_s = 4.002×10²⁰ ÷ 9.0×10¹⁶ ≈ 4.44×10³ m = 4.44 km.", "feedbackCorrect": "~4.45 km — the ship at 2×10⁷ m is vastly outside this radius. Not a black hole.", "feedbackWrong": "A common mistake is using the wrong rearrangement of d = s × t. Write the formula triangle and cover the quantity you want. r_s = 4.002×10²⁰ ÷ 9×10¹⁶ ≈ 4,447 m.", "consequence": "<strong>Schwarzschild radius: 4.45 km. The ship at 20,000 km is safely outside the event horizon — for now.</strong>", "next": "bridge2", "nextWrong": "bridge2", "bloomsLevel": "Analyse"}, {"id": "bridge2", "type": "story", "chapter": "Act III — The Escape", "title": "Did the Ship Escape?", "scene": "scene3", "body": "<p>The ship achieves <strong>5.0 × 10⁶ m/s</strong>. The escape velocity was ~4.47 × 10⁶ m/s. Did it escape? And what is the ship's kinetic energy per kilogram at escape speed if m = 1 kg is used as a unit?</p>", "factBox": null, "formulaBox": {"label": "KE per unit mass", "formula": "Ek/m = ½v²", "vars": "v = 5.0×10⁶ m/s"}, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Escape Assessment", "title": "Has the ship successfully escaped the neutron star?", "scene": "scene3", "body": "<p>Ship speed: 5.0 × 10⁶ m/s. Escape velocity at r = 2.0 × 10⁷ m: ~4.47 × 10⁶ m/s.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "Has the ship escaped the neutron star's gravity?", "options": [{"text": "Yes — 5.0×10⁶ > 4.47×10⁶ m/s. The ship exceeds escape velocity and will continue moving away indefinitely.", "correct": true}, {"text": "No — the ship must reach exactly the escape velocity, not just exceed it", "correct": false}, {"text": "No — escape velocity must be calculated at infinity, not at r = 2×10⁷ m", "correct": false}, {"text": "Yes — but only temporarily; it will slow and return", "correct": false}], "maxAttempts": 2, "hintText": "If ship speed > escape velocity, the ship has more than enough energy to escape. It won't return.", "feedbackCorrect": "Correct — exceeding escape velocity means the ship has positive total energy and will escape to infinity.", "feedbackWrong": "A common mistake is using the wrong rearrangement of d = s × t. Write the formula triangle and cover the quantity you want. 5.0×10⁶ > 4.47×10⁶ m/s. Ship speed exceeds escape velocity → escape is achieved.", "consequence": "<strong>The ship accelerates away. The neutron star recedes behind them. They made it.</strong>", "next": "end", "nextWrong": "end", "examTip": "In the exam, always check whether the question asks for speed (scalar) or velocity (vector). State the formula, substitute values with units, then calculate.", "bloomsLevel": "Evaluate"}], "ending": {"title": "Escaped", "perfect": "Excellent gravitational physics — you calculated escape velocity, Schwarzschild radius, and correctly assessed whether the ship escaped.", "partial": "Good work. v_esc = √(2GM/r) and r_s = 2GM/c² are related — note that v_esc = c when r = r_s (the black hole condition).", "topic": "You practised escape velocity v = √(2GM/r) and the Schwarzschild radius r_s = 2GM/c².", "retry": "Plot the escape trajectory again — every calculation counts."}};</script>
  <script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `ClassCraft — ${S.meta.title}`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
