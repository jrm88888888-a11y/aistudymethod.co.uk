<script>const STORY_DATA = {"meta": {"title": "The Profit", "subtitle": "A bakery's finances are in chaos. Only your calculations can restore order.", "subject": "Business Studies", "topic": "Revenue, Costs & Profit", "level": "KS3", "tags": ["💼 Business Studies", "KS3 · Year 7–9", "Revenue, Costs & Profit", "~10 min", "3 questions"], "intro": "You are Jamie Reeves, newly hired accountant at Blossom Bakery. The owner, Rosa, is passionate about baking but hopeless with numbers. She suspects the business is losing money but isn't sure. Your job: untangle the finances, calculate the true profit, and save the bakery."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='190' width='400' height='60' fill='#706860'/><rect x='60' y='90' width='160' height='100' fill='#8a7868'/><rect x='75' y='70' width='130' height='25' fill='#a09080'/><rect x='80' y='110' width='40' height='50' fill='#706860'/><rect x='140' y='110' width='40' height='50' fill='#706860'/><circle cx='140' cy='140' r='15' fill='#c8b8a8'/><rect x='270' y='140' width='80' height='50' fill='#8a7868'/><rect x='280' y='125' width='60' height='20' fill='#a09080'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='50' y='40' width='300' height='160' fill='#8a7868'/><rect x='70' y='60' width='120' height='5' fill='#b0a898'/><rect x='70' y='80' width='90' height='5' fill='#b0a898'/><rect x='70' y='100' width='150' height='5' fill='#b0a898'/><rect x='70' y='120' width='60' height='5' fill='#b0a898'/><rect x='70' y='150' width='200' height='3' fill='#706860'/><rect x='70' y='165' width='100' height='5' fill='#c8b8a8'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='220' width='400' height='30' fill='#706860'/><rect x='40' y='50' width='2' height='170' fill='#706860'/><rect x='40' y='218' width='320' height='2' fill='#706860'/><rect x='60' y='160' width='50' height='58' fill='#8a7868'/><rect x='130' y='120' width='50' height='98' fill='#8a7868'/><rect x='200' y='80' width='50' height='138' fill='#a09080'/><rect x='270' y='100' width='50' height='118' fill='#c8b8a8'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Bakery Books", "scene": "scene1", "body": "<p>Rosa slides a shoebox full of receipts across the table. <em>\"Jamie, I sell lots of cakes, but there's never any money left at the end of the month. Where does it all go?\"</em></p><p>You begin sorting the numbers. Every business has <strong>revenue</strong> (the money coming in from sales) and <strong>costs</strong> (the money going out). Costs come in two types: <strong>fixed costs</strong> that stay the same regardless of output (rent, insurance), and <strong>variable costs</strong> that change with output (ingredients, packaging).</p>", "factBox": {"label": "Revenue, Costs & Profit", "text": "Revenue (or turnover) = selling price × quantity sold. Total costs = fixed costs + variable costs. Profit = total revenue − total costs. If costs exceed revenue, the business makes a loss."}, "formulaBox": {"label": "The profit equation", "formula": "Profit = Revenue − Total Costs", "vars": "Revenue = price × quantity · Total costs = fixed + variable"}, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Revenue, Costs & Profit", "title": "Revenue Count", "scene": "scene2", "body": "<p>Last month, Blossom Bakery sold <strong>800 cakes</strong> at an average price of <strong>£4.50</strong> each. You need to calculate the total revenue before looking at costs.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Total revenue = price × quantity</p><p>= £4.50 × 800</p>"}, "question": "What was the bakery's total revenue last month?", "unit": "£", "answer": 3600, "tolerance": 0, "maxAttempts": 2, "hintText": "Multiply £4.50 by 800. Think of it as £4 × 800 = £3,200, plus £0.50 × 800 = £400.", "feedbackCorrect": "£3,600 in revenue. That sounds healthy — but we haven't looked at costs yet.", "feedbackWrong": "A common mistake is confusing revenue and profit. Revenue is total income from sales; profit is what remains after all costs are deducted. The answer is £3,600. Revenue = £4.50 × 800 = £3,600.", "consequence": "<strong>£3,600 coming in.</strong> Rosa smiles, but you hold up a hand. <em>\"Revenue isn't profit, Rosa. Let's see what's going out.\"</em>", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "The Story Continues", "title": "The Cost Mountain", "scene": "scene2", "body": "<p>You sort through Rosa's receipts and group the costs:</p><p><strong>Fixed costs</strong> (same every month): Rent £800, Insurance £200, Equipment lease £150. Total fixed = £1,150.</p><p><strong>Variable costs</strong> (depend on how many cakes are made): Ingredients £1.20 per cake, Packaging £0.30 per cake. That's £1.50 variable cost per cake.</p>", "factBox": {"label": "Fixed vs Variable Costs", "text": "Fixed costs don't change with output — rent is the same whether you make 10 cakes or 1,000. Variable costs change directly with output — more cakes means more ingredients. Understanding this split is essential for pricing and break-even decisions."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Revenue, Costs & Profit", "title": "The True Profit", "scene": "scene3", "body": "<p>Now calculate Rosa's <strong>profit</strong> for the month. Revenue was £3,600. Fixed costs were £1,150. Variable costs were £1.50 per cake × 800 cakes.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Step 1: Variable costs = £1.50 × 800 = £1,200</p><p>Step 2: Total costs = £1,150 + £1,200 = £2,350</p><p>Step 3: Profit = £3,600 − £2,350 = ?</p>"}, "question": "What is the bakery's profit for the month?", "unit": "£", "answer": 1250, "tolerance": 0, "maxAttempts": 2, "hintText": "Total costs = fixed (£1,150) + variable (£1,200) = £2,350. Profit = £3,600 − £2,350.", "feedbackCorrect": "£1,250 profit! The bakery is actually doing better than Rosa thought. Knowledge is power.", "feedbackWrong": "A common mistake is confusing revenue and profit. Revenue is total income from sales; profit is what remains after all costs are deducted. The answer is £1,250. Total costs = £1,150 + £1,200 = £2,350. Profit = £3,600 − £2,350 = £1,250.", "consequence": "<strong>£1,250 profit.</strong> Rosa's eyes widen. <em>\"I'm actually making money? I thought I was losing it!\"</em> You explain: the problem wasn't profit — it was Rosa mixing personal and business spending.", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "The Story Continues", "title": "The Price Decision", "scene": "scene1", "body": "<p>A competitor opens nearby and starts selling cakes at £3.50 each. Rosa panics: <em>\"Should I drop my prices too?\"</em></p><p>You remind her that cutting prices affects revenue, while costs may stay the same. Understanding the relationship between price, costs, and profit is crucial before making any changes.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Revenue, Costs & Profit", "title": "The Price War", "scene": "scene3", "body": "<p>Rosa is considering dropping her price from £4.50 to £3.50 to match the competitor. Her variable cost per cake is £1.50 and she currently sells 800 cakes a month.</p><p><em>\"If I cut the price by £1, what happens to my profit — assuming I still sell the same 800 cakes?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What happens to monthly profit if the price drops by £1 per cake (same 800 sales)?", "options": [{"text": "Profit drops by £800 — from £1,250 to £450", "correct": true}, {"text": "Profit stays the same because costs haven't changed", "correct": false}, {"text": "Profit increases because more customers will come", "correct": false}, {"text": "Profit drops to zero — the bakery breaks even", "correct": false}], "maxAttempts": 2, "hintText": "A £1 price cut on 800 cakes means £800 less revenue. Costs don't change. So profit falls by £800.", "feedbackCorrect": "Exactly. £1 less per cake × 800 cakes = £800 less revenue. Profit falls from £1,250 to £450. Price cuts have a direct impact on profit.", "feedbackWrong": "A common mistake is confusing revenue and profit. Revenue is total income from sales; profit is what remains after all costs are deducted. The correct answer is that profit drops by £800 (from £1,250 to £450). Revenue falls by £1 × 800 = £800, but costs remain the same.", "consequence": "<strong>Rosa keeps her price at £4.50</strong> and instead focuses on quality and service. The competitor eventually closes. Sometimes understanding your numbers is the best competitive advantage.", "next": "end", "examTip": "In the exam, show all calculations clearly. Define the financial term before applying it — e.g., 'Profit = Revenue - Costs'.", "bloomsLevel": "Understand"}], "ending": {"title": "The Profit", "perfect": "Superb work, Jamie! You calculated revenue, total costs, and profit with precision. Rosa's bakery is in safe hands.", "partial": "The bakery survived, but some figures need rechecking. Review how revenue, fixed costs, and variable costs combine to determine profit.", "retry": "Want to revisit the bakery books and aim for a clean sheet?", "topic": "Revenue, Costs & Profit"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
