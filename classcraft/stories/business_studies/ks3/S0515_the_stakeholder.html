    .submit-btn {

    .feedback.correct {
      background: #eef6e8;
      border: 1px solid #7aad4a;
      color: #2d5a0f;
    }
    .feedback.wrong {
      background: #fbefef;
      border: 1px solid #c97a7a;
      color: #5c1a1a;
    }

      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;

      margin-bottom: 0.4rem;

      display: none;
      margin-top: 1.25rem;
      padding: 1.1rem 1.3rem;

      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--ink-mid);
      font-style: italic;

<script>const STORY_DATA = {"meta": {"title": "The Stakeholder", "subtitle": "A factory expansion pits profit against community. Whose interests will prevail?", "subject": "Business Studies", "topic": "Stakeholder Conflict", "level": "KS3", "tags": ["💼 Business Studies", "KS3 · Year 7–9", "Stakeholder Conflict", "~10 min", "3 questions"], "intro": "You are Taylor Morgan, operations manager at GreenPack Ltd, a packaging company. The board wants to double production capacity by building a new factory wing. But local residents are protesting about noise and pollution, employees want a share of the profits, and the environmental agency is watching closely. Every stakeholder wants something different."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='190' width='400' height='60' fill='#706860'/><rect x='40' y='80' width='180' height='110' fill='#8a7868'/><rect x='50' y='60' width='160' height='25' fill='#a09080'/><rect x='60' y='100' width='50' height='60' fill='#706860'/><rect x='130' y='100' width='50' height='60' fill='#706860'/><rect x='200' y='70' width='20' height='50' fill='#706860'/><rect x='260' y='100' width='100' height='90' fill='#c8b8a8'/><rect x='275' y='85' width='70' height='20' fill='#a09080'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><circle cx='200' cy='120' r='90' fill='#8a7868'/><circle cx='130' cy='90' r='30' fill='#b0a898'/><circle cx='270' cy='90' r='30' fill='#b0a898'/><circle cx='150' cy='170' r='30' fill='#b0a898'/><circle cx='250' cy='170' r='30' fill='#b0a898'/><circle cx='200' cy='120' r='20' fill='#706860'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='220' width='400' height='30' fill='#706860'/><rect x='50' y='50' width='130' height='80' fill='#8a7868'/><rect x='220' y='50' width='130' height='80' fill='#8a7868'/><rect x='135' y='70' width='130' height='40' fill='#a09080'/><line x1='180' y1='90' x2='180' y2='70' stroke='#706860' stroke-width='3'/><line x1='220' y1='90' x2='220' y2='70' stroke='#706860' stroke-width='3'/><rect x='100' y='160' width='200' height='50' fill='#c8b8a8'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Expansion Plan", "scene": "scene1", "body": "<p>GreenPack's boardroom is tense. The CEO announces a £500,000 factory expansion that will double output and create 40 new jobs. But the room erupts with conflicting voices.</p><p><strong>Shareholders</strong> want higher dividends. <strong>Employees</strong> want better pay. <strong>Local residents</strong> want less noise and pollution. <strong>Customers</strong> want lower prices. <strong>The government</strong> wants more tax revenue and employment.</p><p>These are all <strong>stakeholders</strong> — individuals or groups with an interest in the business. Their interests often conflict.</p>", "factBox": {"label": "Stakeholders", "text": "Internal stakeholders: owners/shareholders, employees, managers. External stakeholders: customers, suppliers, local community, government, pressure groups. Stakeholder conflict arises when different groups want different things — e.g., shareholders want higher profits while employees want higher wages."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Stakeholder Conflict", "title": "The Dividend Demand", "scene": "scene2", "body": "<p>GreenPack made a profit of <strong>£200,000</strong> last year. Shareholders own 1,000 shares and demand a <strong>dividend of £80 per share</strong>. You need to calculate the <strong>total dividend payout</strong> to see how much profit remains for other stakeholders.</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Total dividends = dividend per share × number of shares</p><p>= £80 × 1,000 = ?</p>"}, "question": "What is the total dividend payout to shareholders?", "unit": "£", "answer": 80000, "tolerance": 0, "maxAttempts": 2, "hintText": "Multiply £80 by 1,000 shares.", "feedbackCorrect": "£80,000 to shareholders — that's 40% of the entire profit. Other stakeholders will need to share the remaining £120,000.", "feedbackWrong": "A common mistake is making general business statements without applying them to the specific case study scenario. Always use the data given. The answer is £80,000. £80 per share × 1,000 shares = £80,000 total dividend payout.", "consequence": "<strong>£80,000 flows to shareholders.</strong> The employees' union representative frowns. <em>\"That's our pay rise money going into investors' pockets.\"</em> The conflict deepens.", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "The Story Continues", "title": "The Workers' Claim", "scene": "scene1", "body": "<p>After dividends, £120,000 of profit remains. The employees want a pay increase. Management wants to reinvest in the business. The local community wants GreenPack to fund a noise reduction barrier costing £25,000.</p><p>This is classic stakeholder conflict — limited resources, unlimited demands. A business must prioritise.</p>", "factBox": {"label": "Managing Conflict", "text": "Businesses manage stakeholder conflict through compromise, communication, and prioritisation. They might negotiate smaller pay rises while also investing some profit, or phase improvements over time. Ignoring stakeholders can lead to strikes, boycotts, or legal action."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Stakeholder Conflict", "title": "The Compromise Budget", "scene": "scene3", "body": "<p>From the remaining <strong>£120,000</strong>, the board agrees to: spend <strong>£25,000</strong> on the noise barrier for residents, allocate <strong>£45,000</strong> for employee bonuses, and reinvest the rest in new equipment.</p><p>How much is left for <strong>reinvestment in equipment</strong>?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Reinvestment = Remaining profit − noise barrier − bonuses</p><p>= £120,000 − £25,000 − £45,000 = ?</p>"}, "question": "How much money is available for reinvestment in equipment?", "unit": "£", "answer": 50000, "tolerance": 0, "maxAttempts": 2, "hintText": "£120,000 − £25,000 − £45,000. Subtract both amounts from the remaining profit.", "feedbackCorrect": "£50,000 for equipment — a balanced compromise that addresses multiple stakeholders.", "feedbackWrong": "A common mistake is making general business statements without applying them to the specific case study scenario. Always use the data given. The answer is £50,000. £120,000 − £25,000 − £45,000 = £50,000.", "consequence": "<strong>Every stakeholder gets something.</strong> Shareholders received dividends, employees get bonuses, residents get noise protection, and the business gets new equipment. Not everyone is fully happy, but that's the nature of compromise.", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "The Story Continues", "title": "The Final Decision", "scene": "scene2", "body": "<p>The expansion goes ahead, but an environmental pressure group launches a campaign against GreenPack, claiming the new factory wing will increase carbon emissions by 30%.</p><p>The CEO asks you: <em>\"Taylor, should we ignore them or engage? They're not customers or shareholders — do they even count as stakeholders?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Stakeholder Conflict", "title": "The Pressure Group", "scene": "scene3", "body": "<p>An environmental pressure group is campaigning against the factory expansion. They have no financial stake in GreenPack. The CEO asks whether they should be treated as stakeholders.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "Should the environmental pressure group be considered a stakeholder?", "options": [{"text": "No — only people who own shares in the company are stakeholders", "correct": false}, {"text": "No — they have no financial connection to the business", "correct": false}, {"text": "Yes — anyone affected by or able to influence the business is a stakeholder", "correct": true}, {"text": "Yes — but only if the government forces the company to listen to them", "correct": false}], "maxAttempts": 2, "hintText": "A stakeholder is anyone with an interest in or influence over the business. Can a pressure group influence GreenPack's reputation?", "feedbackCorrect": "Correct. Stakeholders include any group affected by or able to influence the business. Pressure groups can damage reputation, trigger boycotts, or influence regulation.", "feedbackWrong": "A common mistake is making general business statements without applying them to the specific case study scenario. Always use the data given. The answer is: yes — anyone affected by or able to influence the business is a stakeholder. This includes pressure groups, who can impact the business through campaigns and public opinion.", "consequence": "<strong>GreenPack engages with the pressure group</strong> and agrees to install carbon filters. The campaign ends, and the company gains a reputation for responsible business. Sometimes the stakeholders you ignore are the ones who matter most.", "next": "end", "examTip": "In the exam, structure your answer with clear business reasoning: point, explanation, application to the case study, evaluation of alternatives.", "bloomsLevel": "Understand"}], "ending": {"title": "The Stakeholder", "perfect": "Masterful stakeholder management, Taylor! You balanced competing interests, calculated financial trade-offs, and understood that stakeholders extend beyond shareholders.", "partial": "The expansion went ahead, but your grasp of stakeholder conflict needs strengthening. Review how businesses balance competing interests and try again.", "retry": "Want to navigate the stakeholder maze again?", "topic": "Stakeholder Conflict"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
