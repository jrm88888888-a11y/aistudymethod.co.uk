<script>const STORY_DATA = {"meta": {"title": "The Supply Chain", "subtitle": "A toy company's supply chain is breaking down. Can you fix it before Christmas?", "subject": "Business Studies", "topic": "Supply Chain Management", "level": "KS3", "tags": ["💼 Business Studies", "KS3 · Year 7–9", "Supply Chain", "~10 min", "3 questions"], "intro": "You are Morgan Lee, logistics manager at ToyBox Ltd. It's October, and Christmas orders are flooding in. But your main supplier has just doubled delivery times, stock is running low, and retailers are threatening to cancel orders. You must optimise the supply chain before the holiday season collapses."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='200' width='400' height='50' fill='#706860'/><rect x='20' y='80' width='80' height='70' fill='#8a7868'/><rect x='140' y='80' width='80' height='70' fill='#8a7868'/><rect x='260' y='80' width='80' height='70' fill='#8a7868'/><line x1='100' y1='115' x2='140' y2='115' stroke='#706860' stroke-width='3'/><line x1='220' y1='115' x2='260' y2='115' stroke='#706860' stroke-width='3'/><rect x='90' y='110' width='15' height='10' fill='#a09080'/><rect x='210' y='110' width='15' height='10' fill='#a09080'/><rect x='50' y='170' width='300' height='25' fill='#a09080'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='60' y='60' width='280' height='140' fill='#8a7868'/><rect x='80' y='80' width='50' height='100' fill='#706860'/><rect x='150' y='80' width='50' height='100' fill='#706860'/><rect x='220' y='80' width='50' height='100' fill='#706860'/><rect x='290' y='80' width='30' height='100' fill='#b0a898'/><line x1='60' y1='180' x2='340' y2='180' stroke='#c8b8a8' stroke-width='2'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='220' width='400' height='30' fill='#706860'/><circle cx='80' cy='120' r='35' fill='#8a7868'/><circle cx='200' cy='120' r='35' fill='#8a7868'/><circle cx='320' cy='120' r='35' fill='#8a7868'/><line x1='115' y1='120' x2='165' y2='120' stroke='#706860' stroke-width='3'/><line x1='235' y1='120' x2='285' y2='120' stroke='#706860' stroke-width='3'/><circle cx='80' cy='120' r='15' fill='#a09080'/><circle cx='200' cy='120' r='15' fill='#a09080'/><circle cx='320' cy='120' r='15' fill='#a09080'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Chain Breaks", "scene": "scene1", "body": "<p>ToyBox Ltd manufactures and distributes toys to 200 retailers across the UK. The supply chain runs: <strong>Raw materials → Factory → Warehouse → Retailer → Customer</strong>.</p><p>But your plastic supplier has been hit by a shortage. Delivery times have doubled from 2 weeks to 4 weeks. Meanwhile, retailers need stock in 6 weeks for Christmas displays.</p><p>The <strong>supply chain</strong> is the network of businesses and processes involved in getting a product from raw materials to the final customer. If one link breaks, the whole chain suffers.</p>", "factBox": {"label": "Supply Chain", "text": "A supply chain includes all stages from raw materials to the final customer: suppliers → manufacturers → distributors → retailers → consumers. Effective supply chain management ensures the right products reach the right place at the right time, at minimum cost. Disruptions at any stage can cascade through the entire chain."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Supply Chain", "title": "Stock Shortfall", "scene": "scene2", "body": "<p>ToyBox needs <strong>10,000 units</strong> ready for Christmas. The factory currently produces <strong>1,500 units per week</strong> and has <strong>6 weeks</strong> until the delivery deadline. However, the factory can only start production <strong>after materials arrive in 4 weeks</strong>, leaving just <strong>2 weeks</strong> of production time.</p><p>How many units can be produced in the available time?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Available production time = 6 weeks − 4 weeks delay = 2 weeks</p><p>Units produced = 1,500 × 2 = ?</p>"}, "question": "How many units can ToyBox produce in the available time?", "unit": "units", "answer": 3000, "tolerance": 0, "maxAttempts": 2, "hintText": "Only 2 weeks of production time available. 1,500 units per week × 2 weeks = ?", "feedbackCorrect": "3,000 units — but ToyBox needs 10,000. That's a shortfall of 7,000 units. The supply chain disruption is severe.", "feedbackWrong": "A common mistake is making general business statements without applying them to the specific case study scenario. Always use the data given. The answer is 3,000 units. 1,500 per week × 2 available weeks = 3,000. Far short of the 10,000 target.", "consequence": "<strong>Only 3,000 out of 10,000.</strong> Retailers will be furious. You need a plan B — and fast.", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "The Story Continues", "title": "Plan B", "scene": "scene3", "body": "<p>You find an alternative supplier who can deliver materials in just <strong>1 week</strong>, but charges <strong>£2 per unit more</strong> than the original supplier. The original cost was £3 per unit.</p><p>Using this supplier gives you <strong>5 weeks of production</strong> (6 weeks minus 1 week delivery), enough to produce 7,500 units. Combined with existing stock, you'd meet the 10,000 target — but at a higher cost.</p>", "factBox": {"label": "Supply Chain Trade-Offs", "text": "Businesses often face trade-offs in supply chain management: speed vs cost, quality vs price, single supplier (risky but cheaper) vs multiple suppliers (safer but more complex). The cheapest option isn't always the best if it causes delays or stockouts."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Supply Chain", "title": "The Extra Cost", "scene": "scene2", "body": "<p>The alternative supplier charges <strong>£5 per unit</strong> instead of £3. ToyBox needs materials for <strong>7,500 units</strong> from this supplier. What is the <strong>extra cost</strong> compared to using the original supplier for these units?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Extra cost per unit = £5 − £3 = £2</p><p>Total extra cost = £2 × 7,500 = ?</p>"}, "question": "What is the total extra cost of using the alternative supplier?", "unit": "£", "answer": 15000, "tolerance": 0, "maxAttempts": 2, "hintText": "The price difference is £2 per unit. Multiply by 7,500 units.", "feedbackCorrect": "£15,000 extra — a significant cost. But losing the Christmas orders would cost far more in lost revenue and damaged retailer relationships.", "feedbackWrong": "A common mistake is making general business statements without applying them to the specific case study scenario. Always use the data given. The answer is £15,000. £2 extra per unit × 7,500 units = £15,000.", "consequence": "<strong>£15,000 extra to save Christmas.</strong> The CEO authorises the spend. <em>\"Better to pay more now than lose our biggest retailers forever.\"</em>", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "The Story Continues", "title": "Lessons Learned", "scene": "scene1", "body": "<p>The crisis is averted — 10,000 units ship on time. But the board wants to prevent this happening again. They ask you to recommend a long-term supply chain strategy.</p>", "factBox": null, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Supply Chain", "title": "Future-Proofing", "scene": "scene3", "body": "<p>The board asks: <em>\"How do we prevent a single supplier disruption from threatening the entire business again?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is the best long-term strategy to reduce supply chain risk?", "options": [{"text": "Use the cheapest single supplier — cost savings outweigh all risks", "correct": false}, {"text": "Stop manufacturing and only sell digital products", "correct": false}, {"text": "Build relationships with multiple suppliers so alternatives are always available", "correct": true}, {"text": "Hold two years of stock in the warehouse to avoid ever running out", "correct": false}], "maxAttempts": 2, "hintText": "The crisis was caused by depending on just one supplier. How can you reduce that dependency?", "feedbackCorrect": "Multiple suppliers provide resilience. If one fails, others can step in. This is a core principle of supply chain risk management.", "feedbackWrong": "A common mistake is making general business statements without applying them to the specific case study scenario. Always use the data given. The correct answer is multiple suppliers. Relying on a single supplier creates a single point of failure. Diversifying suppliers reduces risk, even if it costs slightly more.", "consequence": "<strong>ToyBox signs contracts with three suppliers.</strong> The next year, when one has a delay, the others cover seamlessly. The supply chain is stronger than ever.", "next": "end", "examTip": "In the exam, apply business concepts to the specific scenario given. Use data from the case study to support your points.", "bloomsLevel": "Understand"}], "ending": {"title": "The Supply Chain", "perfect": "Exceptional logistics, Morgan! You calculated production shortfalls, weighed cost trade-offs, and built a resilient supply chain strategy. Christmas was saved.", "partial": "The toys shipped on time, but your supply chain analysis needs work. Review how disruptions cascade and the trade-off between cost and resilience.", "retry": "Want to manage the Christmas supply chain crisis again?", "topic": "Supply Chain Management"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
