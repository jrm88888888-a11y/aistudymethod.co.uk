<script>const STORY_DATA = {"meta": {"title": "The Depression Dilemma", "subtitle": "A patient is trapped in negative thinking. Can you apply Beck's cognitive triad and evaluate cognitive explanations of depression?", "subject": "Psychology", "topic": "Cognitive Explanations of Depression", "level": "A-Level", "tags": ["🧠 Psychology", "A-Level", "Cognitive Depression", "~12 min", "3 questions"], "intro": "You are a cognitive therapist working with a severely depressed patient. Using Beck's cognitive model and Ellis's ABC model, you must identify the distorted thinking patterns maintaining the depression and evaluate the cognitive approach."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#a09080'/><rect x='0' y='220' width='700' height='42' fill='#706860'/><rect x='150' y='120' width='400' height='80' fill='#8a7868'/><rect x='130' y='100' width='40' height='120' fill='#706860'/><rect x='530' y='100' width='40' height='120' fill='#706860'/><rect x='160' y='100' width='380' height='25' fill='#b0a898'/><circle cx='350' cy='70' r='25' fill='#8a7868'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><line x1='100' y1='30' x2='100' y2='210' stroke='#706860' stroke-width='2'/><line x1='100' y1='210' x2='620' y2='210' stroke='#706860' stroke-width='2'/><rect x='140' y='160' width='60' height='50' fill='#8a7868'/><rect x='240' y='120' width='60' height='90' fill='#8a7868'/><rect x='340' y='80' width='60' height='130' fill='#a09080'/><rect x='440' y='50' width='60' height='160' fill='#706860'/><rect x='540' y='100' width='60' height='110' fill='#8a7868'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#a09080'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><rect x='250' y='30' width='200' height='190' fill='#8a7868'/><rect x='300' y='20' width='100' height='20' fill='#706860'/><rect x='270' y='60' width='160' height='8' fill='#c8b8a8'/><rect x='270' y='80' width='140' height='8' fill='#c8b8a8'/><rect x='270' y='100' width='155' height='8' fill='#c8b8a8'/><rect x='270' y='120' width='120' height='8' fill='#c8b8a8'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Cognitive Trap", "scene": "scene1", "body": "<p>Rachel, aged 32, has been depressed for 8 months. She tells you: 'I'm completely useless. Nothing ever goes right for me. Things will never get better — what's the point?'</p><p>You recognise <strong>Beck's cognitive triad</strong> immediately:</p><p><strong>1. Negative view of SELF:</strong> 'I'm useless'<br/><strong>2. Negative view of the WORLD:</strong> 'Nothing goes right'<br/><strong>3. Negative view of the FUTURE:</strong> 'Things will never get better'</p><p><strong>Beck (1967)</strong> proposed that depression is caused and maintained by <strong>negative schemas</strong> (mental frameworks) that develop in childhood and are activated by stressful life events. These schemas produce <strong>cognitive distortions</strong> — systematic errors in thinking that maintain the depressive cycle.</p>", "factBox": {"label": "Beck's Cognitive Model (1967)", "text": "Depression results from negative schemas activated by critical events. These schemas produce the cognitive triad and cognitive distortions including: overgeneralisation ('everything is bad'), catastrophising ('the worst will happen'), selective abstraction (focusing only on negatives), and personalisation (blaming yourself for everything)."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Cognitive Depression", "title": "Beck's Year", "scene": "scene2", "body": "<p>Beck developed his cognitive model of depression based on clinical observations of depressed patients. He noticed that their thinking was systematically distorted in predictable ways.</p><p>In what year did Beck publish his influential cognitive model of depression?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "Historical context", "steps": "<p>Beck published his cognitive model of depression in 1967.</p><p>This was the same decade as the cognitive revolution in psychology.</p>"}, "question": "In what year did Beck publish his cognitive model of depression?", "unit": "", "answer": 1967, "tolerance": 0, "maxAttempts": 2, "hintText": "Beck's model was published in 1967 — during the cognitive revolution of the 1960s.", "feedbackCorrect": "Correct — 1967. Beck's model was revolutionary because it shifted the focus from unconscious conflicts (psychoanalysis) to conscious, identifiable thought patterns — making depression treatable through cognitive restructuring.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The answer is 1967. Beck published his cognitive model of depression in 1967, proposing that negative schemas and cognitive distortions maintain depressive episodes.", "consequence": "<strong>Over 55 years later, Beck's model remains the foundation of CBT</strong> — the most widely used and evidence-based psychological treatment for depression.", "next": "mid1", "bloomsLevel": "Analyse"}, {"id": "mid1", "type": "story", "chapter": "Ellis's ABC Model", "title": "The Alternative Cognitive View", "scene": "scene1", "body": "<p>Another cognitive explanation comes from <strong>Albert Ellis (1962)</strong> and his <strong>ABC model</strong>:</p><p><strong>A — Activating event:</strong> Rachel fails a work presentation<br/><strong>B — Belief:</strong> 'I'm a total failure. I can't do anything right.' (irrational belief)<br/><strong>C — Consequence:</strong> Depression, withdrawal, avoidance of future presentations</p><p>Ellis argued that it is not the event itself that causes the emotional response, but the <strong>irrational beliefs</strong> about the event. He identified common irrational beliefs including <strong>'musturbation'</strong> (rigid demands: 'I MUST be perfect'), <strong>'awfulising'</strong> (catastrophising minor setbacks), and <strong>'I-can't-stand-it-itis'</strong> (believing one cannot tolerate frustration).</p><p>Ellis developed <strong>Rational Emotive Behaviour Therapy (REBT)</strong> to challenge these irrational beliefs and replace them with rational alternatives.</p>", "factBox": {"label": "Ellis vs Beck", "text": "Both propose that cognition causes depression, but differ in focus. Beck emphasises automatic negative thoughts and cognitive distortions arising from negative schemas. Ellis emphasises irrational beliefs and demands ('musts' and 'shoulds'). Both have strong evidence bases and inform CBT practice."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Cognitive Depression", "title": "The ABC Components", "scene": "scene2", "body": "<p>Ellis's ABC model has three components: <strong>A</strong> (Activating event), <strong>B</strong> (Belief), and <strong>C</strong> (Consequence).</p><p>In therapy, Ellis added two more stages: <strong>D</strong> (Dispute — challenging the irrational belief) and <strong>E</strong> (Effect — the new, healthier emotional response). This makes it the <strong>ABCDE model</strong>.</p><p>How many total components are in Ellis's extended ABCDE model?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "Count the stages", "steps": "<p>A — Activating event</p><p>B — Belief</p><p>C — Consequence</p><p>D — Dispute</p><p>E — Effect</p>"}, "question": "How many components are in Ellis's extended ABCDE model?", "unit": "components", "answer": 5, "tolerance": 0, "maxAttempts": 2, "hintText": "A, B, C, D, E — count the letters.", "feedbackCorrect": "Correct — 5 components. The D (Dispute) stage is where therapy happens — the therapist helps the client challenge irrational beliefs and develop more rational alternatives, leading to E (a healthier emotional Effect).", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The answer is 5. The extended model has 5 stages: Activating event, Belief, Consequence, Dispute, and Effect.", "consequence": "<strong>Rachel begins to see the pattern.</strong> Her depression isn't caused by events themselves, but by her irrational interpretations. By disputing these beliefs, she can change the emotional consequence.", "next": "mid2", "bloomsLevel": "Analyse"}, {"id": "mid2", "type": "story", "chapter": "Evaluation", "title": "Strengths and Limitations", "scene": "scene3", "body": "<p><strong>Strengths of the cognitive approach:</strong></p><p>— CBT is highly effective for depression (NICE-recommended)<br/>— Supported by extensive research evidence<br/>— Empowers patients by teaching coping skills<br/>— Identifies specific, measurable thought patterns</p><p><strong>Limitations:</strong></p><p>— <strong>Cause or consequence?</strong> Negative thinking may be a SYMPTOM of depression, not a CAUSE. Depressed mood may produce negative thoughts, not the other way round.<br/>— <strong>Biological factors ignored:</strong> The cognitive model downplays neurotransmitter imbalances and genetic factors.<br/>— <strong>Blame the patient?</strong> Suggesting depression is caused by 'faulty thinking' could imply it's the patient's fault.</p>", "factBox": {"label": "The Cause-Consequence Debate", "text": "A major criticism: does negative thinking cause depression, or does depression cause negative thinking? Longitudinal studies suggest both are true — it's a bidirectional relationship. Negative schemas may predispose to depression (cause), and depressive episodes strengthen negative schemas (consequence). This creates a vicious cycle."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Cognitive Depression", "title": "The Key Criticism", "scene": "scene1", "body": "<p>What is the most significant criticism of cognitive explanations of depression?</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is the main criticism of the cognitive approach to depression?", "options": [{"text": "Negative thinking may be a symptom of depression rather than a cause — the direction of causality is unclear", "correct": true}, {"text": "CBT has no evidence base — it has never been tested in clinical trials", "correct": false}, {"text": "The cognitive approach says depression is entirely biological and ignores thinking", "correct": false}, {"text": "Beck and Ellis completely agree on every aspect of the cognitive model", "correct": false}], "maxAttempts": 2, "hintText": "The question is about CAUSE and EFFECT. Does negative thinking CAUSE depression, or does depression CAUSE negative thinking? The answer is not straightforward.", "feedbackCorrect": "Exactly right. The cognitive approach assumes negative thinking causes depression, but it could equally be that depression produces negative thinking. This chicken-and-egg problem (the cause-consequence debate) is the most fundamental criticism of the cognitive model.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The correct answer is that negative thinking may be a symptom rather than a cause. The direction of causality is unclear — depressed mood may generate negative thoughts rather than negative thoughts causing depression.", "consequence": "<strong>Rachel's therapy addresses both cognition and biology.</strong> She receives CBT to challenge negative thinking AND an SSRI to address neurochemical factors. The best treatment acknowledges multiple causes.", "next": "end", "examTip": "In the exam, name the specific model (e.g., Multi-Store Model, Working Memory Model) and evaluate it with research evidence for and against.", "bloomsLevel": "Evaluate"}], "ending": {"perfect": "Excellent evaluation of cognitive explanations. You accurately recalled Beck's model, Ellis's ABCDE framework, and identified the key limitation around causality.", "partial": "Good work. Review Beck's cognitive triad (1967), Ellis's ABCDE model, and the cause-consequence debate about whether cognition causes or results from depression.", "retry": "Want to revisit the depression case and master cognitive explanations?", "topic": "Beck (1967) proposed the cognitive triad (negative views of self, world, future) maintained by negative schemas and cognitive distortions. Ellis (1962) proposed the ABCDE model. Key criticism: negative thinking may be a symptom of depression, not a cause. CBT is NICE-recommended and highly effective."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
<!-- Reading progress bar (site-wide story upgrade) -->
<div id="aism-readbar" aria-hidden="true" style="position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#2d8f5a,#7b6fff);z-index:9999;pointer-events:none;"></div>
<script>
(function () {
  var bar = document.getElementById('aism-readbar');
  if (!bar) return;
  var ticking = false;
  function update() {
    ticking = false;
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    if (max <= 0) { bar.style.width = '0'; return; }
    var pct = Math.min(100, Math.max(0, (window.scrollY || doc.scrollTop) / max * 100));
    bar.style.width = pct + '%';
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>
