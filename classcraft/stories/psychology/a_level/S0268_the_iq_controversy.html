<script>const STORY_DATA = {"meta": {"title": "The IQ Controversy", "subtitle": "IQ tests claim to measure intelligence. But are they valid, reliable, and fair?", "subject": "Psychology", "topic": "Intelligence & Its Measurement", "level": "A-Level", "tags": ["🧠 Psychology", "A-Level", "Intelligence Testing", "~12 min", "3 questions"], "intro": "You are a psychometrician reviewing IQ testing policy for a school district. IQ tests have been used for over a century, but debate rages about what they actually measure, whether they are culturally biased, and whether 'intelligence' is even a single construct."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#a09080'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><rect x='250' y='30' width='200' height='190' fill='#8a7868'/><rect x='300' y='20' width='100' height='20' fill='#706860'/><rect x='270' y='60' width='160' height='8' fill='#c8b8a8'/><rect x='270' y='80' width='140' height='8' fill='#c8b8a8'/><rect x='270' y='100' width='155' height='8' fill='#c8b8a8'/><rect x='270' y='120' width='120' height='8' fill='#c8b8a8'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><line x1='100' y1='30' x2='100' y2='210' stroke='#706860' stroke-width='2'/><line x1='100' y1='210' x2='620' y2='210' stroke='#706860' stroke-width='2'/><rect x='140' y='160' width='60' height='50' fill='#8a7868'/><rect x='240' y='120' width='60' height='90' fill='#8a7868'/><rect x='340' y='80' width='60' height='130' fill='#a09080'/><rect x='440' y='50' width='60' height='160' fill='#706860'/><rect x='540' y='100' width='60' height='110' fill='#8a7868'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><rect x='345' y='60' width='10' height='140' fill='#8a7868'/><polygon points='350,50 320,60 380,60' fill='#706860'/><line x1='200' y1='80' x2='500' y2='80' stroke='#8a7868' stroke-width='3'/><path d='M170 80 L200 130 L230 80' fill='none' stroke='#706860' stroke-width='2'/><path d='M470 80 L500 130 L530 80' fill='none' stroke='#706860' stroke-width='2'/><ellipse cx='200' cy='135' rx='35' ry='10' fill='#a09080'/><ellipse cx='500' cy='135' rx='35' ry='10' fill='#a09080'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "Measuring the Mind", "scene": "scene1", "body": "<p>IQ (Intelligence Quotient) testing began with <strong>Binet and Simon (1905)</strong> in France, designed to identify children who needed extra educational support. The modern IQ scale sets the <strong>mean at 100</strong> with a <strong>standard deviation of 15</strong>.</p><p>But what does IQ actually measure? <strong>Spearman (1904)</strong> proposed 'g' — a single general intelligence factor underlying all mental abilities. <strong>Gardner (1983)</strong> proposed <strong>multiple intelligences</strong> (linguistic, logical-mathematical, musical, spatial, bodily-kinaesthetic, interpersonal, intrapersonal, naturalistic) — arguing IQ tests only measure a narrow slice of human ability.</p><p><strong>Sternberg (1985)</strong> proposed a <strong>triarchic theory</strong>: analytical, creative, and practical intelligence — only the first is captured by traditional IQ tests.</p>", "factBox": {"label": "The IQ Scale", "text": "Modern IQ tests (e.g., WAIS, WISC) use a deviation IQ: mean = 100, SD = 15. Approximately 68% of the population scores between 85 and 115. About 95% scores between 70 and 130. Scores below 70 traditionally indicated intellectual disability; scores above 130 indicated giftedness."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Intelligence", "title": "The Mean IQ", "scene": "scene2", "body": "<p>Modern IQ tests are standardised so that the mean score for the general population is a specific value. This value is set by convention and has been used since the development of the deviation IQ scale.</p><p>What is the mean IQ score on a standard IQ test?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "IQ scale", "steps": "<p>The deviation IQ scale:</p><p>Mean = 100</p><p>Standard deviation = 15</p><p>68% score between 85 and 115</p>"}, "question": "What is the mean IQ score on a standardised IQ test?", "unit": "", "answer": 100, "tolerance": 0, "maxAttempts": 2, "hintText": "The IQ scale is designed with a round number as its centre point — 100.", "feedbackCorrect": "Correct — 100. This is a convention: the tests are designed and standardised so that the average score is always 100, with a standard deviation of 15.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The answer is 100. IQ tests are standardised with a mean of 100 and a standard deviation of 15.", "consequence": "<strong>100 — the benchmark.</strong> But what does scoring above or below 100 actually mean? That depends on whether you believe IQ tests capture something real and meaningful about human intelligence.", "next": "mid1", "bloomsLevel": "Analyse"}, {"id": "mid1", "type": "story", "chapter": "The Bias Question", "title": "Cultural Fairness", "scene": "scene1", "body": "<p>A major concern is <strong>cultural bias</strong>. IQ tests have historically been developed in Western, English-speaking countries. Items may reflect specific cultural knowledge rather than universal intelligence.</p><p><strong>Gould (1981)</strong> argued in 'The Mismeasure of Man' that IQ tests have been used to justify racial and class-based discrimination. Early IQ testing in the US was used to support racist immigration policies and forced sterilisation programmes.</p><p>Even modern 'culture-fair' tests (like Raven's Progressive Matrices) may contain hidden biases — familiarity with abstract pattern tasks, test-taking experience, and educational opportunity all affect performance.</p>", "factBox": {"label": "The Flynn Effect", "text": "James Flynn discovered that IQ scores have been rising steadily at about 3 points per decade across the 20th century in all countries studied. This 'Flynn Effect' suggests IQ is strongly influenced by environmental factors (nutrition, education, environmental complexity) — not just genetics. If IQ were purely genetic, this rapid change would be impossible."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Intelligence", "title": "The Flynn Effect", "scene": "scene2", "body": "<p>The <strong>Flynn Effect</strong> refers to the steady rise in IQ scores observed across the 20th century. Flynn found that scores increased by approximately <strong>3 points per decade</strong> on average.</p><p>By approximately how many IQ points do scores increase per decade due to the Flynn Effect?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "The Flynn Effect", "steps": "<p>Flynn discovered IQ scores rise over generations.</p><p>The rate is approximately 3 points per decade.</p><p>This has been observed across all countries studied.</p>"}, "question": "By approximately how many IQ points do scores increase per decade (Flynn Effect)?", "unit": "points", "answer": 3, "tolerance": 0, "maxAttempts": 2, "hintText": "The Flynn Effect shows an increase of about 3 IQ points per decade — roughly 30 points over a century.", "feedbackCorrect": "Correct — approximately 3 points per decade. This means that by today's standards, the average person in 1920 would score around 70 — technically in the 'intellectually disabled' range. This shows how strongly environmental factors influence IQ.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The answer is approximately 3 points per decade. The Flynn Effect demonstrates that IQ scores rise by about 3 points each decade — proof that environmental factors significantly affect measured intelligence.", "consequence": "<strong>Three points per decade — 30 points per century.</strong> This makes it impossible to argue that IQ is purely genetic. Environmental improvements (nutrition, education, healthcare) clearly boost measured intelligence.", "next": "mid2", "bloomsLevel": "Analyse"}, {"id": "mid2", "type": "story", "chapter": "The Decision", "title": "Should We Use IQ Tests?", "scene": "scene3", "body": "<p>You present your evaluation to the school district:</p><p><strong>For IQ testing:</strong> Good predictive validity for academic performance. Reliable (high test-retest reliability). Can identify children needing extra support.</p><p><strong>Against:</strong> Measures only narrow aspects of intelligence (ignores creativity, practical skills, emotional intelligence). Potential cultural bias. Risk of labelling and self-fulfilling prophecies. The Flynn Effect shows scores are environmentally malleable.</p><p>Your recommendation: use IQ tests as <strong>one tool among many</strong>, not as a definitive measure. Combine with teacher assessments, practical evaluations, and awareness of cultural/socioeconomic factors.</p>", "factBox": {"label": "Gardner's Multiple Intelligences", "text": "Gardner (1983) proposed 8 types of intelligence: linguistic, logical-mathematical, musical, spatial, bodily-kinaesthetic, interpersonal, intrapersonal, and naturalistic. Traditional IQ tests primarily measure linguistic and logical-mathematical intelligence, potentially undervaluing individuals gifted in other areas."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Intelligence", "title": "The Core Limitation", "scene": "scene1", "body": "<p>What is the most significant limitation of traditional IQ tests?</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is the main limitation of traditional IQ tests?", "options": [{"text": "They measure only a narrow range of cognitive abilities, ignoring creativity, practical skills, and emotional intelligence", "correct": true}, {"text": "They are completely random and have no predictive validity for anything", "correct": false}, {"text": "They are too easy — everyone gets the same score regardless of ability", "correct": false}, {"text": "They measure intelligence perfectly with no room for improvement", "correct": false}], "maxAttempts": 2, "hintText": "Think about what IQ tests DON'T measure — Gardner and Sternberg both argued that traditional tests miss large parts of human intelligence.", "feedbackCorrect": "Exactly right. Traditional IQ tests primarily measure linguistic and logical-mathematical abilities. Gardner's multiple intelligences and Sternberg's triarchic theory both highlight that this captures only a fraction of human cognitive ability.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The correct answer is that IQ tests measure only a narrow range of abilities. They have good predictive validity for academic performance but miss creativity, practical intelligence, emotional intelligence, and other important human capabilities.", "consequence": "<strong>The school district adopts a balanced assessment approach.</strong> IQ tests remain one tool, but are supplemented by creativity assessments, practical tasks, and teacher observations — a more complete picture of each child's potential.", "next": "end", "examTip": "In the exam, support every claim with named research evidence. State the study, its findings, and then evaluate its methodology.", "bloomsLevel": "Evaluate"}], "ending": {"perfect": "Excellent critical evaluation of IQ testing. You understood the scale, the Flynn Effect, and the key limitations. Your analysis was balanced and evidence-based.", "partial": "Good work. Review the IQ scale (mean 100, SD 15), the Flynn Effect (3 points/decade), and the arguments of Gardner and Sternberg about multiple types of intelligence.", "retry": "Want to revisit the IQ controversy and master intelligence theory?", "topic": "IQ tests: mean 100, SD 15 (Binet & Simon, 1905). The Flynn Effect shows 3-point/decade rise, proving environmental influence. Gardner (1983): 8 multiple intelligences. Traditional tests measure narrow abilities. Cultural bias is a concern. Best used as one tool among many."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
