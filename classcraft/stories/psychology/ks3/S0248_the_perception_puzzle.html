<script>const STORY_DATA = {"meta": {"title": "The Perception Puzzle", "subtitle": "Two witnesses see completely different things at the same event. Can you explain why?", "subject": "Psychology", "topic": "Perceptual Set", "level": "KS3", "tags": ["🧠 Psychology", "KS3 · Year 7–9", "Perceptual Set", "~10 min", "3 questions"], "intro": "You are a forensic psychologist called to a case where two witnesses describe the same event completely differently. One says the person was holding a weapon; the other says it was a phone. Using research on perceptual set, you must explain how expectations shape what we see."}, "scenes": {"scene1": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><rect x='150' y='60' width='180' height='150' fill='#8a7868'/><rect x='370' y='60' width='180' height='150' fill='#a09080'/><circle cx='240' cy='135' r='40' fill='#a09080'/><circle cx='460' cy='135' r='40' fill='#8a7868'/><polygon points='240,100 210,160 270,160' fill='#706860'/><polygon points='460,100 430,160 490,160' fill='#c8b8a8'/></svg>", "scene2": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><line x1='100' y1='30' x2='100' y2='210' stroke='#706860' stroke-width='2'/><line x1='100' y1='210' x2='620' y2='210' stroke='#706860' stroke-width='2'/><rect x='140' y='160' width='60' height='50' fill='#8a7868'/><rect x='240' y='120' width='60' height='90' fill='#8a7868'/><rect x='340' y='80' width='60' height='130' fill='#a09080'/><rect x='440' y='50' width='60' height='160' fill='#706860'/><rect x='540' y='100' width='60' height='110' fill='#8a7868'/></svg>", "scene3": "<svg viewBox='0 0 700 262' xmlns='http://www.w3.org/2000/svg'><rect width='700' height='262' fill='#b0a898'/><rect x='0' y='230' width='700' height='32' fill='#706860'/><circle cx='150' cy='120' r='50' fill='#8a7868'/><circle cx='135' cy='105' r='6' fill='#706860'/><circle cx='165' cy='105' r='6' fill='#706860'/><path d='M130 140 Q150 160 170 140' fill='none' stroke='#706860' stroke-width='3'/><circle cx='350' cy='120' r='50' fill='#8a7868'/><circle cx='335' cy='105' r='6' fill='#706860'/><circle cx='365' cy='105' r='6' fill='#706860'/><line x1='330' y1='140' x2='370' y2='140' stroke='#706860' stroke-width='3'/><circle cx='550' cy='120' r='50' fill='#8a7868'/><circle cx='535' cy='105' r='6' fill='#706860'/><circle cx='565' cy='105' r='6' fill='#706860'/><path d='M530 145 Q550 130 570 145' fill='none' stroke='#706860' stroke-width='3'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "Two Different Stories", "scene": "scene1", "body": "<p>Two witnesses watched the same incident from the same distance. Witness A says the suspect was holding 'a knife — definitely a knife.' Witness B says: 'It was a mobile phone. I'm sure of it.'</p><p>How can two people looking at the same thing see something completely different? The answer lies in <strong>perceptual set</strong> — the tendency for perception to be influenced by expectations, motivations, emotions, and prior experience.</p><p>Your brain doesn't passively record reality like a camera. Instead, it actively interprets incoming sensory data based on what it <strong>expects</strong> to see. This is called <strong>top-down processing</strong> — your knowledge and expectations shape your perception.</p>", "factBox": {"label": "Perceptual Set", "text": "Perceptual set is a predisposition to perceive things in a certain way based on expectations, context, motivation, emotion, and culture. It demonstrates that perception is an active process — we don't just see what is there, but what we expect to be there."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Perception", "title": "The Weapons Effect", "scene": "scene2", "body": "<p>You reference research by <strong>Payne (2001)</strong> on racial bias and perceptual set. In his study, participants were shown images of faces (Black or White) followed by an ambiguous object, and had to quickly identify whether it was a <strong>tool or a gun</strong>.</p><p>Participants misidentified tools as guns significantly more often when preceded by a Black face. The error rate for misidentifying tools as guns after a Black face prime was approximately <strong>35%</strong>, compared to about <strong>20%</strong> after a White face prime.</p><p>The detective asks: what was the error rate (percentage) for misidentifying tools as guns after a Black face prime?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "Payne (2001)", "steps": "<p>Error rate (tool → gun misidentification):</p><p>After Black face: ~35%</p><p>After White face: ~20%</p><p>This shows how racial stereotypes create a perceptual set that influences what people think they see.</p>"}, "question": "What was the error rate for misidentifying tools as guns after a Black face prime?", "unit": "%", "answer": 35, "tolerance": 2, "maxAttempts": 2, "hintText": "The error rate was approximately 35% — more than one in three participants made this misidentification.", "feedbackCorrect": "Correct — approximately 35%. This demonstrates how powerfully perceptual set, shaped by cultural stereotypes, can distort what people believe they see.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The answer is approximately 35%. Payne's study showed that stereotypes create a perceptual set: participants misidentified harmless tools as guns 35% of the time when primed with a Black face.", "consequence": "<strong>The detective shifts uncomfortably.</strong> 'So Witness A might have seen a knife because they expected to see one?' Exactly — their perceptual set shaped their perception of an ambiguous stimulus.", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "Deeper Analysis", "title": "Context and Expectation", "scene": "scene1", "body": "<p>You dig deeper into each witness's background. Witness A had recently watched a news report about knife crime in the area. Witness B had just been texting on their own phone.</p><p>This explains everything. Witness A was <strong>primed</strong> to see a weapon — their recent exposure to knife crime stories created an expectation. Witness B was primed by their own phone use — they expected to see what was already on their mind.</p><p>This is consistent with research by <strong>Bruner and Minturn (1955)</strong>, who showed that context dramatically affects perception. When people were shown an ambiguous figure that could be read as the letter 'B' or the number '13', those primed with letters saw 'B' and those primed with numbers saw '13'.</p>", "factBox": {"label": "Bruner & Minturn (1955)", "text": "Participants shown an ambiguous figure (B/13) perceived it differently depending on context. Those shown letters first saw 'B'; those shown numbers first saw '13'. This demonstrates that prior context creates a perceptual set that biases interpretation of ambiguous stimuli."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Perception", "title": "The Difference in Error", "scene": "scene2", "body": "<p>The prosecution lawyer asks you to calculate the <strong>difference</strong> in error rates from Payne's study. The misidentification rate was <strong>35%</strong> after a Black face prime and <strong>20%</strong> after a White face prime.</p><p>By how many percentage points did the error rate differ between the two conditions?</p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "Calculate the difference", "steps": "<p>Error rate (Black face prime): 35%</p><p>Error rate (White face prime): 20%</p><p>Difference = 35 − 20 = ?</p>"}, "question": "What is the percentage point difference in error rates between the two conditions?", "unit": "percentage points", "answer": 15, "tolerance": 0, "maxAttempts": 2, "hintText": "Simply subtract: 35 minus 20.", "feedbackCorrect": "Correct — a 15 percentage point difference. This significant gap shows how much perceptual set, driven by stereotypes, can bias perception of identical ambiguous stimuli.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The answer is 15 percentage points (35 − 20 = 15). The racial prime created a substantial difference in how the same objects were perceived.", "consequence": "<strong>Fifteen percentage points.</strong> The lawyer nods grimly. This data will be crucial for explaining how the witnesses could have seen different things.", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "The Verdict", "title": "Implications for Justice", "scene": "scene3", "body": "<p>Your testimony helps the court understand that neither witness was lying — they genuinely perceived different things. Perceptual set is not a conscious choice; it operates automatically and below awareness.</p><p>This has profound implications for the justice system. Eyewitness testimony, once considered the most reliable form of evidence, is now known to be highly fallible. Research suggests that mistaken eyewitness identification is the <strong>leading cause of wrongful convictions</strong>.</p><p>The judge asks you to confirm your core finding about perception.</p>", "factBox": {"label": "Eyewitness Reliability", "text": "The Innocence Project found that eyewitness misidentification contributed to approximately 69% of wrongful convictions later overturned by DNA evidence. Perceptual set, stress, weapon focus, and post-event information all distort eyewitness memory."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Perception", "title": "The Core Concept", "scene": "scene1", "body": "<p>The judge asks: 'In simple terms, what is perceptual set?'</p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "Which statement best describes perceptual set?", "options": [{"text": "A tendency to perceive things based on expectations, shaped by context, experience, and motivation", "correct": true}, {"text": "A mental disorder that causes people to hallucinate objects that aren't there", "correct": false}, {"text": "A type of memory that stores visual images permanently", "correct": false}, {"text": "A deliberate decision to lie about what you have seen", "correct": false}], "maxAttempts": 2, "hintText": "Perceptual set is about how expectations influence what we perceive — it's a normal psychological process, not a disorder or a choice.", "feedbackCorrect": "Exactly right. Perceptual set is a normal psychological process where our expectations, shaped by context, prior experience, emotion, and motivation, influence how we interpret ambiguous sensory information.", "feedbackWrong": "A common mistake is describing a study without evaluating it. Always discuss methodological strengths and weaknesses alongside the findings. The correct answer describes perceptual set as a tendency to perceive based on expectations. It is a normal psychological process — not a disorder or a deliberate choice.", "consequence": "<strong>The judge thanks you for your expert testimony.</strong> The case is resolved with a proper understanding of how perception works — a victory for psychological science in the courtroom.", "next": "end", "examTip": "In the exam, support every claim with named research evidence. State the study, its findings, and then evaluate its methodology.", "bloomsLevel": "Understand"}], "ending": {"perfect": "Exceptional forensic psychology work. You correctly explained perceptual set, referenced key research, and demonstrated how expectations shape perception. Your testimony would stand up in any court.", "partial": "Good effort. You understand the basics of perceptual set, but review the specific research by Payne (2001) and Bruner & Minturn (1955) to strengthen your evidence base.", "retry": "Want to revisit the perception case and master perceptual set?", "topic": "Perceptual set is the tendency for expectations to shape perception. Payne (2001) showed tools were misidentified as guns 35% of the time with racial priming. Bruner & Minturn (1955) demonstrated context effects with ambiguous figures. Perception is active, not passive."}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
