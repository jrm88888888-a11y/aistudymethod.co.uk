<script>const STORY_DATA = {"meta": {"title": "The Structure vs Agency", "subtitle": "A philosophy student confronts sociology's deepest question: are we puppets of society or masters of our fate?", "subject": "Sociology", "topic": "Structuration Theory", "level": "A-Level", "tags": ["📖 Sociology", "A-Level", "Structuration Theory", "~10 min", "3 questions"], "intro": "You are Erin, an A-level student tackling sociology's grand debate: structure vs agency. Marx and Durkheim saw society as a powerful structure constraining individuals. Weber and the interactionists championed human agency. Giddens tried to reconcile both. Your essay demands precision."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='50' y='40' width='300' height='80' fill='#8a7868'/><rect x='50' y='140' width='300' height='60' fill='#a09080'/><line x1='200' y1='120' x2='200' y2='140' stroke='#706860' stroke-width='3'/><polygon points='190,135 210,135 200,145' fill='#706860'/><line x1='200' y1='140' x2='200' y2='120' stroke='#c8b8a8' stroke-width='1'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><circle cx='130' cy='120' r='50' fill='#8a7868'/><circle cx='270' cy='120' r='50' fill='#8a7868'/><rect x='170' y='95' width='60' height='50' fill='#a09080'/><line x1='180' y1='120' x2='220' y2='120' stroke='#706860' stroke-width='4'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><ellipse cx='200' cy='120' rx='150' ry='70' fill='#8a7868'/><circle cx='200' cy='120' r='40' fill='#a09080'/><circle cx='200' cy='120' r='15' fill='#b0a898'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Grand Debate", "scene": "scene1", "body": "<p>Sociology's deepest division is between <strong>structuralism</strong> and <strong>social action theory</strong>. Structuralists (Marx, Durkheim, functionalists) argue society shapes individuals through powerful institutions. Social action theorists (Weber, interactionists) argue individuals create society through their meaningful actions.</p><p><strong>Anthony Giddens</strong> proposed <strong>structuration theory</strong> as a middle way. He argued structure and agency are not opposites — they are two sides of the same coin. Structures only exist because people reproduce them through their daily actions. But those actions are also constrained by structures.</p><p>This is the <strong>duality of structure</strong>: society shapes us, and we shape society, simultaneously.</p>", "factBox": {"label": "Structuration Theory (Giddens)", "text": "Giddens rejected the structure/agency dichotomy. His 'duality of structure' means: structures (rules and resources) are both the medium and the outcome of social action. We draw on structures to act, but our actions also reproduce (or transform) those structures. Example: language is a structure that enables communication — but every conversation also reproduces or changes language."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Structuration Theory", "title": "The Theoretical Landscape", "scene": "scene2", "body": "<p>Your textbook identifies the main theoretical perspectives in sociology: <strong>Functionalism, Marxism, Feminism, Interactionism, Postmodernism, and the New Right</strong>. Of these, your teacher classifies functionalism, Marxism, and feminism as primarily <strong>structural</strong> (macro) perspectives, and interactionism as primarily an <strong>action</strong> (micro) perspective.</p><p><em>\"How many of the six perspectives are classified as structural?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Count the structural perspectives listed: Functionalism, Marxism, Feminism.</p><p>That gives us...</p>"}, "question": "How many perspectives are classified as structural?", "unit": "perspectives", "answer": 3, "tolerance": 0, "maxAttempts": 2, "hintText": "Structural = macro, focusing on how society shapes individuals. The teacher listed three: functionalism, Marxism, feminism.", "feedbackCorrect": "3 structural perspectives — functionalism, Marxism, and feminism all focus on how large-scale social structures shape behaviour and inequality.", "feedbackWrong": "A common mistake is using everyday language instead of sociological concepts. Use terms like 'socialisation', 'norms', 'values', and name specific theorists. The answer is 3. Functionalism, Marxism, and Feminism are the structural perspectives.", "consequence": "<strong>Three macro perspectives vs one micro.</strong> This imbalance shows how sociology has historically emphasised structure over agency — which is exactly what Giddens tried to rebalance.", "next": "mid1", "bloomsLevel": "Analyse"}, {"id": "mid1", "type": "story", "chapter": "The Duality", "title": "Rules and Resources", "scene": "scene2", "body": "<p>Giddens explains structure through two components: <strong>rules</strong> (norms, laws, expectations) and <strong>resources</strong> (material wealth, authority, knowledge). Every social action draws on these rules and resources — but also reproduces or transforms them.</p><p>Consider education: the structure of schooling (timetables, exams, hierarchy) constrains students. But students also reproduce that structure by attending, obeying rules, and sitting exams. If enough students refused, the structure would collapse. Structure depends on agency.</p><p>This makes Giddens both structural AND action-oriented — a 'third way' in sociological theory.</p>", "factBox": {"label": "Rules and Resources", "text": "Rules: the norms, expectations, and procedures that guide social action (e.g. exam rules, workplace procedures, cultural norms). Resources: authoritative (power over people) and allocative (material possessions). Social systems are patterns of interaction that are reproduced across time and space. Structures exist 'virtually' — they only become real when people enact them through practice."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Structuration Theory", "title": "The Agency Measure", "scene": "scene3", "body": "<p>A study surveys <strong>1,000 workers</strong> about their experience of workplace rules. <strong>680</strong> say they follow workplace rules without questioning them (reproducing structure). <strong>200</strong> say they sometimes challenge or bend the rules (exercising agency). <strong>120</strong> say they actively try to change workplace rules (transforming structure).</p><p><em>\"What percentage of workers actively try to transform workplace structures?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Percentage = (transformers ÷ total) × 100</p><p>= (120 ÷ 1,000) × 100 = ?</p>"}, "question": "What percentage actively try to transform structures?", "unit": "%", "answer": 12, "tolerance": 0, "maxAttempts": 2, "hintText": "120 ÷ 1,000 = 0.12. Multiply by 100.", "feedbackCorrect": "12% — a minority actively try to change structures. Giddens would note that both reproduction (68%) and transformation (12%) are expressions of agency, not just the latter.", "feedbackWrong": "A common mistake is using everyday language instead of sociological concepts. Use terms like 'socialisation', 'norms', 'values', and name specific theorists. The answer is 12%. 120 ÷ 1,000 = 0.12 = 12%.", "consequence": "<strong>Most reproduce, some bend, a few transform.</strong> Giddens would say all three groups exercise agency — even those who follow rules are choosing to reproduce structure.", "next": "mid2", "bloomsLevel": "Analyse"}, {"id": "mid2", "type": "story", "chapter": "The Critique", "title": "Problems with Giddens", "scene": "scene3", "body": "<p>Giddens' structuration theory is elegant but not without critics. <strong>Marxists</strong> argue he underestimates the power of economic structures — workers in a sweatshop have very little agency to 'transform' their conditions. <strong>Feminists</strong> argue he neglects how patriarchy constrains women's choices more than men's.</p><p><strong>Archer</strong> (a critical realist) argues Giddens conflates structure and agency — they should be analysed separately because they operate on different timescales. Structures precede individuals (you are born into a pre-existing class system) and outlast them.</p>", "factBox": {"label": "Critiques of Giddens", "text": "Marxist critique: underestimates structural power and constraint — not all agents are equally able to transform structures. Feminist critique: ignores gendered nature of structural constraint. Archer's morphogenetic approach: structure and agency should be analysed separately, not merged. Structure pre-dates individuals and constrains them before they can exercise agency. Postmodernists: Giddens still assumes a coherent, knowable social world."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Structuration Theory", "title": "The Core Concept", "scene": "scene1", "body": "<p>Your essay requires you to define: <em>\"What does Giddens mean by the 'duality of structure'?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What is the 'duality of structure'?", "options": [{"text": "Structure and agency are completely separate forces that never interact", "correct": false}, {"text": "Structure is both the medium and the outcome of social action — it constrains and enables agency simultaneously", "correct": true}, {"text": "There are two types of social structure: economic and cultural", "correct": false}, {"text": "Society has a dual nature: one visible and one hidden", "correct": false}], "maxAttempts": 2, "hintText": "'Duality' means two-sided. Structure is BOTH the thing that shapes our actions AND the product of those actions.", "feedbackCorrect": "The duality of structure means structure simultaneously constrains and enables action, while being reproduced or transformed by that same action. Structure and agency are inseparable.", "feedbackWrong": "A common mistake is using everyday language instead of sociological concepts. Use terms like 'socialisation', 'norms', 'values', and name specific theorists. The correct answer is that structure is both the medium (enabling action) and the outcome (produced by action) of social practices.", "consequence": "<strong>Your essay bridges the grand divide.</strong> Giddens showed that the structure-agency debate was based on a false dichotomy — both operate together in every social interaction.", "next": "end", "examTip": "In the exam, use named sociological perspectives and theorists. Evaluate each viewpoint by considering its strengths and at least one criticism.", "bloomsLevel": "Evaluate"}], "ending": {"title": "The Structure vs Agency", "perfect": "A masterful essay, Erin. You navigated structuration theory, measured agency in practice, and evaluated Giddens with critical precision.", "partial": "Good engagement with the structure-agency debate, but some concepts need sharpening. Review the duality of structure and Archer's critique.", "retry": "Want to revisit the structure vs agency debate?", "topic": "Structuration Theory"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      const _y = document.getElementById('year'); if (_y) _y.textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav (legacy classcraft drawer — guarded; AI Study Method uses a global nav) ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    if (toggle && links && overlay) {
      const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
      const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
      toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
      overlay.addEventListener('click',  close);
      links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
    }

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
