<script>const STORY_DATA = {"meta": {"title": "The Ethnicity", "subtitle": "A school governor examines the achievement gap between ethnic groups. The data demands answers.", "subject": "Sociology", "topic": "Ethnicity & Achievement", "level": "GCSE", "tags": ["📖 Sociology", "GCSE", "Ethnicity & Achievement", "~10 min", "3 questions"], "intro": "You are Fatima, a school governor tasked with explaining why ethnic minority students achieve differently. Is it home culture, school factors, or structural racism? The data is clear — the explanations are contested."}, "scenes": {"scene1": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='200' width='400' height='50' fill='#706860'/><rect x='40' y='40' width='2' height='160' fill='#8a7868'/><rect x='40' y='180' width='320' height='2' fill='#8a7868'/><rect x='60' y='60' width='40' height='120' fill='#706860'/><rect x='120' y='80' width='40' height='100' fill='#a09080'/><rect x='180' y='100' width='40' height='80' fill='#8a7868'/><rect x='240' y='70' width='40' height='110' fill='#706860'/><rect x='300' y='120' width='40' height='60' fill='#a09080'/></svg>", "scene2": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#a09080'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='60' y='50' width='280' height='150' fill='#8a7868'/><circle cx='130' cy='110' r='25' fill='#706860'/><circle cx='200' cy='110' r='25' fill='#b0a898'/><circle cx='270' cy='110' r='25' fill='#706860'/><rect x='80' y='150' width='240' height='30' fill='#a09080'/></svg>", "scene3": "<svg viewBox='0 0 400 250' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='250' fill='#b0a898'/><rect x='0' y='210' width='400' height='40' fill='#706860'/><rect x='50' y='50' width='140' height='150' fill='#8a7868'/><rect x='210' y='50' width='140' height='150' fill='#a09080'/><rect x='70' y='70' width='100' height='20' fill='#a09080'/><rect x='70' y='100' width='60' height='20' fill='#706860'/><rect x='230' y='70' width='100' height='20' fill='#8a7868'/><rect x='230' y='100' width='100' height='20' fill='#706860'/><rect x='230' y='130' width='80' height='20' fill='#706860'/></svg>"}, "nodes": [{"id": "start", "type": "story", "chapter": "Mission Briefing", "title": "The Achievement Data", "scene": "scene1", "body": "<p>Educational achievement varies significantly by ethnicity in the UK. Chinese and Indian students consistently outperform the national average. White British students perform near the average. Black Caribbean and White working-class boys underperform.</p><p>But why? Explanations fall into three broad categories: <strong>home factors</strong> (family values, cultural attitudes to education), <strong>school factors</strong> (teacher labelling, institutional racism), and <strong>structural factors</strong> (poverty, discrimination in the labour market).</p>", "factBox": {"label": "Ethnicity and Achievement", "text": "Patterns: Chinese and Indian students achieve the highest GCSE grades on average. Bangladeshi and Pakistani students have improved significantly. Black Caribbean boys and White working-class boys underperform. Explanations include: cultural capital, parental expectations, teacher expectations and labelling, institutional racism, material deprivation, and the intersection of ethnicity with class and gender."}, "formulaBox": null, "workedBox": null, "next": "q1"}, {"id": "q1", "type": "numeric", "chapter": "Question 1 of 3 — Ethnicity & Achievement", "title": "The GCSE Gap", "scene": "scene2", "body": "<p>GCSE data shows <strong>78%</strong> of Chinese students achieved a Grade 5 or above in English and Maths, compared to <strong>50%</strong> of White British students.</p><p><em>\"What is the percentage point difference between these two groups?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Difference = Chinese rate − White British rate</p><p>= 78 − 50 = ?</p>"}, "question": "What is the percentage point gap?", "unit": "percentage points", "answer": 28, "tolerance": 0, "maxAttempts": 2, "hintText": "78 − 50 = ?", "feedbackCorrect": "28 percentage points — a substantial gap. Understanding why some ethnic groups outperform others requires looking at culture, class, and school factors together.", "feedbackWrong": "A common mistake is using everyday language instead of sociological concepts. Use terms like 'socialisation', 'norms', 'values', and name specific theorists. The answer is 28. 78 − 50 = 28 percentage points.", "consequence": "<strong>A 28-point gap.</strong> But be careful — Chinese students are a small, self-selected group (often from educated, aspirational families), making direct comparison complex.", "next": "mid1", "bloomsLevel": "Apply"}, {"id": "mid1", "type": "story", "chapter": "School Factors", "title": "Labelling and Racism", "scene": "scene2", "body": "<p>Research by <strong>David Gillborn</strong> argues that schools are institutionally racist. Teachers may unconsciously have lower expectations of Black students, placing them in lower sets and interpreting their behaviour more negatively.</p><p><strong>Tony Sewell</strong> disagrees, arguing that family structure and peer group culture play a bigger role than school racism. He points to the absence of father figures in some Black Caribbean families and peer pressure against academic success ('acting white').</p><p>The debate is heated — and both sides have evidence.</p>", "factBox": {"label": "Internal vs External Factors", "text": "Internal (school) factors: teacher labelling, setting and streaming, ethnocentric curriculum, institutional racism (Gillborn), self-fulfilling prophecy. External (home/society) factors: cultural capital, parental expectations, material deprivation, peer group pressure, family structure (Sewell), racism in the labour market. Most sociologists argue both internal and external factors interact."}, "formulaBox": null, "workedBox": null, "next": "q2"}, {"id": "q2", "type": "numeric", "chapter": "Question 2 of 3 — Ethnicity & Achievement", "title": "The Exclusion Pattern", "scene": "scene3", "body": "<p>Black Caribbean students make up about <strong>1%</strong> of the school population but account for <strong>3.5%</strong> of permanent exclusions.</p><p><em>\"How many times overrepresented are Black Caribbean students in exclusion statistics?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": {"label": "How to approach it", "steps": "<p>Overrepresentation = exclusion share ÷ population share</p><p>= 3.5 ÷ 1 = ?</p>"}, "question": "How many times overrepresented are they?", "unit": "times", "answer": 3.5, "tolerance": 0.1, "maxAttempts": 2, "hintText": "3.5 ÷ 1 = ?", "feedbackCorrect": "3.5 times overrepresented — they are excluded at 3.5 times the rate you would expect from their population share. Gillborn argues this is evidence of institutional racism.", "feedbackWrong": "A common mistake is using everyday language instead of sociological concepts. Use terms like 'socialisation', 'norms', 'values', and name specific theorists. The answer is 3.5. 3.5% ÷ 1% = 3.5 times overrepresented.", "consequence": "<strong>Three and a half times overrepresented.</strong> Whether this reflects behaviour, labelling, or institutional racism remains one of the most contested debates in sociology of education.", "next": "mid2", "bloomsLevel": "Apply"}, {"id": "mid2", "type": "story", "chapter": "The Intersection", "title": "Class, Gender, and Ethnicity", "scene": "scene3", "body": "<p>Perhaps the most important insight is that ethnicity does not operate alone. It <strong>intersects</strong> with class and gender. The lowest-achieving group in British education is <strong>White working-class boys</strong> — not ethnic minorities.</p><p>When you control for social class (comparing students from similar economic backgrounds), many ethnic achievement gaps narrow significantly. This suggests that <strong>poverty</strong>, not ethnicity per se, is the strongest predictor of underachievement.</p>", "factBox": {"label": "Intersectionality in Education", "text": "Achievement is shaped by the intersection of ethnicity, class, and gender. White working-class boys eligible for free school meals are the lowest-achieving group. When class is controlled for, ethnic gaps narrow. Middle-class Black students outperform working-class White students. This shows class, not ethnicity alone, is the primary driver — but racism still plays an independent role."}, "formulaBox": null, "workedBox": null, "next": "q3"}, {"id": "q3", "type": "mcq", "chapter": "Question 3 of 3 — Ethnicity & Achievement", "title": "The Key Explanation", "scene": "scene1", "body": "<p>The governing body asks: <em>\"What does Gillborn mean by 'institutional racism' in education?\"</em></p>", "factBox": null, "formulaBox": null, "workedBox": null, "question": "What does Gillborn mean by institutional racism in education?", "options": [{"text": "Individual teachers deliberately refusing to teach ethnic minority students", "correct": false}, {"text": "The built-in, often unconscious, practices and policies of schools that systematically disadvantage ethnic minority students", "correct": true}, {"text": "Ethnic minority students choosing not to engage with the curriculum", "correct": false}, {"text": "Government policies that explicitly ban ethnic minorities from certain schools", "correct": false}], "maxAttempts": 2, "hintText": "Institutional racism is not about individual prejudice — it is about SYSTEMS, POLICIES, and PRACTICES that disadvantage certain groups, often without anyone intending it.", "feedbackCorrect": "Gillborn argues institutional racism operates through everyday practices — setting, exclusion, curriculum design, and teacher expectations — that systematically disadvantage ethnic minority students.", "feedbackWrong": "A common mistake is using everyday language instead of sociological concepts. Use terms like 'socialisation', 'norms', 'values', and name specific theorists. The correct answer is that institutional racism refers to built-in practices and policies of schools that systematically disadvantage ethnic minority students, often unconsciously.", "consequence": "<strong>The governors pledge to review school policies.</strong> Your data has forced uncomfortable but necessary conversations about ethnicity, achievement, and fairness.", "next": "end", "examTip": "In the exam, use named sociological perspectives and theorists. Evaluate each viewpoint by considering its strengths and at least one criticism.", "bloomsLevel": "Analyse"}], "ending": {"title": "The Ethnicity", "perfect": "Thorough and sensitive analysis, Fatima. You measured the achievement gap, identified exclusion patterns, and navigated the complex debate about ethnicity and education.", "partial": "Good engagement with ethnicity and achievement, but some concepts need revision. Review institutional racism, intersectionality, and the role of class in the achievement gap.", "retry": "Want to re-examine the ethnicity and achievement data?", "topic": "Ethnicity & Achievement"}};</script>
<script>
(function () {

    /* ── State ── */
    let state = {
      nodeIndex:   0,
      attempts:    0,
      score:       0,
      totalQ:      0,
      correctQ:    0,
      log:         [],    // {question, correct, userAnswer}
      pendingNext: null
    };

    const S       = STORY_DATA;
    const nodes   = S.nodes;
    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    /* ── Boot ── */
    function boot() {
      document.title = `${S.meta.title} — AI Study Method`;
      document.getElementById('year').textContent = new Date().getFullYear();
      buildIntro();
    }

    /* ── Intro screen ── */
    function buildIntro() {
      const intro = document.getElementById('intro-screen');
      intro.innerHTML = `
        <span class="eyebrow">Interactive ${S.meta.subject} Lesson</span>
        <h1 class="story-h">${S.meta.title}</h1>
        <p class="story-prose" style="margin:0 auto 0.5rem; text-align:center; max-width:52ch;">${S.meta.subtitle}</p>
        <p class="story-prose" style="margin:0 auto 1.5rem; color:var(--ink-mid); text-align:center; max-width:52ch; font-size:0.95rem;">${S.meta.intro}</p>
        <div class="meta-tags">${S.meta.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <button class="start-btn" onclick="startStory()">Begin mission →</button>
      `;
      show(intro);
    }

    /* ── Start ── */
    window.startStory = function () {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('scene-screen').style.display = 'block';
      renderNode(nodes[0].id);
    };

    /* ── Render a node ── */
    function renderNode(id) {
      const node = nodeMap[id];
      if (!node) { showEnd(); return; }
      if (id === 'end') { showEnd(); return; }

      state.attempts    = 0;
      state.pendingNext = node.next;

      const panel = document.getElementById('scene-panel');
      panel.classList.remove('in');

      updateProgress(id);

      setTimeout(() => {
        panel.innerHTML = buildNodeHTML(node);
        panel.classList.add('in');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        bindNode(node);
      }, 320);
    }

    /* ── Progress bar ── */
    function updateProgress(id) {
      const total   = nodes.length;
      const idx     = nodes.findIndex(n => n.id === id);
      const pct     = total <= 1 ? 0 : Math.round((idx / (total - 1)) * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    /* ── Build node HTML ── */
    function buildNodeHTML(node) {
      let h = '';

      /* Eyebrow + title */
      h += `<span class="eyebrow">${esc(node.chapter || '')}</span>`;
      h += `<h2 class="story-h">${esc(node.title || '')}</h2>`;

      /* Scene illustration */
      if (node.scene && S.scenes[node.scene]) {
        h += `<div class="scene">${S.scenes[node.scene]}</div>`;
      }

      /* Prose body */
      if (node.body) {
        h += `<div class="story-prose">${node.body}</div>`;
      }

      /* Fact box */
      if (node.factBox) {
        h += `<div class="fact-box">
          <span class="fact-label">📚 ${esc(node.factBox.label)}</span>
          <p>${esc(node.factBox.text)}</p>
        </div>`;
      }

      /* Formula box */
      if (node.formulaBox) {
        h += `<div class="formula-box">
          <span class="formula-label">🔢 ${esc(node.formulaBox.label)}</span>
          <span class="formula-main">${esc(node.formulaBox.formula)}</span>
          <span class="formula-vars">${esc(node.formulaBox.vars)}</span>
        </div>`;
      }

      /* Worked example */
      if (node.workedBox) {
        h += `<div class="worked">
          <span class="worked-label">✏️ ${esc(node.workedBox.label)}</span>
          <button class="hint-toggle" onclick="var s=this.nextElementSibling;if(s.style.display==='none'){s.style.display='block';this.textContent='Hide working ↑'}else{s.style.display='none';this.textContent='Show working ↓'}">Show working ↓</button>
          <div class="worked-steps" style="display:none">${node.workedBox.steps}</div>
        </div>`;
      }

      /* Answer zone */
      if (node.type === 'numeric') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="answer-numeric">
            <input type="number" id="num-input" placeholder="?" step="any" />
            <span class="answer-unit">${esc(node.unit || '')}</span>
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <br>
          <button class="submit-btn" id="submit-btn" onclick="submitNumeric()">Check answer →</button>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else if (node.type === 'mcq') {
        h += `<div class="answer-zone">
          <p class="answer-prompt">${esc(node.question)}</p>
          <div class="mcq-choices" id="mcq-choices">
            ${(node.options || []).map((opt, i) =>
              `<button class="mcq-btn" id="opt-${i}" onclick="submitMCQ(${i})">${esc(opt.text)}</button>`
            ).join('')}
          </div>
          ${attemptsHTML(node.maxAttempts || 2)}
          <div id="hint-area"></div>
          <div class="feedback" id="feedback"></div>
          <div class="consequence" id="consequence"></div>
          <button class="continue-btn" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      } else {
        /* Story node — just a continue button */
        h += `<div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--rule);">
          <button class="continue-btn show" id="continue-btn" onclick="goNext()">Continue →</button>
        </div>`;
      }

      return h;
    }

    /* ── Attempts pips ── */
    function attemptsHTML(max) {
      let pips = '';
      for (let i = 0; i < max; i++) {
        pips += `<div class="attempt-pip" id="pip-${i}"></div>`;
      }
      return `<div class="attempts-row">${pips}<span class="attempts-label">${max} attempt${max > 1 ? 's' : ''}</span></div>`;
    }

    /* ── Bind interactive elements ── */
    function bindNode(node) {
      /* Allow Enter key on numeric input */
      const ni = document.getElementById('num-input');
      if (ni) {
        ni.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitNumeric();
        });
        ni.focus();
      }
    }

    /* ── Numeric submit ── */
    window.submitNumeric = function () {
      const node  = getCurrentNode();
      const input = document.getElementById('num-input');
      const val   = parseFloat(input.value);

      if (isNaN(val)) { input.focus(); return; }

      state.attempts++;
      markPip(state.attempts - 1, true);

      const tol   = node.tolerance || 0;
      const correct = Math.abs(val - node.answer) <= tol;

      if (correct) {
        handleCorrect(node, val);
      } else {
        handleWrong(node, val);
      }
    };

    /* ── MCQ submit ── */
    window.submitMCQ = function (idx) {
      const node = getCurrentNode();
      const opt  = node.options[idx];

      state.attempts++;
      markPip(state.attempts - 1, false);

      /* Disable all buttons */
      (node.options || []).forEach((_, i) => {
        const b = document.getElementById(`opt-${i}`);
        if (b) { b.disabled = true; b.style.opacity = '0.45'; }
      });
      /* Highlight chosen */
      const chosen = document.getElementById(`opt-${idx}`);
      if (chosen) { chosen.style.opacity = '1'; chosen.style.borderColor = 'var(--accent)'; }

      if (opt.correct) {
        handleCorrect(node, opt.text);
      } else {
        handleWrong(node, opt.text);
      }
    };

    /* ── Correct answer ── */
    function handleCorrect(node, userVal) {
      state.correctQ++;
      state.totalQ++;
      state.log.push({ question: node.title, correct: true, userAnswer: userVal });

      showFeedback('correct', '✓ Correct', node.feedbackCorrect || 'Well done.');

      if (node.consequence) {
        showConsequence(node.consequence);
      }

      disableSubmit();
      state.pendingNext = node.next;
      showContinue();
    }

    /* ── Wrong answer ── */
    function handleWrong(node, userVal) {
      const max = node.maxAttempts || 2;

      if (state.attempts < max) {
        /* Still have attempts left — show hint */
        showFeedback('wrong', '✗ Not quite', 'That\'s not right. Check your working and try again.');
        if (node.hintText) {
          showHint(node.hintText);
        }
        /* Re-enable submit for numeric */
        const sub = document.getElementById('submit-btn');
        if (sub) sub.disabled = false;
        /* Re-enable MCQ options */
        if (node.type === 'mcq') {
          (node.options || []).forEach((opt, i) => {
            if (!opt.correct) {
              const b = document.getElementById(`opt-${i}`);
              if (b && !b.disabled) { /* already grayed — don't re-enable chosen wrong */ }
            }
          });
        }
        /* Mark pip wrong */
        markPip(state.attempts - 1, false, true);
      } else {
        /* Out of attempts */
        state.totalQ++;
        state.log.push({ question: node.title, correct: false, userAnswer: userVal });

        showFeedback('wrong', '✗ Out of attempts', node.feedbackWrong || `The correct answer was ${node.answer}.`);

        if (node.consequence) {
          showConsequence(node.consequence);
        }

        disableSubmit();
        state.pendingNext = node.nextWrong || node.next;
        showContinue();
      }
    }

    /* ── UI helpers ── */
    function showFeedback(type, label, text) {
      const fb = document.getElementById('feedback');
      if (!fb) return;
      fb.className = `feedback show ${type}`;
      fb.innerHTML = `<span class="fb-label">${esc(label)}</span>${esc(text)}`;
    }

    function showConsequence(html) {
      const c = document.getElementById('consequence');
      if (!c) return;
      c.innerHTML = html;
      c.classList.add('show');
    }

    function showHint(text) {
      const ha = document.getElementById('hint-area');
      if (!ha) return;
      ha.innerHTML = `<div class="feedback hint show" style="margin-top:0.5rem"><span class="fb-label">💡 Hint</span>${esc(text)}</div>`;
    }

    function disableSubmit() {
      const sub = document.getElementById('submit-btn');
      if (sub) sub.disabled = true;
      const ni = document.getElementById('num-input');
      if (ni) ni.disabled = true;
    }

    function showContinue() {
      const btn = document.getElementById('continue-btn');
      if (btn) btn.classList.add('show');
    }

    function markPip(idx, pending, wrong) {
      const pip = document.getElementById(`pip-${idx}`);
      if (!pip) return;
      if (wrong) {
        pip.classList.add('wrong-pip');
      } else {
        pip.classList.add('used');
      }
    }

    /* ── Navigate to next node ── */
    window.goNext = function () {
      const next = state.pendingNext;
      if (!next) return;
      state.pendingNext = null;
      if (next === 'end' || !nodeMap[next]) {
        showEnd();
      } else {
        renderNode(next);
      }
    };

    /* ── End screen ── */
    function showEnd() {
      document.getElementById('scene-screen').style.display  = 'none';
      document.getElementById('progress-fill').style.width   = '100%';

      const pct     = state.totalQ > 0 ? Math.round((state.correctQ / state.totalQ) * 100) : 100;
      const summary = pct === 100
        ? S.ending.perfect
        : pct >= 50
          ? S.ending.partial
          : S.ending.partial;

      let reviewHTML = '';
      state.log.forEach(entry => {
        reviewHTML += `<div class="review-item">
          <span class="review-icon">${entry.correct ? '✓' : '✗'}</span>
          <div>${esc(entry.question)} — ${entry.correct ? '<span style="color:#3a7020">answered correctly</span>' : '<span style="color:#8a2020">answer revealed</span>'}</div>
        </div>`;
      });

      const endEl = document.getElementById('end-screen');
      endEl.innerHTML = `
        <span class="end-badge">Mission Complete</span>
        <div class="score-display">${pct}%</div>
        <div class="score-label">accuracy score</div>
        <p class="score-summary">${esc(summary)}</p>
        ${reviewHTML ? `<div class="question-review">${reviewHTML}</div>` : ''}
        <div class="fact-box" style="text-align:left; margin-bottom:2rem;">
          <span class="fact-label">📚 What you practised</span>
          <p>The distance–speed–time formula (<em>d = s × t</em>) can be rearranged to find any of the three quantities depending on what you know. Real-world problems — navigation, timing, speed limits — all use this relationship. You also practised rearranging: time = d ÷ s and speed = d ÷ t.</p>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-light); margin-bottom:1.5rem;">${esc(S.ending.retry)}</p>
        <button class="restart-btn" onclick="restartStory()">← Try again</button>
      `;
      endEl.classList.add('show');
      endEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Restart ── */
    window.restartStory = function () {
      state = { nodeIndex: 0, attempts: 0, score: 0, totalQ: 0, correctQ: 0, log: [], pendingNext: null };
      document.getElementById('end-screen').classList.remove('show');
      document.getElementById('end-screen').innerHTML = '';
      document.getElementById('scene-screen').style.display  = 'block';
      document.getElementById('progress-fill').style.width   = '0%';
      renderNode(nodes[0].id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    /* ── Helpers ── */
    function getCurrentNode() {
      const panel = document.getElementById('scene-panel');
      const ey    = panel ? panel.querySelector('.eyebrow') : null;
      const label = ey ? ey.textContent : '';
      return nodes.find(n => n.chapter === label) || nodes[0];
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function show(el) {
      setTimeout(() => el.classList.add('in'), 60);
    }

    /* ── Nav ── */
    const toggle  = document.getElementById('nav-toggle');
    const links   = document.getElementById('nav-links');
    const overlay = document.getElementById('nav-overlay');
    const open  = () => { toggle.classList.add('open');    links.classList.add('open');    overlay.classList.add('open');    document.body.style.overflow = 'hidden'; };
    const close = () => { toggle.classList.remove('open'); links.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';       };
    toggle.addEventListener('click',   () => toggle.classList.contains('open') ? close() : open());
    overlay.addEventListener('click',  close);
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', close));

    /* ── Go ── */
    boot();

  })();
  </script>
</body>
</html>
