<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Context — AI Study Method</title>
<meta name="description" content="The story of how a concept was discovered — the people, the experiments, the wrong turns, and what we know now.">
<link rel="stylesheet" href="../../style.css">
<style>
  .hc-wrap { max-width: 760px; margin: 0 auto; padding: calc(var(--nav-h) + 36px) 1.5rem 80px; }
  .hc-badge { display:inline-flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 12px; border-radius:30px; font-family:'DM Mono',monospace; margin-bottom:14px; }
  .hc-title { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1.15; margin:0 0 10px; }
  .hc-sub { color:var(--text-secondary); font-size:15px; margin:0 0 22px; line-height:1.55; max-width:60ch; }
  .hc-meta { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:24px; }

  /* Timeline rail */
  .hc-rail { position:relative; padding-left:32px; margin-bottom:24px; }
  .hc-rail::before { content:''; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg, var(--accent), var(--accent2, #4a3fa0)); border-radius:2px; opacity:0.4; }
  .hc-node { position:relative; margin-bottom:18px; }
  .hc-dot { position:absolute; left:-32px; top:18px; width:18px; height:18px; border-radius:50%; background:var(--velvet-gradient); border:3px solid var(--bg-primary); box-shadow:0 0 0 2px var(--accent); z-index:1; }
  .hc-node.now .hc-dot { background:linear-gradient(135deg, #d97706, #f59e0b); box-shadow:0 0 0 2px #d97706; }
  .hc-card { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:14px; padding:22px 24px; box-shadow:0 4px 14px rgba(10,107,94,0.06); }
  .hc-node.now .hc-card { border-left-color:#d97706; }
  .hc-year { font-family:'DM Mono',monospace; font-size:11px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .hc-node.now .hc-year { color:#d97706; }
  .hc-h { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:700; color:var(--text-primary); margin:0 0 4px; line-height:1.25; }
  .hc-who { font-size:13.5px; color:var(--text-muted); margin:0 0 12px; font-style:italic; }
  .hc-body { font-size:14.5px; color:var(--text-primary); line-height:1.6; }
  .hc-body p { margin:0 0 10px; }
  .hc-body p:last-child { margin-bottom:0; }
  .hc-quote { font-family:'Playfair Display',serif; font-style:italic; font-size:15.5px; color:var(--text-primary); padding:14px 18px; background:var(--bg-primary); border-left:3px solid var(--accent); border-radius:8px; margin:12px 0; line-height:1.55; }
  .hc-quote::before { content:'"'; color:var(--accent); font-size:2rem; line-height:0; vertical-align:-12px; margin-right:4px; }
  .hc-quote-attrib { font-style:normal; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-muted); margin-top:8px; display:block; }
  .hc-takeaway { margin-top:14px; padding:14px 16px; background:var(--accent-soft); border:1px solid var(--border-accent); border-radius:8px; }
  .hc-takeaway-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:4px; }
  .hc-takeaway-body { font-size:13.5px; color:var(--text-primary); }

  .hc-prompt-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:24px 26px; margin-bottom:18px; }
  .hc-prompt-h { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:600; color:var(--text-primary); margin:0 0 14px; }
  .hc-prompt-q { font-size:14.5px; color:var(--text-secondary); margin:0 0 12px; font-style:italic; }
  .hc-reflect { width:100%; padding:12px 14px; background:var(--bg-primary); border:1.5px solid var(--border); border-radius:10px; font-size:14.5px; font-family:inherit; color:var(--text-primary); resize:vertical; min-height:80px; box-sizing:border-box; }
  .hc-reflect:focus { outline:none; border-color:var(--accent); }
  .hc-btn { background:var(--velvet-gradient); color:#fff; border:none; padding:14px 24px; border-radius:10px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; box-shadow:0 4px 12px var(--accent-glow); margin-top:16px; }
  .hc-back { color:var(--accent); text-decoration:none; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; display:inline-block; margin-top:24px; }
  .hc-back:hover { text-decoration:underline; }
  .hc-error, .hc-pending { padding:20px; border-radius:10px; font-size:14px; }
  .hc-error { background:rgba(194,65,12,0.05); border:1px solid rgba(194,65,12,0.2); color:#c2410c; }
  .hc-pending { background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="../../index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text">
        <span class="logo-primary">AI Study Method</span>
        <span class="logo-secondary">The Velvet Method™</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="../../subjects.html">Subjects</a></li>
      <li><a href="../../velvet-method.html">The Velvet Method</a></li>
      <li><a href="../../courses.html">Courses</a></li>
      <li><a href="../../ai-study-guide.html">AI Lab</a></li>
      <li><a href="../../parents.html">Parents</a></li>
      <li><a href="../../about.html">About</a></li>
    </ul>
    <div class="nav-right">
      <a href="../../courses.html" class="btn-primary">View the Course →</a>
    </div>
  </div>
</nav>

<div class="hc-wrap" id="root">
  <div class="hc-pending">Loading…</div>
</div>

<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');

  if (!stem) { root.innerHTML = '<div class="hc-error">Missing <code>?spec=</code> parameter.</div>'; return; }

  const specCandidates = [`../adventures/_specs/${stem}.json`];
  for (let i = 0; i < stem.length; i++) {
    if (stem[i] === '-') specCandidates.push(`../adventures/_specs/${stem.slice(0,i)}:${stem.slice(i)}.json`);
  }
  let spec = null;
  for (const u of specCandidates) { try { const r = await fetch(u); if (r.ok) { spec = await r.json(); break; } } catch(e){} }

  let bank = null;
  try { const r = await fetch(`./historical-context-banks/${stem}.json`); if (r.ok) bank = await r.json(); } catch(e){}

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = (spec && spec.level || '').toUpperCase().replace('A-LEVEL','A-Level');
  const subj  = (spec && spec.subject || '').replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase());

  function header() {
    return `
      <div class="hc-badge">E · Explore · Historical Context</div>
      <h1 class="hc-title">${escapeHtml(topic)}</h1>
      <p class="hc-sub">Every concept on this page took someone decades to work out, often after dozens of wrong turns. Knowing the story makes the idea harder to forget — and shows you that science is built by people who were once where you are now.</p>
      <div class="hc-meta">${escapeHtml(level)} · ${escapeHtml(subj)}</div>
    `;
  }

  const lowQuality = bank && bank.quality === 'low';
  if (!bank || !Array.isArray(bank.moments) || bank.moments.length === 0 || lowQuality) {
    root.innerHTML = `
      ${header()}
      <div class="hc-prompt-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">📜</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;margin:0 0 8px">Historical context in production</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:15px;">Topic-specific history is still being written for this one. Generic origin stories wouldn't earn their place here.</p>
        <p style="font-size:13px;color:var(--text-muted);">Meanwhile, try the <a href="edge-case-showcase.html?spec=${encodeURIComponent(stem)}" style="color:var(--accent);">Edge-Case Showcase</a> for this topic.</p>
      </div>
    `;
    return;
  }

  const moments = bank.moments;
  const now = bank.now || null;
  const reflection = bank.reflection || null;

  root.innerHTML = `
    ${header()}
    <div class="hc-rail">
      ${moments.map(m => `
        <div class="hc-node">
          <div class="hc-dot"></div>
          <div class="hc-card">
            <div class="hc-year">${escapeHtml(m.year || '')}</div>
            <h2 class="hc-h">${escapeHtml(m.title || '')}</h2>
            ${m.who ? `<p class="hc-who">${escapeHtml(m.who)}</p>` : ''}
            <div class="hc-body">
              ${(m.body || '').split(/\n\n+/).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
              ${m.quote ? `<div class="hc-quote">${escapeHtml(m.quote.text || m.quote)}${m.quote.attrib ? `<span class="hc-quote-attrib">— ${escapeHtml(m.quote.attrib)}</span>` : ''}</div>` : ''}
              ${m.takeaway ? `<div class="hc-takeaway"><div class="hc-takeaway-label">What this gave us</div><div class="hc-takeaway-body">${escapeHtml(m.takeaway)}</div></div>` : ''}
            </div>
          </div>
        </div>
      `).join('')}
      ${now ? `
        <div class="hc-node now">
          <div class="hc-dot"></div>
          <div class="hc-card">
            <div class="hc-year">Now we know</div>
            <h2 class="hc-h">${escapeHtml(now.title || 'Where we are today')}</h2>
            <div class="hc-body">
              ${(now.body || '').split(/\n\n+/).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
              ${now.open_questions ? `<div class="hc-takeaway" style="border-color:rgba(217,119,6,0.3);background:rgba(217,119,6,0.08)"><div class="hc-takeaway-label" style="color:#d97706">Still open</div><div class="hc-takeaway-body">${escapeHtml(now.open_questions)}</div></div>` : ''}
            </div>
          </div>
        </div>` : ''}
    </div>
    ${reflection ? `
      <div class="hc-prompt-card">
        <h3 class="hc-prompt-h">A question to take with you</h3>
        <p class="hc-prompt-q">${escapeHtml(reflection)}</p>
        <textarea class="hc-reflect" id="reflect" aria-label="Your reflection" placeholder="Your reflection (saved in your browser, just for you)…"></textarea>
        <div id="reflect-saved" aria-live="polite" style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-top:6px;opacity:0;transition:opacity 0.3s ease;">Saved ✓</div>
      </div>` : ''}
    <a href="../../subjects.html" class="hc-back">← Back to subjects</a>
  `;

  // Persist reflection in localStorage per-stem so the placeholder isn't a lie.
  const reflectEl = document.getElementById('reflect');
  if (reflectEl) {
    const key = `aism.reflect.${stem}`;
    try {
      const saved = localStorage.getItem(key);
      if (saved) reflectEl.value = saved;
      const savedEl = document.getElementById('reflect-saved');
      let savedTimer = null;
      reflectEl.addEventListener('input', () => {
        try {
          localStorage.setItem(key, reflectEl.value);
          // Brief "Saved ✓" confirmation so the auto-save is visible.
          if (savedEl) {
            savedEl.style.opacity = '1';
            clearTimeout(savedTimer);
            savedTimer = setTimeout(() => { savedEl.style.opacity = '0'; }, 1200);
          }
        } catch(e){}
      });
    } catch(e){}
  }

  function escapeHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
})();
</script>

</body>
</html>
