<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge-Case Showcase — AI Study Method</title>
<meta name="description" content="Counter-intuitive results that break naive intuition. Predict, then reveal — the gap between what you'd expect and what's true is where deep understanding starts.">
<link rel="stylesheet" href="../../style.css">
<style>
  .ec-wrap { max-width: 760px; margin: 0 auto; padding: calc(var(--nav-h) + 36px) 1.5rem 80px; }
  .ec-badge { display:inline-flex; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 12px; border-radius:30px; font-family:'DM Mono',monospace; margin-bottom:14px; }
  .ec-title { font-family:'Playfair Display',serif; font-size:clamp(1.7rem,3vw,2.4rem); line-height:1.15; margin:0 0 10px; }
  .ec-sub { color:var(--text-secondary); font-size:15px; margin:0 0 22px; line-height:1.55; max-width:60ch; }
  .ec-meta { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:24px; }
  .ec-card { background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:14px; padding:24px 26px; box-shadow:0 4px 14px rgba(10,107,94,0.06); margin-bottom:18px; }
  .ec-step-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px; }
  .ec-h { font-size:19px; font-weight:700; color:var(--text-primary); margin:0 0 8px; line-height:1.3; font-family:'Playfair Display',serif; }
  .ec-claim { font-size:16px; color:var(--text-primary); margin:0 0 16px; line-height:1.55; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid #d97706; font-style:italic; }
  .ec-prompt { font-size:15px; color:var(--text-secondary); margin:0 0 14px; line-height:1.55; }
  .ec-options { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .ec-opt { background:var(--bg-primary); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; font-size:15px; transition:all 0.15s ease; text-align:left; font-family:inherit; color:var(--text-primary); line-height:1.45; }
  .ec-opt:hover:not(:disabled) { border-color:var(--accent); background:var(--accent-soft); }
  .ec-opt.selected { border-color:var(--accent); background:var(--accent-soft); }
  .ec-opt.true { border-color:#0a6b5e; background:rgba(10,107,94,0.10); }
  .ec-opt-letter { display:inline-block; font-family:'DM Mono',monospace; font-size:11px; font-weight:700; color:var(--accent); margin-right:10px; letter-spacing:1px; }
  .ec-btn { background:var(--velvet-gradient); color:#fff; border:none; padding:14px 24px; border-radius:10px; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; box-shadow:0 4px 12px var(--accent-glow); }
  .ec-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .ec-reveal { margin-top:18px; padding:18px 20px; border-radius:10px; background:rgba(10,107,94,0.06); border:1px solid var(--border-accent); }
  .ec-reveal-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px; }
  .ec-reveal-h { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:700; color:var(--text-primary); margin:0 0 8px; }
  .ec-reveal p { font-size:14.5px; color:var(--text-primary); margin:0 0 10px; line-height:1.6; }
  .ec-reveal p:last-child { margin-bottom:0; }
  .ec-why { font-style:italic; color:var(--text-secondary); font-size:13.5px; padding-top:10px; border-top:1px dashed var(--border); }
  .ec-summary { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  .ec-summary h2 { font-family:'Playfair Display',serif; font-size:1.5rem; margin:0 0 16px; }
  .ec-list { display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .ec-list-row { padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); }
  .ec-list-h { font-weight:600; color:var(--text-primary); font-size:14.5px; margin-bottom:4px; }
  .ec-list-p { font-size:13.5px; color:var(--text-secondary); margin:0; }
  .ec-insight { font-style:italic; font-size:14px; color:var(--text-secondary); margin-top:18px; padding:14px 16px; background:var(--bg-primary); border-radius:10px; border-left:3px solid var(--accent); }
  .ec-back { color:var(--accent); text-decoration:none; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; display:inline-block; margin-top:24px; }
  .ec-back:hover { text-decoration:underline; }
  .ec-progress { display:flex; gap:6px; margin-bottom:24px; }
  .ec-progress span { height:5px; flex:1; border-radius:3px; background:var(--border); transition:background 0.2s ease; }
  .ec-progress span.done { background:var(--accent); }
  .ec-progress span.now { background:var(--accent); opacity:0.45; }
  .ec-kbd-hint { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-top:10px; }
  @media (hover:none) { .ec-kbd-hint { display:none; } }
  .ec-error, .ec-pending { padding:20px; border-radius:10px; font-size:14px; }
  .ec-error { background:rgba(194,65,12,0.05); border:1px solid rgba(194,65,12,0.2); color:#c2410c; }
  .ec-pending { background:var(--accent-soft); border:1px solid var(--border-accent); color:var(--accent); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="../../index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text">
        <span class="logo-primary">AI Study Method</span>
        <span class="logo-secondary">The Velvet Method™</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="../../subjects.html">Subjects</a></li>
      <li><a href="../../velvet-method.html">The Velvet Method</a></li>
      <li><a href="../../courses.html">Courses</a></li>
      
      <li><a href="../../parents.html">Parents</a></li>

    <div class="nav-right">
      <a href="../../courses.html" class="btn-primary">View the Course →</a>

</nav>

<div class="ec-wrap" id="root">
  <div class="ec-pending">Loading…</div>
</div>

<script>
/* ── AISM audio + confetti (shared 'aism-muted' preference) ── */
const AISM_REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const AISM_SFX = (() => {
  let actx = null, master = null;
  let muted = false;
  try { muted = localStorage.getItem('aism-muted') === '1'; } catch (e) {}
  function ensure() {
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.28;
        master.connect(actx.destination);
      }
      if (actx.state === 'suspended') actx.resume();
      return true;
    } catch (e) { return false; }
  }
  function tone(freq, dur, type, vol, endFreq) {
    if (muted || !ensure()) return;
    try {
      const t0 = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t0 + dur);
      g.gain.setValueAtTime(vol || 0.1, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  return {
    unlock() { ensure(); },
    isMuted() { return muted; },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('aism-muted', muted ? '1' : '0'); } catch (e) {}
      return muted;
    },
    ok()      { tone(587, 0.08, 'sine', 0.1); setTimeout(() => tone(740, 0.1, 'sine', 0.09), 70); },
    bad()     { tone(220, 0.15, 'sawtooth', 0.05, 165); },
    fanfare() { tone(523, 0.1, 'triangle', 0.12); setTimeout(() => tone(659, 0.1, 'triangle', 0.12), 100); setTimeout(() => tone(784, 0.2, 'triangle', 0.12), 200); },
  };
})();
function aismConfetti() {
  if (AISM_REDUCED) return;
  let st = document.getElementById('aism-confetti-style');
  if (!st) {
    st = document.createElement('style');
    st.id = 'aism-confetti-style';
    st.textContent = '@keyframes aismCfFall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}.aism-cf{position:fixed;top:0;width:8px;height:12px;z-index:950;pointer-events:none;animation:aismCfFall linear both;}';
    document.head.appendChild(st);
  }
  const colours = ['#0a6b5e', '#7b6fff', '#ffd166', '#c2410c', '#5ac8ff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'aism-cf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colours[i % colours.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3600);
  }
}
(function aismMuteBtn() {
  function add() {
    if (document.getElementById('aism-mute')) return;
    const b = document.createElement('button');
    b.id = 'aism-mute';
    b.type = 'button';
    b.title = 'Toggle sound (M)';
    b.textContent = AISM_SFX.isMuted() ? '🔇' : '🔊';
    b.style.cssText = 'position:fixed;bottom:14px;right:14px;z-index:900;background:rgba(26,29,39,0.92);border:1px solid rgba(255,255,255,0.16);color:#e8eaf0;border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;line-height:1;';
    b.addEventListener('click', () => { b.textContent = AISM_SFX.toggleMute() ? '🔇' : '🔊'; });
    document.body.appendChild(b);
  }
  if (document.body) add(); else window.addEventListener('DOMContentLoaded', add);
  document.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const b = document.getElementById('aism-mute');
      if (b) b.click();
    }
  });
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    document.addEventListener(ev, () => AISM_SFX.unlock(), { once: true, capture: true }));
})();

(async function() {
  const params = new URLSearchParams(location.search);
  const stem = params.get('spec');
  const root = document.getElementById('root');

  if (!stem) {
    root.innerHTML = '<div class="ec-error">Missing <code>?spec=</code> parameter.</div>';
    return;
  }

  // Spec for context
  const specCandidates = [`../adventures/_specs/${stem}.json`];
  for (let i = 0; i < stem.length; i++) {
    if (stem[i] === '-') specCandidates.push(`../adventures/_specs/${stem.slice(0,i)}:${stem.slice(i)}.json`);
  }
  let spec = null;
  for (const u of specCandidates) { try { const r = await fetch(u); if (r.ok) { spec = await r.json(); break; } } catch(e){} }

  let bank = null;
  try { const r = await fetch(`./edge-case-banks/${stem}.json`); if (r.ok) bank = await r.json(); } catch(e){}

  const topic = (spec && (spec.topic_display || spec.title)) || stem;
  const level = (spec && spec.level || '').toUpperCase().replace('A-LEVEL','A-Level');
  const subj  = (spec && spec.subject || '').replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase());

  function header(stage) {
    return `
      <div class="ec-badge">E · Explore · Edge-Case Showcase</div>
      <h1 class="ec-title">${escapeHtml(topic)}</h1>
      <p class="ec-sub">Counter-intuitive results that break the naive intuition for this topic. Read the claim, predict the outcome, then reveal what's actually true. The gap between expectation and reality is where deep understanding lives.</p>
      <div class="ec-meta">${escapeHtml(level)} · ${escapeHtml(subj)} · ${stage}</div>
    `;
  }

  const lowQuality = bank && bank.quality === 'low';
  if (!bank || !Array.isArray(bank.items) || bank.items.length === 0 || lowQuality) {
    root.innerHTML = `
      ${header('In production')}
      <div class="ec-card" style="text-align:center;padding:40px 28px;">
        <div style="font-size:48px;line-height:1;margin-bottom:14px">🌌</div>
        <h2 style="font-family:'Playfair Display',serif;font-size:1.4rem;margin:0 0 8px">Edge cases in production</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:15px;">Topic-specific counter-intuitive results are still being authored for this topic — generic surprises wouldn't earn their place. Come back soon.</p>
        <p style="font-size:13px;color:var(--text-muted);">Meanwhile, try the <a href="historical-context.html?spec=${encodeURIComponent(stem)}" style="color:var(--accent);">Historical Context</a> for this topic.</p>
      </div>
    `;
    return;
  }

  // Validate bank items: need exactly 4 options with exactly 1 isTrue.
  const items = (bank.items || []).filter(it =>
    Array.isArray(it.options) && it.options.length === 4 && it.options.filter(o => o.isTrue).length === 1
  );
  if (items.length === 0) {
    root.innerHTML = `
      ${header('Items malformed')}
      <div class="ec-error">This bank's items don't have the expected 4-option-with-one-correct shape. <a href="../../subjects.html" style="color:var(--accent)">← Back to subjects</a></div>
    `;
    return;
  }
  const state = { idx: 0, log: [] };

  function renderItem() {
    const item = items[state.idx];
    // 4 options: 1 correct (the surprising truth) + 3 wrong (the naive predictions and red herrings)
    const options = item.options.map((o, i) => ({ text: o.text, isTrue: !!o.isTrue, i }));
    // Per-session randomisation: previously a deterministic hash kept the correct
    // letter fixed forever, so returning learners memorised position rather than content.
    for (let i = options.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [options[i], options[j]] = [options[j], options[i]];
    }
    const correctIdx = options.findIndex(o => o.isTrue);

    root.innerHTML = `
      ${header(`Item ${state.idx + 1} of ${items.length}`)}
      <div class="ec-progress" aria-hidden="true">${items.map((_, i) =>
        `<span class="${i < state.idx ? 'done' : i === state.idx ? 'now' : ''}"></span>`).join('')}</div>
      <div class="ec-card">
        <div class="ec-step-label">Item ${state.idx + 1}</div>
        <h2 class="ec-h">${escapeHtml(item.title)}</h2>
        <div class="ec-claim">${escapeHtml(item.claim)}</div>
        <p class="ec-prompt">${escapeHtml(item.prompt || 'What do you think actually happens?')}</p>
        <div class="ec-options" role="radiogroup" aria-label="Pick what you think actually happens">
          ${options.map((o,i)=>`<button class="ec-opt" data-i="${i}" role="radio" aria-checked="false"><span class="ec-opt-letter">${'ABCD'[i]}.</span>${escapeHtml(o.text)}</button>`).join('')}
        </div>
        <button class="ec-btn" id="submit" disabled>Reveal →</button>
        <div class="ec-kbd-hint">Keyboard: A–D to pick · Enter to reveal</div>
        <div id="reveal" aria-live="polite"></div>
      </div>
    `;

    const submit = document.getElementById('submit');
    let picked = null;
    let phase = 'answer'; // 'answer' or 'next'
    root.querySelectorAll('.ec-opt').forEach(b => {
      b.addEventListener('click', () => {
        if (phase !== 'answer') return;
        root.querySelectorAll('.ec-opt').forEach(x => {
          x.classList.remove('selected');
          x.setAttribute('aria-checked', 'false');
        });
        b.classList.add('selected');
        b.setAttribute('aria-checked', 'true');
        picked = parseInt(b.dataset.i);
        submit.disabled = false;
      });
    });

    submit.addEventListener('click', () => {
      if (phase === 'answer') {
        // Reveal
        root.querySelectorAll('.ec-opt').forEach((b, i) => {
          b.disabled = true; b.style.pointerEvents = 'none';
          if (i === correctIdx) b.classList.add('true');
        });
        const wasCorrect = picked === correctIdx;
        try { wasCorrect ? AISM_SFX.ok() : AISM_SFX.bad(); } catch (e) {}
        state.log.push({ title: item.title, wasCorrect });

        const r = document.getElementById('reveal');
        r.innerHTML = `
          <div class="ec-reveal">
            <div class="ec-reveal-label">${wasCorrect ? 'You called it' : 'The surprise'}</div>
            <div class="ec-reveal-h">${escapeHtml(item.reveal_title || 'What actually happens')}</div>
            ${(item.reveal || '').split(/\n\n+/).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
            ${item.why ? `<div class="ec-why">${escapeHtml(item.why)}</div>` : ''}
          </div>
        `;

        submit.textContent = state.idx + 1 < items.length ? 'Next →' : 'See summary →';
        submit.disabled = false;
        phase = 'next';
      } else {
        // Advance
        if (state.idx + 1 < items.length) { state.idx++; renderItem(); }
        else renderSummary();
      }
    });
  }

  function renderSummary() {
    const correct = state.log.filter(l => l.wasCorrect).length;
    const total = state.log.length;
    try { if (total && correct / total >= 0.8) { AISM_SFX.fanfare(); aismConfetti(); } } catch (e) {}
    const insight = correct === total
      ? "You predicted every surprise correctly — which is itself surprising. Either you already know these edge cases or you're a very calibrated guesser."
      : correct > total / 2
      ? "You caught more surprises than you missed. The ones you missed are the most valuable — those are gaps in your default intuition for this topic."
      : "You missed most of these — which is the *point*. These edge cases were chosen because they break the naive intuition. Re-read the reveals; the ones that surprised you most are the deepest learning.";
    const rows = state.log.map((l, i) => `
      <div class="ec-list-row">
        <div class="ec-list-h">${escapeHtml(items[i].title)}</div>
        <div class="ec-list-p">${escapeHtml(items[i].reveal_title || '')}</div>
      </div>
    `).join('');
    root.innerHTML = `
      ${header('Report')}
      <div class="ec-summary">
        <h2>Surprises taken in</h2>
        <p style="color:var(--text-secondary);margin:0 0 18px;font-size:14.5px">You predicted <strong style="color:var(--accent)">${correct} of ${total}</strong> correctly. Of more interest: what surprised you?</p>
        <div class="ec-list">${rows}</div>
        <div class="ec-insight">${insight}</div>
        <a href="../../subjects.html" class="ec-back">← Back to subjects</a>
      </div>
    `;
  }

  function escapeHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function hashStr(s) { let h=0; for (let i=0;i<s.length;i++) h = ((h<<5)-h + s.charCodeAt(i)) | 0; return h; }

  // Keyboard shortcuts: A–D (or 1–4) select an option, Enter reveals/advances.
  document.addEventListener('keydown', e => {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
    if (k in map) {
      const opts = root.querySelectorAll('.ec-opt');
      const b = opts[map[k]];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (k === 'enter') {
      if (e.target && e.target.classList && e.target.classList.contains('ec-opt')) return; // let Enter activate the focused option
      const submit = document.getElementById('submit');
      if (submit && !submit.disabled) { e.preventDefault(); submit.click(); }
    }
  });

  renderItem();
})();
</script>
