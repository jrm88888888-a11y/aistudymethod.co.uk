<style>
  /* difficulty chips */
  .pv-diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 480px) { .pv-diff-grid { grid-template-columns: repeat(2, 1fr); } }
  .pv-diff {
    background: var(--ar-card); border: 2px solid var(--ar-border); border-radius: var(--ar-r);
    padding: 14px 8px; text-align: center; cursor: pointer; color: var(--ar-text);
    font-family: var(--ar-font); transition: all 0.14s ease; min-width: 0;
  }
  .pv-diff:hover:not(:disabled) { border-color: var(--ar-cyan); transform: translateY(-2px); }
  .pv-diff:focus-visible { outline: 2px solid var(--ar-cyan); outline-offset: 2px; }
  .pv-diff.selected { border-color: var(--ar-mint); background: var(--ar-mint-dim); box-shadow: 0 0 18px rgba(0,255,163,0.22); }
  .pv-diff:disabled { opacity: 0.3; cursor: default; }
  .pv-diff-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
  .pv-diff-label { font-size: 0.85rem; font-weight: 700; }
  .pv-diff-detail { font-family: var(--ar-mono); font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: var(--ar-muted); }

  /* legend */
  .pv-legend { display: flex; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
  .pv-legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--ar-text2); }
  .pv-swatch { width: 24px; height: 16px; border-radius: 4px; border: 1.5px solid; }
  .pv-swatch.term { background: var(--ar-cyan-dim); border-color: var(--ar-cyan); }
  .pv-swatch.def  { background: var(--ar-mint-dim); border-color: var(--ar-mint); }

  /* board */
  .pv-grid { display: grid; gap: 8px; margin-bottom: 14px; }
  .pv-card {
    background: transparent; border: none; padding: 0; cursor: pointer;
    perspective: 800px; min-height: 96px; min-width: 0; text-align: center;
  }
  .pv-card:focus-visible { outline: 2px solid var(--ar-cyan); outline-offset: 2px; border-radius: 12px; }
  .pv-inner {
    position: relative; width: 100%; height: 100%; display: block;
    transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
  }
  .pv-card.flipped .pv-inner, .pv-card.matched .pv-inner { transform: rotateY(180deg); }
  .pv-face {
    position: absolute; inset: 0; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 7px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .pv-back {
    background: var(--ar-grad-card); border: 2px solid var(--ar-border);
    font-family: var(--ar-font); font-weight: 700; font-size: 1.3rem; color: var(--ar-violet);
    text-shadow: 0 0 14px rgba(139,92,246,0.7);
    transition: border-color 0.13s ease, transform 0.13s ease, box-shadow 0.13s ease;
  }
  .pv-card:hover:not(.matched):not(.flipped) .pv-back { border-color: var(--ar-cyan); box-shadow: 0 6px 20px rgba(0,229,255,0.18); }
  .pv-front { transform: rotateY(180deg); }
  .pv-front.term { background: var(--ar-cyan-dim); border: 2px solid rgba(0,229,255,0.55); }
  .pv-front.def  { background: var(--ar-mint-dim); border: 2px solid rgba(0,255,163,0.5); }
  .pv-tag { font-family: var(--ar-mono); font-size: 0.46rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; flex-shrink: 0; }
  .pv-front.term .pv-tag { color: var(--ar-cyan); }
  .pv-front.def  .pv-tag { color: var(--ar-mint); }
  .pv-text {
    font-family: var(--ar-font); font-weight: 600; color: var(--ar-text);
    line-height: 1.2; font-size: var(--pv-fs, 0.7rem); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pv-card.matched { cursor: default; }
  .pv-card.matched .pv-front { border-color: var(--ar-mint) !important; box-shadow: 0 0 0 2px rgba(0,255,163,0.25), 0 0 22px rgba(0,255,163,0.35); }
  .pv-card.matched .pv-text { color: #b8ffe3; }
  .pv-card.wrong .pv-inner { animation: pvShake 0.45s ease; }
  @keyframes pvShake { 0%,100%{transform:rotateY(180deg)} 20%{transform:rotateY(180deg) translateX(-6px)} 60%{transform:rotateY(180deg) translateX(6px)} }
  .pv-card.just .pv-inner { animation: pvPop 0.4s cubic-bezier(0.2, 2.0, 0.4, 1) 0.45s both; }
  @keyframes pvPop { 0%{transform:rotateY(180deg) scale(1)} 50%{transform:rotateY(180deg) scale(1.07)} 100%{transform:rotateY(180deg) scale(1)} }
  .pv-card.deal { animation: pvDeal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes pvDeal { from { opacity: 0; transform: translateY(22px) scale(0.7); } to { opacity: 1; transform: none; } }
</style>

<script>
// ── Load vocab from sessionStorage (set by vocab-hub.html) ──
const VOCAB_DATA = JSON.parse(sessionStorage.getItem('vocab') || '[]');
const META       = JSON.parse(sessionStorage.getItem('vocabMeta') || '{}');

const esc      = Arcade.escapeHtml;
const root     = document.getElementById('root');
const announce = document.getElementById('announce');

Arcade.mountMuteButton();

const topicLine = [META.subject, META.board, META.topic].filter(Boolean).join(' · ');
const BEST_KEY = `aism-best:pairs:${META.subject || ''}:${META.topic || ''}`;

// ── Difficulty options ──
const DIFF_OPTIONS = [
  { icon:'🌱', label:'Starter',   pairs:4  },
  { icon:'⚡', label:'Standard',  pairs:6  },
  { icon:'🔥', label:'Challenge', pairs:8  },
  { icon:'💀', label:'Expert',    pairs:10 },
  { icon:'🏆', label:'Master',    pairs:12 },
  { icon:'👾', label:'Legend',    pairs:VOCAB_DATA.length },
];

let selectedPairs = 0;
let flipped = [], matched = new Set(), moves = 0;
let locked = false, gameOver = false;
let combo = 0, bestCombo = 0;
let startTime = 0, clockInterval = null, elapsed = 0;

function shuffle(arr) { return Arcade.shuffle(arr); }
function fmtTime(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function headerHtml(tail) {
  return `
    <div class="ar-badge">🃏 Terms Tester · Memory Match</div>
    <h1 class="ar-title">${esc(META.topic || 'Memory Match')}</h1>
    <div class="ar-meta">${esc([topicLine, tail].filter(Boolean).join(' · '))}</div>
  `;
}

/* ── Missing data fallback ── */
if (!VOCAB_DATA.length) {
  root.innerHTML = `
    <div class="ar-badge">🃏 Terms Tester · Memory Match</div>
    <h1 class="ar-title">No vocab loaded</h1>
    <div class="ar-card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:46px;line-height:1;margin-bottom:12px">🕹</div>
      <p style="color:var(--ar-text2);margin:0 0 18px;">This machine needs a vocabulary list first. Pick a subject and topic in the arcade lobby.</p>
      <a class="ar-btn" href="vocab-hub.html?game=pairs" style="text-decoration:none;display:inline-block;">Choose subject &amp; topic →</a>
    </div>`;
} else {
  renderSetup();
}

/* ── Setup screen ── */
function renderSetup() {
  stopClock();
  root.innerHTML = `
    ${headerHtml('Pick your level')}
    <p class="ar-sub">Flip cards to pair each term with its definition. Back-to-back matches build a combo — fewer moves, better grade.</p>
    <div class="ar-card">
      <div class="pv-legend">
        <div class="pv-legend-item"><span class="pv-swatch term"></span>Cyan = Term</div>
        <div class="pv-legend-item"><span class="pv-swatch def"></span>Mint = Definition</div>
      </div>
      <div class="ar-label">Difficulty</div>
      <div class="pv-diff-grid" id="diff-grid" role="group" aria-label="Difficulty"></div>
      <button class="ar-btn big" id="btn-start" disabled>▶ Insert coin</button>
    </div>
  `;
  const diffGrid = document.getElementById('diff-grid');
  DIFF_OPTIONS.forEach(opt => {
    const n = Math.min(opt.pairs, VOCAB_DATA.length);
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'pv-diff';
    card.disabled = VOCAB_DATA.length < opt.pairs;
    card.dataset.pairs = n;
    card.innerHTML = `<span class="pv-diff-icon" aria-hidden="true">${opt.icon}</span><div class="pv-diff-label">${esc(opt.label)}</div><div class="pv-diff-detail">${esc(n)} pairs</div>`;
    if (!card.disabled) card.addEventListener('click', () => {
      Arcade.sfx.click();
      document.querySelectorAll('.pv-diff').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedPairs = n;
      const start = document.getElementById('btn-start');
      start.disabled = false;
      start.textContent = `▶ Start — ${n} pairs`;
    });
    diffGrid.appendChild(card);
  });
  document.getElementById('btn-start').addEventListener('click', () => { if (selectedPairs) startGame(); });
}

/* ── Game (global so the study-first overlay can wrap it) ── */
function startGame() {
  if (!selectedPairs) return;
  Arcade.sfx.swoosh();
  flipped = []; matched = new Set(); moves = 0;
  locked = false; gameOver = false; combo = 0; bestCombo = 0; elapsed = 0;

  const vw = window.innerWidth || 360;
  let cols;
  if (vw < 420) cols = selectedPairs <= 8 ? 2 : 3;
  else if (vw < 640) cols = selectedPairs <= 10 ? 3 : 4;
  else cols = selectedPairs <= 6 ? 4 : selectedPairs <= 8 ? 4 : selectedPairs <= 10 ? 5 : 6;
  const fs = cols >= 6 ? '0.6rem' : cols >= 5 ? '0.66rem' : cols >= 4 ? '0.74rem' : cols >= 3 ? '0.82rem' : '0.92rem';

  const pool = shuffle([...VOCAB_DATA]).slice(0, selectedPairs);
  let cards = [];
  pool.forEach((item, i) => {
    cards.push({ pairId: i, type: 'term', text: item.term, item });
    cards.push({ pairId: i, type: 'def',  text: item.definition, item });
  });
  cards = shuffle(cards);

  root.innerHTML = `
    ${headerHtml('Find every pair')}
    <div class="ar-hud">
      <div class="ar-hud-stat">Pairs <b id="hudPairs">0/${selectedPairs}</b></div>
      <div class="ar-hud-stat">Moves <b id="hudMoves">0</b></div>
      <div class="ar-hud-stat">Combo <b id="hudCombo">0</b></div>
      <div class="ar-hud-stat gold">Time <b id="hudTime">0:00</b></div>
    </div>
    <div class="pv-grid" id="board" style="grid-template-columns:repeat(${cols},1fr);--pv-fs:${fs};"></div>
    <div id="fb"></div>
    <div class="ar-kbd-hint">Keyboard: Tab between cards · Enter flips</div>
  `;

  const board = document.getElementById('board');
  cards.forEach((c, idx) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'pv-card';
    card.dataset.pairId = c.pairId;
    card.dataset.type = c.type;
    card.dataset.term = c.item.term;
    card.dataset.def = c.item.definition;
    card.setAttribute('aria-label', 'Card ' + (idx + 1) + ', face down');
    card.innerHTML = `
      <span class="pv-inner">
        <span class="pv-face pv-back" aria-hidden="true">?</span>
        <span class="pv-face pv-front ${c.type}">
          <span class="pv-tag">${c.type === 'term' ? 'Term' : 'Definition'}</span>
          <span class="pv-text">${esc(c.text)}</span>
        </span>
      </span>`;
    card.addEventListener('click', () => onCardClick(card));
    card.classList.add('deal');
    card.style.animationDelay = Math.min(idx * 30, 900) + 'ms';
    board.appendChild(card);
  });

  startClock();
  announce.textContent = `Board dealt: ${selectedPairs} pairs. Flip two cards to find a term and its matching definition.`;
}

function startClock() {
  stopClock();
  startTime = Date.now();
  clockInterval = setInterval(() => {
    if (document.hidden || gameOver) return;
    elapsed = Math.floor((Date.now() - startTime) / 1000);
    const el = document.getElementById('hudTime');
    if (el) el.textContent = fmtTime(elapsed);
  }, 500);
}
function stopClock() { clearInterval(clockInterval); clockInterval = null; }

function onCardClick(card) {
  if (locked || gameOver) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (flipped.length >= 2) return;
  card.classList.add('flipped');
  card.setAttribute('aria-label', card.dataset.type === 'term'
    ? 'Term: ' + card.dataset.term
    : 'Definition: ' + card.dataset.def);
  Arcade.sfx.click();
  flipped.push(card);
  if (flipped.length === 2) checkMatch();
}

function checkMatch() {
  locked = true;
  moves++;
  document.getElementById('hudMoves').textContent = moves;
  const [a, b] = flipped;
  const isMatch = a.dataset.pairId === b.dataset.pairId && a.dataset.type !== b.dataset.type;
  const fb = document.getElementById('fb');

  if (isMatch) {
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    setTimeout(() => {
      a.classList.add('matched', 'just'); b.classList.add('matched', 'just');
      a.classList.remove('flipped'); b.classList.remove('flipped');
      a.disabled = true; b.disabled = true;
      setTimeout(() => { a.classList.remove('just'); b.classList.remove('just'); }, 1200);
      matched.add(a.dataset.pairId);
      flipped = []; locked = false;
      Arcade.sfx.correct(combo);
      const r = a.getBoundingClientRect();
      Arcade.confettiBurst({ x: r.left + r.width / 2, y: r.top + r.height / 2, count: 26 });
      if (combo >= 2) Arcade.popTextOver(b, 'COMBO ×' + combo, '#ffd60a');
      Arcade.streakCall(combo);
      Arcade.vibrate(20);

      document.getElementById('hudPairs').textContent = matched.size + '/' + selectedPairs;
      document.getElementById('hudCombo').textContent = combo + (combo >= 3 ? '🔥' : '');
      document.getElementById('hudCombo').parentElement.classList.toggle('hot', combo >= 3);

      fb.className = 'ar-feedback ok';
      fb.innerHTML = `<strong>Matched!</strong> <strong>${esc(a.dataset.term)}</strong> — ${esc(a.dataset.def)}`;
      announce.textContent = `Match! ${a.dataset.term}: ${a.dataset.def}. ${matched.size} of ${selectedPairs} pairs found.`;

      if (matched.size === selectedPairs) setTimeout(endGame, 600);
    }, 350);
  } else {
    combo = 0;
    setTimeout(() => {
      a.classList.add('wrong'); b.classList.add('wrong');
      Arcade.sfx.wrong();
      Arcade.shake();
      Arcade.vibrate([30, 20, 30]);
      // Educational beat: spell out both cards' term + full definition.
      fb.className = 'ar-feedback no';
      fb.innerHTML = `<strong>Not a pair.</strong> <strong>${esc(a.dataset.term)}</strong> — ${esc(a.dataset.def)}<br><strong>${esc(b.dataset.term)}</strong> — ${esc(b.dataset.def)}`;
      announce.textContent = `Not a pair. ${a.dataset.term}: ${a.dataset.def}. ${b.dataset.term}: ${b.dataset.def}.`;
    }, 200);
    setTimeout(() => {
      [a, b].forEach(c => {
        c.classList.remove('flipped', 'wrong');
        c.setAttribute('aria-label', 'Card, face down');
      });
      flipped = []; locked = false;
      document.getElementById('hudCombo').textContent = '0';
      document.getElementById('hudCombo').parentElement.classList.remove('hot');
    }, 1500);
  }
}

function endGame() {
  if (gameOver) return;
  gameOver = true;
  stopClock();
  elapsed = Math.max(elapsed, 1);
  const accuracy = moves > 0 ? Math.min(100, Math.round(selectedPairs / moves * 100)) : 100;

  let insight;
  if (accuracy === 100) insight = 'Perfect recall — every flip was a first-try match. Next level up: bigger board, same accuracy.';
  else if (accuracy >= 70) insight = 'Sharp memory. The pairs that took extra flips are the definitions to re-read — they were spelled out under the board every time you missed.';
  else insight = 'Every mismatch printed both definitions in full — that was the revision happening live. Run it back and watch the move count drop.';

  root.innerHTML = headerHtml('Results') + '<div id="end"></div>';
  Arcade.renderEndCard(document.getElementById('end'), {
    gameName: 'Memory Match',
    gameEmoji: '🃏',
    topic: META.topic || 'Vocabulary',
    meta: [META.subject, META.board].filter(Boolean).join(' · '),
    pct: accuracy,
    big: accuracy,
    bigSuffix: '%',
    bigLabel: 'match accuracy',
    rows: [
      { v: fmtTime(elapsed), l: 'time' },
      { v: String(moves), l: 'moves' },
      { v: '🔥 ' + bestCombo, l: 'best combo' },
    ],
    bestKey: BEST_KEY,
    bestValue: accuracy,
    bestSuffix: '%',
    insight: insight,
    shareLines: [
      '🃏 Memory Match — ' + (META.topic || 'Vocabulary'),
      `${selectedPairs} pairs in ${fmtTime(elapsed)} · ${moves} moves · 🔥 combo ${bestCombo} · ${accuracy}% accuracy`,
    ],
    onAgain: startGame,
  });
  announce.textContent = `All pairs found! ${selectedPairs} pairs in ${fmtTime(elapsed)}, ${moves} moves, best combo ${bestCombo}.`;
}
</script>

<div id="aism-study-overlay" aria-hidden="true">
  <div class="aism-study-card" role="dialog" aria-modal="true" aria-label="Study these before you play">
    <h2 id="aism-study-title">Study first &mdash; then play to test your memory</h2>
    <p class="aism-study-sub">Take your time. When you&rsquo;re ready, start the game.</p>
    <div id="aism-study-content"></div>
    <button id="aism-study-start" class="aism-study-btn" type="button">I&rsquo;m ready &mdash; start game &rarr;</button>
    <button id="aism-study-skip" class="aism-study-skip" type="button">Skip and go straight to game</button>
  </div>
</div>
<script>
(function(){
  if (window.__aismStudyInstalled) return;
  window.__aismStudyInstalled = true;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function buildContent(){
    var c = document.getElementById('aism-study-content');
    if (!c) return false;
    c.innerHTML = '';
    var rendered = false;
    var pairs = null;
    if (typeof ALL_PAIRS !== 'undefined' && Array.isArray(ALL_PAIRS) && ALL_PAIRS.length) pairs = ALL_PAIRS;
    else if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) pairs = VOCAB_DATA;
    if (pairs) {
      pairs.forEach(function(p){
        var term = p.term || p.front || p.word || '';
        var def  = p.def || p.definition || p.back || '';
        var div = document.createElement('div');
        div.className = 'aism-study-item';
        div.innerHTML = '<span class="aism-term">' + esc(term) + '</span>' + (def ? ' &mdash; ' + esc(def) : '');
        c.appendChild(div);
      });
      rendered = true;
    }
    if (!rendered && typeof CATEGORIES !== 'undefined' && typeof ALL_ITEMS !== 'undefined' && Array.isArray(CATEGORIES) && Array.isArray(ALL_ITEMS)) {
      CATEGORIES.forEach(function(catName, idx){
        var wrap = document.createElement('div'); wrap.className = 'aism-study-cat';
        var h = document.createElement('div'); h.className = 'aism-study-cat-head'; h.textContent = catName; wrap.appendChild(h);
        ALL_ITEMS.filter(function(i){ return i.cat === idx; }).forEach(function(i){
          var d = document.createElement('div'); d.className = 'aism-study-item';
          d.textContent = i.text || i.label || '';
          wrap.appendChild(d);
        });
        c.appendChild(wrap);
      });
      rendered = true;
    }
    if (!rendered && typeof ALL_EVENTS !== 'undefined' && Array.isArray(ALL_EVENTS) && ALL_EVENTS.length) {
      var sorted = ALL_EVENTS.slice().sort(function(a,b){
        var ay = parseInt(String(a.year||a.date||'0').replace(/[^-\d]/g,''))||0;
        var by = parseInt(String(b.year||b.date||'0').replace(/[^-\d]/g,''))||0;
        return ay - by;
      });
      sorted.forEach(function(e){
        var div = document.createElement('div');
        div.className = 'aism-study-item';
        div.innerHTML = '<span class="aism-term">' + esc(e.year || e.date || '') + '</span>' + (e.text ? ' &mdash; ' + esc(e.text) : '');
        c.appendChild(div);
      });
      rendered = true;
    }
    return rendered;
  }
  function install(){
    if (typeof window.startGame !== 'function') { setTimeout(install, 80); return; }
    var orig = window.startGame;
    var shown = false;
    window.startGame = function(){
      if (shown) return orig.apply(this, arguments);
      var args = arguments, ctx = this;
      var ov = document.getElementById('aism-study-overlay');
      if (!ov || !buildContent()) return orig.apply(ctx, args);
      ov.dataset.show = '1';
      ov.setAttribute('aria-hidden','false');
      var startBtn = document.getElementById('aism-study-start');
      var skipBtn  = document.getElementById('aism-study-skip');
      function go(){
        ov.dataset.show = '';
        ov.setAttribute('aria-hidden','true');
        shown = true;
        try { orig.apply(ctx, args); } catch(e){ console.error(e); }
      }
      startBtn.onclick = go;
      skipBtn.onclick  = go;
    };
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') install();
  else document.addEventListener('DOMContentLoaded', install);
})();
</script>

</body>
</html>
