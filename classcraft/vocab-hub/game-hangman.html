<style>
  /* ── shield / energy meter ── */
  .hb-core { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; }
  .hb-face { font-size: 2.1rem; line-height: 1; filter: drop-shadow(0 0 16px rgba(0,255,163,0.5)); transition: filter 0.3s ease; }
  .hb-meter { display: flex; gap: 5px; width: 100%; max-width: 320px; }
  .hb-cell {
    flex: 1; height: 14px; border-radius: 4px;
    background: var(--ar-mint); box-shadow: 0 0 10px rgba(0,255,163,0.55);
    transition: all 0.3s ease;
  }
  .hb-cell.low  { background: var(--ar-gold); box-shadow: 0 0 10px rgba(255,214,10,0.55); }
  .hb-cell.crit { background: var(--ar-pink); box-shadow: 0 0 10px rgba(255,46,136,0.6); animation: arBreathe 0.8s ease-in-out infinite; }
  .hb-cell.dead { background: var(--ar-card2); box-shadow: none; }
  .hb-cell.draining { animation: hbDrain 0.45s ease both; }
  @keyframes hbDrain {
    0% { background: var(--ar-pink); box-shadow: 0 0 18px rgba(255,46,136,0.9); transform: scaleY(1.6); }
    100% { background: var(--ar-card2); box-shadow: none; transform: scaleY(1); }
  }
  .hb-status { font-family: var(--ar-mono); font-size: 10px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; }
  .hb-status.s4 { color: var(--ar-mint); text-shadow: 0 0 12px rgba(0,255,163,0.6); }
  .hb-status.s3 { color: var(--ar-cyan); text-shadow: 0 0 12px rgba(0,229,255,0.6); }
  .hb-status.s2 { color: var(--ar-gold); text-shadow: 0 0 12px rgba(255,214,10,0.6); }
  .hb-status.s1 { color: var(--ar-pink); text-shadow: 0 0 12px rgba(255,46,136,0.7); animation: arBreathe 0.8s ease-in-out infinite; }

  /* ── word display ── */
  .hb-word { display: flex; flex-wrap: wrap; gap: 12px 18px; justify-content: center; margin: 6px 0 14px; }
  .hb-word-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .hb-slot {
    min-width: 26px; height: 40px; display: flex; align-items: flex-start; justify-content: center;
    border-bottom: 3px solid var(--ar-border-hi); padding: 0 2px;
    font-family: var(--ar-font); font-weight: 700; font-size: clamp(1.15rem, 4.5vw, 1.7rem);
    color: transparent; transition: border-color 0.2s ease;
  }
  .hb-slot.shown { color: var(--ar-mint); border-color: rgba(0,255,163,0.5); text-shadow: 0 0 16px rgba(0,255,163,0.5); }
  .hb-slot.fixed { color: var(--ar-muted); }
  .hb-slot.soft  { color: var(--ar-cyan); border-color: rgba(0,229,255,0.5); text-shadow: 0 0 16px rgba(0,229,255,0.5); }
  .hb-slot.pop   { animation: hbPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes hbPop { 0% { transform: scale(0.2); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .hb-slot.wave  { animation: hbWave 0.5s ease; }
  @keyframes hbWave { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }

  /* ── on-screen keyboard ── */
  .hb-kb { margin-top: 4px; }
  .hb-kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
  .hb-key {
    font-family: var(--ar-font); font-size: 0.85rem; font-weight: 700;
    background: var(--ar-card); border: 2px solid var(--ar-border); border-radius: 8px;
    flex: 1; max-width: 42px; min-width: 0; padding: 0.55rem 0; cursor: pointer; color: var(--ar-text);
    transition: all 0.12s ease; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .hb-key:hover:not(:disabled) { border-color: var(--ar-cyan); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,229,255,0.2); }
  .hb-key:active:not(:disabled) { transform: scale(0.92); }
  .hb-key:focus-visible { outline: 2px solid var(--ar-cyan); outline-offset: 1px; }
  .hb-key.hit  { background: var(--ar-mint-dim); border-color: var(--ar-mint); color: var(--ar-mint); box-shadow: 0 0 12px rgba(0,255,163,0.25); }
  .hb-key.miss { background: var(--ar-pink-dim); border-color: rgba(255,46,136,0.35); color: rgba(255,46,136,0.6); opacity: 0.6; }
  .hb-key:disabled { cursor: default; }

  .hb-hint {
    font-family: var(--ar-mono); font-size: 0.66rem; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; background: var(--ar-gold-dim); border: 2px solid rgba(255,214,10,0.4);
    color: var(--ar-gold); padding: 0.4rem 0.9rem; border-radius: 10px; cursor: pointer;
    transition: all 0.13s ease;
  }
  .hb-hint:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,214,10,0.25); }
  .hb-hint:focus-visible { outline: 2px solid var(--ar-gold); outline-offset: 2px; }
  .hb-hint:disabled { opacity: 0.35; cursor: default; }
</style>

<script>
// ── Load vocab (set by vocab-hub.html via sessionStorage) ──
const VOCAB_DATA = JSON.parse(sessionStorage.getItem('vocab') || '[]');
const META       = JSON.parse(sessionStorage.getItem('vocabMeta') || '{}');

const esc      = Arcade.escapeHtml;
const root     = document.getElementById('root');
const announce = document.getElementById('announce');

Arcade.mountMuteButton();

const MAX_WRONG = 7;
const KB_ROWS   = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const topicLine = [META.subject, META.board, META.topic].filter(Boolean).join(' · ');
const BEST_KEY  = `aism-best:hangman:${META.subject || ''}:${META.topic || ''}`;

// ── STATE ──
let wordList = [], wordIndex = 0;
let currentWord = '', currentDef = '', currentItem = null;
let guessed = new Set(), wrongCount = 0;
let score = 0, correct = 0, failed = 0, streak = 0, bestStreak = 0;
let gameActive = false;
let resultGrid = [];

function shuffle(arr) { return Arcade.shuffle(arr); }
// Strip accents so É is solved by guessing E (French/Spanish/German terms).
function baseChar(ch) {
  return ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}
function isGuessable(ch) { return /^[A-Z]$/.test(baseChar(ch)); }

function headerHtml(tail) {
  return `
    <div class="ar-badge">🛡 Terms Tester · System Breach (Hangman)</div>
    <h1 class="ar-title">${esc(META.topic || 'System Breach')}</h1>
    <div class="ar-meta">${esc([topicLine, tail].filter(Boolean).join(' · '))}</div>
  `;
}

/* ── Missing data fallback ── */
if (!VOCAB_DATA.length) {
  root.innerHTML = `
    <div class="ar-badge">🛡 Terms Tester · System Breach (Hangman)</div>
    <h1 class="ar-title">No vocab loaded</h1>
    <div class="ar-card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:46px;line-height:1;margin-bottom:12px">🕹</div>
      <p style="color:var(--ar-text2);margin:0 0 18px;">This machine needs a vocabulary list first. Pick a subject and topic in the arcade lobby.</p>
      <a class="ar-btn" href="vocab-hub.html?game=hangman" style="text-decoration:none;display:inline-block;">Choose subject &amp; topic →</a>
    </div>`;
} else {
  renderIntro();
}

/* ── Intro screen ── */
function renderIntro() {
  root.innerHTML = `
    ${headerHtml('Briefing')}
    <p class="ar-sub">The definition is your decryption clue. Crack the term letter by letter — every wrong guess drains a cell of your shield. Seven misses and the firewall breaches.</p>
    <div class="ar-card">
      <div class="ar-label">Mission briefing</div>
      <div style="display:flex;flex-direction:column;gap:9px;color:var(--ar-text2);font-size:14px;line-height:1.5;">
        <div>🛡 <strong style="color:var(--ar-text)">7 shield cells</strong> per word — wrong letters drain them</div>
        <div>💡 Stuck? A <strong style="color:var(--ar-text)">hint</strong> reveals a letter for <strong style="color:var(--ar-text)">−5 pts</strong></div>
        <div>🔥 Crack words back-to-back to build a <strong style="color:var(--ar-text)">streak</strong></div>
        <div>⌨️ Tap the on-screen keys or type on your keyboard</div>
        <div>🎯 More shield left when you solve = more points</div>
      </div>
      <div style="margin-top:18px;"><button class="ar-btn big" id="btn-begin">▶ Start the breach</button></div>
    </div>
  `;
  document.getElementById('btn-begin').addEventListener('click', () => startGame());
}

/* ── Game (global so the study-first overlay can wrap it) ── */
function startGame() {
  Arcade.sfx.swoosh();
  wordList = shuffle([...VOCAB_DATA]);
  wordIndex = 0; score = 0; correct = 0; failed = 0; streak = 0; bestStreak = 0;
  resultGrid = [];
  loadWord(0);
}

function loadWord(idx) {
  if (idx >= wordList.length) { showFinal(); return; }
  currentItem = wordList[idx];
  currentWord = currentItem.term.toUpperCase();
  currentDef  = currentItem.definition;
  guessed = new Set();
  wrongCount = 0;
  gameActive = true;
  renderRound();
  announce.textContent = `Word ${idx + 1} of ${wordList.length}. Clue: ${currentDef}`;
}

function hudHtml() {
  return `
    <div class="ar-hud">
      <div class="ar-hud-stat">Score <b id="hudScore">${score}</b></div>
      <div class="ar-hud-stat${streak >= 2 ? ' hot' : ''}">Streak <b id="hudStreak">${streak}${streak >= 2 ? '🔥' : ''}</b></div>
      <div class="ar-hud-stat gold">Word <b>${wordIndex + 1}/${wordList.length}</b></div>
    </div>`;
}

function renderRound() {
  root.innerHTML = `
    ${headerHtml('Word ' + (wordIndex + 1) + ' of ' + wordList.length)}
    ${hudHtml()}
    <div class="ar-card">
      <div class="hb-core" aria-hidden="true">
        <div class="hb-face" id="hbFace">🛡️</div>
        <div class="hb-meter" id="hbMeter">${Array.from({ length: MAX_WRONG }, () => '<span class="hb-cell"></span>').join('')}</div>
        <div class="hb-status s4" id="hbStatus">FIREWALL STABLE</div>
      </div>
      <div class="ar-label">Decryption clue — guess the term</div>
      <div class="ar-prompt" style="font-size:15.5px;font-weight:600;color:var(--ar-text2);">${esc(currentDef)}</div>
      <div class="hb-word" id="wordDisplay" aria-hidden="true"></div>
      <div style="display:flex;justify-content:center;margin-bottom:10px;">
        <button class="hb-hint" type="button" id="btnHint" title="Reveal a letter (−5 pts)">💡 Hint −5 pts</button>
      </div>
      <div class="hb-kb" id="keyboard" role="group" aria-label="Letter keyboard"></div>
      <div class="ar-kbd-hint">Keyboard: type any letter to guess it</div>
      <div id="fb"></div>
      <div id="nextWrap" style="margin-top:14px;"></div>
    </div>
  `;
  renderMeter();
  renderWord();
  renderKeyboard();
  document.getElementById('btnHint').addEventListener('click', useHint);
  updateHintBtn();
}

function renderMeter(drainedIdx) {
  const left = MAX_WRONG - wrongCount;
  const cells = document.querySelectorAll('#hbMeter .hb-cell');
  cells.forEach((c, i) => {
    c.className = 'hb-cell';
    if (i >= left) {
      c.classList.add('dead');
      if (drainedIdx === i) c.classList.add('draining');
    } else if (left <= 2) c.classList.add('crit');
    else if (left <= 4) c.classList.add('low');
  });
  const face = document.getElementById('hbFace');
  const status = document.getElementById('hbStatus');
  if (!face || !status) return;
  if (left >= 6)      { face.textContent = '🛡️'; status.textContent = 'FIREWALL STABLE';   status.className = 'hb-status s4'; }
  else if (left >= 4) { face.textContent = '🛡️'; status.textContent = 'SHIELDS HOLDING';   status.className = 'hb-status s3'; }
  else if (left >= 2) { face.textContent = '⚠️'; status.textContent = 'SYSTEM UNSTABLE';   status.className = 'hb-status s2'; }
  else if (left >= 1) { face.textContent = '🚨'; status.textContent = 'CRITICAL — 1 CELL'; status.className = 'hb-status s1'; }
  else                { face.textContent = '💥'; status.textContent = 'SYSTEM BREACHED';   status.className = 'hb-status s1'; }
}

function renderWord(revealCh) {
  const disp = document.getElementById('wordDisplay');
  disp.innerHTML = '';
  currentWord.split(' ').forEach(word => {
    const group = document.createElement('div');
    group.className = 'hb-word-group';
    word.split('').forEach(ch => {
      const slot = document.createElement('div');
      const guessable = isGuessable(ch);
      const shown = !guessable || guessed.has(baseChar(ch));
      slot.className = 'hb-slot' + (shown ? (guessable ? ' shown' : ' fixed') : '');
      if (revealCh && guessable && baseChar(ch) === revealCh) slot.classList.add('pop');
      slot.textContent = ch;
      group.appendChild(slot);
    });
    disp.appendChild(group);
  });
}

function renderKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(rowStr => {
    const row = document.createElement('div');
    row.className = 'hb-kb-row';
    rowStr.split('').forEach(ch => {
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'hb-key';
      key.id = 'key-' + ch;
      key.textContent = ch;
      key.setAttribute('aria-label', 'Guess letter ' + ch);
      key.addEventListener('click', () => guessLetter(ch));
      row.appendChild(key);
    });
    kb.appendChild(row);
  });
}

function wordBaseLetters() {
  return new Set(currentWord.split('').filter(isGuessable).map(baseChar));
}

// ── GUESS ──
function guessLetter(ch) {
  if (!gameActive || guessed.has(ch)) return;
  guessed.add(ch);
  const keyEl = document.getElementById('key-' + ch);
  const inWord = wordBaseLetters().has(ch);

  if (inWord) {
    if (keyEl) { keyEl.classList.add('hit'); keyEl.disabled = true; }
    Arcade.sfx.correct(1);
    Arcade.vibrate(15);
    renderWord(ch);
    if (keyEl) Arcade.popTextOver(keyEl, ch, '#00ffa3');
    announce.textContent = `${ch} is in the term.`;
    updateHintBtn();

    const allGuessed = [...wordBaseLetters()].every(l => guessed.has(l));
    if (allGuessed) {
      gameActive = false;
      celebrateWin();
    }
  } else {
    wrongCount++;
    if (keyEl) { keyEl.classList.add('miss'); keyEl.disabled = true; }
    Arcade.sfx.wrong();
    Arcade.shake();
    Arcade.vibrate([40, 30, 40]);
    renderMeter(MAX_WRONG - wrongCount);
    const left = MAX_WRONG - wrongCount;
    if (left === 1) Arcade.sfx.heartbeat();
    announce.textContent = `${ch} is not in the term. ${left} shield ${left === 1 ? 'cell' : 'cells'} left.`;
    updateHintBtn();
    if (wrongCount >= MAX_WRONG) {
      gameActive = false;
      revealWordGently();
      Arcade.sfx.timeup();
      Arcade.flashMsg('BREACHED 💥', '#ff2e88');
      setTimeout(() => settleWord(false), 900);
    }
  }
}

function celebrateWin() {
  const livesLeft = MAX_WRONG - wrongCount;
  Arcade.sfx.fanfare();
  Arcade.confettiBurst({ count: 60 });
  Arcade.flashMsg(livesLeft >= 5 ? 'CLEAN CRACK ⚡' : 'DECRYPTED', '#00ffa3');
  document.querySelectorAll('#wordDisplay .hb-slot').forEach((el, i) => {
    el.style.animationDelay = (i * 0.05) + 's';
    el.classList.remove('pop');
    el.classList.add('wave');
  });
  setTimeout(() => settleWord(true), 900);
}

// Gentle staggered reveal of missing letters — it's revision, not punishment.
function revealWordGently() {
  document.querySelectorAll('#wordDisplay .hb-slot:not(.shown):not(.fixed)').forEach((el, i) => {
    setTimeout(() => el.classList.add('soft', 'pop'), i * 80);
  });
}

// ── HINT ──
function useHint() {
  if (!gameActive) return;
  const unrevealed = [...wordBaseLetters()].filter(l => !guessed.has(l));
  if (unrevealed.length <= 1) return; // a hint never finishes the word
  const first = baseChar(currentWord.split('').filter(isGuessable)[0]);
  const ch = !guessed.has(first) ? first
           : unrevealed[Math.floor(Math.random() * unrevealed.length)];
  score = Math.max(0, score - 5);
  const hudS = document.getElementById('hudScore');
  if (hudS) hudS.textContent = score;
  Arcade.sfx.coin();
  guessLetter(ch);
  updateHintBtn();
}

function updateHintBtn() {
  const btn = document.getElementById('btnHint');
  if (!btn) return;
  const unrevealed = [...wordBaseLetters()].filter(l => !guessed.has(l));
  btn.disabled = !gameActive || unrevealed.length <= 1;
}

// ── WORD RESULT (educational beat: term + full definition, always) ──
function settleWord(won) {
  document.querySelectorAll('.hb-key').forEach(k => { k.disabled = true; });
  let pts = 0;
  if (won) {
    const livesLeft = MAX_WRONG - wrongCount;
    pts = 10 + livesLeft * 5;
    score += pts;
    correct++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    resultGrid.push('🟩');
    Arcade.streakCall(streak);
  } else {
    failed++;
    streak = 0;
    resultGrid.push('🟥');
  }

  const hudS = document.getElementById('hudScore');
  hudS.textContent = score;
  const hudSt = document.getElementById('hudStreak');
  hudSt.textContent = streak + (streak >= 2 ? '🔥' : '');
  hudSt.parentElement.classList.toggle('hot', streak >= 2);

  const fb = document.getElementById('fb');
  fb.className = 'ar-feedback ' + (won ? 'ok' : 'no');
  fb.innerHTML = (won
    ? `<strong>Decrypted! +${pts} pts${streak >= 2 ? ' · 🔥 ' + streak + ' in a row' : ''}.</strong> `
    : `<strong>The firewall fell. The term was:</strong> `)
    + `<strong>${esc(currentItem.term)}</strong> — ${esc(currentDef)}`;
  announce.textContent = (won
    ? `Solved! Plus ${pts} points. `
    : 'Out of shield. ')
    + `The term was ${currentItem.term}: ${currentDef}`;

  const isLast = wordIndex >= wordList.length - 1;
  document.getElementById('nextWrap').innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="ar-btn big" id="next" style="flex:2;min-width:160px;">${isLast ? 'See final score →' : 'Next word →'}</button>
      <button class="ar-btn ghost" id="endEarly" style="flex:1;min-width:110px;">End run</button>
    </div>`;
  const nextBtn = document.getElementById('next');
  nextBtn.addEventListener('click', nextWord);
  document.getElementById('endEarly').addEventListener('click', showFinal);
  nextBtn.focus({ preventScroll: true });
}

function nextWord() {
  Arcade.sfx.swoosh();
  wordIndex++;
  if (wordIndex >= wordList.length) showFinal();
  else loadWord(wordIndex);
}

// ── FINAL ──
function showFinal() {
  gameActive = false;
  const attempted = Math.max(1, correct + failed);
  const pct = Math.round((correct / attempted) * 100);

  let insight;
  if (pct === 100) insight = 'Every firewall cracked. You did not just recognise these terms — you rebuilt them letter by letter, which is exactly how spellings stick for exam day.';
  else if (pct >= 60) insight = 'Solid breach rate. The words that broke through your shield were restated with full definitions — re-read those, then run it back with more cells intact.';
  else insight = 'Tough system. Every breached word showed you the term and its definition in full — that reveal is the revision. Go again and watch your shield survive longer.';

  root.innerHTML = headerHtml('Results') + '<div id="end"></div>';
  Arcade.renderEndCard(document.getElementById('end'), {
    gameName: 'System Breach',
    gameEmoji: '🛡',
    topic: META.topic || 'Vocabulary',
    meta: [META.subject, META.board].filter(Boolean).join(' · '),
    pct: pct,
    big: score,
    bigLabel: 'points',
    rows: [
      { v: String(correct), l: 'cracked' },
      { v: String(failed), l: 'breached' },
      { v: '🔥 ' + bestStreak, l: 'best streak' },
    ],
    emojiGrid: resultGrid.join(''),
    bestKey: BEST_KEY,
    bestValue: score,
    bestSuffix: ' pts',
    insight: insight,
    shareLines: [
      '🛡 System Breach (Hangman) — ' + (META.topic || 'Vocabulary'),
      `Score ${score} pts · ${correct} cracked · 🔥 best streak ${bestStreak}`,
      resultGrid.join(''),
    ],
    onAgain: startGame,
  });
  announce.textContent = `Run over. Score ${score} points. ${correct} words cracked, ${failed} breached.`;
}

// ── PHYSICAL KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const study = document.getElementById('aism-study-overlay');
  if (study && study.dataset.show === '1') return;

  if (e.key === 'Enter') {
    if (e.target && e.target.tagName === 'BUTTON') return; // native activation
    const next = document.getElementById('next');
    if (next) { e.preventDefault(); next.click(); }
    return;
  }
  const ch = e.key.toUpperCase();
  if (gameActive && /^[A-Z]$/.test(ch)) {
    e.preventDefault();
    guessLetter(ch);
  }
});
</script>

<div id="aism-study-overlay" aria-hidden="true">
  <div class="aism-study-card" role="dialog" aria-modal="true" aria-label="Study these before you play">
    <h2 id="aism-study-title">Study first &mdash; then play to test your memory</h2>
    <p class="aism-study-sub">Take your time. When you&rsquo;re ready, start the game.</p>
    <div id="aism-study-content"></div>
    <button id="aism-study-start" class="aism-study-btn" type="button">I&rsquo;m ready &mdash; start game &rarr;</button>
    <button id="aism-study-skip" class="aism-study-skip" type="button">Skip and go straight to game</button>
  </div>
</div>
<script>
(function(){
  if (window.__aismStudyInstalled) return;
  window.__aismStudyInstalled = true;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function buildContent(){
    var c = document.getElementById('aism-study-content');
    if (!c) return false;
    c.innerHTML = '';
    var rendered = false;
    var pairs = null;
    if (typeof ALL_PAIRS !== 'undefined' && Array.isArray(ALL_PAIRS) && ALL_PAIRS.length) pairs = ALL_PAIRS;
    else if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) pairs = VOCAB_DATA;
    if (pairs) {
      pairs.forEach(function(p){
        var term = p.term || p.front || p.word || '';
        var def  = p.def || p.definition || p.back || '';
        var div = document.createElement('div');
        div.className = 'aism-study-item';
        div.innerHTML = '<span class="aism-term">' + esc(term) + '</span>' + (def ? ' &mdash; ' + esc(def) : '');
        c.appendChild(div);
      });
      rendered = true;
    }
    if (!rendered && typeof CATEGORIES !== 'undefined' && typeof ALL_ITEMS !== 'undefined' && Array.isArray(CATEGORIES) && Array.isArray(ALL_ITEMS)) {
      CATEGORIES.forEach(function(catName, idx){
        var wrap = document.createElement('div'); wrap.className = 'aism-study-cat';
        var h = document.createElement('div'); h.className = 'aism-study-cat-head'; h.textContent = catName; wrap.appendChild(h);
        ALL_ITEMS.filter(function(i){ return i.cat === idx; }).forEach(function(i){
          var d = document.createElement('div'); d.className = 'aism-study-item';
          d.textContent = i.text || i.label || '';
          wrap.appendChild(d);
        });
        c.appendChild(wrap);
      });
      rendered = true;
    }
    if (!rendered && typeof ALL_EVENTS !== 'undefined' && Array.isArray(ALL_EVENTS) && ALL_EVENTS.length) {
      var sorted = ALL_EVENTS.slice().sort(function(a,b){
        var ay = parseInt(String(a.year||a.date||'0').replace(/[^-\d]/g,''))||0;
        var by = parseInt(String(b.year||b.date||'0').replace(/[^-\d]/g,''))||0;
        return ay - by;
      });
      sorted.forEach(function(e){
        var div = document.createElement('div');
        div.className = 'aism-study-item';
        div.innerHTML = '<span class="aism-term">' + esc(e.year || e.date || '') + '</span>' + (e.text ? ' &mdash; ' + esc(e.text) : '');
        c.appendChild(div);
      });
      rendered = true;
    }
    return rendered;
  }
  function install(){
    if (typeof window.startGame !== 'function') { setTimeout(install, 80); return; }
    var orig = window.startGame;
    var shown = false;
    window.startGame = function(){
      if (shown) return orig.apply(this, arguments);
      var args = arguments, ctx = this;
      var ov = document.getElementById('aism-study-overlay');
      if (!ov || !buildContent()) return orig.apply(ctx, args);
      ov.dataset.show = '1';
      ov.setAttribute('aria-hidden','false');
      var startBtn = document.getElementById('aism-study-start');
      var skipBtn  = document.getElementById('aism-study-skip');
      function go(){
        ov.dataset.show = '';
        ov.setAttribute('aria-hidden','true');
        shown = true;
        try { orig.apply(ctx, args); } catch(e){ console.error(e); }
      }
      startBtn.onclick = go;
      skipBtn.onclick  = go;
    };
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') install();
  else document.addEventListener('DOMContentLoaded', install);
})();
</script>
