<script>
// ── Load vocab (set by vocab-hub.html via sessionStorage) ──
const VOCAB_DATA = JSON.parse(sessionStorage.getItem('vocab') || '[]');
const META       = JSON.parse(sessionStorage.getItem('vocabMeta') || '{}');

const esc      = Arcade.escapeHtml;
const root     = document.getElementById('root');
const announce = document.getElementById('announce');

Arcade.mountMuteButton();

const ROUND_MS = 20000;
const KEYS = ['A', 'B', 'C', 'D'];
const topicLine = [META.subject, META.board, META.topic].filter(Boolean).join(' · ');
const BEST_KEY = `aism-best:quiz:${META.subject || ''}:${META.topic || ''}`;

let selectedCount = 0;
let selectedMode  = 'def';
let activeQs = [], state = null, timerCtl = null;

function shuffle(arr) { return Arcade.shuffle(arr); }

function headerHtml(tail) {
  return `
    <div class="ar-badge">❓ Terms Tester · Multiple Choice</div>
    <h1 class="ar-title">${esc(META.topic || 'Vocabulary Quiz')}</h1>
    <div class="ar-meta">${esc([topicLine, tail].filter(Boolean).join(' · '))}</div>
  `;
}

function bump(el) {
  if (!el) return;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 350);
}

/* ── Missing data fallback ── */
if (!VOCAB_DATA.length) {
  root.innerHTML = `
    <div class="ar-badge">❓ Terms Tester · Multiple Choice</div>
    <h1 class="ar-title">No vocab loaded</h1>
    <div class="ar-card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:46px;line-height:1;margin-bottom:12px">🕹</div>
      <p style="color:var(--ar-text2);margin:0 0 18px;">This machine needs a vocabulary list first. Pick a subject and topic in the arcade lobby.</p>
      <a class="ar-btn" href="vocab-hub.html?game=quiz" style="text-decoration:none;display:inline-block;">Choose subject &amp; topic →</a>
    </div>`;
} else {
  renderSetup();
}

/* ── Setup screen ── */
function renderSetup() {
  if (timerCtl) { timerCtl.stop(); timerCtl = null; }
  root.innerHTML = `
    ${headerHtml('Set your run')}
    <p class="ar-sub">Tap the right answer before the bar runs dry. 100 pts base, up to +50 speed bonus, streaks multiply everything up to ×2.</p>
    <div class="ar-card">
      <div class="ar-label">Questions per run</div>
      <div class="vq-setup-row" id="count-row" role="group" aria-label="Number of questions"></div>
      <div class="ar-label" style="margin-top:16px;">Mode</div>
      <div class="vq-setup-row" role="group" aria-label="Quiz mode">
        <button type="button" class="vq-chip mode selected" data-mode="def">Definition → Term</button>
        <button type="button" class="vq-chip mode" data-mode="term">Term → Definition</button>
      </div>
      <p style="color:var(--ar-muted);font-size:12.5px;margin:10px 0 18px;" id="mode-desc">Given the definition, choose the correct term.</p>
      <button class="ar-btn big" id="btn-start" disabled>▶ Insert coin</button>
    </div>
  `;
  const countRow = document.getElementById('count-row');
  [5, 10, 15, 20, 'All'].forEach(n => {
    const actual = n === 'All' ? VOCAB_DATA.length : Math.min(n, VOCAB_DATA.length);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'vq-chip count';
    btn.dataset.count = actual;
    btn.textContent = n === 'All' ? `All (${actual})` : n;
    if (typeof n === 'number' && n > VOCAB_DATA.length) btn.disabled = true;
    else btn.addEventListener('click', () => {
      Arcade.sfx.click();
      document.querySelectorAll('.vq-chip.count').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCount = actual;
      const start = document.getElementById('btn-start');
      start.disabled = false;
      start.textContent = `▶ Start — ${actual} questions`;
    });
    countRow.appendChild(btn);
  });
  document.querySelectorAll('.vq-chip.mode').forEach(b => {
    b.addEventListener('click', () => {
      Arcade.sfx.click();
      document.querySelectorAll('.vq-chip.mode').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selectedMode = b.dataset.mode;
      document.getElementById('mode-desc').textContent = selectedMode === 'def'
        ? 'Given the definition, choose the correct term.'
        : 'Given the term, choose the correct definition.';
    });
  });
  document.getElementById('btn-start').addEventListener('click', startGame);
}

/* ── Build + run a quiz ── */
function startGame() {
  if (!selectedCount) return;
  Arcade.sfx.swoosh();
  const pool = shuffle([...VOCAB_DATA]).slice(0, selectedCount);
  activeQs = pool.map((item, idx) => {
    const others = pool.filter((_, i) => i !== idx);
    const wrongs = shuffle(others).slice(0, 3).map(o => selectedMode === 'def' ? o.term : o.definition);
    const correct = selectedMode === 'def' ? item.term : item.definition;
    const question = selectedMode === 'def' ? item.definition : item.term;
    const options = shuffle([correct, ...wrongs]);
    return { question, correct, options, item };
  });
  state = { idx: 0, correct: 0, score: 0, streak: 0, bestStreak: 0, grid: [] };
  renderQuestion();
}

function hudHtml() {
  return `
    <div class="ar-hud">
      <div class="ar-hud-stat">Score <b id="hudScore">${state.score}</b></div>
      <div class="ar-hud-stat${state.streak >= 3 ? ' hot' : ''}">Streak <b id="hudStreak">${state.streak}${state.streak >= 3 ? '🔥' : ''}</b></div>
      <div class="ar-hud-stat gold">Q <b>${state.idx + 1}/${activeQs.length}</b></div>
    </div>`;
}

function renderQuestion() {
  const q = activeQs[state.idx];
  root.innerHTML = `
    ${headerHtml('Question ' + (state.idx + 1) + ' of ' + activeQs.length)}
    ${hudHtml()}
    <div class="ar-dots" aria-hidden="true">${activeQs.map((_, i) => {
      if (i < state.idx) return `<span class="${state.grid[i] === '🟩' ? 'done' : 'fail'}"></span>`;
      return `<span class="${i === state.idx ? 'now' : ''}"></span>`;
    }).join('')}</div>
    <div class="ar-timer" aria-hidden="true"><i id="tfill"></i></div>
    <div class="ar-card">
      <div class="ar-label">${selectedMode === 'def' ? 'Definition — pick the term' : 'Term — pick the definition'}</div>
      <div class="ar-prompt">${esc(q.question)}</div>
      <div class="vq-opt-row ar-stagger" role="group" aria-label="Answer options">
        ${q.options.map((opt, i) => `
          <button type="button" class="ar-tile" data-idx="${i}">
            <span class="vq-key" aria-hidden="true">${KEYS[i]}</span><span class="vq-opt-text">${esc(opt)}</span>
          </button>`).join('')}
      </div>
      <div class="ar-kbd-hint">Keyboard: 1–4 or A–D answers · Enter for next</div>
      <div id="fb"></div>
      <div id="nextWrap" style="margin-top:14px;"></div>
    </div>
  `;
  announce.textContent = `Question ${state.idx + 1} of ${activeQs.length}. ${q.question}`;

  const tiles = Array.from(root.querySelectorAll('.vq-opt-row .ar-tile'));
  let phase = 'answer';

  timerCtl = Arcade.timer(document.getElementById('tfill'), ROUND_MS, {
    onEnd: () => { if (phase === 'answer') settle(null, true); },
  });

  function settle(chosenIdx, timedOut) {
    if (phase !== 'answer') return;
    phase = 'verdict';
    const remaining = timedOut ? 0 : timerCtl.remaining;
    timerCtl.stop();

    const chosen = chosenIdx === null ? null : q.options[chosenIdx];
    const ok = !timedOut && chosen === q.correct;
    const correctIdx = q.options.indexOf(q.correct);

    tiles.forEach((b, i) => {
      b.disabled = true;
      if (i === correctIdx) b.classList.add('correct');
      else if (i === chosenIdx) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    let pts = 0;
    if (ok) {
      state.correct++;
      state.streak++;
      state.bestStreak = Math.max(state.bestStreak, state.streak);
      const mult = Math.min(2, 1 + 0.25 * (state.streak - 1));
      const speed = Math.round(50 * (remaining / ROUND_MS));
      pts = Math.round((100 + speed) * mult);
      state.score += pts;
      state.grid.push('🟩');
      Arcade.sfx.correct(state.streak);
      if (![3, 5, 7, 10].includes(state.streak)) Arcade.flashMsg('NAILED IT', '#00ffa3');
      Arcade.streakCall(state.streak);
      Arcade.confettiBurst({ count: 36 });
      Arcade.popTextOver(tiles[correctIdx], '+' + pts, '#00ffa3');
      Arcade.vibrate(20);
    } else {
      state.streak = 0;
      state.grid.push(timedOut ? '⬛' : '🟥');
      if (timedOut) { Arcade.sfx.timeup(); Arcade.flashMsg("TIME'S UP ⏱", '#ffd60a'); }
      else { Arcade.sfx.wrong(); Arcade.flashMsg('MISS', '#ff2e88'); }
      Arcade.shake();
      Arcade.vibrate([40, 30, 40]);
    }

    const hudS = document.getElementById('hudScore');
    hudS.textContent = state.score;
    if (pts) bump(hudS);
    const hudSt = document.getElementById('hudStreak');
    hudSt.textContent = state.streak + (state.streak >= 3 ? '🔥' : '');
    bump(hudSt);
    hudSt.parentElement.classList.toggle('hot', state.streak >= 3);

    // Educational beat: always restate the term + full definition.
    const fb = document.getElementById('fb');
    fb.className = 'ar-feedback ' + (ok ? 'ok' : 'no');
    fb.innerHTML = (ok
      ? `<strong>Correct! +${pts} pts.</strong> `
      : timedOut
        ? `<strong>The clock won that one.</strong> `
        : `<strong>Not quite.</strong> `)
      + `<strong>${esc(q.item.term)}</strong> — ${esc(q.item.definition)}`;
    announce.textContent = (ok
      ? `Correct, plus ${pts} points. `
      : timedOut ? 'Time up. ' : 'Incorrect. ')
      + `${q.item.term}: ${q.item.definition}`;

    const last = state.idx + 1 >= activeQs.length;
    document.getElementById('nextWrap').innerHTML =
      `<button class="ar-btn big" id="next">${last ? 'See your score →' : 'Next →'}</button>`;
    const nextBtn = document.getElementById('next');
    nextBtn.addEventListener('click', advance);
    nextBtn.focus({ preventScroll: true });
    if (ok && !last) {
      // Quick learners keep momentum — auto-advance on a correct answer.
      setTimeout(() => { if (document.getElementById('next') === nextBtn) advance(); }, 1400);
    }
  }

  let advanced = false;
  function advance() {
    if (advanced) return;
    advanced = true;
    Arcade.sfx.swoosh();
    if (state.idx + 1 < activeQs.length) {
      state.idx++;
      renderQuestion();
    } else {
      renderEnd();
    }
  }

  tiles.forEach(b => {
    b.addEventListener('click', () => {
      if (phase !== 'answer') return;
      Arcade.sfx.click();
      settle(parseInt(b.dataset.idx), false);
    });
  });
}

/* ── End card ── */
function renderEnd() {
  if (timerCtl) { timerCtl.stop(); timerCtl = null; }
  const total = activeQs.length;
  const pct = Math.round((state.correct / total) * 100);

  let insight;
  if (pct === 100) insight = `Flawless run on ${META.topic || 'this topic'}. Final boss move: explain each term out loud to someone else — if you can teach it, you own it.`;
  else if (pct >= 60) insight = 'Strong run. Every miss above restated the term with its full definition — re-read those, then run it back faster for the speed bonus.';
  else insight = 'This run just mapped out exactly which terms need rebuilding. Scroll back through the definitions you missed, then come back for the revenge run.';

  root.innerHTML = headerHtml('Results') + '<div id="end"></div>';
  Arcade.renderEndCard(document.getElementById('end'), {
    gameName: 'Vocab Quiz',
    gameEmoji: '❓',
    topic: META.topic || 'Vocabulary',
    meta: [META.subject, META.board].filter(Boolean).join(' · '),
    pct: pct,
    big: state.score,
    bigLabel: 'points',
    rows: [
      { v: `${state.correct}/${total}`, l: 'correct' },
      { v: '🔥 ' + state.bestStreak, l: 'best streak' },
      { v: pct + '%', l: 'accuracy' },
    ],
    emojiGrid: state.grid.join(''),
    bestKey: BEST_KEY,
    bestValue: pct,
    bestSuffix: '%',
    insight: insight,
    shareLines: [
      '❓ Vocab Quiz — ' + (META.topic || 'Vocabulary'),
      `Score ${state.score} pts · ${state.correct}/${total} · 🔥 best streak ${state.bestStreak}`,
      state.grid.join(''),
    ],
    onAgain: startGame,
  });
  announce.textContent = `Quiz over. Score ${state.score} points. ${state.correct} of ${total} correct — ${pct} percent.`;
}

/* ── Keyboard: 1–4 / A–D answer, Enter advances ── */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'enter') {
    if (e.target && e.target.tagName === 'BUTTON') return; // native activation
    const next = document.getElementById('next');
    if (next) { e.preventDefault(); next.click(); }
    return;
  }
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
  if (k in map) {
    const b = root.querySelectorAll('.vq-opt-row .ar-tile')[map[k]];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
});
</script>
