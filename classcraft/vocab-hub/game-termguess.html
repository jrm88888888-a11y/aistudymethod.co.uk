<style>
  /* ── guess grid ── */
  .wg-grid { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 14px 0; }
  .wg-row { display: flex; gap: 4px; align-items: center; }
  .wg-tile {
    width: var(--wg-size, 40px); height: var(--wg-size, 40px);
    border: 2px solid var(--ar-border-hi); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ar-font); font-size: calc(var(--wg-size, 40px) * 0.5); font-weight: 700;
    color: var(--ar-text); background: transparent; flex-shrink: 0;
  }
  .wg-tile.active-row { border-color: rgba(0,229,255,0.35); }
  .wg-tile.filled { border-color: var(--ar-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.18); }
  .wg-tile.fixed { border-color: var(--ar-border); background: var(--ar-card2); color: var(--ar-muted); }
  .wg-tile.flip { animation: wgFlip 0.5s ease forwards; }
  @keyframes wgFlip {
    0%   { transform: rotateX(0); }
    49%  { transform: rotateX(90deg); }
    50%  { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  .wg-tile.correct { background: var(--ar-mint); border-color: var(--ar-mint); color: #04251a; box-shadow: 0 0 14px rgba(0,255,163,0.45); }
  .wg-tile.present { background: var(--ar-gold); border-color: var(--ar-gold); color: #2b2300; box-shadow: 0 0 14px rgba(255,214,10,0.4); }
  .wg-tile.absent  { background: var(--ar-card2); border-color: var(--ar-card2); color: var(--ar-muted); }
  .wg-tile.dance { animation: wgDance 0.55s ease both; }
  @keyframes wgDance { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-13px); } 70% { transform: translateY(2px); } }
  .wg-tile.bounce { animation: wgBounce 0.16s ease; }
  @keyframes wgBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .wg-space { width: calc(var(--wg-size, 40px) * 0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .wg-space-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ar-muted); }
  .wg-row.shake-row { animation: arShakeX 0.4s ease; }

  /* ── keyboard ── */
  .wg-kb { margin-top: 10px; }
  .wg-kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
  .wg-key {
    font-family: var(--ar-font); font-size: 0.8rem; font-weight: 700;
    background: var(--ar-card); border: 2px solid var(--ar-border); border-radius: 8px;
    flex: 1; max-width: 40px; min-width: 0; padding: 0.55rem 0; cursor: pointer; color: var(--ar-text);
    transition: all 0.12s ease; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .wg-key.wide { max-width: 60px; font-size: 0.62rem; }
  .wg-key:hover:not(:disabled) { border-color: var(--ar-cyan); transform: translateY(-2px); }
  .wg-key:active:not(:disabled) { transform: scale(0.92); }
  .wg-key:focus-visible { outline: 2px solid var(--ar-cyan); outline-offset: 1px; }
  .wg-key.correct { background: var(--ar-mint-dim); border-color: var(--ar-mint); color: var(--ar-mint); }
  .wg-key.present { background: var(--ar-gold-dim); border-color: var(--ar-gold); color: var(--ar-gold); }
  .wg-key.absent  { background: var(--ar-card2); border-color: var(--ar-card2); color: var(--ar-muted); }

  /* legend tiles on intro */
  .wg-legend { display: flex; flex-direction: column; gap: 9px; margin-bottom: 4px; }
  .wg-legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--ar-text2); }
  .wg-mini { width: 28px; height: 28px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--ar-font); font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
  .wg-mini.c { background: var(--ar-mint); color: #04251a; }
  .wg-mini.p { background: var(--ar-gold); color: #2b2300; }
  .wg-mini.a { background: var(--ar-card2); color: var(--ar-muted); }
</style>

<script>
// ── Load vocab (set by vocab-hub.html via sessionStorage) ──
const VOCAB_DATA = JSON.parse(sessionStorage.getItem('vocab') || '[]');
const META       = JSON.parse(sessionStorage.getItem('vocabMeta') || '{}');

const esc      = Arcade.escapeHtml;
const root     = document.getElementById('root');
const announce = document.getElementById('announce');

Arcade.mountMuteButton();

const MAX_GUESSES = 6;
const KB_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

// Wordle format plays best with short single words. When the bank has enough
// 4–9-letter single-word terms (≥5), play only those; otherwise keep everything.
const WORDLE_FIT = VOCAB_DATA.filter(v => {
  const t = String(v.term || '').trim();
  const letters = t.replace(/[^A-Za-z]/g, '');
  return !/\s/.test(t) && letters.length >= 4 && letters.length <= 9;
});
const PLAY_DATA = WORDLE_FIT.length >= 5 ? WORDLE_FIT : VOCAB_DATA;
const BANK_FILTERED = WORDLE_FIT.length >= 5 && WORDLE_FIT.length < VOCAB_DATA.length;
const topicLine = [META.subject, META.board, META.topic].filter(Boolean).join(' · ');
const BEST_KEY = `aism-best:termguess:${META.subject || ''}:${META.topic || ''}`;

// ── STATE ──
let wordList = [], wordIndex = 0;
let target = '', targetLetters = [], wordStructure = [];
let currentRow = 0, currentInput = [], keyStates = {};
let gameActive = false, revealing = false, resultShown = false;
let score = 0, solved = 0, failed = 0, streak = 0, bestStreak = 0;
let resultGrid = [];

function shuffle(arr) { return Arcade.shuffle(arr); }

function headerHtml(tail) {
  return `
    <div class="ar-badge">🟩 Terms Tester · TermGuess</div>
    <h1 class="ar-title">${esc(META.topic || 'TermGuess')}</h1>
    <div class="ar-meta">${esc([topicLine, tail].filter(Boolean).join(' · '))}</div>
  `;
}

/* ── Missing data fallback ── */
if (!VOCAB_DATA.length) {
  root.innerHTML = `
    <div class="ar-badge">🟩 Terms Tester · TermGuess</div>
    <h1 class="ar-title">No vocab loaded</h1>
    <div class="ar-card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:46px;line-height:1;margin-bottom:12px">🕹</div>
      <p style="color:var(--ar-text2);margin:0 0 18px;">This machine needs a vocabulary list first. Pick a subject and topic in the arcade lobby.</p>
      <a class="ar-btn" href="vocab-hub.html?game=termguess" style="text-decoration:none;display:inline-block;">Choose subject &amp; topic →</a>
    </div>`;
} else {
  renderIntro();
}

/* ── Intro ── */
function renderIntro() {
  root.innerHTML = `
    ${headerHtml('Briefing')}
    <p class="ar-sub">Guess the vocabulary term in 6 tries — the definition is your clue. Fewer guesses means more points, and back-to-back solves stack a streak bonus.</p>
    <div class="ar-card">
      <div class="ar-label">How the tiles talk</div>
      <div class="wg-legend">
        <div class="wg-legend-item"><span class="wg-mini c">A</span>Right letter, right place</div>
        <div class="wg-legend-item"><span class="wg-mini p">B</span>Right letter, wrong place</div>
        <div class="wg-legend-item"><span class="wg-mini a">C</span>Not in the word</div>
      </div>
      <div style="color:var(--ar-text2);font-size:13.5px;margin:14px 0 18px;line-height:1.55;">
        ⌨️ Type or tap the keys · ↩️ Enter submits · 🔡 Spaces and hyphens are filled in for free · 🔥 Streaks add bonus points
      </div>
      ${BANK_FILTERED ? `<div style="color:var(--ar-muted);font-size:12.5px;margin:-6px 0 16px;">🔎 Playing ${PLAY_DATA.length} of ${VOCAB_DATA.length} terms. Longer terms live in Anagram and Hangman.</div>` : ''}
      <button class="ar-btn big" id="btn-begin">▶ Insert coin</button>
    </div>
  `;
  document.getElementById('btn-begin').addEventListener('click', () => startGame());
}

/* ── Game ── */
function startGame() {
  Arcade.sfx.swoosh();
  wordList = shuffle([...PLAY_DATA]);
  wordIndex = 0; score = 0; solved = 0; failed = 0; streak = 0; bestStreak = 0;
  resultGrid = [];
  loadWord(0);
}

function loadWord(idx) {
  if (idx >= wordList.length) { showFinal(); return; }
  const item = wordList[idx];
  target = item.term.toUpperCase().trim();

  // Build word structure: letter | space | fixed (hyphens etc. given for free)
  wordStructure = [];
  targetLetters = [];
  for (const ch of target) {
    if (ch === ' ') wordStructure.push({ type: 'space' });
    else if (/[A-Z]/.test(ch)) { wordStructure.push({ type: 'letter', letter: ch }); targetLetters.push(ch); }
    else wordStructure.push({ type: 'fixed', char: ch });
  }

  currentRow = 0; currentInput = []; keyStates = {};
  gameActive = true; revealing = false; resultShown = false;

  // Tile size: fit the longest row on a 380px screen without overflow
  const cells = wordStructure.length;
  const avail = Math.min(window.innerWidth, 600) - 70;
  const size = Math.max(20, Math.min(42, Math.floor(avail / cells) - 4));

  root.innerHTML = `
    ${headerHtml('Word ' + (idx + 1) + ' of ' + wordList.length + (item._redemption ? ' · second chance' : ''))}
    <div class="ar-hud">
      <div class="ar-hud-stat">Score <b id="hudScore">${score}</b></div>
      <div class="ar-hud-stat${streak >= 2 ? ' hot' : ''}">Streak <b id="hudStreak">${streak}${streak >= 2 ? '🔥' : ''}</b></div>
      <div class="ar-hud-stat gold">Word <b>${idx + 1}/${wordList.length}</b></div>
    </div>
    <div class="ar-card">
      <div class="ar-label">Definition — guess the term · ${targetLetters.length} letters</div>
      <div class="ar-prompt" style="font-size:15.5px;font-weight:600;color:var(--ar-text2);">${esc(item.definition)}</div>
      <div class="wg-grid" id="grid" style="--wg-size:${size}px;" aria-hidden="true"></div>
      <button class="ar-btn big" id="btn-submit" style="margin-bottom:10px;">Submit guess ↵</button>
      <div class="wg-kb" id="keyboard" role="group" aria-label="Letter keyboard"></div>
      <div class="ar-kbd-hint">Keyboard: type letters · Enter submits · Backspace deletes</div>
      <div id="fb"></div>
      <div id="nextWrap" style="margin-top:14px;"></div>
    </div>
  `;
  buildGrid();
  buildKeyboard();
  document.getElementById('btn-submit').addEventListener('click', submitGuess);
  announce.textContent = `Word ${idx + 1} of ${wordList.length}, ${targetLetters.length} letters. Clue: ${item.definition}`;
}

function buildGrid() {
  const wrap = document.getElementById('grid');
  wrap.innerHTML = '';
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement('div');
    row.className = 'wg-row';
    row.id = `row-${r}`;
    wordStructure.forEach((cell, ci) => {
      if (cell.type === 'space') {
        const sp = document.createElement('div');
        sp.className = 'wg-space';
        sp.innerHTML = '<div class="wg-space-dot"></div>';
        row.appendChild(sp);
      } else if (cell.type === 'fixed') {
        const tile = document.createElement('div');
        tile.className = 'wg-tile fixed';
        tile.textContent = cell.char;
        row.appendChild(tile);
      } else {
        const tile = document.createElement('div');
        tile.className = 'wg-tile' + (r === 0 ? ' active-row' : '');
        tile.id = `tile-${r}-${ci}`;
        row.appendChild(tile);
      }
    });
    wrap.appendChild(row);
  }
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach((rowStr, ri) => {
    const row = document.createElement('div');
    row.className = 'wg-kb-row';
    if (ri === 2) {
      const enter = document.createElement('button');
      enter.type = 'button';
      enter.className = 'wg-key wide';
      enter.textContent = 'Enter';
      enter.addEventListener('click', submitGuess);
      row.appendChild(enter);
    }
    rowStr.split('').forEach(ch => {
      const key = document.createElement('button');
      key.type = 'button';
      key.className = 'wg-key';
      key.id = 'kb-' + ch;
      key.textContent = ch;
      key.setAttribute('aria-label', 'Letter ' + ch);
      key.addEventListener('click', () => typeLetter(ch));
      row.appendChild(key);
    });
    if (ri === 2) {
      const bs = document.createElement('button');
      bs.type = 'button';
      bs.className = 'wg-key wide';
      bs.textContent = '⌫';
      bs.setAttribute('aria-label', 'Backspace');
      bs.addEventListener('click', deleteLetter);
      row.appendChild(bs);
    }
    kb.appendChild(row);
  });
}

// ── INPUT ──
function typeLetter(ch) {
  if (!gameActive || revealing) return;
  if (currentInput.length >= targetLetters.length) return;
  currentInput.push(ch);
  Arcade.sfx.click();
  updateActiveRow();
}

function deleteLetter() {
  if (!gameActive || revealing) return;
  if (currentInput.length === 0) return;
  currentInput.pop();
  Arcade.sfx.tick();
  updateActiveRow();
}

function updateActiveRow() {
  let inputIdx = 0;
  wordStructure.forEach((cell, ci) => {
    if (cell.type !== 'letter') return;
    const tile = document.getElementById(`tile-${currentRow}-${ci}`);
    if (!tile) return;
    const letter = currentInput[inputIdx] || '';
    const had = tile.textContent;
    tile.textContent = letter;
    tile.className = 'wg-tile active-row' + (letter ? ' filled' : '');
    if (letter && letter !== had) {
      tile.classList.remove('bounce');
      void tile.offsetWidth;
      tile.classList.add('bounce');
    }
    inputIdx++;
  });
}

// ── SUBMIT ──
function submitGuess() {
  if (!gameActive || revealing) return;
  if (currentInput.length < targetLetters.length) {
    Arcade.sfx.wrong();
    Arcade.flashMsg(`${targetLetters.length} LETTERS`, '#ffd60a');
    shakeRow(currentRow);
    announce.textContent = `Need ${targetLetters.length} letters before submitting.`;
    return;
  }

  const guess = [...currentInput];
  const result = scoreGuess(guess, targetLetters);

  revealRow(currentRow, guess, result, () => {
    result.forEach((state, i) => {
      const ch = guess[i];
      const priority = { correct: 3, present: 2, absent: 1 };
      if ((priority[state] || 0) > (priority[keyStates[ch]] || 0)) {
        keyStates[ch] = state;
        updateKey(ch, state);
      }
    });

    const nCorrect = result.filter(s => s === 'correct').length;
    const nPresent = result.filter(s => s === 'present').length;
    announce.textContent = `Guess ${currentRow + 1}: ${nCorrect} in the right place, ${nPresent} in the word but misplaced.`;

    const won = result.every(s => s === 'correct');
    if (won) {
      gameActive = false;
      const tries = currentRow + 1;
      const base = Math.max(10, 60 - (tries - 1) * 10);
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      const bonus = streak >= 2 ? streak * 5 : 0;
      const wordScore = base + bonus;
      score += wordScore;
      solved++;
      updateHud();
      Arcade.sfx.correct(streak);
      Arcade.flashMsg(tries === 1 ? 'FIRST TRY ⚡' : 'CRACKED IT', '#00ffa3');
      Arcade.streakCall(streak);
      Arcade.confettiBurst({ count: tries <= 2 ? 80 : 50 });
      Arcade.popTextOver(document.getElementById(`row-${currentRow}`), '+' + wordScore + (bonus ? ' 🔥' : ''), '#00ffa3');
      Arcade.vibrate(25);
      danceRow(currentRow);
      setTimeout(() => settleWord(true, tries), 900);
      return;
    }

    currentRow++;
    currentInput = [];

    if (currentRow >= MAX_GUESSES) {
      gameActive = false;
      failed++;
      streak = 0;
      updateHud();
      Arcade.sfx.timeup();
      Arcade.shake();
      setTimeout(() => settleWord(false, MAX_GUESSES), 400);
    } else {
      activateRow(currentRow);
    }
  });
}

// 'correct' | 'present' | 'absent' per letter (classic two-pass)
function scoreGuess(guess, target) {
  const result = new Array(guess.length).fill('absent');
  const targetRemaining = [...target];
  for (let i = 0; i < guess.length; i++) {
    if (guess[i] === targetRemaining[i]) { result[i] = 'correct'; targetRemaining[i] = null; }
  }
  for (let i = 0; i < guess.length; i++) {
    if (result[i] === 'correct') continue;
    const j = targetRemaining.indexOf(guess[i]);
    if (j !== -1) { result[i] = 'present'; targetRemaining[j] = null; }
  }
  return result;
}

function revealRow(rowIdx, guess, result, onComplete) {
  revealing = true;
  const tileEls = [];
  wordStructure.forEach((cell, ci) => {
    if (cell.type === 'letter') tileEls.push(document.getElementById(`tile-${rowIdx}-${ci}`));
  });
  const stagger = 110, midpoint = 250, tail = 300;
  tileEls.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('flip');
      Arcade.sfx.tick();
      setTimeout(() => {
        tile.classList.remove('active-row', 'filled', 'bounce');
        tile.classList.add(result[i]);
      }, midpoint);
      if (i === tileEls.length - 1) {
        setTimeout(() => { revealing = false; onComplete(); }, tail);
      }
    }, i * stagger);
  });
}

function danceRow(rowIdx) {
  let i = 0;
  wordStructure.forEach((cell, ci) => {
    if (cell.type !== 'letter') return;
    const tile = document.getElementById(`tile-${rowIdx}-${ci}`);
    if (tile) {
      tile.style.animationDelay = (i * 0.07) + 's';
      tile.classList.remove('flip');
      tile.classList.add('dance');
    }
    i++;
  });
}

function activateRow(rowIdx) {
  wordStructure.forEach((cell, ci) => {
    if (cell.type === 'letter') {
      const tile = document.getElementById(`tile-${rowIdx}-${ci}`);
      if (tile) tile.classList.add('active-row');
    }
  });
}

function updateKey(ch, state) {
  const key = document.getElementById('kb-' + ch);
  if (key) key.className = `wg-key ${state}`;
}

function shakeRow(rowIdx) {
  const row = document.getElementById(`row-${rowIdx}`);
  if (!row) return;
  row.classList.remove('shake-row');
  void row.offsetWidth;
  row.classList.add('shake-row');
  setTimeout(() => row.classList.remove('shake-row'), 450);
}

function updateHud() {
  const hudS = document.getElementById('hudScore');
  if (hudS) hudS.textContent = score;
  const hudSt = document.getElementById('hudStreak');
  if (hudSt) {
    hudSt.textContent = streak + (streak >= 2 ? '🔥' : '');
    hudSt.parentElement.classList.toggle('hot', streak >= 2);
  }
}

// ── WORD RESULT (educational beat: term + full definition, always) ──
function settleWord(won, tries) {
  if (resultShown) return;
  resultShown = true;
  const item = wordList[wordIndex];
  // 🟨 marks a word redeemed on its second chance — the grid stays honest.
  resultGrid.push(won ? (item._redemption ? '🟨' : '🟩') : '🟥');
  // Failed words return once at the end of the run — a second miss is final.
  if (!won && !item._redemption) {
    wordList.push(Object.assign({}, item, { _redemption: true }));
  }

  const fb = document.getElementById('fb');
  fb.className = 'ar-feedback ' + (won ? 'ok' : 'no');
  fb.innerHTML = (won
    ? `<strong>${tries === 1 ? 'First try!' : 'Solved in ' + tries + '/' + MAX_GUESSES + ' guesses.'}${streak >= 2 ? ' 🔥 ' + streak + ' in a row.' : ''}</strong> `
    : `<strong>Out of guesses — seeing the answer is revision too. The term was:</strong> `)
    + `<strong>${esc(item.term)}</strong> — ${esc(item.definition)}`;
  announce.textContent = (won
    ? `Solved in ${tries} ${tries === 1 ? 'guess' : 'guesses'}. `
    : 'Out of guesses. ')
    + `The term was ${item.term}: ${item.definition}`;

  const isLast = wordIndex >= wordList.length - 1;
  document.getElementById('nextWrap').innerHTML = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="ar-btn big" id="next" style="flex:2;min-width:160px;">${isLast ? 'See final score →' : 'Next word →'}</button>
      <button class="ar-btn ghost" id="endEarly" style="flex:1;min-width:110px;">End run</button>
    </div>`;
  const nextBtn = document.getElementById('next');
  nextBtn.addEventListener('click', nextWord);
  document.getElementById('endEarly').addEventListener('click', showFinal);
  nextBtn.focus({ preventScroll: true });
}

function nextWord() {
  Arcade.sfx.swoosh();
  wordIndex++;
  if (wordIndex >= wordList.length) showFinal();
  else loadWord(wordIndex);
}

// ── FINAL ──
function showFinal() {
  gameActive = false;
  const attempted = Math.max(1, solved + failed);
  const pct = Math.round((solved / attempted) * 100);

  let insight;
  if (pct === 100) insight = 'Every term cracked. Recalling spellings letter by letter is one of the strongest memory workouts there is — this topic is locking in.';
  else if (pct >= 60) insight = 'Strong solve rate. The terms that escaped were shown with their full definitions — re-read those, then run it back and aim for fewer guesses per word.';
  else insight = 'Tricky set. Every miss revealed the term and its definition in full — that reveal is the revision. Another run will feel noticeably easier.';

  root.innerHTML = headerHtml('Results') + '<div id="end"></div>';
  Arcade.renderEndCard(document.getElementById('end'), {
    gameName: 'TermGuess',
    gameEmoji: '🟩',
    topic: META.topic || 'Vocabulary',
    meta: [META.subject, META.board].filter(Boolean).join(' · '),
    pct: pct,
    big: score,
    bigLabel: 'points',
    rows: [
      { v: String(solved), l: 'solved' },
      { v: String(failed), l: 'failed' },
      { v: '🔥 ' + bestStreak, l: 'best streak' },
    ],
    emojiGrid: resultGrid.join(''),
    bestKey: BEST_KEY,
    bestValue: score,
    bestSuffix: ' pts',
    insight: insight,
    shareLines: [
      '🟩 TermGuess — ' + (META.topic || 'Vocabulary'),
      `Score ${score} pts · ${solved} solved · 🔥 best streak ${bestStreak}`,
      resultGrid.join(''),
    ],
    onAgain: startGame,
  });
  announce.textContent = `Run over. Score ${score} points. ${solved} solved, ${failed} failed.`;
}

// ── PHYSICAL KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key;

  // Word-result shown: Enter advances
  if (resultShown && !gameActive) {
    if (k === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return; // native activation
      const next = document.getElementById('next');
      if (next) { e.preventDefault(); next.click(); }
    }
    return;
  }
  if (!gameActive) {
    if (k === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      const begin = document.getElementById('btn-begin');
      if (begin) { e.preventDefault(); begin.click(); }
    }
    return;
  }
  if (k === 'Enter') { e.preventDefault(); submitGuess(); return; }
  if (k === 'Backspace') { e.preventDefault(); deleteLetter(); return; }
  const ch = k.toUpperCase();
  if (/^[A-Z]$/.test(ch)) typeLetter(ch);
});
</script>

<div id="aism-study-overlay" aria-hidden="true">
  <div class="aism-study-card" role="dialog" aria-modal="true" aria-label="Study these before you play">
    <h2 id="aism-study-title">Study first &mdash; then play to test your memory</h2>
    <p class="aism-study-sub">Take your time. When you&rsquo;re ready, start the game.</p>
    <div id="aism-study-content"></div>
    <button id="aism-study-start" class="aism-study-btn" type="button">I&rsquo;m ready &mdash; start game &rarr;</button>
    <button id="aism-study-skip" class="aism-study-skip" type="button">Skip and go straight to game</button>
  </div>
</div>
<script>
(function(){
  if (window.__aismStudyInstalled) return;
  window.__aismStudyInstalled = true;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function buildContent(){
    var c = document.getElementById('aism-study-content');
    if (!c) return false;
    c.innerHTML = '';
    var rendered = false;
    var pairs = null;
    if (typeof ALL_PAIRS !== 'undefined' && Array.isArray(ALL_PAIRS) && ALL_PAIRS.length) pairs = ALL_PAIRS;
    else if (typeof VOCAB_DATA !== 'undefined' && Array.isArray(VOCAB_DATA) && VOCAB_DATA.length) pairs = VOCAB_DATA;
    if (pairs) {
      pairs.forEach(function(p){
        var term = p.term || p.front || p.word || '';
        var def  = p.def || p.definition || p.back || '';
        var div = document.createElement('div');
        div.className = 'aism-study-item';
        div.innerHTML = '<span class="aism-term">' + esc(term) + '</span>' + (def ? ' &mdash; ' + esc(def) : '');
        c.appendChild(div);
      });
      rendered = true;
    }
    if (!rendered && typeof CATEGORIES !== 'undefined' && typeof ALL_ITEMS !== 'undefined' && Array.isArray(CATEGORIES) && Array.isArray(ALL_ITEMS)) {
      CATEGORIES.forEach(function(catName, idx){
        var wrap = document.createElement('div'); wrap.className = 'aism-study-cat';
        var h = document.createElement('div'); h.className = 'aism-study-cat-head'; h.textContent = catName; wrap.appendChild(h);
        ALL_ITEMS.filter(function(i){ return i.cat === idx; }).forEach(function(i){
          var d = document.createElement('div'); d.className = 'aism-study-item';
          d.textContent = i.text || i.label || '';
          wrap.appendChild(d);
        });
        c.appendChild(wrap);
      });
      rendered = true;
    }
    if (!rendered && typeof ALL_EVENTS !== 'undefined' && Array.isArray(ALL_EVENTS) && ALL_EVENTS.length) {
      var sorted = ALL_EVENTS.slice().sort(function(a,b){
        var ay = parseInt(String(a.year||a.date||'0').replace(/[^-\d]/g,''))||0;
        var by = parseInt(String(b.year||b.date||'0').replace(/[^-\d]/g,''))||0;
        return ay - by;
      });
      sorted.forEach(function(e){
        var div = document.createElement('div');
        div.className = 'aism-study-item';
        div.innerHTML = '<span class="aism-term">' + esc(e.year || e.date || '') + '</span>' + (e.text ? ' &mdash; ' + esc(e.text) : '');
        c.appendChild(div);
      });
      rendered = true;
    }
    return rendered;
  }
  function install(){
    if (typeof window.startGame !== 'function') { setTimeout(install, 80); return; }
    var orig = window.startGame;
    var shown = false;
    window.startGame = function(){
      if (shown) return orig.apply(this, arguments);
      var args = arguments, ctx = this;
      var ov = document.getElementById('aism-study-overlay');
      if (!ov || !buildContent()) return orig.apply(ctx, args);
      ov.dataset.show = '1';
      ov.setAttribute('aria-hidden','false');
      var startBtn = document.getElementById('aism-study-start');
      var skipBtn  = document.getElementById('aism-study-skip');
      function go(){
        ov.dataset.show = '';
        ov.setAttribute('aria-hidden','true');
        shown = true;
        try { orig.apply(ctx, args); } catch(e){ console.error(e); }
      }
      startBtn.onclick = go;
      skipBtn.onclick  = go;
    };
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') install();
  else document.addEventListener('DOMContentLoaded', install);
})();
</script>
