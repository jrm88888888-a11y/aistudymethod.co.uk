<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revision Arcade — collect the elements</title>
<!-- Chat/social link preview. NOTE: these are STATIC. WhatsApp/iMessage read them
     server-side and ignore ?el=, so the preview is the same for every element for now.
     Per-element preview images need a small Bunny edge script (see the share build
     doc) — the page itself still shows the specific element via JS below. -->
<meta property="og:title" content="Revision Arcade">
<meta property="og:description" content="A friend just unlocked an element on the Revision Arcade. Play a quick round and start collecting the whole periodic table — free, no email needed.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AI Study Method">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--bg:#131028;--panel:#1b1636;--panel2:#221b44;--line:#332a5e;--gold:#f5c542;--cyan:#5ee4e0;--green:#5eea7c;--text:#e8e4ff;--dim:#8f88b8;--px:'Press Start 2P',monospace;--vt:'VT323',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--vt);min-height:100vh;padding:34px 18px 60px;
    background-image:radial-gradient(1px 1px at 15% 20%,#ffffff22 50%,transparent 51%),radial-gradient(1px 1px at 75% 35%,#ffffff16 50%,transparent 51%),radial-gradient(1px 1px at 50% 80%,#ffffff12 50%,transparent 51%)}
  .wrap{max-width:460px;margin:0 auto;text-align:center}
  .brand{font-family:var(--px);font-size:10px;letter-spacing:2px;color:var(--cyan);margin-bottom:16px}
  h1{font-family:var(--px);font-size:clamp(15px,4.5vw,20px);color:var(--gold);text-shadow:0 0 14px #f5c54244,3px 3px 0 #6b4e00;line-height:1.5}
  .sub{font-size:20px;color:var(--dim);line-height:1.35;margin:14px 0 22px}
  .sub b{color:var(--text)}
  /* element card */
  .ec{--c:#6ab7ff;background:var(--panel);border:2px solid var(--c);border-radius:16px;overflow:hidden;
    box-shadow:0 0 0 1px #00000055,0 0 26px -8px var(--c);margin:0 auto 22px;text-align:left}
  .ec-head{display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:color-mix(in srgb,var(--c) 16%,var(--panel))}
  .ec-head b{font-family:var(--px);font-size:12px;color:var(--c);line-height:1.4}
  .ec-head span{font-size:16px;color:var(--dim)}
  .ec-art{position:relative;aspect-ratio:5/4;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ec-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px}
  .ec-sym{font-family:var(--px);font-size:34px;color:var(--c);text-shadow:2px 2px 0 #00000088}
  .ec-fact{padding:12px 15px 14px;font-size:19px;line-height:1.3;color:#cfc9ef}
  /* CTAs */
  .cta{display:block;width:100%;font-family:var(--px);letter-spacing:.5px;cursor:pointer;border-radius:12px;
    padding:16px 14px;margin:0 0 12px;text-decoration:none;border:0}
  .cta.primary{font-size:12px;color:#131028;background:linear-gradient(180deg,#ffe95c,#ffc800 55%,#ffb400);
    box-shadow:0 0 22px -2px #ffce1fbb,inset 0 2px 0 #fff3b0,0 3px 0 #a9760a;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
  .cta.ghost{font-size:10px;color:var(--cyan);background:var(--panel);border:1px solid var(--cyan)}
  .cta.ghost:hover{background:#221b44}
  .foot{font-size:16px;color:var(--dim);margin-top:8px}
  .coin{width:16px;height:16px;border-radius:50%;display:inline-block;vertical-align:-2px;
    background:radial-gradient(circle at 35% 30%,#c6a8ff,#8b5cf6 60%,#5a2fb8)}
  @media (prefers-reduced-motion:reduce){.cta.primary{animation:none}}
</style>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-y_3K19wHddzHShFk02JEm.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>
<main class="wrap">
  <div class="brand">◆ AI STUDY METHOD · REVISION ARCADE</div>
  <h1 id="hero">Collect all 118 elements</h1>
  <div class="sub" id="sub">Play games, earn coins, and unlock the whole periodic table.</div>
  <div id="elCard"></div>
  <a class="cta primary" id="playBtn" href="arcade.html">▶ Play the arcade</a>
  <button class="cta ghost" id="signupBtn">Set up an account &amp; collect rewards</button>
  <div class="foot">Free · no email needed · built by teachers</div>
</main>

<script>window.AISM_NO_CORNER = true;</script>
<script src="elements-data.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var n = parseInt(p.get('el'), 10);
  var by = (p.get('by') || '').trim();
  var els = (typeof VELVET_ELEMENTS !== 'undefined') ? VELVET_ELEMENTS : [];
  var el = els.filter(function(x){ return x.n === n; })[0];
  var cats = (typeof VELVET_CATEGORIES !== 'undefined') ? VELVET_CATEGORIES : {};

  if (el){
    var cat = cats[el.cat] || { label:'', color:'#6ab7ff' };
    var who = by ? by : 'A friend';
    document.getElementById('hero').textContent = who + ' unlocked ' + el.name + '!';
    document.getElementById('sub').innerHTML = 'Can you collect it too? There are <b>118</b> elements to unlock — one game at a time.';
    var art = (typeof velvetArtPath === 'function') ? velvetArtPath(el) : '';
    document.getElementById('elCard').innerHTML =
      '<div class="ec" style="--c:' + cat.color + '">' +
        '<div class="ec-head"><b>' + el.name + '</b><span>' + cat.label + ' · No. ' + el.n + '</span></div>' +
        '<div class="ec-art"><img alt="" src="' + art + '" onerror="this.style.display=\'none\'"><span class="ec-sym">' + el.sym + '</span></div>' +
        '<div class="ec-fact">' + el.fact + '</div>' +
      '</div>';
    document.title = 'Revision Arcade — ' + el.name;
    var b = document.getElementById('signupBtn');
    b.innerHTML = 'Set up an account &amp; collect rewards' + (by ? ' like ' + escHtml(by) : '') + '!';
  }

  function escHtml(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  document.getElementById('signupBtn').addEventListener('click', function(){
    if (window.Arcade && Arcade.auth && Arcade.auth.open) Arcade.auth.open('register');
    else location.href = 'arcade.html';
  });
})();
</script>
</body>
</html>
