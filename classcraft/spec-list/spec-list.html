<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specification Map — AI Study Method</title>
<meta name="description" content="A clean, exam-board-accurate map of every topic and subtopic in your specification — the big picture before you start studying.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{
  --bg-primary:#faf9f7; --bg-secondary:#f3f1ed; --bg-card:#ffffff; --bg-alt:#f0ede8;
  --accent:#0a6b5e; --accent-soft:rgba(10,107,94,0.08); --accent2:#4a3fa0;
  --text-primary:#1a1a2e; --text-secondary:#4a5568; --text-muted:#9aa3b2;
  --border:rgba(0,0,0,0.08); --border-accent:rgba(10,107,94,0.2);
  --velvet-gradient:linear-gradient(135deg,#0a6b5e 0%,#4a3fa0 100%);
  --shadow-card:0 4px 24px rgba(0,0,0,0.06);
 }
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg-primary);color:var(--text-primary);font-family:'DM Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;padding:0 0 80px}
 .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
 .topbar{border-bottom:1px solid var(--border);background:var(--bg-card)}
 .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
 .back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--text-secondary);text-decoration:none;text-transform:uppercase}
 .back:hover{color:var(--accent)}
 .brand{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase}
 header.hero{padding:46px 0 18px}
 .eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
 .eyebrow .badge{background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:999px;padding:4px 11px;color:var(--accent)}
 h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,4vw,42px);line-height:1.12;letter-spacing:-0.5px}
 .sub{margin-top:12px;color:var(--text-secondary);font-size:16px;max-width:680px}
 .meta-row{margin-top:18px;display:flex;gap:24px;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted)}
 .meta-row b{color:var(--text-secondary);font-weight:500}
 .grid{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
 .unit{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card);overflow:hidden}
 .unit-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px}
 .unit-num{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:#fff;background:var(--velvet-gradient);border-radius:7px;padding:3px 9px;flex:none}
 .unit-name{font-family:'Playfair Display',serif;font-weight:600;font-size:18px;color:var(--text-primary);line-height:1.2}
 .unit ul{list-style:none;padding:8px 18px 16px}
 .unit li{position:relative;padding:6px 0 6px 18px;font-size:14.5px;color:var(--text-secondary);border-bottom:1px dashed var(--border)}
 .unit li:last-child{border-bottom:none}
 .unit li::before{content:'';position:absolute;left:0;top:13px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.5}
 .source{margin-top:40px;padding:18px 20px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;font-size:13.5px;color:var(--text-secondary)}
 .source .lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:6px}
 .source a{color:var(--accent);text-decoration:none;font-weight:500;word-break:break-word}
 .source a:hover{text-decoration:underline}
 .source .accessed{display:block;margin-top:8px;color:var(--text-muted);font-size:12px}
 .note{margin-top:14px;font-size:12.5px;color:var(--text-muted);max-width:680px}
 .state{padding:80px 0;text-align:center;color:var(--text-muted);font-family:'DM Mono',monospace;font-size:14px}
 .state.err{color:#9a4a4a}
 @media(max-width:560px){header.hero{padding:32px 0 12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
 <div class="topbar"><div class="wrap">
   <a class="back" href="../../subjects.html">◀ All resources</a>
   <span class="brand">The Velvet Method™ · View</span>
 </div></div>
 <main class="wrap" id="root"><div class="state" id="loading">Loading specification…</div></main>

<script>
(function(){
 var P = new URLSearchParams(location.search);
 var subject = (P.get('subject')||'').toLowerCase();
 var level   = (P.get('level')||'').toLowerCase();
 var board   = (P.get('board')||'').toLowerCase();
 var root = document.getElementById('root');

 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function fail(msg){ root.innerHTML = '<div class="state err">'+esc(msg)+'</div>'; }

 if(!subject||!level||!board){ fail('Missing subject, level or board in the link.'); return; }

 fetch('specs/'+subject+'-'+level+'-'+board+'.json')
  .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
  .then(function(d){ render(d); })
  .catch(function(){ fail('Specification map for this combination is not available yet.'); });

 function render(d){
  document.title = d.subjectDisplay+' — '+d.boardDisplay+' '+d.levelDisplay+' Specification Map · AI Study Method';
  var units = (d.units||[]).map(function(u){
    var subs = (u.subs||[]).map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('');
    var parts = String(u.n).split(/\.\s+/);
    var num = parts.length>1 ? parts[0] : '';
    var name = parts.length>1 ? parts.slice(1).join('. ') : u.n;
    return '<div class="unit"><div class="unit-head">'
      + (num?'<span class="unit-num">'+esc(num)+'</span>':'')
      + '<span class="unit-name">'+esc(name)+'</span></div>'
      + (subs?'<ul>'+subs+'</ul>':'') + '</div>';
  }).join('');

  var unitCount = (d.units||[]).length;
  var subCount = (d.units||[]).reduce(function(a,u){return a+((u.subs||[]).length);},0);

  root.innerHTML =
    '<header class="hero">'
   +  '<div class="eyebrow"><span class="badge">V · View</span>'
   +    '<span>'+esc(d.boardDisplay)+'</span><span>·</span><span>'+esc(d.levelDisplay)+'</span>'
   +    (d.specCode?'<span>·</span><span>'+esc(d.specCode)+'</span>':'')+'</div>'
   +  '<h1>'+esc(d.subjectDisplay)+' — Specification Map</h1>'
   +  '<p class="sub">The whole specification at a glance: every unit and the subtopics inside it. Use this to see the shape of the course before you start, and to tick off what you have covered.</p>'
   +  '<div class="meta-row"><span><b>'+unitCount+'</b> units</span><span><b>'+subCount+'</b> subtopics</span>'
   +    (d.tiers?'<span><b>Tiers:</b> '+esc(d.tiers)+'</span>':'')+'</div>'
   + '</header>'
   + '<div class="grid">'+units+'</div>'
   + '<div class="source"><span class="lbl">Source</span>'
   +   'Topic structure compiled from the official <a href="'+esc(d.sourceUrl)+'" target="_blank" rel="noopener">'+esc(d.sourceName)+'</a>.'
   +   '<span class="accessed">Last reviewed '+esc(d.accessed)+'. Specifications are updated periodically — always confirm the current specification on the exam board website before relying on it for assessment.</span>'
   + '</div>'
   + '<p class="note">This map shows the specification structure for orientation. It is not affiliated with or endorsed by the exam board.</p>';
 }
})();
</script>
</body>
</html>
