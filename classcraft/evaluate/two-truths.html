<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Truths, One Lie — AI Study Method</title>
<meta name="description" content="Spot the misconception hidden among two true statements, then see exactly why it's wrong. A confidence-correcting diagnostic.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 :root{
  --bg-primary:#faf9f7; --bg-secondary:#f3f1ed; --bg-card:#ffffff; --bg-alt:#f0ede8;
  --accent:#0a6b5e; --accent-soft:rgba(10,107,94,0.08); --accent2:#4a3fa0;
  --text-primary:#1a1a2e; --text-secondary:#4a5568; --text-muted:#9aa3b2;
  --border:rgba(0,0,0,0.08); --border-accent:rgba(10,107,94,0.2);
  --good:#0a6b5e; --good-soft:rgba(10,107,94,.10);
  --flag:#b4452e; --flag-soft:rgba(180,69,46,.10);
  --velvet-gradient:linear-gradient(135deg,#0a6b5e 0%,#4a3fa0 100%);
  --shadow-card:0 4px 24px rgba(0,0,0,0.06);
 }
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg-primary);color:var(--text-primary);font-family:'DM Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;padding:0 0 80px}
 .wrap{max-width:720px;margin:0 auto;padding:0 20px}
 .topbar{border-bottom:1px solid var(--border);background:var(--bg-card)}
 .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;max-width:1080px}
 .back{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--text-secondary);text-decoration:none;text-transform:uppercase}
 .back:hover{color:var(--accent)}
 .brand{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase}
 .badge{display:inline-block;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:999px;padding:4px 12px;color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase}
 h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.14;letter-spacing:-0.5px;margin:14px 0 8px}
 h2{font-family:'Playfair Display',serif;font-weight:600;font-size:21px;margin:0 0 4px}
 .sub{color:var(--text-secondary);font-size:16px}
 .meta{margin-top:12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap}
 .card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card);padding:24px 22px;margin-top:18px}
 .btn{display:inline-flex;align-items:center;gap:8px;background:var(--velvet-gradient);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
 .btn:disabled{opacity:.4;cursor:not-allowed}
 .btn.ghost{background:none;color:var(--accent);border:1px solid var(--border-accent)}
 .pbar{height:6px;background:var(--bg-alt);border-radius:99px;overflow:hidden;margin:6px 0 2px}
 .pbar>span{display:block;height:100%;background:var(--velvet-gradient);transition:width .3s}
 .pnum{font-family:'DM Mono',monospace;font-size:12px;color:var(--text-muted)}
 .ask{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:12px}
 .stmt{border:1.5px solid var(--border);background:var(--bg-card);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;display:block;width:100%;margin-bottom:11px;transition:.12s}
 .stmt:hover{border-color:var(--border-accent);background:var(--accent-soft)}
 .stmt .pr{font-size:12.5px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:4px}
 .stmt .cl{font-size:16px;font-weight:500;line-height:1.45}
 .stmt.lie{border-color:var(--flag);background:var(--flag-soft)}
 .stmt.true{border-color:var(--good);background:var(--good-soft)}
 .stmt .verdict{margin-top:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
 .stmt.lie .verdict{color:var(--flag)} .stmt.true .verdict{color:var(--good)}
 .fb{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.55}
 .fb.win{background:var(--good-soft);border:1px solid var(--border-accent)}
 .fb.miss{background:var(--flag-soft);border:1px solid rgba(180,69,46,.25)}
 .fb .ft{font-weight:700;margin-bottom:4px}
 .fb .why{color:var(--text-secondary);margin-top:6px}
 .fb .truth{color:var(--text-secondary);margin-top:4px;font-size:13.5px}
 .qnav{display:flex;justify-content:flex-end;margin-top:18px}
 .scorebig{font-family:'Playfair Display',serif;font-size:42px;font-weight:700;line-height:1}
 .scorebig small{font-size:18px;color:var(--text-muted);font-weight:400}
 .sectlbl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin:24px 0 8px}
 .miss-item{border-left:3px solid var(--flag);background:var(--flag-soft);border-radius:0 10px 10px 0;padding:12px 16px;margin-top:10px}
 .miss-item .m{font-weight:600;font-size:14.5px}
 .miss-item .w{font-size:13.5px;color:var(--text-secondary);margin-top:4px}
 .ok-item{border-left:3px solid var(--good);background:var(--good-soft);border-radius:0 10px 10px 0;padding:10px 16px;margin-top:8px;font-size:14px}
 .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
 .state{padding:70px 0;text-align:center;color:var(--text-muted);font-family:'DM Mono',monospace;font-size:14px}
 .state.err{color:#9a4a4a}
 @media(max-width:560px){.stmt .cl{font-size:15px}}
</style>
<meta name="robots" content="noindex,nofollow">
</head>
<body>
 <div class="topbar"><div class="wrap">
   <a class="back" href="../../subjects.html">◀ All resources</a>
   <span class="brand">The Velvet Method® · Verify</span>
 </div></div>
 <main class="wrap" id="root"><div class="state" id="loading">Loading…</div></main>

<script>
(function(){
 'use strict';
 var root=document.getElementById('root');
 var P=new URLSearchParams(location.search);
 var stem=(P.get('spec')||'');
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function fail(m){root.innerHTML='<div class="state err">'+esc(m)+'</div>';}
 function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
 function colonCandidates(s,dir){var c=[dir+'/'+s+'.json'];for(var i=0;i<s.length;i++){if(s[i]==='-')c.push(dir+'/'+s.slice(0,i)+':'+s.slice(i)+'.json');}return c;}
 async function fetchJson(s,dir){var cands=colonCandidates(s,dir);for(var i=0;i<cands.length;i++){try{var r=await fetch(cands[i],{cache:'no-cache'});if(r.ok)return await r.json();}catch(e){}}return null;}

 if(!stem){fail('Missing ?spec= parameter.');return;}
 var PLACE=/^(A central idea in |A key term you.?ll meet in |A core concept tied to |Another important idea linked to |How .+ sits within the wider |An application of the ideas in )/;

 (async function(){
   // Prefer a hand-authored dedicated bank (meaning-focused, fully spec-checked).
   // Falls back to auto-deriving from the adventure spec + misconception bank.
   var ded=await fetchJson(stem,'../evaluate/two-truths-banks');
   var spec=await fetchJson(stem,'../adventures/_specs');
   var topic, subj, lvl, rounds, learn;
   if(ded && Array.isArray(ded.rounds) && ded.rounds.length){
     topic=ded.topicDisplay||ded.topic||(spec&&spec.topic_display)||stem;
     subj=ded.subject||(spec&&spec.subject)||''; lvl=ded.level||(spec&&spec.level)||'';
     learn=ded.learnHref||null;
     // each round: a lie statement + its why/truth + two true statements (full sentences, no prompt)
     rounds=shuffle(ded.rounds).slice(0,12).map(function(rd){
       var stmts=shuffle([
         {lie:true, claim:rd.lie, why:rd.why||'', truth:rd.truth||''},
         {lie:false, claim:(rd.truths&&rd.truths[0])||''},
         {lie:false, claim:(rd.truths&&rd.truths[1])||''}
       ]);
       return {stmts:stmts, lieIdx:stmts.findIndex(function(s){return s.lie;})};
     });
   } else {
     var bank=await fetchJson(stem,'../evaluate/misconception-banks');
     var concepts=((spec&&spec.concepts)||[]).filter(function(c){return c&&c.term&&c.def&&!PLACE.test(c.def);});
     var items=((bank&&bank.items)||[]).filter(function(it){return it&&it.q&&it.misconception&&it.correct;});
     topic=(spec&&(spec.topic_display||spec.title))||(bank&&bank.topic)||stem;
     subj=(spec&&spec.subject)||(bank&&bank.subject)||'';
     lvl=(spec&&spec.level)||(bank&&bank.level)||'';
     if(concepts.length<4||items.length<2||(bank&&bank.quality==='low')){
       root.innerHTML='<div style="padding:34px 0"><span class="badge">V · Verify · Two Truths, One Lie</span><h1>'+esc(topic)+'</h1>'
         +'<p class="sub">A topic-specific set of statements for this exact topic is still being authored — generic ones wouldn\'t earn their place. Come back soon.</p>'
         +'<div class="card" style="text-align:center;padding:40px 24px"><div style="font-size:46px">🕵️</div><h2 style="margin-top:12px">In production</h2><p class="sub" style="font-size:14px;margin-top:6px">Two Truths, One Lie needs distinctive, accurate statements for this topic.</p></div></div>';
       return;
     }
     rounds=shuffle(items).slice(0,10).map(function(it){
       var pair=shuffle(concepts).slice(0,2);
       var stmts=shuffle([
         {lie:true, prompt:it.q, claim:it.misconception, why:it.why||'', truth:it.correct},
         {lie:false, prompt:'What does “'+pair[0].term+'” mean?', claim:pair[0].def},
         {lie:false, prompt:'What does “'+pair[1].term+'” mean?', claim:pair[1].def}
       ]);
       return {stmts:stmts, lieIdx:stmts.findIndex(function(s){return s.lie;})};
     });
   }
   var subjLbl=subj.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
   var lvlLbl=(lvl||'').toUpperCase().replace('A-LEVEL','A-Level');
   var state={i:0, answered:rounds.map(function(){return null;})};

   function intro(){
     root.innerHTML='<div style="padding:32px 0 4px"><span class="badge">V · Verify · Two Truths, One Lie</span>'
       +'<h1>'+esc(topic)+'</h1>'
       +'<p class="sub">Each round shows <b>three statements</b> about this topic — two are true, one is a classic misconception built to catch you out. Spot the lie, then see <b>exactly why</b> it\'s wrong.</p>'
       +'<div class="meta"><span><b>'+rounds.length+'</b> rounds</span>'+(lvlLbl?'<span>'+esc(lvlLbl)+' · '+esc(subjLbl)+'</span>':'')+'</div></div>'
       +'<div class="card"><h2>Why this works</h2><p class="sub" style="font-size:15px;margin-top:6px">Naming a misconception and immediately refuting it fixes it more durably than only seeing the right answer — especially the ones you were sure about. Trust your reasoning, then read the feedback.</p>'
       +'<div class="actions"><button class="btn" id="start">Start →</button></div></div>';
     document.getElementById('start').onclick=function(){state.i=0;round();window.scrollTo(0,0);};
   }

   function round(){
     var i=state.i, r=rounds[i], picked=state.answered[i];
     var locked=picked!=null;
     var html='<div style="padding:26px 0 2px"><div class="pnum">Round '+(i+1)+' of '+rounds.length+'</div>'
       +'<div class="pbar"><span style="width:'+Math.round(i/rounds.length*100)+'%"></span></div></div>'
       +'<div class="card"><div class="ask">Two are true — which one is the lie?</div>';
     r.stmts.forEach(function(s,idx){
       var cls='stmt';
       if(locked){ cls+=s.lie?' lie':' true'; }
       html+='<button class="'+cls+'" data-i="'+idx+'"'+(locked?' disabled':'')+'>'
         +(s.prompt?'<div class="pr">'+esc(s.prompt)+'</div>':'')+'<div class="cl">'+esc(s.claim)+'</div>'
         +(locked?'<div class="verdict">'+(s.lie?'✗ The lie':'✓ True')+'</div>':'')+'</button>';
     });
     if(locked){
       var correct=picked===r.lieIdx;
       var lie=r.stmts[r.lieIdx];
       html+='<div class="fb '+(correct?'win':'miss')+'">'
         +'<div class="ft">'+(correct?'✓ You caught the lie.':'✗ Not quite — the statement you picked is actually true.')+'</div>'
         +(correct?'':'<div>The lie was: <b>'+esc(lie.claim)+'</b></div>')
         +'<div class="why"><b>Why it\'s wrong:</b> '+esc(lie.why||'This is a common misconception.')+'</div>'
         +(lie.truth?'<div class="truth"><b>The truth:</b> '+esc(lie.truth)+'</div>':'')
         +'</div>';
     }
     html+='</div>';
     html+='<div class="qnav">'+(locked?'<button class="btn" id="next">'+(i===rounds.length-1?'See summary →':'Next round →')+'</button>':'<span class="pnum">Pick the lie to continue</span>')+'</div>';
     root.innerHTML=html;
     if(!locked){
       Array.prototype.forEach.call(root.querySelectorAll('.stmt'),function(b){
         b.onclick=function(){ state.answered[i]=+b.dataset.i; round(); };
       });
     } else {
       document.getElementById('next').onclick=function(){ if(state.i<rounds.length-1){state.i++;round();window.scrollTo(0,0);} else { report(); window.scrollTo(0,0);} };
     }
   }

   function report(){
     var caught=0, missed=[];
     rounds.forEach(function(r,i){
       var lie=r.stmts[r.lieIdx];
       if(state.answered[i]===r.lieIdx) caught++; else missed.push(lie);
     });
     var n=rounds.length, pct=Math.round(caught/n*100);
     var msg = missed.length===0 ? '<b>Flawless — you spotted every misconception.</b> These are exactly the traps that lose marks, so this is a strong sign for this topic.'
        : (caught>=n*0.6 ? '<b>Good instincts.</b> You caught most of them. The '+missed.length+' below slipped past — they\'re the ideas to nail down before the exam.'
        : '<b>Several misconceptions slipped past.</b> That\'s useful to know — the statements below are the ones to re-learn carefully.');
     var learnTo = learn || (spec&&spec._learnHref) || '../../subjects.html';
     var html='<div style="padding:30px 0 4px"><span class="badge">V · Verify · Summary</span>'
       +'<h1>'+esc(topic)+'</h1></div>'
       +'<div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'
       +'<div class="scorebig">'+caught+'<small>/'+n+'</small></div>'
       +'<div class="sub" style="flex:1;min-width:220px;font-size:14.5px">'+msg+'</div></div>';
     if(missed.length){
       html+='<div class="sectlbl">⚠️ Misconceptions that caught you out — revise these</div>';
       missed.forEach(function(m){
         html+='<div class="miss-item"><div class="m">'+esc(m.claim)+'</div>'
           +'<div class="w"><b>Why it\'s wrong:</b> '+esc(m.why||'')+(m.truth?' <b>Truth:</b> '+esc(m.truth):'')+'</div></div>';
       });
     }
     if(caught){
       html+='<div class="sectlbl">✓ Misconceptions you spotted</div>';
       rounds.forEach(function(r,i){ if(state.answered[i]===r.lieIdx){ html+='<div class="ok-item">'+esc(r.stmts[r.lieIdx].claim)+'</div>'; } });
     }
     html+='<div class="actions"><a class="btn" href="'+esc(learnTo)+'">Revise this topic in Learn →</a>'
       +'<button class="btn ghost" id="again">Play again</button>'
       +'<a class="btn ghost" href="../../subjects.html">← All resources</a></div>';
     root.innerHTML=html;
     document.getElementById('again').onclick=function(){ state={i:0,answered:rounds.map(function(){return null;})}; round(); window.scrollTo(0,0); };
   }

   intro();
 })();
})();
</script>
</body>
</html>
