 radial-gradient(ellipse 60% 40% at 50% -6%,rgba(126,109,255,.30),transparent 70%),
 radial-gradient(ellipse 50% 35% at 50% 106%,rgba(92,255,228,.12),transparent 70%)}
.scan{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.22;
 background:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 2px,transparent 2px 5px)}
.vig{position:absolute;inset:0;z-index:89;pointer-events:none;
 background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 58%,rgba(0,0,0,.68))}
.bez i{position:absolute;z-index:5}
.bez .t{left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#ff5470,#ffd24d,#5cffe4,#7e6dff,#ff5470)}
.bez .b{left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#7e6dff,#5cffe4,#ffd24d,#ff5470,#7e6dff)}

/* header */
.hdr{position:absolute;top:26px;left:56px;right:56px;height:76px;z-index:20;display:flex;align-items:center;gap:20px}
.vtile{width:66px;height:66px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
 background:linear-gradient(135deg,#1fb89a,#4f6bd8 55%,#8b5cf6);font-family:"Playfair Display",Georgia,serif;
 font-weight:700;font-size:40px;color:#fff;box-shadow:0 0 22px rgba(126,109,255,.5)}
.wm{font-family:'PS2P',monospace;font-size:22px;color:#ffd24d;letter-spacing:1px;text-shadow:3px 3px 0 #7a2bd6}
.wm small{display:block;font-size:11px;color:#5cffe4;letter-spacing:2px;margin-bottom:6px;text-shadow:none}
.unit{margin-left:auto;font-size:20px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:#5cffe4;
 border:2px solid rgba(92,255,228,.4);border-radius:999px;padding:9px 20px;background:rgba(92,255,228,.07);white-space:nowrap}
.qno{font-family:'PS2P',monospace;font-size:26px;color:#ece8ff;white-space:nowrap;min-width:150px;text-align:right}
.prog{position:absolute;top:118px;left:56px;right:56px;height:8px;border-radius:4px;background:rgba(255,255,255,.10);z-index:20;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7e6dff,#5cffe4);box-shadow:0 0 14px rgba(92,255,228,.6)}

.round{position:absolute;top:146px;left:56px;z-index:20;font-family:'PS2P',monospace;font-size:16px;
 color:#ffd24d;letter-spacing:2px}
.tierchip{position:absolute;top:142px;right:56px;z-index:20;font-family:'PS2P',monospace;font-size:14px;
 color:#0d0a30;background:#ff5470;border-radius:6px;padding:8px 12px;letter-spacing:1px}

/* question */
.stem{position:absolute;top:196px;left:90px;width:1740px;height:190px;z-index:20;display:flex;
 align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.16;
 font-size:52px;letter-spacing:-.4px;text-shadow:0 4px 20px rgba(0,0,0,.55)}
.tbar{position:absolute;top:404px;left:90px;width:1740px;height:22px;z-index:20;display:flex;align-items:center;gap:18px}
.tbar b{font-family:'PS2P',monospace;font-size:24px;color:#ffd24d;width:44px;flex:0 0 auto;text-align:right}
.tbar u{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.10);display:block;overflow:hidden;text-decoration:none}
.tbar u i{display:block;height:100%;background:linear-gradient(90deg,#ffd24d,#ff5470)}

.opts{position:absolute;top:452px;left:90px;width:1740px;height:376px;z-index:20;
 display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:26px}
.row{border-radius:18px;display:flex;align-items:center;gap:20px;padding:0 26px;
 background:rgba(126,109,255,.13);border:3px solid rgba(126,109,255,.42)}
.row .k{font-family:'PS2P',monospace;font-size:24px;color:#7e6dff;flex:0 0 auto;width:38px}
.row .v{font-size:32px;font-weight:600;line-height:1.2}
.row.correct{background:rgba(61,220,132,.30);border-color:#3ddc84;box-shadow:0 0 46px rgba(61,220,132,.6),inset 0 0 30px rgba(61,220,132,.2)}
.row.correct .k{color:#3ddc84}

.why{position:absolute;top:856px;left:90px;width:1740px;height:170px;z-index:20;display:flex;align-items:center;
 gap:20px;border-radius:16px;padding:0 28px;background:rgba(92,255,228,.09);border:2px solid rgba(92,255,228,.35)}
.why .tick{font-family:'PS2P',monospace;font-size:26px;color:#3ddc84;flex:0 0 auto}
.why .tx{font-size:27px;line-height:1.34;color:#d6f6ff}

/* full-screen scenes */
.scene{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:30px;background:rgba(13,10,48,.97)}
.scene .big{font-family:'PS2P',monospace;font-size:76px;color:#ffd24d;text-shadow:5px 5px 0 #7a2bd6;text-align:center;line-height:1.5}
.scene .mid{font-family:'PS2P',monospace;font-size:38px;color:#5cffe4;text-align:center;line-height:1.6}
.scene .sml{font-size:30px;color:#ece8ff;opacity:.9;text-align:center;line-height:1.5}
.word{display:inline-block;margin:0 14px}
.band{font-size:31px;line-height:1.85;color:#ece8ff;text-align:left}
.band b{color:#3ddc84}
.cta{font-size:44px;font-weight:800;color:#5cffe4}
</style><!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-y_3K19wHddzHShFk02JEm.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()

</head><body>
<div id="stage">
 <canvas id="stars" width="1920" height="1080"></canvas><div class="glow"></div>
 <div class="bez"><i class="t"></i><i class="b"></i></div>
 <div class="hdr"><div class="vtile">V</div>
   <div class="wm"><small>AI STUDY METHOD</small>REVISION ARCADE</div>
   <div class="unit" id="unit"></div><div class="qno" id="qno"></div></div>
 <div class="prog"><i id="progi"></i></div>
 <div class="round" id="roundlbl"></div>
 <div class="tierchip" id="tier" style="display:none">HIGHER TIER</div>
 <div class="stem" id="stem" data-fit></div>
 <div class="tbar"><b id="tdig"></b><u><i id="tfill"></i></u></div>
 <div class="opts" id="opts"></div>
 <div class="why" id="why"><div class="tick">✓</div><div class="tx" id="whytx" data-fit></div></div>
 <div class="scene" id="scene"></div>
 <div class="vig"></div><div class="scan"></div>
</div>
<script>
(function(){
'use strict';
var FPS=30;
var T_INTRO=7.0, T_ROUND=3.0, T_Q=11.3, T_OUTRO=18.0;
var Q={think:[0.4,7.4], lock:[7.4,7.7], reveal:7.7, why:8.0};
var data=null, sched=[], DUR=0, starPts=[], curQ=-1, curScene=null;
var $=function(i){return document.getElementById(i)};
function clamp(v,a,b){return v<a?a:v>b?b:v}
function ease(x){return 1-Math.pow(1-clamp(x,0,1),3)}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function fit(el,max,min){
 el.style.fontSize=max+'px';
 for(var s=max;s>min;s-=2){el.style.fontSize=s+'px';
   if(el.scrollHeight<=el.clientHeight+1&&el.scrollWidth<=el.clientWidth+1)break;}
}
function buildSched(){
 var t=0; sched=[];
 sched.push({k:'intro',t0:0,t1:T_INTRO}); t=T_INTRO;
 data.rounds.forEach(function(r,ri){
   sched.push({k:'round',t0:t,t1:t+T_ROUND,ri:ri}); t+=T_ROUND;
   r.items.forEach(function(it){ sched.push({k:'q',t0:t,t1:t+T_Q,ri:ri,it:it}); t+=T_Q; });
 });
 sched.push({k:'outro',t0:t,t1:t+T_OUTRO}); t+=T_OUTRO;
 DUR=t;
}
function setQuestion(it,ri){
 if(curQ===it.n)return; curQ=it.n;
 $('stem').textContent=it.stem; fit($('stem'),52,30);
 var K=['A','B','C','D'],h='';
 it.options.forEach(function(o,i){h+='<div class="row" data-c="'+(o.correct?1:0)+'"><div class="k">'+K[i]+
   '</div><div class="v" data-fit>'+o.text+'</div></div>'});
 $('opts').innerHTML=h;
 [].forEach.call(document.querySelectorAll('.opts .v'),function(v){fit(v,32,20)});
 $('whytx').textContent=it.why; fit($('whytx'),27,17);
 $('qno').textContent='Q '+it.n+' / '+data.total;
 $('roundlbl').textContent='ROUND '+(ri+1)+' · '+data.rounds[ri].name.toUpperCase();
 $('tier').style.display=(it.tier==='higher')?'block':'none';
 $('progi').style.width=(100*it.n/data.total).toFixed(2)+'%';
}
function drawStars(t){
 var g=$('stars').getContext('2d');g.clearRect(0,0,1920,1080);
 for(var i=0;i<190;i++){var p=starPts[i],y=(p.y+t*p.s)%1080;
  g.globalAlpha=p.a*(0.55+0.45*Math.sin(t*1.6+i));g.fillStyle=i%7===0?'#5cffe4':'#fff';
  g.fillRect(p.x,y,p.r,p.r)}
 g.globalAlpha=1;
}
function words(arr,lt,start,step){
 return arr.map(function(w,i){
   var p=ease((lt-(start+i*step))/0.28);
   return '<span class="word" style="opacity:'+clamp(p,0,1).toFixed(3)+
     ';transform:scale('+(0.5+0.5*clamp(p,0,1)).toFixed(3)+')">'+w+'</span>';
 }).join('');
}
function showScene(html,bg){ var s=$('scene'); s.style.display='flex'; s.style.background=bg||'rgba(13,10,48,.97)';
 if(s.dataset.h!==html){ s.innerHTML=html; s.dataset.h=html; } }
function hideScene(){ $('scene').style.display='none'; $('scene').dataset.h=''; }

function seek(t){
 t=clamp(t,0,DUR); drawStars(t);
 var sc=null;
 for(var i=0;i<sched.length;i++){ if(t>=sched[i].t0&&t<sched[i].t1){sc=sched[i];break} }
 if(!sc) sc=sched[sched.length-1];
 var lt=t-sc.t0;
 var qEls=['stem','opts','why','roundlbl','qno','tier'];
 if(sc.k==='q'){
   hideScene(); setQuestion(sc.it,sc.ri);
   // restore the containers a full-screen scene switched off
   ['opts','roundlbl','qno','tier','why'].forEach(function(id){$(id).style.opacity='1'});
   $('stem').style.opacity=String(ease(lt/0.4));
   var think=lt>=Q.think[0]&&lt<Q.think[1];
   var left=Math.max(0,Q.think[1]-lt);
   $('tdig').textContent = lt<Q.think[1] ? String(Math.max(1,Math.ceil(left))) : '0';
   $('tfill').style.width=(100*clamp(left/(Q.think[1]-Q.think[0]),0,1)).toFixed(2)+'%';
   document.querySelector('.tbar').style.opacity=String(lt<Q.reveal?1:0.25);
   [].forEach.call(document.querySelectorAll('.opts .row'),function(r,i){
     var ap=ease((lt-(0.35+i*0.08))/0.3);
     var corr=r.dataset.c==='1', on=lt>=Q.reveal&&corr;
     r.className='row'+(on?' correct':'');
     var mul=(lt>=Q.reveal&&!corr)?0.34:1;
     r.style.opacity=String(clamp(ap,0,1)*mul);
     r.style.filter=on?('brightness('+(1+0.5*Math.max(0,1-(lt-Q.reveal)/0.9))+')'):'none';
   });
   $('why').style.opacity=String(lt>=Q.why?ease((lt-Q.why)/0.35):0);
   $('why').style.transform='translateY('+((1-ease((lt-Q.why)/0.35))*16)+'px)';
 } else {
   qEls.forEach(function(id){var e=$(id); if(e) e.style.opacity='0'});
   document.querySelector('.tbar').style.opacity='0';
   if(sc.k==='intro'){
     var head='<div class="mid" style="opacity:'+clamp(ease((lt-0.2)/0.5),0,1)+'">'+
       'AQA GCSE BIOLOGY</div><div class="big" style="font-size:56px;opacity:'+
       clamp(ease((lt-0.9)/0.5),0,1)+'">'+data.unit.toUpperCase()+'</div>'+
       '<div class="sml" style="opacity:'+clamp(ease((lt-1.7)/0.5),0,1)+'">'+data.total+
       ' questions · 7 seconds each · pause any time</div>'+
       '<div class="big" style="margin-top:26px">'+words(['ARE','YOU','READY?'],lt,3.2,0.34)+'</div>'+
       '<div class="big" style="color:#5cffe4;text-shadow:5px 5px 0 #1fb89a">'+words(["LET'S","GO!"],lt,4.9,0.34)+'</div>';
     var flash=lt>6.5?(1-(lt-6.5)/0.5):0;
     showScene(head,'rgba(13,10,48,'+(0.97).toFixed(2)+')');
     $('scene').style.boxShadow='inset 0 0 400px rgba(255,210,77,'+(0.5*clamp(flash,0,1)).toFixed(3)+')';
   } else if(sc.k==='round'){
     var r=data.rounds[sc.ri];
     showScene('<div class="mid" style="opacity:'+clamp(ease(lt/0.4),0,1)+'">ROUND '+(sc.ri+1)+' OF '+data.rounds.length+
       '</div><div class="big" style="opacity:'+clamp(ease((lt-0.35)/0.4),0,1)+'">'+r.name.toUpperCase()+
       '</div><div class="sml" style="opacity:'+clamp(ease((lt-0.8)/0.4),0,1)+'">'+r.items.length+' questions</div>');
     $('scene').style.boxShadow='none';
   } else {
     showScene('<div class="big">SCORE YOURSELF</div>'+
       '<div class="mid" style="opacity:'+clamp(ease((lt-0.5)/0.5),0,1)+'">OUT OF '+data.total+'</div>'+
       '<div class="band" style="opacity:'+clamp(ease((lt-1.4)/0.6),0,1)+'">'+
       '<b>30+</b> — you know this unit cold<br/>'+
       '<b>22–29</b> — solid, patch the gaps<br/>'+
       '<b>under 22</b> — worth another pass at 4.1</div>'+
       '<div class="sml" style="opacity:'+clamp(ease((lt-3.2)/0.6),0,1)+'">Comment your score — and tell me which one caught you out</div>'+
       '<div class="cta" style="margin-top:18px;opacity:'+clamp(ease((lt-4.6)/0.6),0,1)+'">Play free · aistudymethod.com</div>'+
       '<div class="sml" style="opacity:'+clamp(ease((lt-5.4)/0.6),0,1)+'">Free GCSE, A-Level, IP &amp; IBDP revision games</div>');
     $('scene').style.boxShadow='none';
   }
 }
}
function fitStage(){var s=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='scale('+s+')'}
addEventListener('resize',fitStage);

var ready=fetch('data/'+(new URLSearchParams(location.search).get('set')||'aqa-bio-4-1')+'.json')
 .then(function(r){return r.json()}).then(function(d){
   data=d; $('unit').textContent=d.unit; buildSched();
   var sr=rng(1337); starPts=[];
   for(var i=0;i<190;i++)starPts.push({x:sr()*1920,y:sr()*1080,r:sr()*2+0.5,a:sr()*0.55+0.2,s:sr()*5+1.5});
   fitStage(); return document.fonts.ready;
 }).then(function(){seek(0);return true});

window.__reel={get duration(){return DUR},fps:FPS,seek:seek,ready:ready,
 get chapters(){return sched.filter(function(s){return s.k==='round'})
   .map(function(s){return {t:s.t0,name:data.rounds[s.ri].name}})},
 overflow:function(){return [].slice.call(document.querySelectorAll('[data-fit]'))
  .filter(function(e){return e.offsetParent!==null&&(e.scrollHeight>e.clientHeight+2||e.scrollWidth>e.clientWidth+2)})
  .map(function(e){return (e.id||e.className)+':'+e.textContent.slice(0,50)})}};
})();
</script></body></html>
