<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Types of Radiation — Sort It — AI Study Method</title>
<meta name="description" content="Sort 15 types of radiation into Alpha, Beta-minus, Gamma or All three in this free physics revision game. No login required. Build your understanding for exam success.">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../quizzes/arcade.css">
<style>
  .so-stage { min-height:148px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .so-card {
    background:var(--ar-grad-card); border:2px solid var(--ar-border-hi);
    border-radius:var(--ar-r-lg); padding:26px 22px; text-align:center;
    width:100%; box-shadow:0 18px 50px rgba(0,0,0,0.45); position:relative;
    transition:transform 0.12s ease;
  }
  .so-card-text { font-size:clamp(18px,5vw,26px); font-weight:700; line-height:1.3; overflow-wrap:anywhere; word-break:break-word; }
  .so-card-hint { font-family:var(--ar-mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ar-muted); margin-top:10px; }
  .so-card.fly  { animation:soFly 0.34s ease forwards; }
  .so-card.in   { animation:soIn 0.26s ease; }
  @keyframes soFly { to { transform:translateY(-60vh) scale(0.7); opacity:0; } }
  @keyframes soIn  { from { transform:translateY(28px); opacity:0; } to { transform:none; opacity:1; } }

  .so-bins { display:grid; gap:12px; margin-bottom:6px; }
  .so-bins.n2 { grid-template-columns:1fr 1fr; }
  .so-bins.n3 { grid-template-columns:1fr 1fr 1fr; }
  .so-bins.n4 { grid-template-columns:1fr 1fr; }
  @media (max-width:380px){ .so-bins.n3 { grid-template-columns:1fr; } }

  .so-bin {
    border:2px solid; border-radius:var(--ar-r); padding:16px 12px; cursor:pointer;
    min-height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-family:var(--ar-font); text-align:center; color:var(--ar-text); width:100%;
    transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  .so-bin:hover:not(:disabled) { transform:translateY(-2px); filter:brightness(1.15); }
  .so-bin:active:not(:disabled) { transform:scale(0.97); }
  .so-bin:focus-visible { outline:2px solid var(--ar-cyan); outline-offset:2px; }
  .so-bin-key { font-family:var(--ar-mono); font-size:10px; opacity:0.7; }
  .so-bin-name { font-size:clamp(13px,3.6vw,16px); font-weight:700; line-height:1.25; overflow-wrap:anywhere; word-break:break-word; }
  .so-bin.c0 { background:rgba(0,229,255,0.12);  border-color:rgba(0,229,255,0.5);  color:var(--ar-cyan); }
  .so-bin.c1 { background:rgba(255,46,136,0.12); border-color:rgba(255,46,136,0.5); color:var(--ar-pink); }
  .so-bin.c2 { background:rgba(0,255,163,0.12);  border-color:rgba(0,255,163,0.5);  color:var(--ar-mint); }
  .so-bin.c3 { background:rgba(255,214,10,0.12); border-color:rgba(255,214,10,0.5); color:var(--ar-gold); }
  .so-bin.right { box-shadow:0 0 0 3px rgba(0,255,163,0.3), 0 0 30px rgba(0,255,163,0.4); animation:arPop 0.4s cubic-bezier(0.2,2,0.4,1); }
  .so-bin.wrongbin { animation:arShakeX 0.4s ease; }
</style>
<meta name="robots" content="noindex,nofollow">
</head>
<body class="arcade">

<nav>
  <div class="nav-inner">
    <a href="../../index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text">
        <span class="logo-primary">AI Study Method</span>
        <span class="logo-secondary">The Velvet Method™</span>
      </div>
    </a>
    <div class="nav-right">
      <a href="../arcade.html" class="arcade-back">← Back to Arcade</a>
    </div>
  </div>
  <style>
    nav .arcade-back { text-decoration: none; color: var(--text-secondary); font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.2s ease; white-space: nowrap; }
    nav .arcade-back:hover { color: var(--text-primary); background: var(--accent-soft); }
    body.arcade nav .arcade-back { color: var(--ar-text2); }
    body.arcade nav .arcade-back:hover { color: var(--ar-mint); }
  </style>
</nav>

<div class="ar-wrap" id="root">
  <div class="ar-error">Loading…</div>
</div>
<div id="announce" aria-live="polite" class="sr-only"></div>

<script src="../quizzes/arcade.js"></script>
<script src="../quizzes/share-score.js?v=20260717a"></script>
<script>
(function () {
  'use strict';
  const GAME_DATA = {"CATEGORIES":["Alpha","Beta-minus","Gamma","All three"],"ALL_ITEMS":[{"text":"Helium nucleus — 2 protons 2 neutrons","cat":0},{"text":"Range of ~5 cm in air","cat":0},{"text":"Stopped by paper","cat":0},{"text":"Most strongly ionising","cat":0},{"text":"Fast electron from nucleus","cat":1},{"text":"Antineutrino also emitted","cat":1},{"text":"Neutron converts to proton","cat":1},{"text":"Stopped by a few mm of aluminium","cat":1},{"text":"High frequency EM radiation","cat":2},{"text":"No change in mass or atomic number","cat":2},{"text":"Reduced by thick lead","cat":2},{"text":"Weakest ionising ability","cat":2},{"text":"Emitted from unstable nuclei","cat":3},{"text":"Cause ionisation","cat":3},{"text":"Detected by Geiger-Müller tube","cat":3}]};
  const esc = Arcade.escapeHtml;
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  Arcade.mountMuteButton();

  const HEADING = "Types of Radiation — Sort It";
  const CATEGORIES = (GAME_DATA.CATEGORIES || []).slice(0, 4);
  const ALL_ITEMS = (GAME_DATA.ALL_ITEMS || []).filter(it => it && it.text != null && it.cat < CATEGORIES.length);
  const RUN_SECS = GAME_DATA.TIMER_SECS || 75;
  const RUN_MS = RUN_SECS * 1000;
  const BEST_KEY = 'aism-best:' + location.pathname;

  if (CATEGORIES.length < 2 || ALL_ITEMS.length < 1) {
    root.innerHTML = '<div class="ar-error">No sorting set available for this topic yet.</div>';
    return;
  }

  // JS-injected styles (markup/CSS sections must stay untouched): frozen bins
  // during the read-the-correction pause, plus a prominent correction line.
  const injected = document.createElement('style');
  injected.textContent = '.so-bin:disabled { opacity:0.35; cursor:default; transform:none; }'
    + ' .ar-feedback.no { font-size:15.5px; }'
    + ' .so-freeze-note { font-family:var(--ar-mono); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ar-muted); margin-top:8px; }'
    // FRENZY event skin: gold pulsing card while the ×2 window runs, plus a
    // countdown pill under the HUD. All JS-injected — the markup never changes.
    + ' body.so-frenzy .so-card { border-color:var(--ar-gold); box-shadow:0 0 0 2px rgba(255,214,10,0.35), 0 0 30px rgba(255,214,10,0.3); }'
    + ' body.so-frenzy .so-card-hint { color:var(--ar-gold); }'
    + ' .so-frenzy-pill { display:none; align-items:center; justify-content:center; gap:6px; margin:0 0 10px; font-family:var(--ar-mono); font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--ar-gold); animation:soFrenzyPulse 0.8s ease-in-out infinite; }'
    + ' body.so-frenzy .so-frenzy-pill { display:flex; }'
    + ' @keyframes soFrenzyPulse { 50% { opacity:0.55; } }'
    + ' @media (prefers-reduced-motion: reduce) { .so-frenzy-pill { animation:none; } body.so-frenzy .so-card { box-shadow:0 0 0 2px rgba(255,214,10,0.35); } }';
  document.head.appendChild(injected);

  // FRENZY: every 5th consecutive correct sort opens a 10-second ×2 window —
  // double sort points and a moderately faster item cadence (more retrieval
  // per second). A wrong sort keeps its full input-freeze correction and ends
  // the frenzy on the spot. Re-earnable at every 5-combo milestone.
  const FRENZY_COMBO = 5;
  const FRENZY_MS = 10000;

  let queue, state, timerCtl = null, heartTimer = null, locked = false;
  let frenzyEndT = null, frenzyTick = null;

  function frenzyPill() { return root.querySelector('.so-frenzy-pill'); }

  function startFrenzy() {
    state.frenzy = true;
    state.frenzyUntil = Date.now() + FRENZY_MS;
    document.body.classList.add('so-frenzy');
    clearTimeout(frenzyEndT);
    clearInterval(frenzyTick);
    frenzyEndT = setTimeout(() => endFrenzy(true), FRENZY_MS);
    frenzyTick = setInterval(() => {
      const p = frenzyPill();
      if (p && state.frenzy) p.textContent = '⚡ FRENZY ×2 · ' + Math.max(0, Math.ceil((state.frenzyUntil - Date.now()) / 1000)) + 's';
    }, 250);
    const p = frenzyPill();
    if (p) p.textContent = '⚡ FRENZY ×2 · 10s';
    // Sequenced after the existing 5-combo streak call so the banners read in order.
    setTimeout(() => { if (state && state.frenzy) { Arcade.flashMsg('⚡ FRENZY — ×2 FOR 10s', '#ffd60a'); Arcade.sfx.riser(); } }, 700);
  }

  function endFrenzy(timedOut) {
    if (!state || !state.frenzy) { document.body.classList.remove('so-frenzy'); return; }
    state.frenzy = false;
    clearTimeout(frenzyEndT); frenzyEndT = null;
    clearInterval(frenzyTick); frenzyTick = null;
    document.body.classList.remove('so-frenzy');
    if (timedOut && timerCtl) announce.textContent = 'Frenzy over. Back to normal points.';
  }

  function startGame() {
    if (timerCtl) { timerCtl.stop(); timerCtl = null; }
    if (heartTimer) { clearInterval(heartTimer); heartTimer = null; }
    queue = Arcade.shuffle(ALL_ITEMS);
    state = {
      pos: 0, sorted: 0, correct: 0, combo: 0, bestCombo: 0,
      grid: [], lastMiss: null,
      pts: 0, frenzyExtra: 0, frenzy: false, frenzyUntil: 0,
    };
    endFrenzy(false);
    locked = false;
    renderGame();
  }

  function renderGame() {
    const n = CATEGORIES.length;
    root.innerHTML = `
      <div class="ar-badge">📦 Arcade · Sorting Rush</div>
      <h1 class="ar-title">${esc(HEADING)}</h1>
      <p class="ar-sub">${esc(RUN_SECS)} seconds. Drop each item into the right bin. Chain correct sorts to grow your combo — five in a row sparks a ×2 frenzy.</p>
      <div class="ar-hud">
        <div class="ar-hud-stat">Score <b id="hudScore">0</b></div>
        <div class="ar-hud-stat${state.combo >= 3 ? ' hot' : ''}">Combo <b id="hudCombo">×1</b></div>
        <div class="ar-hud-stat gold">Time <b id="hudTime">${RUN_SECS}</b></div>
      </div>
      <div class="so-frenzy-pill" aria-hidden="true">⚡ FRENZY ×2</div>
      <div class="ar-timer" aria-hidden="true"><i id="tfill"></i></div>
      <div class="so-stage">
        <div class="so-card in" id="card">
          <div class="so-card-text" id="cardText">—</div>
          <div class="so-card-hint">Tap the right bin below</div>
        </div>
      </div>
      <div class="so-bins n${n}" id="bins" role="group" aria-label="Category bins">
        ${CATEGORIES.map((c, i) => `
          <button type="button" class="so-bin c${i}" data-cat="${i}">
            <span class="so-bin-key">${i + 1}</span>
            <span class="so-bin-name">${esc(c)}</span>
          </button>
        `).join('')}
      </div>
      <div id="fb"></div>
      <div class="ar-kbd-hint">Keyboard: press 1–${n} to sort</div>
      <div id="endWrap"></div>
    `;

    const bins = Array.from(root.querySelectorAll('.so-bin'));
    bins.forEach(b => b.addEventListener('click', () => sort(parseInt(b.dataset.cat))));

    timerCtl = Arcade.timer(document.getElementById('tfill'), RUN_MS, {
      onSecond: (s) => {
        const t = document.getElementById('hudTime');
        if (t) t.textContent = s;
      },
      onEnd: () => endGame(),
    });

    // Heartbeat in the final 10 seconds.
    heartTimer = setInterval(() => {
      if (!timerCtl) return;
      if (timerCtl.remaining <= 10000 && timerCtl.remaining > 0) Arcade.sfx.heartbeat();
    }, 1000);

    showItem();
  }

  function curItem() { return queue[state.pos % queue.length]; }

  function showItem() {
    const item = curItem();
    const card = document.getElementById('card');
    const txt = document.getElementById('cardText');
    card.classList.remove('fly', 'in');
    void card.offsetWidth;
    card.classList.add('in');
    txt.textContent = item.text;
    announce.textContent = 'Sort this item: ' + item.text;
  }

  function sort(catIdx) {
    if (locked || !timerCtl) return;
    locked = true;
    const item = curItem();
    const correct = item.cat === catIdx;
    const bins = Array.from(root.querySelectorAll('.so-bin'));
    const chosenBin = bins[catIdx];
    const card = document.getElementById('card');

    state.sorted++;
    const fb = document.getElementById('fb');

    if (correct) {
      state.correct++;
      state.combo++;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      // FRENZY payout: a correct sort inside the window banks 2 points, not 1.
      // Accuracy stats (sorted / correct) stay untouched — score only.
      const inFrenzy = state.frenzy;
      const gained = inFrenzy ? 2 : 1;
      state.pts += gained;
      if (inFrenzy) state.frenzyExtra++;
      state.grid.push('🟩');
      Arcade.sfx.correct(state.combo);
      chosenBin.classList.add('right');
      card.classList.add('fly');
      Arcade.popTextOver(chosenBin, inFrenzy ? '+2 ⚡' : '×' + state.combo, inFrenzy ? '#ffd60a' : '#00ffa3');
      Arcade.vibrate(15);
      if (state.combo === 5 || state.combo === 10) { Arcade.streakCall(state.combo); Arcade.confettiBurst({ count: 45 }); }
      // EVENT — FRENZY: earned at every 5-combo milestone while no frenzy runs.
      if (!state.frenzy && state.combo % FRENZY_COMBO === 0) startFrenzy();
      fb.className = 'ar-feedback ok';
      fb.innerHTML = `<strong>Correct!${inFrenzy ? ' ⚡ +2' : ''}</strong> “${esc(item.text)}” belongs in <em>${esc(CATEGORIES[item.cat])}</em>.`;
      announce.textContent = `Correct. ${item.text} is ${CATEGORIES[item.cat]}. Combo ${state.combo}.`
        + (inFrenzy ? ' Frenzy: two points banked.' : '')
        + (state.frenzy && !inFrenzy ? ' Frenzy! Double points for ten seconds.' : '');
    } else {
      state.combo = 0;
      endFrenzy(false);   // a miss snuffs the frenzy; the full correction pause below is unchanged
      state.grid.push('🟥');
      state.lastMiss = item;
      // Re-queue the miss 3–4 positions ahead so it re-tests within this run.
      const at = state.pos % queue.length;
      state.pos = at;
      queue.splice(Math.min(queue.length, at + 3 + (Math.random() < 0.5 ? 0 : 1)), 0, item);
      Arcade.sfx.wrong();
      chosenBin.classList.add('wrongbin');
      Arcade.shake();
      Arcade.vibrate([40, 30, 40]);
      // Freeze the bins while the correction shows — the penalty is the reading time.
      bins.forEach(b => { b.disabled = true; });
      fb.className = 'ar-feedback no';
      fb.innerHTML = `<strong>Nope.</strong> “${esc(item.text)}” actually belongs in <em>${esc(CATEGORIES[item.cat])}</em>, not ${esc(CATEGORIES[catIdx])}.<div class="so-freeze-note">Read it — this one comes back around</div>`;
      announce.textContent = `Incorrect. ${item.text} belongs in ${CATEGORIES[item.cat]}, not ${CATEGORIES[catIdx]}. It will come back around shortly.`;
    }

    const scoreEl = document.getElementById('hudScore');
    scoreEl.textContent = state.pts;
    if (correct) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
    const comboEl = document.getElementById('hudCombo');
    comboEl.textContent = '×' + Math.max(1, state.combo);
    comboEl.parentElement.classList.toggle('hot', state.combo >= 3);

    // Correct sorts speed up as the combo climbs; misses hold for reading time.
    // During FRENZY the cadence tightens moderately (density up) — the card
    // itself stays full size and the player still paces their own answer.
    let delay = correct ? Math.max(200, 360 - 20 * (state.combo - 1)) : 1400;
    if (correct && state.frenzy) delay = Math.max(150, Math.round(delay * 0.65));
    setTimeout(() => {
      chosenBin.classList.remove('right', 'wrongbin');
      bins.forEach(b => { b.disabled = false; });
      state.pos++;
      locked = false;
      if (timerCtl) { showItem(); }
    }, delay);
  }

  function endGame() {
    if (timerCtl) { timerCtl.stop(); timerCtl = null; }
    if (heartTimer) { clearInterval(heartTimer); heartTimer = null; }
    endFrenzy(false);
    locked = true;

    const pct = state.sorted ? Math.round((state.correct / state.sorted) * 100) : 0;
    const gridStr = state.grid.slice(-20).join('');

    let insight;
    if (state.lastMiss) {
      insight = `The one that fooled you: “${state.lastMiss.text}” actually belongs in ${CATEGORIES[state.lastMiss.cat]}. Lock that in and your next run will be cleaner.`;
    } else if (state.correct > 0) {
      insight = `Zero mistakes — you sorted every item into the right bin. Push for a bigger combo and more sorted next run.`;
    } else {
      insight = `Time ran out before you got going. Tap a bin to start sorting — speed comes with reps.`;
    }

    root.innerHTML = `
      <div class="ar-badge">📦 Arcade · Sorting Rush</div>
      <h1 class="ar-title">${esc(HEADING)}</h1>
      <div id="end"></div>
    `;
    Arcade.renderEndCard(document.getElementById('end'), {
      gameName: 'Sorting Rush',
      gameEmoji: '📦',
      topic: HEADING,
      pct: pct,
      big: state.pts,
      bigLabel: 'sort points',
      rows: [
        { v: `${state.correct}/${state.sorted}`, l: 'sorted right' },
        { v: pct + '%', l: 'accuracy' },
        { v: '🔥 ×' + state.bestCombo, l: 'best combo' },
        ...(state.frenzyExtra > 0 ? [{ v: '⚡ +' + state.frenzyExtra, l: 'frenzy bonus' }] : []),
      ],
      emojiGrid: gridStr,
      bestKey: BEST_KEY,
      bestValue: state.pts,
      bestSuffix: ' pts',
      insight: insight,
      shareLines: [
        '📦 Sorting Rush — ' + HEADING,
        `${state.pts} pts · ${state.correct} sorted right · ${pct}%` + (state.frenzyExtra > 0 ? ` · ⚡ frenzy +${state.frenzyExtra}` : '') + ` · 🔥 best combo ×${state.bestCombo}`,
        gridStr,
      ],
      onAgain: startGame,
    });
    announce.textContent = `Time up. ${state.pts} sort points. You sorted ${state.correct} correctly out of ${state.sorted} — ${pct} percent. Best combo ${state.bestCombo}.`;
  }

  // Keyboard: number keys 1-4 sort into the matching bin.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const num = parseInt(e.key);
    if (num >= 1 && num <= CATEGORIES.length) {
      const bin = root.querySelectorAll('.so-bin')[num - 1];
      if (bin) { e.preventDefault(); bin.click(); }
    }
  });

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
