<style>
  /* ---- memory-match specifics (mm-) ------------------------------------ */
  .mm-strip {
    min-height: 56px; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: var(--ar-r);
    border: 1px solid var(--ar-border); background: var(--ar-card);
    color: var(--ar-text2); font-size: 13.5px; line-height: 1.45;
    margin-bottom: 14px;
  }
  .mm-strip.ok { background: var(--ar-mint-dim); border-color: rgba(0,255,163,0.35); color: #b8ffe3; animation: arSlideUp 0.25s ease; }
  .mm-strip.no { background: var(--ar-pink-dim); border-color: rgba(255,46,136,0.35); color: #ffc4dd; animation: arSlideUp 0.25s ease; }
  .mm-strip strong { color: var(--ar-text); }

  .mm-grid { display: grid; gap: 8px; margin-bottom: 12px; }

  .mm-card {
    position: relative; border: none; background: transparent; padding: 0;
    cursor: pointer; perspective: 900px; height: 100%;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--ar-font);
    animation: arSlideUp 0.35s ease both;
  }
  .mm-card:disabled { cursor: default; }
  .mm-card:focus-visible { outline: none; }
  .mm-card:focus-visible .mm-face { outline: 2px solid var(--ar-cyan); outline-offset: 2px; }

  .mm-inner {
    position: relative; display: block; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
  }
  .mm-card.flipped .mm-inner, .mm-card.matched .mm-inner { transform: rotateY(180deg); }

  .mm-face {
    position: absolute; inset: 0; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 8px 7px; overflow: hidden; text-align: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .mm-back { background: linear-gradient(160deg, #181838 0%, #11112b 100%); border: 2px solid var(--ar-border-hi); }
  .mm-back::before {
    content: ''; position: absolute; inset: 0; border-radius: 12px; opacity: 0.16;
    background-image:
      repeating-linear-gradient(45deg,  var(--ar-violet) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(-45deg, var(--ar-cyan)   0 1px, transparent 1px 9px);
  }
  .mm-glyph {
    position: relative; font-weight: 700; font-size: 22px;
    color: rgba(242,243,255,0.3); text-shadow: 0 0 16px rgba(139,92,246,0.7);
  }
  .mm-card:hover:not(:disabled):not(.flipped) .mm-back { border-color: var(--ar-cyan); box-shadow: 0 0 18px rgba(0,229,255,0.22); }
  .mm-card:active:not(:disabled):not(.flipped) .mm-inner { transform: scale(0.97); }

  .mm-front { transform: rotateY(180deg); }
  .mm-front.term { background: var(--ar-cyan-dim);        border: 2px solid rgba(0,229,255,0.45); }
  .mm-front.def  { background: rgba(139,92,246,0.13);     border: 2px solid rgba(139,92,246,0.5); }

  .mm-kind {
    flex: 0 0 auto; font-family: var(--ar-mono); font-size: 8px; font-weight: 700;
    letter-spacing: 1.4px; text-transform: uppercase;
    padding: 1px 7px; border-radius: 10px;
  }
  .mm-front.term .mm-kind { background: rgba(0,229,255,0.18);  color: var(--ar-cyan); }
  .mm-front.def  .mm-kind { background: rgba(139,92,246,0.25); color: #c9b3ff; }

  .mm-text {
    display: block; flex: 0 1 auto; min-height: 0; width: 100%;
    overflow: hidden; font-weight: 600; line-height: 1.22; color: var(--ar-text);
    overflow-wrap: break-word;
  }
  .mm-text.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 8; text-overflow: ellipsis; }

  .mm-card.matched .mm-face.mm-front {
    border-color: var(--ar-mint); background: var(--ar-mint-dim);
    box-shadow: 0 0 0 2px rgba(0,255,163,0.18), 0 0 20px rgba(0,255,163,0.32);
  }
  .mm-card.matched .mm-text { color: #b8ffe3; }
  .mm-card.matched .mm-kind { opacity: 0.55; }
  .mm-card.just .mm-inner { animation: mmPop 0.45s cubic-bezier(0.2, 2.0, 0.4, 1) both; }
  @keyframes mmPop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.09); } 100% { transform: rotateY(180deg) scale(1); } }

  .mm-card.miss .mm-inner { animation: mmShake 0.45s ease; }
  .mm-card.miss .mm-face.mm-front { border-color: var(--ar-pink); box-shadow: 0 0 16px rgba(255,46,136,0.3); }
  @keyframes mmShake {
    0%, 100% { transform: rotateY(180deg); }
    20% { transform: rotateY(180deg) translateX(-6px); }
    45% { transform: rotateY(180deg) translateX(5px); }
    70% { transform: rotateY(180deg) translateX(-3px); }
  }

  @media (max-width: 480px) { .mm-grid { gap: 6px; } }
</style>

<div class="ar-wrap" id="root">
  <div class="ar-badge" id="badge">Memory Match</div>
  <h1 class="ar-title" id="heading">Numbers & Dates — Memory Match</h1>
  <p class="ar-sub" id="sub"></p>
  <div class="ar-meta" id="meta"></div>
  <div id="stage"><div class="ar-error">Loading…</div></div>
</div>
<div id="announce" aria-live="polite" class="sr-only" role="status"></div>

<script src="../quizzes/arcade.js"></script>
<script>
(function () {
  'use strict';
  const GAME_DATA = {"ALL_PAIRS":[{"term":"eins","def":"one (1)"},{"term":"zehn","def":"ten (10)"},{"term":"zwanzig","def":"twenty (20)"},{"term":"hundert","def":"one hundred (100)"},{"term":"Montag","def":"Monday"},{"term":"Mittwoch","def":"Wednesday"},{"term":"Januar","def":"January"},{"term":"Wochenende (n)","def":"Weekend (neuter noun)"},{"term":"heute","def":"today"},{"term":"Geburtstag (m)","def":"Birthday (masculine noun)"}],"GRID_COLS":{"6":4,"8":4,"10":5,"12":6,"15":6,"18":6},"GRID_ROWS":{"6":3,"8":4,"10":4,"12":4,"15":5,"18":6},"TIMER_SECS":{"6":90,"8":120,"10":150,"12":180,"15":210,"18":240},"MODE":"verify"};

  const esc = Arcade.escapeHtml;
  const stage = document.getElementById('stage');
  const announce = document.getElementById('announce');
  const HEADING = document.getElementById('heading').textContent.trim();

  Arcade.mountMuteButton();

  /* ---------- normalise incoming data ----------------------------------- */
  const D = GAME_DATA || {};
  const MODE = D.MODE === 'verify' ? 'verify' : 'memory';
  const RAW = (Array.isArray(D.ALL_PAIRS) ? D.ALL_PAIRS : [])
    .filter(p => p && p.term && p.def);

  function asNum(v) { return (typeof v === 'number' && isFinite(v) && v > 0) ? Math.round(v) : null; }

  const isMobile = !window.matchMedia || window.matchMedia('(max-width: 560px)').matches;
  const nc = asNum(D.GRID_COLS), nr = asNum(D.GRID_ROWS);

  // Pair count: explicit numeric grid wins, else 6 pairs (12 cards) on
  // phones, 8 pairs (16 cards) on bigger screens. Cap so cards stay readable.
  let pairCount = (nc && nr) ? Math.floor((nc * nr) / 2) : (isMobile ? 6 : 8);
  pairCount = Math.max(3, Math.min(pairCount, RAW.length, 10));
  const cardCount = pairCount * 2;

  let cols = nc || (cardCount % 4 === 0 ? 4 : 3);
  if (cardCount % cols !== 0) cols = (cardCount % 4 === 0) ? 4 : 3;
  if (isMobile) cols = (cardCount % 3 === 0) ? 3 : Math.min(cols, 4);
  cols = Math.max(2, Math.min(cols, 6));

  // Timer: number wins; legacy data ships a {pairs: secs} map; else 15s/pair.
  let timerSecs = asNum(D.TIMER_SECS);
  if (!timerSecs && D.TIMER_SECS && typeof D.TIMER_SECS === 'object') {
    timerSecs = asNum(D.TIMER_SECS[pairCount]) || asNum(D.TIMER_SECS[String(pairCount)]);
  }
  if (!timerSecs) timerSecs = Math.max(60, pairCount * 15);

  /* ---------- static header copy ----------------------------------------- */
  document.getElementById('badge').textContent =
    MODE === 'verify' ? 'V · Verify · Memory Match' : 'M · Memory Match';
  document.getElementById('sub').textContent = MODE === 'verify'
    ? 'Every term has its definition hiding on the board. Clear all ' + pairCount + ' pairs before the clock hits zero.'
    : 'Flip cards to pair each term with its definition. Fewer moves, hotter combos, better grade.';
  document.getElementById('meta').textContent =
    pairCount + ' pairs · ' + cardCount + ' cards · ' +
    (MODE === 'verify' ? timerSecs + 's on the clock' : 'untimed · speed still scores');

  if (RAW.length < 3) {
    stage.innerHTML = '<div class="ar-error">This topic needs at least 3 authored term–definition pairs. Come back soon.</div>';
    return;
  }

  const BEST_KEY = 'aism-best:' + location.pathname;
  const FLIPBACK_MS = MODE === 'verify' ? 750 : 1150; // learn pacing breathes
  const MATCH_BASE = 100;

  function fmt(secs) {
    const s = Math.max(0, Math.round(secs));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  /* ---------- game state -------------------------------------------------- */
  let state = null, timerCtl = null, elapsedInt = null;

  function startGame() {
    if (timerCtl) { timerCtl.stop(); timerCtl = null; }
    if (elapsedInt) { clearInterval(elapsedInt); elapsedInt = null; }

    const deck = Arcade.shuffle(RAW).slice(0, pairCount);
    const cards = Arcade.shuffle(deck.flatMap((p, i) => ([
      { pairId: i, kind: 'term', text: p.term, pair: p },
      { pairId: i, kind: 'def',  text: p.def,  pair: p },
    ])));

    state = {
      cards, flipped: [], lock: false, over: false,
      moves: 0, matched: 0, score: 0, combo: 0, bestCombo: 0,
      missed: new Set(),         // pairIds that were ever in a mismatch
      order: [],                 // matches in the order they landed
      t0: performance.now(), lastMatchT: performance.now(),
    };

    renderStage();
    announce.textContent = 'New board dealt: ' + cardCount + ' face-down cards, ' +
      pairCount + ' pairs to find. ' +
      (MODE === 'verify' ? fmt(timerSecs) + ' on the clock.' : 'Take your time — every definition counts.');
  }

  /* ---------- rendering --------------------------------------------------- */
  function renderStage() {
    stage.innerHTML = `
      <div class="ar-hud">
        <div class="ar-hud-stat">Score <b id="hudScore">0</b></div>
        <div class="ar-hud-stat" id="comboStat">Combo <b id="hudCombo">×1</b></div>
        <div class="ar-hud-stat">Moves <b id="hudMoves">0</b></div>
        <div class="ar-hud-stat gold">${MODE === 'verify' ? 'Left' : 'Time'} <b id="hudTime">${MODE === 'verify' ? fmt(timerSecs) : '0:00'}</b></div>
      </div>
      <div class="ar-dots" aria-hidden="true">${state.cards.slice(0, pairCount).map(() => '<span></span>').join('')}</div>
      ${MODE === 'verify' ? '<div class="ar-timer" aria-hidden="true"><i id="tfill"></i></div>' : ''}
      <div class="mm-strip" id="fb" role="status">🃏 Flip two cards. Match each <strong>term</strong> to its <strong>definition</strong> — every match shows the full meaning here.</div>
      <div class="mm-grid" id="grid" role="group" aria-label="Memory cards: match each term with its definition"></div>
      <div class="ar-kbd-hint">Keyboard: Tab / arrow keys move · Enter or Space flips</div>
    `;

    const grid = document.getElementById('grid');
    state.cards.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mm-card';
      b.dataset.i = i;
      b.style.animationDelay = (i * 0.03) + 's';
      b.setAttribute('aria-label', 'Card ' + (i + 1) + ' of ' + cardCount + ', face down');
      b.innerHTML = `
        <span class="mm-inner">
          <span class="mm-face mm-back" aria-hidden="true"><span class="mm-glyph">✦</span></span>
          <span class="mm-face mm-front ${c.kind}">
            <span class="mm-kind">${c.kind === 'term' ? 'Term' : 'Definition'}</span>
            <span class="mm-text">${esc(c.text)}</span>
          </span>
        </span>`;
      b.addEventListener('click', () => onCard(i));
      grid.appendChild(b);
      c.el = b;
    });

    // Arrow-key grid navigation (skips matched/disabled cards).
    grid.addEventListener('keydown', (e) => {
      const map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols };
      if (!(e.key in map)) return;
      const cur = document.activeElement;
      if (!cur || !cur.classList || !cur.classList.contains('mm-card')) return;
      e.preventDefault();
      let i = parseInt(cur.dataset.i, 10);
      const step = map[e.key];
      do { i += step; } while (i >= 0 && i < state.cards.length && state.cards[i].el.disabled);
      if (i >= 0 && i < state.cards.length) state.cards[i].el.focus();
    });

    layout();
    requestAnimationFrame(fitAll);

    if (MODE === 'verify') {
      timerCtl = Arcade.timer(document.getElementById('tfill'), timerSecs * 1000, {
        onSecond: (s) => {
          const t = document.getElementById('hudTime');
          if (t) t.textContent = fmt(s);
          if (s === 10 && !state.over) {
            Arcade.flashMsg('10 SECONDS ⏱', '#ffd60a');
            announce.textContent = 'Ten seconds left.';
          }
        },
        onEnd: () => { if (!state.over) finish(false); },
      });
    } else {
      elapsedInt = setInterval(() => {
        const t = document.getElementById('hudTime');
        if (t && !state.over) t.textContent = fmt((performance.now() - state.t0) / 1000);
      }, 1000);
    }
  }

  /* ---------- card sizing + text fitting ---------------------------------- */
  function layout() {
    const grid = document.getElementById('grid');
    if (!grid || !state) return;
    const gap = (window.matchMedia && window.matchMedia('(max-width: 480px)').matches) ? 6 : 8;
    const cardW = (grid.clientWidth - gap * (cols - 1)) / cols;
    const cardH = Math.max(86, Math.min(150, Math.round(cardW * 1.12)));
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    grid.style.gridAutoRows = cardH + 'px';
    state.fsTerm = cardH >= 128 ? 16 : cardH >= 104 ? 14.5 : 13;
    state.fsDef  = cardH >= 128 ? 12.5 : cardH >= 104 ? 11.5 : 10.5;
  }

  function fitText(c) {
    const t = c.el.querySelector('.mm-text');
    if (!t) return;
    t.classList.remove('clamp');
    let size = c.kind === 'term' ? state.fsTerm : state.fsDef;
    t.style.fontSize = size + 'px';
    let guard = 24;
    while (t.scrollHeight > t.clientHeight + 1 && size > 8 && guard--) {
      size -= 0.5;
      t.style.fontSize = size + 'px';
    }
    if (t.scrollHeight > t.clientHeight + 1) t.classList.add('clamp'); // last resort
  }
  function fitAll() { if (state) state.cards.forEach(fitText); }

  let resizeT = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { layout(); fitAll(); }, 150);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll());

  /* ---------- play -------------------------------------------------------- */
  function onCard(i) {
    if (!state || state.lock || state.over) return;
    const c = state.cards[i];
    if (c.matchedFlag || c.flippedFlag) return;

    c.flippedFlag = true;
    c.el.classList.add('flipped');
    c.el.setAttribute('aria-label', (c.kind === 'term' ? 'Term: ' : 'Definition: ') + c.text);
    Arcade.sfx.click();
    announce.textContent = 'Flipped ' + (c.kind === 'term' ? 'term: ' : 'definition: ') + c.text;

    state.flipped.push(i);
    if (state.flipped.length === 2) {
      state.lock = true;
      state.moves++;
      setHud('hudMoves', String(state.moves));
      setTimeout(resolvePair, 480);
    }
  }

  function resolvePair() {
    const [ia, ib] = state.flipped;
    const a = state.cards[ia], b = state.cards[ib];
    const hit = a.pairId === b.pairId;
    const fb = document.getElementById('fb');

    if (hit) {
      const now = performance.now();
      const speedBonus = Math.max(0, Math.round(40 * Math.max(0, 1 - (now - state.lastMatchT) / 8000)));
      state.lastMatchT = now;
      state.combo++;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      const pts = MATCH_BASE * Math.min(state.combo, 5) + speedBonus;
      state.score += pts;
      state.matched++;

      const firstTry = !state.missed.has(a.pairId);
      state.order.push({ term: a.pair.term, firstTry });

      [a, b].forEach(c => {
        c.matchedFlag = true;
        c.el.classList.remove('flipped');
        c.el.classList.add('matched', 'just');
        c.el.disabled = true;
        c.el.setAttribute('aria-label', 'Matched — ' + c.pair.term + ': ' + c.pair.def);
        const r = c.el.getBoundingClientRect();
        Arcade.confettiBurst({ x: r.left + r.width / 2, y: r.top + r.height / 2, count: 22 });
        setTimeout(() => c.el.classList.remove('just'), 900);
      });
      Arcade.popTextOver(b.el, '+' + pts, '#00ffa3');
      Arcade.sfx.correct(state.combo);
      Arcade.vibrate(20);
      Arcade.streakCall(state.combo);

      setHud('hudScore', String(state.score), true);
      setHud('hudCombo', '×' + Math.min(state.combo, 5), true);
      const comboStat = document.getElementById('comboStat');
      if (comboStat) comboStat.classList.toggle('hot', state.combo >= 3);
      paintDots();

      // The learning beat: full definition, readable, after every match.
      fb.className = 'mm-strip ok';
      fb.innerHTML = '✓ <span><strong>' + esc(a.pair.term) + '</strong> — ' + esc(a.pair.def) +
        (speedBonus ? ' <em style="opacity:0.8">(+' + speedBonus + ' speed)</em>' : '') + '</span>';
      announce.textContent = 'Match! ' + a.pair.term + ': ' + a.pair.def + '. Plus ' + pts + ' points. ' +
        (pairCount - state.matched) + ' pairs left.';

      state.flipped = [];
      state.lock = false;
      if (state.matched === pairCount) setTimeout(() => finish(true), 750);
    } else {
      state.missed.add(a.pairId);
      state.missed.add(b.pairId);
      state.combo = 0;
      setHud('hudCombo', '×1');
      const comboStat = document.getElementById('comboStat');
      if (comboStat) comboStat.classList.remove('hot');

      [a, b].forEach(c => c.el.classList.add('miss'));
      Arcade.sfx.wrong();
      Arcade.vibrate([40, 30, 40]);

      fb.className = 'mm-strip no';
      fb.innerHTML = '✗ <span>Not a pair — <strong>' + esc(a.text) + '</strong> and <strong>' + esc(b.text) +
        '</strong> don’t belong together. Remember where they sit.</span>';
      announce.textContent = 'Not a match. Combo reset. The cards flip back.';

      setTimeout(() => {
        [a, b].forEach(c => {
          c.flippedFlag = false;
          c.el.classList.remove('flipped', 'miss');
          c.el.setAttribute('aria-label', 'Card ' + (parseInt(c.el.dataset.i, 10) + 1) + ' of ' + cardCount + ', face down');
        });
        state.flipped = [];
        state.lock = false;
      }, FLIPBACK_MS);
    }
  }

  function setHud(id, text, doBump) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    if (doBump) {
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 350);
    }
  }

  function paintDots() {
    const dots = stage.querySelectorAll('.ar-dots span');
    dots.forEach((d, i) => d.className = i < state.matched ? 'done' : '');
  }

  /* ---------- end of run --------------------------------------------------- */
  function finish(completed) {
    state.over = true;
    const remainingMs = timerCtl ? timerCtl.remaining : 0;
    if (timerCtl) { timerCtl.stop(); timerCtl = null; }
    if (elapsedInt) { clearInterval(elapsedInt); elapsedInt = null; }

    const elapsed = MODE === 'verify' && completed
      ? timerSecs - Math.round(remainingMs / 1000)
      : Math.round((performance.now() - state.t0) / 1000);
    const timeShown = MODE === 'verify' && !completed ? fmt(timerSecs) : fmt(elapsed);

    const comp = state.matched / pairCount;
    const accFrac = state.moves > 0 ? Math.min(1, state.matched / state.moves) : 0;
    const pct = Math.round(comp * 60 + accFrac * 40);

    const emojiGrid = state.order.map(o => o.firstTry ? '🟩' : '🟨').join('') +
      '⬛'.repeat(pairCount - state.matched);

    const retried = state.order.filter(o => !o.firstTry).map(o => o.term);
    let insight;
    if (!completed) {
      insight = 'The clock won this round — ' + state.matched + ' of ' + pairCount +
        ' pairs found. Scan the board in rows before you flip: knowing where cards sit is half the game, knowing the definitions is the other half.';
    } else if (retried.length === 0) {
      insight = 'Every pair on the first try — that means these definitions are genuinely stored, not guessed. Final boss: close the tab and say each definition out loud from memory.';
    } else {
      insight = 'Pairs that needed a retry: ' + retried.slice(0, 3).join(', ') +
        (retried.length > 3 ? ' (+' + (retried.length - 3) + ' more)' : '') +
        '. Those are your weak links — say each one’s definition out loud, then run it back for a full green grid.';
    }

    stage.innerHTML = '<div id="end"></div>';
    Arcade.renderEndCard(document.getElementById('end'), {
      gameName: 'Memory Match',
      gameEmoji: '🧠',
      topic: HEADING,
      meta: pairCount + ' pairs · ' + (MODE === 'verify' ? 'timed' : 'untimed'),
      pct: pct,
      big: state.score,
      bigLabel: 'points',
      rows: [
        { v: timeShown, l: 'time' },
        { v: String(state.moves), l: 'moves' },
        { v: '×' + Math.max(1, state.bestCombo), l: 'best combo' },
      ],
      emojiGrid: emojiGrid,
      bestKey: BEST_KEY,
      bestValue: state.score,
      bestSuffix: ' pts',
      insight: insight,
      shareLines: [
        '🧠 Memory Match — ' + HEADING,
        'Score ' + state.score + ' pts · ' + state.matched + '/' + pairCount +
          ' pairs · ×' + Math.max(1, state.bestCombo) + ' combo · ' + timeShown,
        emojiGrid,
      ],
      onAgain: startGame,
    });
    announce.textContent = (completed ? 'Board cleared! ' : 'Time up. ') +
      'Score ' + state.score + ' points. ' + state.matched + ' of ' + pairCount +
      ' pairs in ' + state.moves + ' moves. Best combo ' + Math.max(1, state.bestCombo) + '.';
  }

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
