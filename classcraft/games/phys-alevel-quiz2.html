<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Level Physics — Paper 2 — Quiz — AI Study Method</title>
<meta name="description" content="Test your A-Level Physics knowledge with this 14-question quiz covering oscillations, capacitance, nuclear and thermal physics. No login required. Instant feedback to sharpen your revision — try it now.">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../quizzes/arcade.css">
<style>
  .qz-opts { display:flex; flex-direction:column; gap:10px; margin-bottom:4px; }
  .qz-opts.tf { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .qz-tile { min-height:60px; display:flex; align-items:center; gap:12px; }
  .qz-tile.tf { justify-content:center; text-align:center; min-height:96px; font-size:clamp(20px,7vw,30px); font-weight:700; letter-spacing:0.5px; }
  .qz-key { font-family:var(--ar-mono); font-size:12px; font-weight:700; min-width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ar-border-hi); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ar-text2); }
  .qz-otext { line-height:1.4; overflow-wrap:anywhere; word-break:break-word; font-size:clamp(14px,3.6vw,16px); }
  .qz-tile.tf .qz-otext { overflow-wrap:normal; }
  .qz-prompt { overflow-wrap:anywhere; }
  @media (max-width:380px){ .qz-opts.tf { gap:8px; } .qz-tile.tf { min-height:84px; } }
</style>
<meta name="robots" content="noindex,nofollow">
</head>
<body class="arcade">

<nav>
  <div class="nav-inner">
    <a href="../../index.html" class="logo">
      <div class="logo-mark">V</div>
      <div class="logo-text">
        <span class="logo-primary">AI Study Method</span>
        <span class="logo-secondary">The Velvet Method™</span>
      </div>
    </a>
    <div class="nav-right">
      <a href="../arcade.html" class="arcade-back">← Back to Arcade</a>
    </div>
  </div>
  <style>
    nav .arcade-back { text-decoration: none; color: var(--text-secondary); font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.2s ease; white-space: nowrap; }
    nav .arcade-back:hover { color: var(--text-primary); background: var(--accent-soft); }
    body.arcade nav .arcade-back { color: var(--ar-text2); }
    body.arcade nav .arcade-back:hover { color: var(--ar-mint); }
  </style>
</nav>

<div class="ar-wrap" id="root">
  <div class="ar-error">Loading…</div>
</div>
<div id="announce" aria-live="polite" class="sr-only"></div>

<script src="../quizzes/arcade.js"></script>
<script src="../quizzes/share-score.js?v=20260717a"></script>
<script>
(function () {
  'use strict';
  const GAME_DATA = {"ALL_QUESTIONS":[{"type":"mc","q":"What is the period of a simple pendulum of length 1 m? (g = 10 m/s²)","options":["1.0 s","2.0 s","3.14 s","0.5 s"],"answer":"2.0 s"},{"type":"mc","q":"What does a Geiger-Müller tube detect?","options":["Visible light","Infrared radiation","Ionising radiation","Microwaves"],"answer":"Ionising radiation"},{"type":"mc","q":"What is the unit of capacitance?","options":["Ohm","Henry","Tesla","Farad"],"answer":"Farad"},{"type":"mc","q":"In which direction does the induced current flow according to Lenz's law?","options":["In same direction as flux change","Perpendicular to flux","To oppose the change in flux","Parallel to the conductor"],"answer":"To oppose the change in flux"},{"type":"mc","q":"What is the binding energy per nucleon for iron-56?","options":["Lowest of all nuclei","About the same as hydrogen","Highest of all nuclei","Zero"],"answer":"Highest of all nuclei"},{"type":"mc","q":"What is absolute zero in Celsius?","options":["0°C","−100°C","−273°C","−373°C"],"answer":"−273°C"},{"type":"tf","q":"The gravitational potential energy at the Earth's surface is taken as zero.","answer":"False"},{"type":"tf","q":"In SHM the period is independent of amplitude.","answer":"True"},{"type":"tf","q":"A photon has zero rest mass.","answer":"True"},{"type":"tf","q":"Nuclear fusion requires less energy to initiate than nuclear fission.","answer":"False"},{"type":"tf","q":"The refractive index of glass is greater than 1.","answer":"True"},{"type":"tf","q":"Gravitational potential is always negative.","answer":"True"},{"type":"tf","q":"The half-life of a radioactive isotope can be changed by heating it.","answer":"False"},{"type":"tf","q":"Capacitors in series have a combined capacitance greater than either alone.","answer":"False"}],"TIMER_SECS":30};
  const esc = Arcade.escapeHtml;
  const root = document.getElementById('root');
  const announce = document.getElementById('announce');

  Arcade.mountMuteButton();

  const HEADING = "A-Level Physics — Paper 2 — Quiz";
  // Load-time guard: a question whose authored answer does not exactly match one
  // of its options can never be marked correct — warn and skip it.
  const ALL_QUESTIONS = (GAME_DATA.ALL_QUESTIONS || []).filter(q => q && q.q && q.answer).filter(q => {
    const opts = q.type === 'tf' ? ['True', 'False'] : (q.options || []);
    if (opts.indexOf(q.answer) === -1) {
      console.warn(`[quiz] Skipping question — its answer does not exactly match any option: ${q.q}`);
      return false;
    }
    return true;
  });
  const ROUND_SECS = GAME_DATA.TIMER_SECS || 20;
  const ROUND_MS = ROUND_SECS * 1000;
  const ROUNDS = Math.min(10, ALL_QUESTIONS.length);
  const BEST_KEY = 'aism-best:' + location.pathname;
  const KEYS = ['A', 'B', 'C', 'D'];

  // JS-injected style (markup/CSS sections must stay untouched): amber dot for
  // redeemed rounds, plus the ON FIRE event skin (flame card border, flaming
  // HUD streak, cheap DOM ember particles).
  const injected = document.createElement('style');
  injected.textContent = '.ar-dots span.redeem { background: var(--ar-gold); box-shadow: 0 0 10px rgba(255,214,10,0.55); }'
    + ' .ar-card.qz-fire { position:relative; overflow:hidden; border-color:#ff7a18 !important; box-shadow:0 0 0 2px rgba(255,122,24,0.35), 0 0 34px rgba(255,90,0,0.38), inset 0 0 26px rgba(255,122,24,0.10); }'
    + ' .qz-fire .ar-label { color:#ffb347; }'
    + ' .ar-hud-stat.qz-fire-hud { border-color:rgba(255,122,24,0.6); }'
    + ' .ar-hud-stat.qz-fire-hud b { color:#ff7a18; text-shadow:0 0 10px rgba(255,122,24,0.7); }'
    + ' .qz-embers { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:inherit; }'
    + ' .qz-ember { position:absolute; bottom:-8px; width:5px; height:5px; border-radius:50%; background:#ffb347; opacity:0; box-shadow:0 0 8px rgba(255,122,24,0.9); animation:qzEmberUp linear infinite; }'
    + ' @keyframes qzEmberUp { 0% { transform:translateY(0) scale(1); opacity:0; } 12% { opacity:0.9; } 100% { transform:translateY(-360px) scale(0.35); opacity:0; } }'
    + ' @media (prefers-reduced-motion: reduce) { .qz-ember { display:none; } .ar-card.qz-fire { box-shadow:0 0 0 2px rgba(255,122,24,0.35); } }';
  document.head.appendChild(injected);
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ON FIRE: every 5th consecutive correct answer ignites the next 3 questions
  // at triple points. Earned by streak only; a wrong answer puts the fire out.
  const FIRE_STREAK = 5;
  const FIRE_ROUNDS = 3;

  if (ALL_QUESTIONS.length < 1) {
    root.innerHTML = '<div class="ar-error">No questions available for this topic yet.</div>';
    return;
  }

  // Build one run: random questions, each with its options shuffled.
  // Answers are tracked by option INDEX so duplicate option text cannot collide.
  function runEntry(q, redemption) {
    const opts = q.type === 'tf'
      ? ['True', 'False']
      : Arcade.shuffle(q.options || []);
    return {
      type: q.type, q: q.q, answer: q.answer,
      answerIdx: opts.indexOf(q.answer), opts,
      why: typeof q.why === 'string' ? q.why : '',
      options: q.options, redemption: !!redemption,
    };
  }
  function buildRun() {
    return Arcade.shuffle(ALL_QUESTIONS).slice(0, ROUNDS).map(q => runEntry(q, false));
  }

  let run, state, timerCtl = null;

  function startGame() {
    if (timerCtl) { timerCtl.stop(); timerCtl = null; }
    run = buildRun();
    state = {
      idx: 0, correct: 0, score: 0, streak: 0, bestStreak: 0, grid: [], times: [],
      misses: [], redeemed: 0, redemptionStarted: false, totalPlanned: run.length,
      fire: 0,   // ON FIRE rounds remaining (0 = not burning)
    };
    renderRound();
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 350);
  }

  function renderHeader() {
    return `
      <div class="ar-badge">⚡ Arcade · Quiz Gauntlet</div>
      <h1 class="ar-title">${esc(HEADING)}</h1>
      <p class="ar-sub">${ROUNDS} round${ROUNDS === 1 ? '' : 's'}. ${esc(ROUND_SECS)} seconds each. Tap fast, keep the streak alive, learn from every miss.</p>
    `;
  }

  function hudHtml() {
    return `
      <div class="ar-hud">
        <div class="ar-hud-stat">Score <b id="hudScore">${state.score}</b></div>
        <div class="ar-hud-stat${state.streak >= 3 ? ' hot' : ''}${state.fire > 0 ? ' qz-fire-hud' : ''}">Streak <b id="hudStreak">${state.streak}${state.streak >= 3 ? '🔥' : ''}</b></div>
        <div class="ar-hud-stat gold">${run[state.idx] && run[state.idx].redemption ? 'Redemption' : 'Round'} <b>${state.idx + 1}/${run.length}</b></div>
      </div>
    `;
  }

  // Cheap DOM embers layered inside the card while ON FIRE (skipped for
  // reduced motion via both the JS guard and the injected media query).
  function mountEmbers(card) {
    if (REDUCED || !card) return;
    const layer = document.createElement('div');
    layer.className = 'qz-embers';
    layer.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 9; i++) {
      const e = document.createElement('span');
      e.className = 'qz-ember';
      e.style.left = (4 + Math.random() * 92) + '%';
      e.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      e.style.animationDelay = (Math.random() * 2) + 's';
      layer.appendChild(e);
    }
    card.appendChild(layer);
  }

  function renderRound() {
    const r = run[state.idx];
    const isTf = r.type === 'tf';
    const fireRound = state.fire > 0;   // this round burns: ×3 points on a correct

    root.innerHTML = `
      ${renderHeader()}
      ${hudHtml()}
      <div class="ar-dots" aria-hidden="true">${run.map((_, i) => {
        if (i < state.idx) return `<span class="${state.grid[i] === '🟩' ? 'done' : state.grid[i] === '🟨' ? 'redeem' : 'fail'}"></span>`;
        return `<span class="${i === state.idx ? 'now' : ''}"></span>`;
      }).join('')}</div>
      <div class="ar-timer" aria-hidden="true"><i id="tfill"></i></div>
      <div class="ar-card${fireRound ? ' qz-fire' : ''}">
        <div class="ar-label">${fireRound ? `🔥 ON FIRE · ×3 points · ${state.fire} burning ` + (state.fire === 1 ? 'round' : 'rounds') + ' left · ' : ''}${r.redemption ? 'Redemption · half points · ' : ''}${isTf ? 'True or False' : 'Multiple choice'} · tap to answer</div>
        <div class="ar-prompt qz-prompt">${esc(r.q)}</div>
        <div class="qz-opts ar-stagger${isTf ? ' tf' : ''}" role="radiogroup" aria-label="Choose your answer">
          ${r.opts.map((opt, i) => `
            <button type="button" class="ar-tile qz-tile${isTf ? ' tf' : ''}" role="radio" aria-checked="false" data-idx="${i}" data-val="${esc(opt)}">
              ${isTf ? '' : `<span class="qz-key">${KEYS[i]}</span>`}
              <span class="qz-otext">${esc(opt)}</span>
            </button>
          `).join('')}
        </div>
        <div class="ar-kbd-hint">${isTf ? 'Keyboard: T / F to answer' : 'Keyboard: 1–4 to answer'} · Enter for next</div>
        <div id="fb"></div>
        <div id="nextWrap" style="margin-top:14px;"></div>
      </div>
    `;

    if (fireRound) mountEmbers(root.querySelector('.ar-card'));

    announce.textContent = (fireRound ? 'On fire — triple points this round. ' : '')
      + `Round ${state.idx + 1} of ${run.length}. ${r.q}`;

    const tiles = Array.from(root.querySelectorAll('.qz-tile'));
    let phase = 'answer';
    let autoNextT = null;

    timerCtl = Arcade.timer(document.getElementById('tfill'), ROUND_MS, {
      onEnd: () => { if (phase === 'answer') settle(-1, true); },
    });

    function settle(chosenIdx, timedOut) {
      if (phase !== 'answer') return;
      phase = 'verdict';
      const remaining = timedOut ? 0 : timerCtl.remaining;
      timerCtl.stop();
      state.times.push((ROUND_MS - remaining) / 1000);

      const correct = !timedOut && chosenIdx === r.answerIdx;

      tiles.forEach((b, i) => {
        b.disabled = true;
        b.style.pointerEvents = 'none';
        b.setAttribute('aria-checked', String(i === chosenIdx));
        if (i === r.answerIdx) {
          b.classList.add('correct');
        } else if (i === chosenIdx) {
          b.classList.add('wrong');
        } else {
          b.classList.add('dim');
        }
      });

      let pts = 0;
      if (correct) {
        state.correct++;
        if (r.redemption) state.redeemed++;
        state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        const mult = Math.min(2, 1 + 0.25 * (state.streak - 1));
        const speed = Math.round(50 * (remaining / ROUND_MS));
        pts = Math.round((100 + speed) * mult);
        if (r.redemption) pts = Math.round(pts / 2);
        if (fireRound) { pts = pts * 3; state.fire--; }   // burn a fire round: ×3
        state.score += pts;
        state.grid.push(r.redemption ? '🟨' : '🟩');
        Arcade.sfx.correct(state.streak);
        if (![3, 5, 7, 10].includes(state.streak)) Arcade.flashMsg(r.redemption ? 'REDEEMED!' : 'NICE!', '#00ffa3');
        Arcade.streakCall(state.streak);
        if (state.streak >= 5) Arcade.confettiBurst({ count: 50 });
        else Arcade.confettiBurst({ count: 30 });
        const winner = tiles[r.answerIdx];
        if (winner) Arcade.popTextOver(winner, '+' + pts, fireRound ? '#ff7a18' : '#00ffa3');
        Arcade.vibrate(20);
        // EVENT — ON FIRE: every 5th consecutive correct (while not already
        // burning) ignites the next 3 rounds at triple points. Telegraphed
        // with a banner sequenced after the streak call. Re-earnable.
        if (state.fire === 0 && state.streak > 0 && state.streak % FIRE_STREAK === 0) {
          state.fire = FIRE_ROUNDS;
          setTimeout(() => {
            Arcade.flashMsg('🔥 ON FIRE — NEXT 3 ×3', '#ff7a18');
            Arcade.sfx.riser();
            Arcade.vibrate([30, 40, 60]);
          }, 750);
        }
      } else {
        if (fireRound) state.fire = 0;   // a wrong answer puts the fire out instantly
        state.streak = 0;
        state.grid.push(timedOut ? '⬛' : '🟥');
        if (!r.redemption) state.misses.push(r);
        if (timedOut) { Arcade.sfx.timeup(); Arcade.flashMsg("TIME'S UP ⏱", '#ffd60a'); }
        else { Arcade.sfx.wrong(); Arcade.flashMsg('MISS', '#ff2e88'); }
        Arcade.shake();
        Arcade.vibrate([40, 30, 40]);
      }

      const hudS = document.getElementById('hudScore');
      hudS.textContent = state.score;
      if (pts) bump(hudS);
      const hudSt = document.getElementById('hudStreak');
      hudSt.textContent = state.streak + (state.streak >= 3 ? '🔥' : '');
      bump(hudSt);
      hudSt.parentElement.classList.toggle('hot', state.streak >= 3);

      const fb = document.getElementById('fb');
      fb.className = 'ar-feedback ' + (correct ? 'ok' : (timedOut ? 'mid' : 'no'));
      const whyHtml = !correct && r.why ? `<div style="margin-top:8px;">💡 ${esc(r.why)}</div>` : '';
      const ignited = correct && state.fire === FIRE_ROUNDS && !fireRound;
      const fireOutHtml = !correct && fireRound
        ? '<div style="margin-top:6px;color:#ffb347;">🔥 The flames go out — build another streak to reignite.</div>' : '';
      fb.innerHTML = correct
        ? `<strong>${fireRound ? '🔥 ' : ''}${r.redemption ? 'Redeemed! ' : 'Correct! '}+${pts} pts${fireRound ? ' (×3 on fire)' : ''}.</strong> The answer is <em>${esc(r.answer)}</em>.${ignited ? '<div style="margin-top:6px;color:#ffb347;">🔥 Five in a row — the next three questions are ON FIRE at triple points.</div>' : ''}`
        : timedOut
          ? `<strong>Clock beat you.</strong> The correct answer was <em>${esc(r.answer)}</em>.${whyHtml}${fireOutHtml}`
          : `<strong>Not quite.</strong> The correct answer was <em>${esc(r.answer)}</em>.${whyHtml}${fireOutHtml}`;
      announce.textContent = (correct
        ? `Correct. Plus ${pts} points${fireRound ? ', tripled by the fire' : ''}. The answer is ${r.answer}.`
          + (ignited ? ' Five in a row — the next three questions score triple points.' : '')
        : timedOut
          ? `Time up. The correct answer was ${r.answer}.` + (r.why ? ' ' + r.why : '')
          : `Incorrect. The correct answer was ${r.answer}.` + (r.why ? ' ' + r.why : ''));

      const morePending = state.idx + 1 < run.length
        || (!state.redemptionStarted && state.misses.length > 0);
      document.getElementById('nextWrap').innerHTML =
        `<button class="ar-btn big" id="next">${morePending ? 'Next →' : 'See your score →'}</button>`;
      const nextBtn = document.getElementById('next');
      nextBtn.addEventListener('click', advance);
      nextBtn.focus({ preventScroll: true });
      // Correct answers auto-advance after a short beat; misses wait for the
      // player, so there is time to read the correct answer (and any why).
      if (correct) autoNextT = setTimeout(advance, 1200);
    }

    function advance() {
      if (phase !== 'verdict') return; // guard: button click vs auto-advance timeout
      phase = 'done';
      if (autoNextT) { clearTimeout(autoNextT); autoNextT = null; }
      Arcade.sfx.swoosh();
      if (state.idx + 1 >= run.length && !state.redemptionStarted && state.misses.length > 0) {
        // Redemption round: every miss comes back once, at half points.
        state.redemptionStarted = true;
        run = run.concat(state.misses.map(m => runEntry(m, true)));
        Arcade.flashMsg('REDEMPTION ROUND', '#ffd60a');
        announce.textContent = 'Redemption round. Your missed questions come back around at half points.';
      }
      if (state.idx + 1 < run.length) { state.idx++; renderRound(); }
      else renderEnd();
    }

    tiles.forEach((b, i) => {
      b.addEventListener('click', () => {
        if (phase !== 'answer') return;
        Arcade.sfx.click();
        settle(i, false);
      });
    });
  }

  function renderEnd() {
    // A question counts as correct if answered right either first time or on
    // redemption; % is out of the planned rounds, not the redemption re-asks.
    const total = state.totalPlanned;
    const pct = Math.round((state.correct / total) * 100);
    const avg = state.times.length
      ? (state.times.reduce((a, b) => a + b, 0) / state.times.length).toFixed(1)
      : '0.0';

    let insight;
    if (pct === 100) insight = `Flawless gauntlet. You answered every round correctly under the clock — now try to teach ${HEADING} to someone else. If you can explain why each answer is right, you own it.`;
    else if (pct >= 60) insight = `Strong run. The ones you missed are exactly the ideas to revisit — re-read each correct answer above, then run it back and aim for a clean sweep.`;
    else insight = `Tough round, but every miss just mapped out which parts of ${HEADING} to study next. Review the correct answers, then come back and beat this score.`;

    root.innerHTML = renderHeader() + '<div id="end"></div>';
    Arcade.renderEndCard(document.getElementById('end'), {
      gameName: 'Quiz Gauntlet',
      gameEmoji: '⚡',
      topic: HEADING,
      pct: pct,
      big: state.score,
      bigLabel: 'points',
      rows: [
        { v: `${state.correct}/${total}`, l: 'correct' },
        ...(state.redemptionStarted ? [{ v: `🟨 ${state.redeemed}`, l: 'redeemed' }] : []),
        { v: '🔥 ' + state.bestStreak, l: 'best streak' },
        { v: avg + 's', l: 'avg time' },
      ],
      emojiGrid: state.grid.join(''),
      bestKey: BEST_KEY,
      bestValue: state.score,
      bestSuffix: ' pts',
      insight: insight,
      shareLines: [
        '⚡ Quiz Gauntlet — ' + HEADING,
        `Score ${state.score} pts · ${pct}% · 🔥 best streak ${state.bestStreak}`,
        state.grid.join(''),
      ],
      onAgain: startGame,
    });
    announce.textContent = `Game over. Score ${state.score} points. ${state.correct} of ${total} correct — ${pct} percent.`;
  }

  // Keyboard: 1-4 / T / F answer, Enter advances.
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      const next = document.getElementById('next');
      if (next) { e.preventDefault(); next.click(); }
      return;
    }
    const tiles = Array.from(root.querySelectorAll('.qz-tile'));
    if (!tiles.length) return;
    const k = e.key.toLowerCase();
    let target = null;
    if (k === 't') target = tiles.find(t => t.dataset.val === 'True');
    else if (k === 'f') target = tiles.find(t => t.dataset.val === 'False');
    else {
      const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
      if (k in map) target = tiles[map[k]];
    }
    if (target && !target.disabled) { e.preventDefault(); target.click(); }
  });

  startGame();
})();
</script>

<script src="../../script.js" defer></script>
</body>
